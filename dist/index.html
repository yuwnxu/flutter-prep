39;Превышено время ожидания&#39;);\n}\n\nclass ServerException extends ApiException {\n  final int statusCode;\n  const ServerException(this.statusCode, String message) : super(message);\n}\n\nclass ParseException extends ApiException {\n  const ParseException() : super(&#39;Не удалось обработать ответ сервера&#39;);\n}\u003c/code>\u003c/pre>\n\u003ch2>Конфиг и абстракция клиента\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class ApiConfig {\n  final String baseUrl;\n  final Duration timeout;\n  final Map&lt;String, String&gt; defaultHeaders;\n  const ApiConfig({\n    required this.baseUrl,\n    this.timeout = const Duration(seconds: 15),\n    this.defaultHeaders = const {&#39;Content-Type&#39;: &#39;application/json&#39;},\n  });\n}\n\nabstract interface class ApiClient {\n  Future&lt;Map&lt;String, dynamic&gt;&gt; get(String path, {Map&lt;String, String&gt;? query});\n  Future&lt;Map&lt;String, dynamic&gt;&gt; post(String path, {Object? body});\n  Future&lt;Map&lt;String, dynamic&gt;&gt; put(String path, {Object? body});\n  Future&lt;Map&lt;String, dynamic&gt;&gt; delete(String path);\n  void setToken(String? token);\n}\u003c/code>\u003c/pre>\n\u003cp>Для интерфейсов из задания (I из SOLID) можно разделить на \u003ccode>AuthApiClient\u003c/code>, \u003ccode>FileApiClient\u003c/code>. Минимум — отдельные \u003ccode>AuthApi\u003c/code>, \u003ccode>GameApi\u003c/code>, \u003ccode>ProfileApi\u003c/code> поверх одного \u003ccode>ApiClient\u003c/code>.\u003c/p>\n\u003ch2>Реализация на пакете http\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:async&#39;;\nimport &#39;dart:convert&#39;;\nimport &#39;dart:io&#39;;\nimport &#39;package:http/http.dart&#39; as http;\n\n// Реализация ApiClient поверх пакета http.\n// Единая точка выполнения запросов, ошибок и логирования.\nclass HttpApiClient implements ApiClient {\n  final ApiConfig _config;\n  final http.Client _client;\n  String? _token;\n\n  // client можно подставить в тестах (MockClient)\n  HttpApiClient(this._config, {http.Client? client}) : _client = client ?? http.Client();\n\n  @override\n  void setToken(String? token) =&gt; _token = token;\n\n  Map&lt;String, String&gt; get _headers =&gt; {\n        ..._config.defaultHeaders,\n        if (_token != null) &#39;Authorization&#39;: &#39;Bearer $_token&#39;,\n      };\n\n  Uri _uri(String path, [Map&lt;String, String&gt;? query]) =&gt;\n      Uri.parse(&#39;${_config.baseUrl}$path&#39;).replace(queryParameters: query);\n\n  @override\n  Future&lt;Map&lt;String, dynamic&gt;&gt; get(String path, {Map&lt;String, String&gt;? query}) =&gt;\n      _send(&#39;GET&#39;, path, () =&gt; _client.get(_uri(path, query), headers: _headers));\n\n  @override\n  Future&lt;Map&lt;String, dynamic&gt;&gt; post(String path, {Object? body}) =&gt; _send(&#39;POST&#39;, path,\n      () =&gt; _client.post(_uri(path), headers: _headers, body: jsonEncode(body)));\n\n  @override\n  Future&lt;Map&lt;String, dynamic&gt;&gt; put(String path, {Object? body}) =&gt; _send(&#39;PUT&#39;, path,\n      () =&gt; _client.put(_uri(path), headers: _headers, body: jsonEncode(body)));\n\n  @override\n  Future&lt;Map&lt;String, dynamic&gt;&gt; delete(String path) =&gt;\n      _send(&#39;DELETE&#39;, path, () =&gt; _client.delete(_uri(path), headers: _headers));\n\n  // Единый обработчик: логирование, таймаут, преобразование ошибок (DRY).\n  Future&lt;Map&lt;String, dynamic&gt;&gt; _send(\n      String method, String path, Future&lt;http.Response&gt; Function() request) async {\n    NetLog.info(&#39;HttpApiClient&#39;, &#39;Запрос&#39;, &#39;$method $path&#39;); // начало — INFO\n    try {\n      final response = await request().timeout(_config.timeout);\n      final body = utf8.decode(response.bodyBytes);\n\n      if (response.statusCode &gt;= 200 &amp;&amp; response.statusCode &lt; 300) {\n        NetLog.debug(&#39;HttpApiClient&#39;, &#39;Ответ&#39;, &#39;${response.statusCode} $path&#39;); // успех — DEBUG\n        if (body.isEmpty) return {};\n        final decoded = jsonDecode(body);\n        return decoded is Map&lt;String, dynamic&gt; ? decoded : {&#39;data&#39;: decoded};\n      }\n\n      // Код не 2xx — ошибка сервера: достаём message из тела, если оно есть\n      final message = _extractMessage(body) ?? &#39;Ошибка сервера (${response.statusCode})&#39;;\n      throw ServerException(response.statusCode, message);\n    } on SocketException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Нет интернета: $path&#39;);\n      throw const NoInternetException();\n    } on http.ClientException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Нет соединения: $path&#39;);\n      throw const NoInternetException();\n    } on TimeoutException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Таймаут: $path&#39;);\n      throw const TimeoutApiException();\n    } on FormatException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Некорректный JSON: $path&#39;);\n      throw const ParseException();\n    } on ApiException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Ответ сервера: $path&#39;);\n      rethrow;\n    }\n  }\n\n  String? _extractMessage(String body) {\n    try {\n      final json = jsonDecode(body);\n      if (json is Map) return (json[&#39;message&#39;] ?? json[&#39;error&#39;])?.toString();\n    } catch (_) {}\n    return null;\n  }\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Адреса, названия полей (\u003ccode>token\u003c/code>, \u003ccode>message\u003c/code>) и формат ответов зависят от выданного вам API. Внимательно прочитайте документацию/карточку запроса и сверяйте поля с реальным ответом (\u003ccode>curl\u003c/code> или Postman).\u003c/p>\n\u003c/div>\n\u003ch2>Модель, API и маппинг ответа\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class UserDto {\n  final String id;\n  final String email;\n  final String? name;\n  final String? photoUrl;\n  const UserDto({required this.id, required this.email, this.name, this.photoUrl});\n\n  factory UserDto.fromJson(Map&lt;String, dynamic&gt; json) =&gt; UserDto(\n        id: json[&#39;id&#39;].toString(),\n        email: json[&#39;email&#39;] as String,\n        name: json[&#39;name&#39;] as String?,\n        photoUrl: json[&#39;photo&#39;] as String?,\n      );\n}\n\nabstract interface class AuthApi {\n  Future&lt;AuthResultDto&gt; login({required String email, required String password});\n  Future&lt;AuthResultDto&gt; register({required String email, required String password});\n  Future&lt;void&gt; logout();\n}\n\nclass AuthApiImpl implements AuthApi {\n  final ApiClient _client;\n  AuthApiImpl(this._client);\n\n  @override\n  Future&lt;AuthResultDto&gt; login({required String email, required String password}) async {\n    final json = await _client.post(&#39;/auth/login&#39;, body: {&#39;email&#39;: email, &#39;password&#39;: password});\n    return AuthResultDto.fromJson(json);\n  }\n  ...\n}\u003c/code>\u003c/pre>\n\u003cp>Каждый следующий запрос: DTO + метод + строка в интерфейсе. Заведите шпаргалку-таблицу из 11 запросов (метод, путь, тело, ответ), как только получили документацию.\u003c/p>\n\u003ch2>Тестирование (модуль Е, 4,95 балла)\u003c/h2>\n\u003cp>Тест-кейсы выдают в карточках. Пример из задания: «Успешный GET с десериализацией» — запускается мок-сервер, возвращается корректный JSON, проверяется код 200, содержимое модели и \u003cstrong>адрес запроса\u003c/strong>. В Dart мок-сервер заменяет \u003ccode>MockClient\u003c/code> из \u003ccode>package:http/testing.dart\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:convert&#39;;\nimport &#39;package:flutter_test/flutter_test.dart&#39;;\nimport &#39;package:http/http.dart&#39; as http;\nimport &#39;package:http/testing.dart&#39;;\nimport &#39;package:network_layer/network_layer.dart&#39;;\n\nvoid main() {\n  group(&#39;ProfileApi.getProfile&#39;, () {\n    test(&#39;успешный GET с десериализацией&#39;, () async {\n      // Предусловие: мок-сервер возвращает корректный JSON\n      late http.Request captured;\n      final mock = MockClient((request) async {\n        captured = request;\n        return http.Response(\n          jsonEncode({&#39;id&#39;: &#39;123&#39;, &#39;email&#39;: &#39;a@b.ru&#39;, &#39;name&#39;: &#39;Аня&#39;}),\n          200,\n          headers: {&#39;content-type&#39;: &#39;application/json; charset=utf-8&#39;},\n        );\n      });\n      final client = HttpApiClient(const ApiConfig(baseUrl: &#39;https://test.local&#39;), client: mock);\n      final api = ProfileApiImpl(client);\n\n      // Шаг: вызвать метод\n      final user = await api.getProfile(&#39;123&#39;);\n\n      // Ожидаемый результат\n      expect(user.id, &#39;123&#39;);\n      expect(user.name, &#39;Аня&#39;);\n      expect(captured.method, &#39;GET&#39;);\n      expect(captured.url.path, &#39;/users/123&#39;); // мок зафиксировал правильный эндпоинт\n    });\n\n    test(&#39;ошибка сервера 500 → ServerException&#39;, () async {\n      final mock = MockClient((_) async =&gt; http.Response(&#39;{&quot;message&quot;:&quot;fail&quot;}&#39;, 500));\n      final api = ProfileApiImpl(HttpApiClient(const ApiConfig(baseUrl: &#39;https://t&#39;), client: mock));\n      expect(() =&gt; api.getProfile(&#39;1&#39;), throwsA(isA&lt;ServerException&gt;()));\n    });\n\n    test(&#39;нет интернета → NoInternetException&#39;, () async {\n      final mock = MockClient((_) async =&gt; throw http.ClientException(&#39;offline&#39;));\n      final api = ProfileApiImpl(HttpApiClient(const ApiConfig(baseUrl: &#39;https://t&#39;), client: mock));\n      expect(() =&gt; api.getProfile(&#39;1&#39;), throwsA(isA&lt;NoInternetException&gt;()));\n    });\n  });\n}\u003c/code>\u003c/pre>\n\u003cp>Запуск: \u003ccode>flutter test\u003c/code>. На каждый из 11 запросов минимум: успех, ошибка сервера, нет интернета (то, что требуют тест-кейсы карточки). Тест по каждому запросу стоит 0,45, поэтому сначала сделайте \u003cstrong>по одному успешному тесту на каждый запрос\u003c/strong>, потом добавляйте ошибки.\u003c/p>\n\u003cp>Если используете \u003ccode>dio\u003c/code>, подменяйте адаптер (\u003ccode>http_mock_adapter\u003c/code>) или реализуйте \u003ccode>HttpClientAdapter\u003c/code>. Если вы пишете только на \u003ccode>http\u003c/code>, \u003ccode>MockClient\u003c/code> проще.\u003c/p>\n\u003ch2>Порядок на 70 минут\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Минуты\u003c/th>\n\u003cth>Действие\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>0–5\u003c/td>\n\u003ctd>Репозиторий, ветка, пакет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>5–20\u003c/td>\n\u003ctd>Конфиг, ошибки, интерфейс клиента, реализация, логи\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>20–45\u003c/td>\n\u003ctd>11 запросов по шаблону (DTO + метод)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>45–65\u003c/td>\n\u003ctd>Тесты на каждый запрос\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>65–70\u003c/td>\n\u003ctd>Тег, PR, merge, карточки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Чек-лист\u003c/h2>\n\u003cul class=\"task-list\">\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Приложение/тесты зависят от \u003ccode>ApiClient\u003c/code>/\u003ccode>AuthApi\u003c/code>, не от \u003ccode>http\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Нет сети → \u003ccode>NoInternetException\u003c/code>; код не 2xx → \u003ccode>ServerException(statusCode, message)\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />URL, заголовки, таймаут — только в \u003ccode>ApiConfig\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Каждый запрос логируется: INFO старт, DEBUG успех, ERROR сбой.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Тесты запускаются командой \u003ccode>flutter test\u003c/code> без сети.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Версия и тег \u003ccode>v1.0.0\u003c/code>.\u003c/label>\u003c/li>\n\u003c/ul>\n", "text": " Что нужно сделать Часть Баллы Нет интернета → вернуть ошибку 0,70 Ошибка сервера → вернуть ошибку 0,84 11 запросов, по 1,10 за каждый 12,10 Архитектура: библиотека, SOLID, DRY 0,5 + 1,0 + 0,5 Тесты: 11 запросов, по 0,45 за каждый 4,95 Git (ветка, merge) 0,30 11 запросов: авторизация, регистрация, изменение профиля, получение профиля, выход, создание игры, список игр, информация об игре, подключение к игре, статистика игрока, сохранение результата игры. Это самый выгодный спринт по соотношению баллы/время : 20,89 балла за 70 минут, и все пункты однотипные. Сделав первый запрос «по шаблону», остальные добавляются за 2–3 минуты. Спринт 2 в вашей симуляции не проверялся, а он вторым по цене. Подготовьте шаблон и отрепетируйте его до автоматизма. Требования к библиотеке Свойство Как выполнить Изолированность Отдельный репозиторий и пакет Абстрагированность Приложение зависит от abstract interface class , а не от http или dio Заменяемость Реализация HttpApiClient может быть заменена на DioApiClient без правок приложения Версионирование version: в pubspec и теги v1.0.0 Структура пакета network_layer/ lib/ network_layer.dart # экспорт публичного API src/ config/api_config.dart # baseUrl, заголовки, таймауты (единый источник) client/api_client.dart # abstract interface class client/http_api_client.dart # реализация на пакете http errors/api_exception.dart # NoInternet, Server, Timeout, Parse models/ # DTO: UserDto, GameDto, StatsDto, ... api/auth_api.dart # abstract + impl api/game_api.dart api/profile_api.dart test/ auth_api_test.dart ... Ошибки // Базовая ошибка сетевого слоя. sealed class ApiException implements Exception { final String message; const ApiException(this.message); @override String toString() => message; } class NoInternetException extends ApiException { const NoInternetException() : super('Нет подключения к интернету'); } class TimeoutApiException extends ApiException { const TimeoutApiException() : super('Превышено время ожидания'); } class ServerException extends ApiException { final int statusCode; const ServerException(this.statusCode, String message) : super(message); } class ParseException extends ApiException { const ParseException() : super('Не удалось обработать ответ сервера'); } Конфиг и абстракция клиента class ApiConfig { final String baseUrl; final Duration timeout; final Map\u003cString, String> defaultHeaders; const ApiConfig({ required this.baseUrl, this.timeout = const Duration(seconds: 15), this.defaultHeaders = const {'Content-Type': 'application/json'}, }); } abstract interface class ApiClient { Future\u003cMap\u003cString, dynamic>> get(String path, {Map\u003cString, String>? query}); Future\u003cMap\u003cString, dynamic>> post(String path, {Object? body}); Future\u003cMap\u003cString, dynamic>> put(String path, {Object? body}); Future\u003cMap\u003cString, dynamic>> delete(String path); void setToken(String? token); } Для интерфейсов из задания (I из SOLID) можно разделить на AuthApiClient , FileApiClient . Минимум — отдельные AuthApi , GameApi , ProfileApi поверх одного ApiClient . Реализация на пакете http import 'dart:async'; import 'dart:convert'; import 'dart:io'; import 'package:http/http.dart' as http; // Реализация ApiClient поверх пакета http. // Единая точка выполнения запросов, ошибок и логирования. class HttpApiClient implements ApiClient { final ApiConfig _config; final http.Client _client; String? _token; // client можно подставить в тестах (MockClient) HttpApiClient(this._config, {http.Client? client}) : _client = client ?? http.Client(); @override void setToken(String? token) => _token = token; Map\u003cString, String> get _headers => { ..._config.defaultHeaders, if (_token != null) 'Authorization': 'Bearer $_token', }; Uri _uri(String path, [Map\u003cString, String>? query]) => Uri.parse('${_config.baseUrl}$path').replace(queryParameters: query); @override Future\u003cMap\u003cString, dynamic>> get(String path, {Map\u003cString, String>? query}) => _send('GET', path, () => _client.get(_uri(path, query), headers: _headers)); @override Future\u003cMap\u003cString, dynamic>> post(String path, {Object? body}) => _send('POST', path, () => _client.post(_uri(path), headers: _headers, body: jsonEncode(body))); @override Future\u003cMap\u003cString, dynamic>> put(String path, {Object? body}) => _send('PUT', path, () => _client.put(_uri(path), headers: _headers, body: jsonEncode(body))); @override Future\u003cMap\u003cString, dynamic>> delete(String path) => _send('DELETE', path, () => _client.delete(_uri(path), headers: _headers)); // Единый обработчик: логирование, таймаут, преобразование ошибок (DRY). Future\u003cMap\u003cString, dynamic>> _send( String method, String path, Future\u003chttp.Response> Function() request) async { NetLog.info('HttpApiClient', 'Запрос', '$method $path'); // начало — INFO try { final response = await request().timeout(_config.timeout); final body = utf8.decode(response.bodyBytes); if (response.statusCode >= 200 && response.statusCode \u003c 300) { NetLog.debug('HttpApiClient', 'Ответ', '${response.statusCode} $path'); // успех — DEBUG if (body.isEmpty) return {}; final decoded = jsonDecode(body); return decoded is Map\u003cString, dynamic> ? decoded : {'data': decoded}; } // Код не 2xx — ошибка сервера: достаём message из тела, если оно есть final message = _extractMessage(body) ?? 'Ошибка сервера (${response.statusCode})'; throw ServerException(response.statusCode, message); } on SocketException { NetLog.error('HttpApiClient', 'Ошибка', 'Нет интернета: $path'); throw const NoInternetException(); } on http.ClientException { NetLog.error('HttpApiClient', 'Ошибка', 'Нет соединения: $path'); throw const NoInternetException(); } on TimeoutException { NetLog.error('HttpApiClient', 'Ошибка', 'Таймаут: $path'); throw const TimeoutApiException(); } on FormatException { NetLog.error('HttpApiClient', 'Ошибка', 'Некорректный JSON: $path'); throw const ParseException(); } on ApiException { NetLog.error('HttpApiClient', 'Ошибка', 'Ответ сервера: $path'); rethrow; } } String? _extractMessage(String body) { try { final json = jsonDecode(body); if (json is Map) return (json['message'] ?? json['error'])?.toString(); } catch (_) {} return null; } } Адреса, названия полей ( token , message ) и формат ответов зависят от выданного вам API. Внимательно прочитайте документацию/карточку запроса и сверяйте поля с реальным ответом ( curl или Postman). Модель, API и маппинг ответа class UserDto { final String id; final String email; final String? name; final String? photoUrl; const UserDto({required this.id, required this.email, this.name, this.photoUrl}); factory UserDto.fromJson(Map\u003cString, dynamic> json) => UserDto( id: json['id'].toString(), email: json['email'] as String, name: json['name'] as String?, photoUrl: json['photo'] as String?, ); } abstract interface class AuthApi { Future\u003cAuthResultDto> login({required String email, required String password}); Future\u003cAuthResultDto> register({required String email, required String password}); Future\u003cvoid> logout(); } class AuthApiImpl implements AuthApi { final ApiClient _client; AuthApiImpl(this._client); @override Future\u003cAuthResultDto> login({required String email, required String password}) async { final json = await _client.post('/auth/login', body: {'email': email, 'password': password}); return AuthResultDto.fromJson(json); } ... } Каждый следующий запрос: DTO + метод + строка в интерфейсе. Заведите шпаргалку-таблицу из 11 запросов (метод, путь, тело, ответ), как только получили документацию. Тестирование (модуль Е, 4,95 балла) Тест-кейсы выдают в карточках. Пример из задания: «Успешный GET с десериализацией» — запускается мок-сервер, возвращается корректный JSON, проверяется код 200, содержимое модели и адрес запроса . В Dart мок-сервер заменяет MockClient из package:http/testing.dart . import 'dart:convert'; import 'package:flutter_test/flutter_test.dart'; import 'package:http/http.dart' as http; import 'package:http/testing.dart'; import 'package:network_layer/network_layer.dart'; void main() { group('ProfileApi.getProfile', () { test('успешный GET с десериализацией', () async { // Предусловие: мок-сервер возвращает корректный JSON late http.Request captured; final mock = MockClient((request) async { captured = request; return http.Response( jsonEncode({'id': '123', 'email': 'a@b.ru', 'name': 'Аня'}), 200, headers: {'content-type': 'application/json; charset=utf-8'}, ); }); final client = HttpApiClient(const ApiConfig(baseUrl: 'https://test.local'), client: mock); final api = ProfileApiImpl(client); // Шаг: вызвать метод final user = await api.getProfile('123'); // Ожидаемый результат expect(user.id, '123'); expect(user.name, 'Аня'); expect(captured.method, 'GET'); expect(captured.url.path, '/users/123'); // мок зафиксировал правильный эндпоинт }); test('ошибка сервера 500 → ServerException', () async { final mock = MockClient((_) async => http.Response('{\"message\":\"fail\"}', 500)); final api = ProfileApiImpl(HttpApiClient(const ApiConfig(baseUrl: 'https://t'), client: mock)); expect(() => api.getProfile('1'), throwsA(isA\u003cServerException>())); }); test('нет интернета → NoInternetException', () async { final mock = MockClient((_) async => throw http.ClientException('offline')); final api = ProfileApiImpl(HttpApiClient(const ApiConfig(baseUrl: 'https://t'), client: mock)); expect(() => api.getProfile('1'), throwsA(isA\u003cNoInternetException>())); }); }); } Запуск: flutter test . На каждый из 11 запросов минимум: успех, ошибка сервера, нет интернета (то, что требуют тест-кейсы карточки). Тест по каждому запросу стоит 0,45, поэтому сначала сделайте по одному успешному тесту на каждый запрос , потом добавляйте ошибки. Если используете dio , подменяйте адаптер ( http_mock_adapter ) или реализуйте HttpClientAdapter . Если вы пишете только на http , MockClient проще. Порядок на 70 минут Минуты Действие 0–5 Репозиторий, ветка, пакет 5–20 Конфиг, ошибки, интерфейс клиента, реализация, логи 20–45 11 запросов по шаблону (DTO + метод) 45–65 Тесты на каждый запрос 65–70 Тег, PR, merge, карточки Чек-лист Приложение/тесты зависят от ApiClient / AuthApi , не от http . Нет сети → NoInternetException ; код не 2xx → ServerException(statusCode, message) . URL, заголовки, таймаут — только в ApiConfig . Каждый запрос логируется: INFO старт, DEBUG успех, ERROR сбой. Тесты запускаются командой flutter test без сети. Версия и тег v1.0.0 . ", "hours": 6, "minutes": 8}, {"id": "sprint3", "stage": 6, "title": "Спринт 3: вход и расписание игры", "lead": "1 ч. Первые экраны приложения на архитектуре с тремя слоями. Максимум 21,95 балла.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 30%\" />\n\u003ccol style=\"width: 40%\" />\n\u003ccol style=\"width: 30%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Задача\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы (верстка)\u003c/th>\n\u003cth>Где ещё баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>SplashScreen\u003c/td>\n\u003ctd style=\"text-align: right;\">0,15\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>3 приветственных экрана, только при первом запуске, с кнопкой «Пропустить»\u003c/td>\n\u003ctd style=\"text-align: right;\">0,60\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Экран «Регистрация»\u003c/td>\n\u003ctd style=\"text-align: right;\">1,10 + 0,70 (скролл)\u003c/td>\n\u003ctd>Сеть 1,10\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Проверка email\u003c/td>\n\u003ctd style=\"text-align: right;\">0,50\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Показ пароля\u003c/td>\n\u003ctd style=\"text-align: right;\">0,20\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Авторизация\u003c/td>\n\u003ctd style=\"text-align: right;\">0,70\u003c/td>\n\u003ctd>Сеть 1,10\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Landing Screen\u003c/td>\n\u003ctd style=\"text-align: right;\">0,40\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Меню-«гамбургер» слева с анимацией, закрывается свайпом и крестиком\u003c/td>\n\u003ctd style=\"text-align: right;\">1,00\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Центральная кнопка нижнего меню → Schedule Game\u003c/td>\n\u003ctd style=\"text-align: right;\">0,05\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Schedule Game, системные дата/время\u003c/td>\n\u003ctd style=\"text-align: right;\">1,10 + 0,10\u003c/td>\n\u003ctd>Сеть 1,10\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Publish → Success → Landing\u003c/td>\n\u003ctd style=\"text-align: right;\">0,05\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектура: папки, три слоя, SOLID, DRY\u003c/td>\n\u003ctd style=\"text-align: right;\">6,20\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Хранение: PDF-политика, соглашение, сессия, последний экран\u003c/td>\n\u003ctd style=\"text-align: right;\">1,50\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Аппаратная часть: фото профиля (галерея/камера)\u003c/td>\n\u003ctd style=\"text-align: right;\">4,00\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Архитектура здесь стоит \u003cstrong>6,2 балла\u003c/strong> — почти как вся верстка. Не откладывайте слои «на потом».\u003c/p>\n\u003ch2>Подготовка (первые 10 минут)\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Ветка \u003ccode>sprint-3\u003c/code> от \u003ccode>main\u003c/code>.\u003c/li>\n\u003cli>Создать проект, добавить \u003ccode>uikit\u003c/code> и \u003ccode>network_layer\u003c/code> из Git (по тегам), пакеты \u003ccode>shared_preferences\u003c/code>, \u003ccode>image_picker\u003c/code>, \u003ccode>logger\u003c/code>.\u003c/li>\n\u003cli>Создать папки \u003ccode>domain / data / presentation / common\u003c/code>.\u003c/li>\n\u003cli>Подключить DI-файл (\u003ccode>common/di.dart\u003c/code>).\u003c/li>\n\u003cli>Поднять \u003ccode>ScaffoldMessenger\u003c/code> для ошибок сети на 5 секунд.\u003c/li>\n\u003c/ol>\n\u003ch2>Splash и первый запуск\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// presentation/screens/splash/splash_screen.dart\nclass _SplashScreenState extends State&lt;SplashScreen&gt; {\n  @override\n  void initState() {\n    super.initState();\n    AppLog.info(&#39;SplashScreen&#39;, &#39;Жизненный цикл&#39;, &#39;initState&#39;);\n    _decide();\n  }\n\n  // Решает, какой экран открыть: онбординг, вход или последний сохранённый\n  Future&lt;void&gt; _decide() async {\n    await Future.delayed(const Duration(seconds: 2)); // время показа Splash по макету\n    final prefs = await SharedPreferences.getInstance();\n    final seenOnboarding = prefs.getBool(&#39;seen_onboarding&#39;) ?? false;\n    final token = prefs.getString(&#39;token&#39;);\n    final lastRoute = prefs.getString(&#39;last_route&#39;);\n\n    if (!mounted) return;\n    final next = !seenOnboarding\n        ? &#39;/onboarding&#39;\n        : token == null\n            ? &#39;/login&#39;\n            : (lastRoute ?? &#39;/landing&#39;);\n    Navigator.of(context).pushReplacementNamed(next);\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Приветственные экраны: \u003ccode>PageView\u003c/code> + \u003ccode>UiPagination\u003c/code> + кнопка «Skip», которая ведёт на \u003cstrong>регистрацию\u003c/strong>. Флаг \u003ccode>seen_onboarding = true\u003c/code> сохраняйте в момент выхода из онбординга (как через «Пропустить», так и на последнем экране).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>PageView(\n  controller: _page,\n  onPageChanged: (i) =&gt; setState(() =&gt; _index = i),\n  children: const [OnboardingPage1(), OnboardingPage2(), OnboardingPage3()],\n)\u003c/code>\u003c/pre>\n\u003ch2>Регистрация и вход\u003c/h2>\n\u003cp>Шаблон: \u003ccode>ЭкранRegistration\u003c/code> → \u003ccode>RegistrationController\u003c/code> → \u003ccode>RegisterUseCase\u003c/code> → \u003ccode>AuthRepository\u003c/code> (интерфейс в domain) → \u003ccode>AuthRepositoryImpl\u003c/code> (в data) → \u003ccode>AuthApi\u003c/code> (сетевая библиотека).\u003c/p>\n\u003cp>Проверка email по заданию (только маленькие буквы и цифры в имени и домене):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Проверяет email на соответствие шаблону name@domenname.ru\n// Принимает: строку [value]. Возвращает: true, если адрес корректен.\nbool isValidEmail(String value) =&gt;\n    RegExp(r&#39;^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$&#39;).hasMatch(value);\u003c/code>\u003c/pre>\n\u003cp>В реальном задании уточните по макету: допустимы ли точки в домене (\u003ccode>mail.co.uk\u003c/code>), нужна ли проверка на «живую» при вводе или при нажатии кнопки.\u003c/p>\n\u003cp>Макет регистрации: картинка сверху + заголовок «Create Account», который должен оставаться на месте при прокрутке — используйте \u003ccode>CustomScrollView\u003c/code> с \u003ccode>SliverAppBar(pinned: true)\u003c/code> или \u003ccode>Stack\u003c/code> с фиксированным заголовком.\u003c/p>\n\u003cp>Ошибки сети на 5 секунд с закрытием по кнопке:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>void showError(BuildContext context, String text) {\n  final messenger = ScaffoldMessenger.of(context);\n  messenger.hideCurrentSnackBar();\n  messenger.showSnackBar(SnackBar(\n    duration: const Duration(seconds: 5),\n    content: Text(text),\n    action: SnackBarAction(label: &#39;OK&#39;, onPressed: messenger.hideCurrentSnackBar),\n  ));\n}\u003c/code>\u003c/pre>\n\u003cp>Лучше сделать это компонентом UIKit (\u003ccode>UiToast\u003c/code>/\u003ccode>showErrorToast\u003c/code>), если макет отличается от стандартного SnackBar.\u003c/p>\n\u003ch2>Сессия и последний экран\u003c/h2>\n\u003cp>Модуль Г: «данные входа и активная сессия сохраняются после перезапуска» и «сохранять состояние последнего экрана».\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Сохранение токена после успешного входа\nfinal prefs = await SharedPreferences.getInstance();\nawait prefs.setString(&#39;token&#39;, result.token);\napiClient.setToken(result.token);   // и при старте приложения — восстановить\n\n// Запоминаем последний открытый экран через NavigatorObserver\nclass LastRouteObserver extends NavigatorObserver {\n  @override\n  void didPush(Route&lt;dynamic&gt; route, Route&lt;dynamic&gt;? previousRoute) {\n    final name = route.settings.name;\n    if (name != null) _save(name);\n  }\n\n  @override\n  void didPop(Route&lt;dynamic&gt; route, Route&lt;dynamic&gt;? previousRoute) {\n    final name = previousRoute?.settings.name;\n    if (name != null) _save(name);\n  }\n\n  Future&lt;void&gt; _save(String name) async {\n    final prefs = await SharedPreferences.getInstance();\n    await prefs.setString(&#39;last_route&#39;, name);\n  }\n}\n\nMaterialApp(navigatorObservers: [LastRouteObserver()], ...)\u003c/code>\u003c/pre>\n\u003cp>Если экран зависит от параметра (например, \u003ccode>gameId\u003c/code>), сохраняйте и его: \u003ccode>last_route_args\u003c/code>.\u003c/p>\n\u003cp>Выход из аккаунта: запрос \u003ccode>logout\u003c/code>, удалить токен и последний экран, вернуться на логин.\u003c/p>\n\u003ch2>Меню слева\u003c/h2>\n\u003cp>Самый простой и надёжный способ: \u003ccode>Scaffold.drawer\u003c/code>. Он выезжает слева с анимацией и закрывается свайпом влево.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Scaffold(\n  key: _scaffoldKey,\n  drawer: AppDrawer(),           // стилизуйте под макет: ширина, фон, скругления\n  appBar: AppBar(leading: IconButton(\n    icon: const Icon(Icons.menu),\n    onPressed: () =&gt; _scaffoldKey.currentState?.openDrawer())),\n)\n\n// Внутри AppDrawer кнопка закрытия:\nIconButton(icon: const Icon(Icons.close), onPressed: () =&gt; Navigator.of(context).pop())\u003c/code>\u003c/pre>\n\u003cp>Если дизайн не похож на стандартный Drawer, соберите свой через \u003ccode>Stack\u003c/code> + \u003ccode>AnimatedSlide\u003c/code> + \u003ccode>GestureDetector(onHorizontalDragEnd: ...)\u003c/code>.\u003c/p>\n\u003ch2>Schedule Game\u003c/h2>\n\u003cp>Поля: название, категория (Select), дата и время, галка уведомления. Для даты и времени — \u003ccode>showDatePicker\u003c/code> / \u003ccode>showTimePicker\u003c/code>. После Publish:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Валидация.\u003c/li>\n\u003cli>Вызов UseCase → репозиторий → сеть (игра сохраняется на сервере).\u003c/li>\n\u003cli>Переход на \u003ccode>Success\u003c/code>, оттуда — \u003ccode>pushAndRemoveUntil\u003c/code> на Landing.\u003c/li>\n\u003c/ol>\n\u003cpre class=\"dart\">\u003ccode>final start = DateTime(d.year, d.month, d.day, t.hour, t.minute);\u003c/code>\u003c/pre>\n\u003cp>Если стоит галка уведомления, сохраните это поле (оно понадобится в спринте 4).\u003c/p>\n\u003ch2>Политика и соглашение\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// PDF из assets: пакет pdfx\nfinal doc = await PdfDocument.openAsset(&#39;assets/docs/privacy.pdf&#39;);\n// Пользовательское соглашение: обычный экран с текстом и прокруткой\u003c/code>\u003c/pre>\n\u003cp>Пропишите файлы в \u003ccode>pubspec.yaml\u003c/code> в \u003ccode>assets\u003c/code>. Без пакета для PDF можно открыть файл через \u003ccode>url_launcher\u003c/code>, но проще и надёжнее показать внутри приложения.\u003c/p>\n\u003ch2>Фото профиля (камера и галерея)\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final picker = ImagePicker();\n\nFuture&lt;void&gt; pickPhoto() async {\n  final source = await showModalBottomSheet&lt;ImageSource&gt;(\n    context: context,\n    builder: (_) =&gt; const PhotoSourceSheet(), // Галерея / Камера\n  );\n  if (source == null) return;\n  try {\n    final file = await picker.pickImage(source: source, maxWidth: 1024, imageQuality: 85);\n    if (file == null) return; // пользователь отменил\n    // отправить на сервер или сохранить, затем обновить аватар на экране\n  } catch (e, st) {\n    AppLog.error(&#39;PlayerScreen&#39;, &#39;Фото&#39;, &#39;Не удалось выбрать фото&#39;, e, st);\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Права:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Android\u003c/strong> — \u003ccode>AndroidManifest.xml\u003c/code>: \u003ccode>&lt;uses-permission android:name=\"android.permission.CAMERA\"/&gt;\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>iOS\u003c/strong> — \u003ccode>Info.plist\u003c/code>: \u003ccode>NSCameraUsageDescription\u003c/code>, \u003ccode>NSPhotoLibraryUsageDescription\u003c/code> с текстом на русском.\u003c/li>\n\u003c/ul>\n\u003cp>Проверьте поведение при \u003cstrong>отказе\u003c/strong> в разрешении: приложение не должно падать, показывает понятное сообщение.\u003c/p>\n\u003ch2>Что чаще всего теряют в спринте 3\u003c/h2>\n\u003cul>\n\u003cli>Слои смешаны: экран импортирует \u003ccode>data/\u003c/code>, \u003ccode>domain\u003c/code> знает про \u003ccode>http\u003c/code>.\u003c/li>\n\u003cli>Файлы лежат вне нужных папок (−0,1 за файл).\u003c/li>\n\u003cli>Нет проверки «только первый запуск»: онбординг показывается снова.\u003c/li>\n\u003cli>Забыли \u003ccode>mounted\u003c/code> после \u003ccode>await\u003c/code> — падение при переходе.\u003c/li>\n\u003cli>Не закрыли Success → Landing через очистку стека (можно вернуться назад).\u003c/li>\n\u003c/ul>\n\u003ch2>Чек-лист\u003c/h2>\n\u003cul class=\"task-list\">\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Три слоя, Domain без импортов Flutter и сети.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Все обращения в сеть идут через интерфейс репозитория → интерфейс сетевого слоя.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Ошибки: SnackBar 5 секунд + закрытие.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Перезапуск приложения возвращает на сохранённый экран, сессия сохранена.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Фото: галерея и камера, права прописаны.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Комментарии и логи во всех классах.\u003c/label>\u003c/li>\n\u003c/ul>\n", "text": " Что нужно сделать Задача Баллы (верстка) Где ещё баллы SplashScreen 0,15 3 приветственных экрана, только при первом запуске, с кнопкой «Пропустить» 0,60 Экран «Регистрация» 1,10 + 0,70 (скролл) Сеть 1,10 Проверка email 0,50 Показ пароля 0,20 Авторизация 0,70 Сеть 1,10 Landing Screen 0,40 Меню-«гамбургер» слева с анимацией, закрывается свайпом и крестиком 1,00 Центральная кнопка нижнего меню → Schedule Game 0,05 Schedule Game, системные дата/время 1,10 + 0,10 Сеть 1,10 Publish → Success → Landing 0,05 Архитектура: папки, три слоя, SOLID, DRY 6,20 Хранение: PDF-политика, соглашение, сессия, последний экран 1,50 Аппаратная часть: фото профиля (галерея/камера) 4,00 Архитектура здесь стоит 6,2 балла — почти как вся верстка. Не откладывайте слои «на потом». Подготовка (первые 10 минут) Ветка sprint-3 от main . Создать проект, добавить uikit и network_layer из Git (по тегам), пакеты shared_preferences , image_picker , logger . Создать папки domain / data / presentation / common . Подключить DI-файл ( common/di.dart ). Поднять ScaffoldMessenger для ошибок сети на 5 секунд. Splash и первый запуск // presentation/screens/splash/splash_screen.dart class _SplashScreenState extends State\u003cSplashScreen> { @override void initState() { super.initState(); AppLog.info('SplashScreen', 'Жизненный цикл', 'initState'); _decide(); } // Решает, какой экран открыть: онбординг, вход или последний сохранённый Future\u003cvoid> _decide() async { await Future.delayed(const Duration(seconds: 2)); // время показа Splash по макету final prefs = await SharedPreferences.getInstance(); final seenOnboarding = prefs.getBool('seen_onboarding') ?? false; final token = prefs.getString('token'); final lastRoute = prefs.getString('last_route'); if (!mounted) return; final next = !seenOnboarding ? '/onboarding' : token == null ? '/login' : (lastRoute ?? '/landing'); Navigator.of(context).pushReplacementNamed(next); } } Приветственные экраны: PageView + UiPagination + кнопка «Skip», которая ведёт на регистрацию . Флаг seen_onboarding = true сохраняйте в момент выхода из онбординга (как через «Пропустить», так и на последнем экране). PageView( controller: _page, onPageChanged: (i) => setState(() => _index = i), children: const [OnboardingPage1(), OnboardingPage2(), OnboardingPage3()], ) Регистрация и вход Шаблон: ЭкранRegistration → RegistrationController → RegisterUseCase → AuthRepository (интерфейс в domain) → AuthRepositoryImpl (в data) → AuthApi (сетевая библиотека). Проверка email по заданию (только маленькие буквы и цифры в имени и домене): // Проверяет email на соответствие шаблону name@domenname.ru // Принимает: строку [value]. Возвращает: true, если адрес корректен. bool isValidEmail(String value) => RegExp(r'^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$').hasMatch(value); В реальном задании уточните по макету: допустимы ли точки в домене ( mail.co.uk ), нужна ли проверка на «живую» при вводе или при нажатии кнопки. Макет регистрации: картинка сверху + заголовок «Create Account», который должен оставаться на месте при прокрутке — используйте CustomScrollView с SliverAppBar(pinned: true) или Stack с фиксированным заголовком. Ошибки сети на 5 секунд с закрытием по кнопке: void showError(BuildContext context, String text) { final messenger = ScaffoldMessenger.of(context); messenger.hideCurrentSnackBar(); messenger.showSnackBar(SnackBar( duration: const Duration(seconds: 5), content: Text(text), action: SnackBarAction(label: 'OK', onPressed: messenger.hideCurrentSnackBar), )); } Лучше сделать это компонентом UIKit ( UiToast / showErrorToast ), если макет отличается от стандартного SnackBar. Сессия и последний экран Модуль Г: «данные входа и активная сессия сохраняются после перезапуска» и «сохранять состояние последнего экрана». // Сохранение токена после успешного входа final prefs = await SharedPreferences.getInstance(); await prefs.setString('token', result.token); apiClient.setToken(result.token); // и при старте приложения — восстановить // Запоминаем последний открытый экран через NavigatorObserver class LastRouteObserver extends NavigatorObserver { @override void didPush(Route\u003cdynamic> route, Route\u003cdynamic>? previousRoute) { final name = route.settings.name; if (name != null) _save(name); } @override void didPop(Route\u003cdynamic> route, Route\u003cdynamic>? previousRoute) { final name = previousRoute?.settings.name; if (name != null) _save(name); } Future\u003cvoid> _save(String name) async { final prefs = await SharedPreferences.getInstance(); await prefs.setString('last_route', name); } } MaterialApp(navigatorObservers: [LastRouteObserver()], ...) Если экран зависит от параметра (например, gameId ), сохраняйте и его: last_route_args . Выход из аккаунта: запрос logout , удалить токен и последний экран, вернуться на логин. Меню слева Самый простой и надёжный способ: Scaffold.drawer . Он выезжает слева с анимацией и закрывается свайпом влево. Scaffold( key: _scaffoldKey, drawer: AppDrawer(), // стилизуйте под макет: ширина, фон, скругления appBar: AppBar(leading: IconButton( icon: const Icon(Icons.menu), onPressed: () => _scaffoldKey.currentState?.openDrawer())), ) // Внутри AppDrawer кнопка закрытия: IconButton(icon: const Icon(Icons.close), onPressed: () => Navigator.of(context).pop()) Если дизайн не похож на стандартный Drawer, соберите свой через Stack + AnimatedSlide + GestureDetector(onHorizontalDragEnd: ...) . Schedule Game Поля: название, категория (Select), дата и время, галка уведомления. Для даты и времени — showDatePicker / showTimePicker . После Publish: Валидация. Вызов UseCase → репозиторий → сеть (игра сохраняется на сервере). Переход на Success , оттуда — pushAndRemoveUntil на Landing. final start = DateTime(d.year, d.month, d.day, t.hour, t.minute); Если стоит галка уведомления, сохраните это поле (оно понадобится в спринте 4). Политика и соглашение // PDF из assets: пакет pdfx final doc = await PdfDocument.openAsset('assets/docs/privacy.pdf'); // Пользовательское соглашение: обычный экран с текстом и прокруткой Пропишите файлы в pubspec.yaml в assets . Без пакета для PDF можно открыть файл через url_launcher , но проще и надёжнее показать внутри приложения. Фото профиля (камера и галерея) final picker = ImagePicker(); Future\u003cvoid> pickPhoto() async { final source = await showModalBottomSheet\u003cImageSource>( context: context, builder: (_) => const PhotoSourceSheet(), // Галерея / Камера ); if (source == null) return; try { final file = await picker.pickImage(source: source, maxWidth: 1024, imageQuality: 85); if (file == null) return; // пользователь отменил // отправить на сервер или сохранить, затем обновить аватар на экране } catch (e, st) { AppLog.error('PlayerScreen', 'Фото', 'Не удалось выбрать фото', e, st); } } Права: Android — AndroidManifest.xml : \u003cuses-permission android:name=\"android.permission.CAMERA\"/> . iOS — Info.plist : NSCameraUsageDescription , NSPhotoLibraryUsageDescription с текстом на русском. Проверьте поведение при отказе в разрешении: приложение не должно падать, показывает понятное сообщение. Что чаще всего теряют в спринте 3 Слои смешаны: экран импортирует data/ , domain знает про http . Файлы лежат вне нужных папок (−0,1 за файл). Нет проверки «только первый запуск»: онбординг показывается снова. Забыли mounted после await — падение при переходе. Не закрыли Success → Landing через очистку стека (можно вернуться назад). Чек-лист Три слоя, Domain без импортов Flutter и сети. Все обращения в сеть идут через интерфейс репозитория → интерфейс сетевого слоя. Ошибки: SnackBar 5 секунд + закрытие. Перезапуск приложения возвращает на сохранённый экран, сессия сохранена. Фото: галерея и камера, права прописаны. Комментарии и логи во всех классах. ", "hours": 6, "minutes": 6}, {"id": "sprint4", "stage": 6, "title": "Спринт 4: бои, игроки, статистика, Image", "lead": "1 ч. Самый дорогой спринт: 25,55 балла. Список игр, детали, профиль соперника, графики и первая игра.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 27%\" />\n\u003ccol style=\"width: 36%\" />\n\u003ccol style=\"width: 36%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Задача\u003c/th>\n\u003cth style=\"text-align: right;\">Верстка\u003c/th>\n\u003cth style=\"text-align: right;\">Сеть\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Discover Combats (все созданные и прошедшие игры)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20 + 0,05\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Combat Information, вход в игру, если нет соперника\u003c/td>\n\u003ctd style=\"text-align: right;\">0,90 + 0,10\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Player Information (из Most Popular Players)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Statistics: Earnings, Played Games, Scheduled Games\u003c/td>\n\u003ctd style=\"text-align: right;\">0,80 + 3×0,5\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Игра \u003cstrong>Image\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00 + 0,30\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Автозавершение при сборке пазла\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Победитель — кто быстрее; результаты на сервер\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектура: папки, 3 слоя, SOLID, DRY\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">5,30\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Хранение: последний экран, закрыл игру = проиграл, кэш медиа\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Уведомление за час до игры\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">1,00\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Игра Image вместе с автозавершением и победителем даёт \u003cstrong>6,3 балла\u003c/strong> — это почти четверть всего спринта.\u003c/p>\n\u003ch2>Порядок (60 минут)\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Минуты\u003c/th>\n\u003cth>Что\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>0–5\u003c/td>\n\u003ctd>Ветка \u003ccode>sprint-4\u003c/code>, обновить пакеты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>5–20\u003c/td>\n\u003ctd>Discover Combats + Combat Information (списки и детали — шаблон повторяется)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>20–32\u003c/td>\n\u003ctd>Player Information, Statistics\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>32–52\u003c/td>\n\u003ctd>Игра Image: поле, перемешивание, таймер, победа, отправка результата\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>52–58\u003c/td>\n\u003ctd>Уведомления, кэш\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>58–60\u003c/td>\n\u003ctd>Коммиты, PR, карточки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Если времени мало, реализуйте экраны полностью, а игру сначала \u003cstrong>минимально рабочую\u003c/strong> (сборка → завершение → отправка), а красоту доведите потом.\u003c/p>\n\u003ch2>Список игр и детали\u003c/h2>\n\u003cp>Шаблон экрана с сетью — одинаковый для всех:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>sealed class ScreenState&lt;T&gt; {}\nclass Loading&lt;T&gt; extends ScreenState&lt;T&gt; {}\nclass Loaded&lt;T&gt; extends ScreenState&lt;T&gt; { final T data; Loaded(this.data); }\nclass Failed&lt;T&gt; extends ScreenState&lt;T&gt; { final String message; Failed(this.message); }\u003c/code>\u003c/pre>\n\u003cpre class=\"dart\">\u003ccode>// В контроллере\nFuture&lt;void&gt; load() async {\n  state = Loading();\n  notifyListeners();\n  try {\n    final games = await _getGames();\n    state = Loaded(games);\n  } on ApiException catch (e) {\n    state = Failed(e.message);   // а экран покажет SnackBar на 5 секунд\n  }\n  notifyListeners();\n}\u003c/code>\u003c/pre>\n\u003cp>В интерфейсе: \u003ccode>switch (state) { Loading() =&gt; spinner, Loaded(:final data) =&gt; список, Failed(:final message) =&gt; сообщение + «повторить» }\u003c/code>.\u003c/p>\n\u003cp>Различие «предстоящая» / «прошедшая» игра определяется по времени начала и статусу с сервера. Сравнивайте даты в одном часовом поясе (\u003ccode>toUtc()\u003c/code> либо \u003ccode>toLocal()\u003c/code> везде).\u003c/p>\n\u003cp>\u003cstrong>Combat Information\u003c/strong>: если соперника нет, кнопка «Join» вызывает запрос «подключение к игре», затем переход в игру.\u003c/p>\n\u003ch2>Статистика: кольцевая диаграмма без пакета\u003c/h2>\n\u003cp>Из задания: «Played Games — количество выигранных игр, \u003cstrong>синий круг\u003c/strong> — Circle, \u003cstrong>красный\u003c/strong> — Image». Если нет разрешённого \u003ccode>fl_chart\u003c/code>, нарисуйте сами:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class DonutPainter extends CustomPainter {\n  final List&lt;double&gt; values;     // например [circleWins, imageWins]\n  final List&lt;Color&gt; colors;      // [синий, красный]\n  const DonutPainter(this.values, this.colors);\n\n  @override\n  void paint(Canvas canvas, Size size) {\n    final total = values.fold&lt;double&gt;(0, (a, b) =&gt; a + b);\n    final stroke = size.shortestSide * 0.18;\n    final rect = Offset.zero &amp; size;\n    final area = rect.deflate(stroke / 2);\n    var start = -3.14159 / 2; // начинаем сверху\n\n    for (var i = 0; i &lt; values.length; i++) {\n      final sweep = total == 0 ? 0.0 : values[i] / total * 2 * 3.14159;\n      final paint = Paint()\n        ..color = colors[i]\n        ..style = PaintingStyle.stroke\n        ..strokeWidth = stroke;\n      canvas.drawArc(area, start, sweep, false, paint);\n      start += sweep;\n    }\n  }\n\n  @override\n  bool shouldRepaint(DonutPainter old) =&gt; old.values != values || old.colors != colors;\n}\n\n// использование\nAspectRatio(aspectRatio: 1, child: CustomPaint(painter: DonutPainter([4, 3], [Colors.blue, Colors.red])))\u003c/code>\u003c/pre>\n\u003cp>Три показателя:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Показатель\u003c/th>\n\u003cth>Как считать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>THIS WEEK EARNINGS\u003c/td>\n\u003ctd>Сумма баллов за текущую неделю из статистики игрока\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Played Games\u003c/td>\n\u003ctd>Количество выигранных игр по категориям Circle и Image\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Scheduled Games\u003c/td>\n\u003ctd>Количество созданных игр за текущую неделю\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Начало недели:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final now = DateTime.now();\nfinal monday = DateTime(now.year, now.month, now.day).subtract(Duration(days: now.weekday - 1));\u003c/code>\u003c/pre>\n\u003ch2>Игра Image: идея и каркас\u003c/h2>\n\u003cp>В макете и прототипе Figma посмотрите механику (в тексте задания: «логику можно посмотреть в режиме прототипа»): картинка режется на части, части перемешаны, игрок переставляет их, пока картинка не будет собрана. Время идёт, как только игра началась.\u003c/p>\n\u003cp>\u003cstrong>Одинаковая картинка у обоих игроков, но разная в каждой игре.\u003c/strong> Значит, выбор картинки и порядок перемешивания должны зависеть от того, что \u003cstrong>одинаково у обоих игроков\u003c/strong>, то есть от \u003ccode>id\u003c/code> игры:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:math&#39;;\n\n// Список возможных картинок\nconst images = [&#39;assets/img/1.jpg&#39;, &#39;assets/img/2.jpg&#39;, &#39;assets/img/3.jpg&#39;];\n\n// seed — число-идентификатор игры (например, id с сервера)\nString pickImage(int seed) =&gt; images[Random(seed).nextInt(images.length)];\n\nList&lt;int&gt; shuffleTiles(int count, int seed) {\n  final order = List&lt;int&gt;.generate(count, (i) =&gt; i);\n  order.shuffle(Random(seed));\n  return order;\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Не используйте \u003ccode>string.hashCode\u003c/code> как seed, если он должен совпасть на разных устройствах: значение не гарантируется одинаковым между запусками и платформами. Берите числовой \u003ccode>id\u003c/code> игры, либо превращайте строку в число вручную (сумма кодов символов).\u003c/p>\n\u003c/div>\n\u003cp>Состояние игры в одном месте (контроллер/Cubit):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class ImageGameController extends ChangeNotifier {\n  final int size;                    // сетка size × size\n  late List&lt;int&gt; tiles;              // tiles[позиция] = номер части\n  int moves = 0;\n  final Stopwatch _watch = Stopwatch();\n\n  ImageGameController({required this.size, required int seed}) {\n    tiles = shuffleTiles(size * size, seed);\n  }\n\n  void start() =&gt; _watch.start();\n\n  // Меняет местами две части и проверяет, собрана ли картинка\n  void swap(int a, int b) {\n    final t = tiles[a]; tiles[a] = tiles[b]; tiles[b] = t;\n    moves++;\n    notifyListeners();\n    if (isSolved) _finish();\n  }\n\n  // Картинка собрана, если каждая часть на своём месте\n  bool get isSolved {\n    for (var i = 0; i &lt; tiles.length; i++) {\n      if (tiles[i] != i) return false;\n    }\n    return true;\n  }\n\n  Duration get elapsed =&gt; _watch.elapsed;\n\n  Future&lt;void&gt; _finish() async {\n    _watch.stop();\n    // отправить результат на сервер: время и победитель определяются сервером/сравнением\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Отображение частей из одной картинки:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Показать часть картинки: Align + ClipRect + увеличенное изображение\nClipRect(\n  child: Align(\n    alignment: Alignment(-1 + 2 * col / (size - 1), -1 + 2 * row / (size - 1)),\n    widthFactor: 1 / size,\n    heightFactor: 1 / size,\n    child: Image.asset(path, fit: BoxFit.cover),\n  ),\n)\u003c/code>\u003c/pre>\n\u003cp>Для перетаскивания используйте \u003ccode>Draggable\u003c/code> + \u003ccode>DragTarget\u003c/code> или \u003ccode>GestureDetector\u003c/code> с двумя нажатиями «выбрать-поменять». Начните с двух нажатий: надёжнее и быстрее, потом улучшайте.\u003c/p>\n\u003cp>Каждое движение и отправку позже придётся отправить в метрику (спринт 6), поэтому сразу делайте метод \u003ccode>onMove()\u003c/code> одним местом.\u003c/p>\n\u003ch2>Автозавершение и победитель\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Как только \u003ccode>isSolved == true\u003c/code>, игра \u003cstrong>сама\u003c/strong> завершается: таймер стоп, экран блокируется, результат улетает на сервер («сохранение результата игры»).\u003c/li>\n\u003cli>Победитель — кто собрал быстрее. Сравнение делайте так, как описывает API: либо сервер возвращает победителя, либо вы сравниваете \u003ccode>time\u003c/code> обоих игроков.\u003c/li>\n\u003cli>Экран результата: время игрока, время соперника, победа/поражение.\u003c/li>\n\u003c/ol>\n\u003cp>Данные по играм должны попасть на сервер, иначе статистика не заполнится.\u003c/p>\n\u003ch2>Закрытие игры = поражение\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class _GameScreenState extends State&lt;GameScreen&gt; with WidgetsBindingObserver {\n  bool _finished = false;\n\n  @override\n  void didChangeAppLifecycleState(AppLifecycleState state) {\n    // Если приложение свернули или закрыли во время игры — засчитываем поражение\n    if (!_finished &amp;&amp; (state == AppLifecycleState.paused || state == AppLifecycleState.detached)) {\n      _lose();\n    }\n  }\n\n  Future&lt;void&gt; _lose() async {\n    _finished = true;\n    await controller.reportLose();   // запрос «сохранение результата игры»\n  }\n  ...\n}\u003c/code>\u003c/pre>\n\u003cp>Дополнительно:\u003c/p>\n\u003cul>\n\u003cli>Кнопка «назад» внутри игры — через \u003ccode>PopScope\u003c/code>: диалог «Выйти? Вы проиграете» и \u003ccode>_lose()\u003c/code> при согласии.\u003c/li>\n\u003cli>Сохраните в \u003ccode>SharedPreferences\u003c/code> флаг \u003ccode>active_game_id\u003c/code> при старте игры и убирайте при завершении. При запуске приложения, если флаг остался (приложение убили), отправьте поражение.\u003c/li>\n\u003c/ul>\n\u003ch2>Кэширование медиа\u003c/h2>\n\u003cp>«Все медиа ресурсы должны кэшироваться». Аватары, картинки игр:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>CachedNetworkImage(\n  imageUrl: player.photoUrl,\n  fit: BoxFit.cover,\n  placeholder: (_, __) =&gt; const ColoredBox(color: UiColors.border),\n  errorWidget: (_, __, ___) =&gt; const Icon(Icons.person),\n)\u003c/code>\u003c/pre>\n\u003cp>Проверьте: включите авиарежим, откройте экран, который уже открывали: картинки должны остаться.\u003c/p>\n\u003ch2>Локальное уведомление за 1 час\u003c/h2>\n\u003cp>Если в Schedule Game стояла галка, при создании игры (и при загрузке списка, если приложение переустановили) планируйте уведомление.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final plugin = FlutterLocalNotificationsPlugin();\n\nFuture&lt;void&gt; initNotifications() async {\n  tz.initializeTimeZones();                       // пакет timezone\n  tz.setLocalLocation(tz.getLocation(&#39;Asia/Yekaterinburg&#39;)); // или flutter_timezone\n  const settings = InitializationSettings(\n    android: AndroidInitializationSettings(&#39;@mipmap/ic_launcher&#39;),\n    iOS: DarwinInitializationSettings(),          // запросит разрешение на iOS\n  );\n  await plugin.initialize(settings);\n  // Android 13+: запросить разрешение на показ\n  await plugin\n      .resolvePlatformSpecificImplementation&lt;AndroidFlutterLocalNotificationsPlugin&gt;()\n      ?.requestNotificationsPermission();\n}\n\nFuture&lt;void&gt; scheduleReminder(Game game) async {\n  final when = game.startAt.subtract(const Duration(hours: 1));\n  if (when.isBefore(DateTime.now())) return;      // уже поздно\n  await plugin.zonedSchedule(\n    game.id.hashCode,                             // id уведомления\n    &#39;Скоро игра&#39;,\n    &#39;Через час: ${game.title}&#39;,\n    tz.TZDateTime.from(when, tz.local),\n    const NotificationDetails(\n      android: AndroidNotificationDetails(&#39;games&#39;, &#39;Игры&#39;),\n      iOS: DarwinNotificationDetails(),\n    ),\n    androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,\n  );\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Сигнатуры \u003ccode>flutter_local_notifications\u003c/code> отличаются между версиями (например, у старых версий был обязательный параметр \u003ccode>uiLocalNotificationDateInterpretation\u003c/code>). Заранее создайте тестовый проект и проверьте с той версией, которую вам согласуют. Также нужны права в \u003ccode>AndroidManifest.xml\u003c/code>: \u003ccode>POST_NOTIFICATIONS\u003c/code>, \u003ccode>SCHEDULE_EXACT_ALARM\u003c/code> (или \u003ccode>USE_EXACT_ALARM\u003c/code>) и ресиверы из README пакета.\u003c/p>\n\u003c/div>\n\u003cp>Для проверки в тесте можно временно поставить интервал в одну минуту.\u003c/p>\n\u003ch2>Частые ошибки\u003c/h2>\n\u003cul>\n\u003cli>Картинка у соперников разная: использовали \u003ccode>Random()\u003c/code> без seed.\u003c/li>\n\u003cli>Игра не завершается, потому что \u003ccode>isSolved\u003c/code> проверяется только при отпускании пальца.\u003c/li>\n\u003cli>Секундомер продолжает идти после победы или ухода с экрана (забыли \u003ccode>dispose\u003c/code>/\u003ccode>stop\u003c/code>).\u003c/li>\n\u003cli>Результат не отправляется в сеть при сворачивании.\u003c/li>\n\u003cli>\u003ccode>DateTime\u003c/code> в UTC сравнивают с локальным.\u003c/li>\n\u003c/ul>\n", "text": " Что нужно сделать Задача Верстка Сеть Discover Combats (все созданные и прошедшие игры) 1,20 + 0,05 1,20 Combat Information, вход в игру, если нет соперника 0,90 + 0,10 1,20 Player Information (из Most Popular Players) 1,20 1,20 Statistics: Earnings, Played Games, Scheduled Games 0,80 + 3×0,5 1,20 Игра Image 2,00 + 0,30 1,20 Автозавершение при сборке пазла 2,00 Победитель — кто быстрее; результаты на сервер 2,00 Архитектура: папки, 3 слоя, SOLID, DRY 5,30 Хранение: последний экран, закрыл игру = проиграл, кэш медиа 1,20 Уведомление за час до игры 1,00 Игра Image вместе с автозавершением и победителем даёт 6,3 балла — это почти четверть всего спринта. Порядок (60 минут) Минуты Что 0–5 Ветка sprint-4 , обновить пакеты 5–20 Discover Combats + Combat Information (списки и детали — шаблон повторяется) 20–32 Player Information, Statistics 32–52 Игра Image: поле, перемешивание, таймер, победа, отправка результата 52–58 Уведомления, кэш 58–60 Коммиты, PR, карточки Если времени мало, реализуйте экраны полностью, а игру сначала минимально рабочую (сборка → завершение → отправка), а красоту доведите потом. Список игр и детали Шаблон экрана с сетью — одинаковый для всех: sealed class ScreenState\u003cT> {} class Loading\u003cT> extends ScreenState\u003cT> {} class Loaded\u003cT> extends ScreenState\u003cT> { final T data; Loaded(this.data); } class Failed\u003cT> extends ScreenState\u003cT> { final String message; Failed(this.message); } // В контроллере Future\u003cvoid> load() async { state = Loading(); notifyListeners(); try { final games = await _getGames(); state = Loaded(games); } on ApiException catch (e) { state = Failed(e.message); // а экран покажет SnackBar на 5 секунд } notifyListeners(); } В интерфейсе: switch (state) { Loading() => spinner, Loaded(:final data) => список, Failed(:final message) => сообщение + «повторить» } . Различие «предстоящая» / «прошедшая» игра определяется по времени начала и статусу с сервера. Сравнивайте даты в одном часовом поясе ( toUtc() либо toLocal() везде). Combat Information : если соперника нет, кнопка «Join» вызывает запрос «подключение к игре», затем переход в игру. Статистика: кольцевая диаграмма без пакета Из задания: «Played Games — количество выигранных игр, синий круг — Circle, красный — Image». Если нет разрешённого fl_chart , нарисуйте сами: class DonutPainter extends CustomPainter { final List\u003cdouble> values; // например [circleWins, imageWins] final List\u003cColor> colors; // [синий, красный] const DonutPainter(this.values, this.colors); @override void paint(Canvas canvas, Size size) { final total = values.fold\u003cdouble>(0, (a, b) => a + b); final stroke = size.shortestSide * 0.18; final rect = Offset.zero & size; final area = rect.deflate(stroke / 2); var start = -3.14159 / 2; // начинаем сверху for (var i = 0; i \u003c values.length; i++) { final sweep = total == 0 ? 0.0 : values[i] / total * 2 * 3.14159; final paint = Paint() ..color = colors[i] ..style = PaintingStyle.stroke ..strokeWidth = stroke; canvas.drawArc(area, start, sweep, false, paint); start += sweep; } } @override bool shouldRepaint(DonutPainter old) => old.values != values || old.colors != colors; } // использование AspectRatio(aspectRatio: 1, child: CustomPaint(painter: DonutPainter([4, 3], [Colors.blue, Colors.red]))) Три показателя: Показатель Как считать THIS WEEK EARNINGS Сумма баллов за текущую неделю из статистики игрока Played Games Количество выигранных игр по категориям Circle и Image Scheduled Games Количество созданных игр за текущую неделю Начало недели: final now = DateTime.now(); final monday = DateTime(now.year, now.month, now.day).subtract(Duration(days: now.weekday - 1)); Игра Image: идея и каркас В макете и прототипе Figma посмотрите механику (в тексте задания: «логику можно посмотреть в режиме прототипа»): картинка режется на части, части перемешаны, игрок переставляет их, пока картинка не будет собрана. Время идёт, как только игра началась. Одинаковая картинка у обоих игроков, но разная в каждой игре. Значит, выбор картинки и порядок перемешивания должны зависеть от того, что одинаково у обоих игроков , то есть от id игры: import 'dart:math'; // Список возможных картинок const images = ['assets/img/1.jpg', 'assets/img/2.jpg', 'assets/img/3.jpg']; // seed — число-идентификатор игры (например, id с сервера) String pickImage(int seed) => images[Random(seed).nextInt(images.length)]; List\u003cint> shuffleTiles(int count, int seed) { final order = List\u003cint>.generate(count, (i) => i); order.shuffle(Random(seed)); return order; } Не используйте string.hashCode как seed, если он должен совпасть на разных устройствах: значение не гарантируется одинаковым между запусками и платформами. Берите числовой id игры, либо превращайте строку в число вручную (сумма кодов символов). Состояние игры в одном месте (контроллер/Cubit): class ImageGameController extends ChangeNotifier { final int size; // сетка size × size late List\u003cint> tiles; // tiles[позиция] = номер части int moves = 0; final Stopwatch _watch = Stopwatch(); ImageGameController({required this.size, required int seed}) { tiles = shuffleTiles(size * size, seed); } void start() => _watch.start(); // Меняет местами две части и проверяет, собрана ли картинка void swap(int a, int b) { final t = tiles[a]; tiles[a] = tiles[b]; tiles[b] = t; moves++; notifyListeners(); if (isSolved) _finish(); } // Картинка собрана, если каждая часть на своём месте bool get isSolved { for (var i = 0; i \u003c tiles.length; i++) { if (tiles[i] != i) return false; } return true; } Duration get elapsed => _watch.elapsed; Future\u003cvoid> _finish() async { _watch.stop(); // отправить результат на сервер: время и победитель определяются сервером/сравнением } } Отображение частей из одной картинки: // Показать часть картинки: Align + ClipRect + увеличенное изображение ClipRect( child: Align( alignment: Alignment(-1 + 2 * col / (size - 1), -1 + 2 * row / (size - 1)), widthFactor: 1 / size, heightFactor: 1 / size, child: Image.asset(path, fit: BoxFit.cover), ), ) Для перетаскивания используйте Draggable + DragTarget или GestureDetector с двумя нажатиями «выбрать-поменять». Начните с двух нажатий: надёжнее и быстрее, потом улучшайте. Каждое движение и отправку позже придётся отправить в метрику (спринт 6), поэтому сразу делайте метод onMove() одним местом. Автозавершение и победитель Как только isSolved == true , игра сама завершается: таймер стоп, экран блокируется, результат улетает на сервер («сохранение результата игры»). Победитель — кто собрал быстрее. Сравнение делайте так, как описывает API: либо сервер возвращает победителя, либо вы сравниваете time обоих игроков. Экран результата: время игрока, время соперника, победа/поражение. Данные по играм должны попасть на сервер, иначе статистика не заполнится. Закрытие игры = поражение class _GameScreenState extends State\u003cGameScreen> with WidgetsBindingObserver { bool _finished = false; @override void didChangeAppLifecycleState(AppLifecycleState state) { // Если приложение свернули или закрыли во время игры — засчитываем поражение if (!_finished && (state == AppLifecycleState.paused || state == AppLifecycleState.detached)) { _lose(); } } Future\u003cvoid> _lose() async { _finished = true; await controller.reportLose(); // запрос «сохранение результата игры» } ... } Дополнительно: Кнопка «назад» внутри игры — через PopScope : диалог «Выйти? Вы проиграете» и _lose() при согласии. Сохраните в SharedPreferences флаг active_game_id при старте игры и убирайте при завершении. При запуске приложения, если флаг остался (приложение убили), отправьте поражение. Кэширование медиа «Все медиа ресурсы должны кэшироваться». Аватары, картинки игр: CachedNetworkImage( imageUrl: player.photoUrl, fit: BoxFit.cover, placeholder: (_, __) => const ColoredBox(color: UiColors.border), errorWidget: (_, __, ___) => const Icon(Icons.person), ) Проверьте: включите авиарежим, откройте экран, который уже открывали: картинки должны остаться. Локальное уведомление за 1 час Если в Schedule Game стояла галка, при создании игры (и при загрузке списка, если приложение переустановили) планируйте уведомление. final plugin = FlutterLocalNotificationsPlugin(); Future\u003cvoid> initNotifications() async { tz.initializeTimeZones(); // пакет timezone tz.setLocalLocation(tz.getLocation('Asia/Yekaterinburg')); // или flutter_timezone const settings = InitializationSettings( android: AndroidInitializationSettings('@mipmap/ic_launcher'), iOS: DarwinInitializationSettings(), // запросит разрешение на iOS ); await plugin.initialize(settings); // Android 13+: запросить разрешение на показ await plugin .resolvePlatformSpecificImplementation\u003cAndroidFlutterLocalNotificationsPlugin>() ?.requestNotificationsPermission(); } Future\u003cvoid> scheduleReminder(Game game) async { final when = game.startAt.subtract(const Duration(hours: 1)); if (when.isBefore(DateTime.now())) return; // уже поздно await plugin.zonedSchedule( game.id.hashCode, // id уведомления 'Скоро игра', 'Через час: ${game.title}', tz.TZDateTime.from(when, tz.local), const NotificationDetails( android: AndroidNotificationDetails('games', 'Игры'), iOS: DarwinNotificationDetails(), ), androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle, ); } Сигнатуры flutter_local_notifications отличаются между версиями (например, у старых версий был обязательный параметр uiLocalNotificationDateInterpretation ). Заранее создайте тестовый проект и проверьте с той версией, которую вам согласуют. Также нужны права в AndroidManifest.xml : POST_NOTIFICATIONS , SCHEDULE_EXACT_ALARM (или USE_EXACT_ALARM ) и ресиверы из README пакета. Для проверки в тесте можно временно поставить интервал в одну минуту. Частые ошибки Картинка у соперников разная: использовали Random() без seed. Игра не завершается, потому что isSolved проверяется только при отпускании пальца. Секундомер продолжает идти после победы или ухода с экрана (забыли dispose / stop ). Результат не отправляется в сеть при сворачивании. DateTime в UTC сравнивают с локальным. ", "hours": 7, "minutes": 8}, {"id": "sprint5", "stage": 6, "title": "Спринт 5: игра Circle", "lead": "1 ч. Вторая игра, общее завершение и победитель. 11,65 балла.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Задача\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Игра \u003cstrong>Circle\u003c/strong>: собрать круги от большего к меньшему\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Автозавершение после сборки\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Победитель — кто быстрее; результаты на сервер для графиков\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сеть: экран Game Circle через абстракцию\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Архитектура: SOLID, DRY, слои\u003c/td>\n\u003ctd style=\"text-align: right;\">3,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Хранение: последний экран, закрыл игру = проиграл (0,35)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,25\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>В этом спринте самое важное — \u003cstrong>повторно использовать\u003c/strong> то, что сделали для Image: общий контроллер игры, таймер, отправку результата, проверку победителя. Если логика скопирована, вы теряете на DRY.\u003c/p>\n\u003ch2>Общая основа игр\u003c/h2>\n\u003cp>Выделите абстракцию, а две игры сделайте её реализациями (O и L из SOLID):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// domain/entities/game_category.dart\nenum GameCategory { image, circle }\n\n// Общее поведение любой игры-пазла.\nabstract class PuzzleGame extends ChangeNotifier {\n  final Stopwatch _watch = Stopwatch();\n  bool finished = false;\n\n  bool get isSolved;                 // каждая игра определяет сама\n  void onUserMove();                 // каждая игра определяет сама\n\n  Duration get elapsed =&gt; _watch.elapsed;\n\n  void start() =&gt; _watch.start();\n\n  // Общий шаг: игрок сделал ход, проверяем, не собран ли пазл\n  void afterMove() {\n    notifyListeners();\n    if (!finished &amp;&amp; isSolved) {\n      finished = true;\n      _watch.stop();\n      onFinished(); // отправка результата, переход на экран результата\n    }\n  }\n\n  void onFinished();\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>ImageGameController\u003c/code> и \u003ccode>CircleGameController\u003c/code> наследуют \u003ccode>PuzzleGame\u003c/code> и реализуют только \u003ccode>isSolved\u003c/code> и ходы. Экран результата, отправка в метрику, обработка выхода — общие.\u003c/p>\n\u003ch2>Логика Circle\u003c/h2>\n\u003cp>Цель: расположить круги в порядке от большего к меньшему. Посмотрите в прототипе, как это выглядит: вложенные круги, которые нужно перетащить на места, или набор кругов, который ставят по порядку в стопку. Ниже — универсальная модель «упорядочить по размеру».\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class CircleItem {\n  final int id;\n  final double radius;\n  const CircleItem(this.id, this.radius);\n}\n\nclass CircleGameController extends PuzzleGame {\n  late List&lt;CircleItem&gt; items;       // текущее расположение\n\n  CircleGameController({required int seed, required List&lt;CircleItem&gt; source}) {\n    items = [...source]..shuffle(Random(seed));   // одинаково у обоих игроков\n  }\n\n  // Собрано, если радиусы идут по убыванию\n  @override\n  bool get isSolved {\n    for (var i = 0; i &lt; items.length - 1; i++) {\n      if (items[i].radius &lt; items[i + 1].radius) return false;\n    }\n    return true;\n  }\n\n  @override\n  void onUserMove() =&gt; afterMove();\n\n  // Перемещение круга на новое место\n  void move(int from, int to) {\n    final item = items.removeAt(from);\n    items.insert(to, item);\n    onUserMove();\n  }\n\n  @override\n  void onFinished() {/* отправка результата */}\n}\u003c/code>\u003c/pre>\n\u003cp>Рисование кругов — \u003ccode>Container\u003c/code> с \u003ccode>BoxShape.circle\u003c/code> или \u003ccode>CustomPaint\u003c/code>. Для перетаскивания — \u003ccode>ReorderableListView\u003c/code> (если макет линейный) либо \u003ccode>Draggable\u003c/code> + \u003ccode>DragTarget\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>ReorderableListView(\n  onReorder: (oldIndex, newIndex) {\n    if (newIndex &gt; oldIndex) newIndex -= 1;   // особенность ReorderableListView\n    controller.move(oldIndex, newIndex);\n  },\n  children: [\n    for (final c in controller.items)\n      CircleWidget(key: ValueKey(c.id), radius: c.radius),\n  ],\n)\u003c/code>\u003c/pre>\n\u003ch2>Завершение и победитель\u003c/h2>\n\u003cp>Алгоритм одинаковый для обеих игр:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003ccode>isSolved == true\u003c/code> → таймер остановлен → экран заблокирован.\u003c/li>\n\u003cli>Запрос «сохранение результата» со временем и категорией.\u003c/li>\n\u003cli>Определение победителя (кто быстрее) по правилам API.\u003c/li>\n\u003cli>Экран результата и возврат на Landing.\u003c/li>\n\u003c/ol>\n\u003cp>Данные попадают в статистику: «Played Games» делится на \u003cstrong>Circle (синий)\u003c/strong> и \u003cstrong>Image (красный)\u003c/strong>, поэтому категорию нужно отправлять корректно.\u003c/p>\n\u003ch2>Закрытие игры = поражение\u003c/h2>\n\u003cp>То же, что в спринте 4 (\u003ccode>WidgetsBindingObserver\u003c/code>, \u003ccode>PopScope\u003c/code>, флаг \u003ccode>active_game_id\u003c/code>). Вынесите это в общий миксин для игровых экранов, а не копируйте:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>mixin GameLifecycleMixin&lt;T extends StatefulWidget&gt; on State&lt;T&gt; implements WidgetsBindingObserver {\n  // ... общий код: подписка на lifecycle и вызов onGameAbandoned()\n}\u003c/code>\u003c/pre>\n\u003cp>Если мешает \u003ccode>implements WidgetsBindingObserver\u003c/code>, используйте обычный базовый \u003ccode>State\u003c/code>-класс.\u003c/p>\n\u003ch2>Проверка перед сдачей\u003c/h2>\n\u003cul>\n\u003cli>Играйте две игры подряд, статистика растёт, круги не дублируются.\u003c/li>\n\u003cli>Выйдите из игры: засчитано поражение.\u003c/li>\n\u003cli>Перезапустите приложение посреди игры: вернулись на экран, где были, и не потеряли данные (либо засчитано поражение, если так сказано в карточке).\u003c/li>\n\u003cli>Отключите интернет: ошибка на 5 секунд, приложение живо.\u003c/li>\n\u003cli>Нет дублирования между \u003ccode>ImageGame\u003c/code> и \u003ccode>CircleGame\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2>Если не успеваете\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Сначала сделайте игру без анимации и красоты.\u003c/li>\n\u003cli>Затем экран результата и отправка.\u003c/li>\n\u003cli>Потом перетаскивание и стили.\u003c/li>\n\u003c/ol>\n", "text": " Что нужно сделать Задача Баллы Игра Circle : собрать круги от большего к меньшему 2,00 Автозавершение после сборки 2,00 Победитель — кто быстрее; результаты на сервер для графиков 2,00 Сеть: экран Game Circle через абстракцию 1,20 Архитектура: SOLID, DRY, слои 3,20 Хранение: последний экран, закрыл игру = проиграл (0,35) 1,25 В этом спринте самое важное — повторно использовать то, что сделали для Image: общий контроллер игры, таймер, отправку результата, проверку победителя. Если логика скопирована, вы теряете на DRY. Общая основа игр Выделите абстракцию, а две игры сделайте её реализациями (O и L из SOLID): // domain/entities/game_category.dart enum GameCategory { image, circle } // Общее поведение любой игры-пазла. abstract class PuzzleGame extends ChangeNotifier { final Stopwatch _watch = Stopwatch(); bool finished = false; bool get isSolved; // каждая игра определяет сама void onUserMove(); // каждая игра определяет сама Duration get elapsed => _watch.elapsed; void start() => _watch.start(); // Общий шаг: игрок сделал ход, проверяем, не собран ли пазл void afterMove() { notifyListeners(); if (!finished && isSolved) { finished = true; _watch.stop(); onFinished(); // отправка результата, переход на экран результата } } void onFinished(); } ImageGameController и CircleGameController наследуют PuzzleGame и реализуют только isSolved и ходы. Экран результата, отправка в метрику, обработка выхода — общие. Логика Circle Цель: расположить круги в порядке от большего к меньшему. Посмотрите в прототипе, как это выглядит: вложенные круги, которые нужно перетащить на места, или набор кругов, который ставят по порядку в стопку. Ниже — универсальная модель «упорядочить по размеру». class CircleItem { final int id; final double radius; const CircleItem(this.id, this.radius); } class CircleGameController extends PuzzleGame { late List\u003cCircleItem> items; // текущее расположение CircleGameController({required int seed, required List\u003cCircleItem> source}) { items = [...source]..shuffle(Random(seed)); // одинаково у обоих игроков } // Собрано, ес
