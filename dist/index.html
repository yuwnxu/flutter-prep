<script id="data" type="application/json">{"parts": [{"id": "start", "stage": 0, "title": "Карта чемпионата", "lead": "Что именно оценивают, сколько баллов в каждом модуле и какие правила нельзя нарушать.", "html": "\u003ch2>Что такое это задание\u003c/h2>\n\u003cp>Региональный этап «Профессионалов» по компетенции \u003cstrong>«Разработка мобильных приложений»\u003c/strong>. Вы за три дня (18 часов) делаете мобильное приложение для игры двух соперников: расписание боёв, поиск соперника, две игры-пазла (\u003cstrong>Image\u003c/strong> и \u003cstrong>Circle\u003c/strong>), статистика. Дизайн дан в Figma, бэкенд — готовый SaaS по REST API.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Параметр\u003c/th>\n\u003cth>Значение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Длительность\u003c/td>\n\u003ctd>18 часов, 3 конкурсных дня\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Модулей\u003c/td>\n\u003ctd>7 (5 обязательных + 2 вариативных)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Сумма баллов\u003c/td>\n\u003ctd>100\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Минимальные ОС\u003c/td>\n\u003ctd>Android 14, iOS 18\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Работа сдаётся\u003c/td>\n\u003ctd>через Git (удалённый репозиторий организаторов)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Задачи выдаются\u003c/td>\n\u003ctd>в таск-трекере, помечены спринтом\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Баллы по модулям\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Модуль\u003c/th>\n\u003cth>Название\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003cth>Тип\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>А\u003c/td>\n\u003ctd>Архитектура приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">17,70\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Б\u003c/td>\n\u003ctd>Верстка приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">34,36\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>В\u003c/td>\n\u003ctd>Клиент-серверное взаимодействие\u003c/td>\n\u003ctd style=\"text-align: right;\">24,14\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Г\u003c/td>\n\u003ctd>Хранение информации\u003c/td>\n\u003ctd style=\"text-align: right;\">4,85\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Д\u003c/td>\n\u003ctd>Аппаратные расширения устройства\u003c/td>\n\u003ctd style=\"text-align: right;\">5,00\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Е\u003c/td>\n\u003ctd>Тестирование\u003c/td>\n\u003ctd style=\"text-align: right;\">4,95\u003c/td>\n\u003ctd>вариативный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Ж\u003c/td>\n\u003ctd>Подготовка продукта\u003c/td>\n\u003ctd style=\"text-align: right;\">9,00\u003c/td>\n\u003ctd>вариативный\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"tip\">\n\u003cp>Верстка и клиент-сервер дают \u003cstrong>58 из 100 баллов\u003c/strong>. Но верстка без архитектуры и логирования получает \u003cstrong>половину\u003c/strong> баллов: почти в каждом критерии написано «половина итоговой оценки, если отсутствуют комментарии и логирование согласно заданию».\u003c/p>\n\u003c/div>\n\u003ch2>Баллы по спринтам\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 23%\" />\n\u003ccol style=\"width: 23%\" />\n\u003ccol style=\"width: 23%\" />\n\u003ccol style=\"width: 30%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Спринт\u003c/th>\n\u003cth>Время\u003c/th>\n\u003cth>Что делаете\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>1\u003c/td>\n\u003ctd>1 ч 30 мин\u003c/td>\n\u003ctd>UIKit в отдельной библиотеке + приложение StoryBook\u003c/td>\n\u003ctd style=\"text-align: right;\">10,96\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>2\u003c/td>\n\u003ctd>1 ч 10 мин\u003c/td>\n\u003ctd>Сетевой слой в отдельной библиотеке + тесты\u003c/td>\n\u003ctd style=\"text-align: right;\">20,89\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>3\u003c/td>\n\u003ctd>1 ч\u003c/td>\n\u003ctd>Splash, приветствие, регистрация, вход, Landing, Schedule Game\u003c/td>\n\u003ctd style=\"text-align: right;\">21,95\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>4\u003c/td>\n\u003ctd>1 ч\u003c/td>\n\u003ctd>Discover, Combat Info, Player Info, Statistics, игра Image\u003c/td>\n\u003ctd style=\"text-align: right;\">25,55\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>5\u003c/td>\n\u003ctd>1 ч\u003c/td>\n\u003ctd>Игра Circle, автозавершение, победитель\u003c/td>\n\u003ctd style=\"text-align: right;\">11,65\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>6\u003c/td>\n\u003ctd>3 ч\u003c/td>\n\u003ctd>Презентация, Яндекс-метрика, публикация в RuStore\u003c/td>\n\u003ctd style=\"text-align: right;\">9,00\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Сумма: 100 баллов. Самые «дорогие» спринты: 4, 3 и 2. Спринт 2 стоит почти вдвое больше первого, и он целиком про сеть и тесты.\u003c/p>\n\u003ch2>Правила, за которые снимают баллы\u003c/h2>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Канбан-доска.\u003c/strong> Колонки: «Готово к разработке» → «В работе» (не более 2 задач одновременно) → «Готово к тестированию» (вы сами переносите карточку и указываете \u003cstrong>коммит\u003c/strong>) → «Завершена» (переносят эксперты). Карточка не в «Готово к тестированию» — задача не проверяется.\u003c/li>\n\u003cli>\u003cstrong>Git.\u003c/strong> Ветка на каждый спринт, проект сохранён в ветку, pull request / merge в \u003ccode>main\u003c/code>. Если приложение не собирается из репозитория, работа \u003cstrong>не оценивается\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Дизайн строго по Figma.\u003c/strong> Шрифты, отступы, пропорции, цвета.\u003c/li>\n\u003cli>\u003cstrong>Адаптивность.\u003c/strong> Без больших пустот, без искажений, без горизонтального скролла, шрифты не заменяются системными.\u003c/li>\n\u003cli>\u003cstrong>Интернет почти недоступен.\u003c/strong> Один выделенный компьютер, \u003cstrong>10 минут на спринт\u003c/strong>, очередь не чаще раза в 10 минут. Пакеты нужно заранее согласовать с главным экспертом в день ознакомления.\u003c/li>\n\u003cli>\u003cstrong>Документирование и логи\u003c/strong> во всех спринтах (раздел «Комментарии и логи»).\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"warn\">\n\u003cp>Из пункта 5 следует важное: \u003cstrong>заранее выучите, какие пакеты вам нужны и как их подключать\u003c/strong>, и держите под рукой шпаргалку. На площадке нельзя долго искать документацию.\u003c/p>\n\u003c/div>\n\u003ch2>Пакеты, которые стоит согласовать заранее\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Задача\u003c/th>\n\u003cth>Пакет\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Сеть\u003c/td>\n\u003ctd>\u003ccode>http\u003c/code> (или \u003ccode>dio\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Логи\u003c/td>\n\u003ctd>\u003ccode>logger\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Хранение настроек и сессии\u003c/td>\n\u003ctd>\u003ccode>shared_preferences\u003c/code>, \u003ccode>flutter_secure_storage\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Кэш картинок\u003c/td>\n\u003ctd>\u003ccode>cached_network_image\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Фото\u003c/td>\n\u003ctd>\u003ccode>image_picker\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Уведомления\u003c/td>\n\u003ctd>\u003ccode>flutter_local_notifications\u003c/code>, \u003ccode>timezone\u003c/code>, \u003ccode>permission_handler\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>PDF\u003c/td>\n\u003ctd>\u003ccode>pdfx\u003c/code> или \u003ccode>flutter_pdfview\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Графики\u003c/td>\n\u003ctd>\u003ccode>fl_chart\u003c/code> (или рисовать самим через \u003ccode>CustomPainter\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Тесты\u003c/td>\n\u003ctd>\u003ccode>flutter_test\u003c/code>, \u003ccode>mocktail\u003c/code>, \u003ccode>http/testing.dart\u003c/code> (идёт вместе с \u003ccode>http\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Метрика\u003c/td>\n\u003ctd>\u003ccode>appmetrica_plugin\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Адаптив\u003c/td>\n\u003ctd>\u003ccode>vize\u003c/code> (вы уже используете)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Состояние\u003c/td>\n\u003ctd>\u003ccode>get\u003c/code> (GetX) или \u003ccode>provider\u003c/code> / \u003ccode>flutter_bloc\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Как пользоваться сайтом\u003c/h2>\n\u003cul>\n\u003cli>Идите по этапам слева направо: от «что такое программирование» до разборов спринтов.\u003c/li>\n\u003cli>Отмечайте темы как \u003cstrong>изученные\u003c/strong> (прогресс хранится в вашем браузере).\u003c/li>\n\u003cli>После каждого этапа решайте \u003cstrong>тренажёр\u003c/strong> с вопросами.\u003c/li>\n\u003cli>Перед каждой репетицией спринта откройте раздел «Чек-лист баллов».\u003c/li>\n\u003c/ul>\n", "text": " Что такое это задание Региональный этап «Профессионалов» по компетенции «Разработка мобильных приложений» . Вы за три дня (18 часов) делаете мобильное приложение для игры двух соперников: расписание боёв, поиск соперника, две игры-паз  пропорции, цвета. Адаптивность. Без больших пустот, без искажений, без горизонтального скролла, шрифты не заменяются системными. Интернет почти недоступен. Один выделенный компьютер, 10 минут на спринт , очередь не чаще раза в 10 минут. Пакеты нужно заранее согласовать с главным экспертом в день ознакомления. Документирование и логи во всех спринтах (раздел «Комментарии и логи»). Из пункта 5 следует важное: заранее выучите, какие пакеты вам нужны и как их подключать , и держите под рукой шпаргалку. На площадке нельзя долго искать документацию. Пакеты, которые стоит согласовать заранее Задача Пакет Сеть http (или dio ) Логи logger Хранение настроек и сессии shared_preferences , flutter_secure_storage Кэш картинок cached_network_image Фото image_picker Уведомления flutter_local_notifications , timezone , permission_handler PDF pdfx или flutter_pdfview Графики fl_chart (или рисовать самим через CustomPainter ) Тесты flutter_test , mocktail , http/testing.dart (идёт вместе с http ) Метрика appmetrica_plugin Адаптив vize (вы уже используете) Состояние get (GetX) или provider / flutter_bloc Как пользоваться сайтом Идите по этапам слева направо: от «что такое программирование» до разборов спринтов. Отмечайте темы как изученные (прогресс хранится в вашем браузере). После каждого этапа решайте тренажёр с вопросами. Перед каждой репетицией спринта откройте раздел «Чек-лист баллов». ", "hours": 1, "minutes": 3}, {"id": "programming", "stage": 1, "title": "Что такое программирование", "lead": "Алгоритм, переменная, условие, цикл, функция. Базовые идеи, на которых стоит любой код.", "html": "\u003ch2>Программа и алгоритм\u003c/h2>\n\u003cp>\u003cstrong>Алгоритм\u003c/strong> — конечная последовательность шагов, которая решает задачу. \u003cstrong>Программа\u003c/strong> — алгоритм, записанный на языке, который понимает компьютер. Мобильное приложение — большая программа, которая реагирует на касания, запрашивает данные у сервера и рисует экран.\u003c/p>\n\u003cp>Пример алгоритма «проверить пароль»:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Получить введённую строку.\u003c/li>\n\u003cli>Если её длина меньше 8 — показать ошибку и остановиться.\u003c/li>\n\u003cli>Иначе отправить пароль на сервер.\u003c/li>\n\u003c/ol>\n\u003ch2>Основные кирпичики\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Понятие\u003c/th>\n\u003cth>Что это\u003c/th>\n\u003cth>Пример на Dart\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Переменная\u003c/td>\n\u003ctd>Именованная ячейка памяти\u003c/td>\n\u003ctd>\u003ccode>int score = 5;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Тип данных\u003c/td>\n\u003ctd>Какие значения допустимы\u003c/td>\n\u003ctd>\u003ccode>int\u003c/code>, \u003ccode>double\u003c/code>, \u003ccode>String\u003c/code>, \u003ccode>bool\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Условие\u003c/td>\n\u003ctd>Выбор ветки выполнения\u003c/td>\n\u003ctd>\u003ccode>if (score &gt; 3) { ... }\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Цикл\u003c/td>\n\u003ctd>Повтор действий\u003c/td>\n\u003ctd>\u003ccode>for (var i = 0; i &lt; 3; i++) { ... }\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Функция\u003c/td>\n\u003ctd>Именованный кусок кода, который можно вызвать\u003c/td>\n\u003ctd>\u003ccode>int sum(int a, int b) =&gt; a + b;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Коллекция\u003c/td>\n\u003ctd>Много значений вместе\u003c/td>\n\u003ctd>\u003ccode>List&lt;int&gt;\u003c/code>, \u003ccode>Map&lt;String, int&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Класс\u003c/td>\n\u003ctd>Шаблон для объектов с данными и поведением\u003c/td>\n\u003ctd>\u003ccode>class Player { ... }\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Как язык превращается в приложение\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Вы пишете \u003cstrong>исходный код\u003c/strong> (\u003ccode>.dart\u003c/code>).\u003c/li>\n\u003cli>Компилятор превращает его в машинный код (Android — ARM, iOS — ARM) либо запускает в режиме отладки на виртуальной машине Dart (\u003cstrong>hot reload\u003c/strong> работает именно так).\u003c/li>\n\u003cli>Приложение запускается на устройстве и общается с системой: рисует экран, получает касания, обращается к камере и сети.\u003c/li>\n\u003c/ol>\n\u003ch2>Клиент и сервер\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Клиент\u003c/strong> — ваше мобильное приложение.\u003c/li>\n\u003cli>\u003cstrong>Сервер\u003c/strong> — компьютер в интернете, который хранит данные (пользователи, игры).\u003c/li>\n\u003cli>\u003cstrong>API\u003c/strong> — набор «адресов» сервера, к которым приложение обращается. В задании — \u003cstrong>REST API\u003c/strong>: запросы по HTTP, данные в формате \u003cstrong>JSON\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>Приложение --(POST /login, JSON)--&gt; Сервер\nПриложение &lt;--(200, JSON с токеном)-- Сервер\u003c/code>\u003c/pre>\n\u003ch2>Как думать при решении задач\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Разбейте задачу на мелкие шаги (декомпозиция).\u003c/li>\n\u003cli>Для каждого шага определите вход и выход.\u003c/li>\n\u003cli>Выделите повторяющиеся части в функции или классы (принцип DRY).\u003c/li>\n\u003cli>Сначала сделайте так, чтобы работало; потом так, чтобы было чисто.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tip\">\n\u003cp>На чемпионате это же умение называется \u003cstrong>тайм-менеджментом\u003c/strong>: спринт идёт 20–90 минут, и вы решаете, что делать в первую очередь. Начинайте с того, что даёт больше всего баллов за меньшее время.\u003c/p>\n\u003c/div>\n\u003ch2>Что нужно уметь после этой темы\u003c/h2>\n\u003cul>\n\u003cli>Объяснить разницу между алгоритмом и программой.\u003c/li>\n\u003cli>Назвать основные типы данных.\u003c/li>\n\u003cli>Написать условие, цикл и функцию.\u003c/li>\n\u003cli>Объяснить, что такое клиент, сервер, API и JSON.\u003c/li>\n\u003c/ul>\n", "text": " Программа и алгоритм Алгоритм — конечная последовательность шагов, которая решает задачу. Программа — алгоритм, записанный на языке, который понимает компьютер. Мобильное приложение — большая программа, которая реагирует на касания, запрашивает данные у сервера и рисует экран. Пример алгоритма «проверить пароль»: Получить введённую строку. Если её длина меньше 8 — показать ошибку и остановиться. Иначе отправить пароль на сервер. Основные кирпичики Понятие Что это Пример на Dart Переменная Именованная ячейка памяти int score = 5; Тип данных Какие значения допустимы int , double , String , bool Условие Выбор ветки выполнения if (score > 3) { ... } Цикл Повтор действий for (var i = 0; i \u003c 3; i++) { ... } Функция Именованный кусок кода, который можно вызвать int sum(int a, int b) => a + b; Коллекция Много значений вместе List\u003cint> , Map\u003cString, int> Класс Шаблон для объектов с данными и поведением class Player { ... } Как язык превращается в приложение Вы пишете исходный код ( .dart ). Компилятор превращает его в машинный код (Android — ARM, iOS — ARM) либо запускает в режиме отладки на виртуальной машине Dart ( hot reload работает именно так). Приложение запускается на устройстве и общается с системой: рисует экран, получает касания, обращается к камере и сети. Клиент и сервер Клиент — ваше мобильное приложение. Сервер — компьютер в интернете, который хранит данные (пользователи, игры). API — набор «адресов» сервера, к которым приложение обращается. В задании — REST API : запросы по HTTP, данные в формате JSON . Приложение --(POST /login, JSON)--> Сервер Приложение \u003c--(200, JSON с токеном)-- Сервер Как думать при решении задач Разбейте задачу на мелкие шаги (декомпозиция). Для каждого шага определите вход и выход. Выделите повторяющиеся части в функции или классы (принцип DRY). Сначала сделайте так, чтобы работало; потом так, чтобы было чисто. На чемпионате это же умение называется тайм-менеджментом : спринт идёт 20–90 минут, и вы решаете, что делать в первую очередь. Начинайте с того, что даёт больше всего баллов за меньшее время. Что нужно уметь после этой темы Объяснить разницу между алгоритмом и программой. Назвать основные типы данных. Написать условие, цикл и функцию. Объяснить, что такое клиент, сервер, API и JSON. ", "hours": 2, "minutes": 3}, {"id": "dart-basics", "stage": 2, "title": "Dart: основы языка", "lead": "Синтаксис, типы, null safety, функции, коллекции. Всё, что нужно для чтения и написания кода во Flutter.", "html": "\u003ch2>Переменные и типы\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>void main() {\n  int age = 18;                 // целое\n  double price = 19.99;         // дробное\n  String name = &#39;Юлдуз&#39;;        // строка\n  bool isReady = true;          // логическое\n  var city = &#39;Сургут&#39;;          // тип выводится сам (String)\n  final today = DateTime.now(); // нельзя переприсвоить, значение известно при запуске\n  const maxScore = 100;         // константа времени компиляции\n\n  print(&#39;Привет, $name! Тебе $age, баллов: ${maxScore - 5}&#39;);\n}\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ключевое слово\u003c/th>\n\u003cth>Когда\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>var\u003c/code>\u003c/td>\n\u003ctd>Тип понятен из значения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>final\u003c/code>\u003c/td>\n\u003ctd>Значение задаётся один раз во время работы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>const\u003c/code>\u003c/td>\n\u003ctd>Значение известно ещё при компиляции (цвета, отступы, константные виджеты)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Null safety\u003c/h2>\n\u003cp>Обычный тип не может хранить \u003ccode>null\u003c/code>. Чтобы разрешить, добавьте \u003ccode>?\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>String? nickname;                 // может быть null\nString title = nickname ?? &#39;Игрок&#39;; // ?? — значение по умолчанию\nprint(nickname?.length);          // ?. — безопасный вызов, вернёт null\nprint(nickname!.length);          // ! — «я уверена, что не null» (упадёт, если null)\n\nlate String token;                // будет присвоено позже, до первого чтения\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Оператор \u003ccode>!\u003c/code> — частая причина падений. Используйте \u003ccode>??\u003c/code>, \u003ccode>?.\u003c/code> или проверку \u003ccode>if (x != null)\u003c/code>.\u003c/p>\n\u003c/div>\n\u003ch2>Условия и циклы\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>if (score &gt;= 10) {\n  print(&#39;Победа&#39;);\n} else if (score &gt;= 5) {\n  print(&#39;Ничья&#39;);\n} else {\n  print(&#39;Поражение&#39;);\n}\n\nfinal label = score &gt; 5 ? &#39;много&#39; : &#39;мало&#39;; // тернарный оператор\n\nfor (var i = 0; i &lt; 3; i++) print(i);\nfor (final item in [&#39;a&#39;, &#39;b&#39;]) print(item);\nwhile (score &lt; 10) { score++; }\n\nswitch (status) {\n  case &#39;win&#39;:\n    print(&#39;Победа&#39;);\n  default:\n    print(&#39;Другое&#39;);\n}\u003c/code>\u003c/pre>\n\u003cp>В Dart 3 есть \u003cstrong>switch-выражения\u003c/strong> и \u003cstrong>паттерны\u003c/strong>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final text = switch (status) {\n  &#39;win&#39; =&gt; &#39;Победа&#39;,\n  &#39;lose&#39; =&gt; &#39;Поражение&#39;,\n  _ =&gt; &#39;Игра идёт&#39;,\n};\u003c/code>\u003c/pre>\n\u003ch2>Функции\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>int sum(int a, int b) =&gt; a + b;                 // короткая запись\n\n// Именованные параметры: удобно для виджетов и конфигураций\nString greet({required String name, int age = 18}) =&gt; &#39;$name, $age&#39;;\ngreet(name: &#39;Аня&#39;);\n\n// Необязательный позиционный\nString join(String a, [String? b]) =&gt; b == null ? a : &#39;$a$b&#39;;\n\n// Функция — это значение\nfinal doubler = (int x) =&gt; x * 2;\n[1, 2, 3].map(doubler);                         // (2, 4, 6)\n\ntypedef Callback = void Function(int value);    // тип функции\u003c/code>\u003c/pre>\n\u003ch2>Коллекции\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final list = &lt;int&gt;[3, 1, 2];\nlist.add(4);\nlist.sort();                                   // [1, 2, 3, 4]\nfinal even = list.where((e) =&gt; e.isEven).toList();\nfinal names = list.map((e) =&gt; &#39;№$e&#39;).toList();\nfinal sumAll = list.fold(0, (acc, e) =&gt; acc + e);\n\nfinal map = &lt;String, int&gt;{&#39;Аня&#39;: 5, &#39;Боря&#39;: 3};\nmap[&#39;Вика&#39;] = 7;\nfor (final e in map.entries) print(&#39;${e.key}: ${e.value}&#39;);\n\nfinal set = {1, 2, 2, 3};                      // {1, 2, 3}, дубликаты исчезают\n\n// Расширение коллекций прямо в литерале\nfinal all = [...list, if (isAdmin) 99, for (var i in [7, 8]) i];\u003c/code>\u003c/pre>\n\u003ch2>Строки\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final s = &#39;Hello&#39;;\ns.toUpperCase(); s.substring(1, 3); s.contains(&#39;el&#39;);\ns.padLeft(8, &#39;0&#39;); s.split(&#39;,&#39;).join(&#39;;&#39;);\nfinal multi = &#39;&#39;&#39;Много\nстрок&#39;&#39;&#39;;\nfinal path = r&#39;C:\\raw\\no\\escape&#39;;             // r — «сырая» строка\u003c/code>\u003c/pre>\n\u003ch2>Типичные ошибки новичков\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ошибка\u003c/th>\n\u003cth>Исправление\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>int x = 5.5;\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>double x = 5.5;\u003c/code> или \u003ccode>x.toInt()\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Null check operator used on a null value\u003c/code>\u003c/td>\n\u003ctd>заменить \u003ccode>!\u003c/code> на проверку\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>late\u003c/code> без присваивания\u003c/td>\n\u003ctd>присвоить до чтения или сделать nullable\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Забыли \u003ccode>await\u003c/code>\u003c/td>\n\u003ctd>функция вернула \u003ccode>Future\u003c/code>, а не значение\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Забыли \u003ccode>;\u003c/code>\u003c/td>\n\u003ctd>компилятор подсвечит красным\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Выбрать между \u003ccode>var\u003c/code>, \u003ccode>final\u003c/code>, \u003ccode>const\u003c/code>.\u003c/li>\n\u003cli>Читать \u003ccode>?\u003c/code>, \u003ccode>??\u003c/code>, \u003ccode>?.\u003c/code>, \u003ccode>!\u003c/code>.\u003c/li>\n\u003cli>Писать функции с именованными параметрами.\u003c/li>\n\u003cli>Работать со списками и словарями (\u003ccode>map\u003c/code>, \u003ccode>where\u003c/code>, \u003ccode>fold\u003c/code>).\u003c/li>\n\u003c/ul>\n", "text": " Переменные и типы void main() { int age = 18; // целое double price = 19.99; // дробное String name = 'Юлдуз'; // строка bool isReady = true; // логическое var city = 'Сургут'; // тип выводится сам (String) final today = DateTime.now(); // нельзя переприсвоить, значение известно при запуске const maxScore = 100; // константа времени компиляции print('Привет, $name! Тебе $age, баллов: ${maxScore - 5}'); } Ключевое слово Когда var Тип понятен из значения final Значение задаётся один раз во время работы const Значение известно ещё при компиляции (цвета, отступы, константные виджеты) Null safety Обычный тип не может хранить null . Чтобы разрешить, добавьте ? . String? nickname; // может быть null String title = nickname ?? 'Игрок'; // ?? — значение по умолчанию print(nickname?.length); // ?. — безопасный вызов, вернёт null print(nickname!.length); // ! — «я уверена, что не null» (упадёт, если null) late String token; // будет присвоено позже, до первого чтения Оператор ! — частая причина падений. Используйте ?? , ?. или проверку if (x != null) . Условия и циклы if (score >= 10) { print('Победа'); } else if (score >= 5) { print('Ничья'); } else { print('Поражение'); } final label = score > 5 ? 'много' : 'мало'; // тернарный оператор for (var i = 0; i \u003c 3; i++) print(i); for (final item in ['a', 'b']) print(item); while (score \u003c 10) { score++; } switch (status) { case 'win': print('Победа'); default: print('Другое'); } В Dart 3 есть switch-выражения и паттерны : final text = switch (status) { 'win' => 'Победа', 'lose' => 'Поражение', _ => 'Игра идёт', }; Функции int sum(int a, int b) => a + b; // короткая запись // Именованные параметры: удобно для виджетов и конфигураций String greet({required String name, int age = 18}) => '$name, $age'; greet(name: 'Аня'); // Необязательный позиционный String join(String a, [String? b]) => b == null ? a : '$a$b'; // Функция — это значение final doubler = (int x) => x * 2; [1, 2, 3].map(doubler); // (2, 4, 6) typedef Callback = void Function(int value); // тип функции Коллекции final list = \u003cint>[3, 1, 2]; list.add(4); list.sort(); // [1, 2, 3, 4] final even = list.where((e) => e.isEven).toList(); final names = list.map((e) => '№$e').toList(); final sumAll = list.fold(0, (acc, e) => acc + e); final map = \u003cString, int>{'Аня': 5, 'Боря': 3}; map['Вика'] = 7; for (final e in map.entries) print('${e.key}: ${e.value}'); final set = {1, 2, 2, 3}; // {1, 2, 3}, дубликаты исчезают // Расширение коллекций прямо в литерале final all = [...list, if (isAdmin) 99, for (var i in [7, 8]) i]; Строки final s = 'Hello'; s.toUpperCase(); s.substring(1, 3); s.contains('el'); s.padLeft(8, '0'); s.split(',').join(';'); final multi = '''Много строк'''; final path = r'C:\\raw\\no\\escape'; // r — «сырая» строка Типичные ошибки новичков Ошибка Исправление int x = 5.5; double x = 5.5; или x.toInt() Null check operator used on a null value заменить ! на проверку late без присваивания присвоить до чтения или сделать nullable Забыли await функция вернула Future , а не значение Забыли ; компилятор подсвечит красным Что нужно уметь Выбрать между var , final , const . Читать ? , ?? , ?. , ! . Писать функции с именованными параметрами. Работать со списками и словарями ( map , where , fold ). ", "hours": 4, "minutes": 3}, {"id": "dart-oop", "stage": 2, "title": "Dart: ООП и обобщения", "lead": "Классы, наследование, интерфейсы, миксины, enum, sealed. Основа для SOLID и чистой архитектуры.", "html": "\u003ch2>Класс и объект\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class Player {\n  final String id;\n  final String name;\n  int score;\n\n  Player({required this.id, required this.name, this.score = 0});\n\n  // Именованный конструктор\n  Player.guest() : this(id: &#39;0&#39;, name: &#39;Гость&#39;);\n\n  // Фабричный конструктор: собирает объект из JSON\n  factory Player.fromJson(Map&lt;String, dynamic&gt; json) =&gt; Player(\n        id: json[&#39;id&#39;] as String,\n        name: json[&#39;name&#39;] as String,\n        score: (json[&#39;score&#39;] as num?)?.toInt() ?? 0,\n      );\n\n  Map&lt;String, dynamic&gt; toJson() =&gt; {&#39;id&#39;: id, &#39;name&#39;: name, &#39;score&#39;: score};\n\n  // Геттер\n  bool get isWinner =&gt; score &gt;= 10;\n}\u003c/code>\u003c/pre>\n\u003ch2>Инкапсуляция\u003c/h2>\n\u003cp>В Dart нет \u003ccode>private\u003c/code>; всё, что начинается с \u003ccode>_\u003c/code>, приватно \u003cstrong>в пределах файла (библиотеки)\u003c/strong>. Для UIKit это ключ к инкапсуляции: детали лежат в \u003ccode>lib/src/\u003c/code>, наружу экспортируются только нужные классы.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Timer1 {\n  int _seconds = 0;           // не видно за пределами файла\n  int get seconds =&gt; _seconds;\n}\u003c/code>\u003c/pre>\n\u003ch2>Наследование, абстракции, интерфейсы\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>abstract class Shape {          // нельзя создать объект напрямую\n  double area();\n}\n\nclass Circle extends Shape {    // наследование\n  final double r;\n  Circle(this.r);\n  @override\n  double area() =&gt; 3.14159 * r * r;\n}\n\n// В Dart 3 интерфейс удобно описывать так:\nabstract interface class HttpGateway {\n  Future&lt;String&gt; get(String url);\n}\n\nclass RealGateway implements HttpGateway { // implements — реализовать контракт\n  @override\n  Future&lt;String&gt; get(String url) async =&gt; &#39;...&#39;;\n}\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Слово\u003c/th>\n\u003cth>Смысл\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>extends\u003c/code>\u003c/td>\n\u003ctd>Унаследовать код и поля\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>implements\u003c/code>\u003c/td>\n\u003ctd>Пообещать реализовать все методы контракта\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>with\u003c/code>\u003c/td>\n\u003ctd>Подмешать миксин\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>abstract\u003c/code>\u003c/td>\n\u003ctd>Класс с незаконченными методами\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>abstract interface class\u003c/code>\u003c/td>\n\u003ctd>Чистый интерфейс (Dart 3)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Миксины и расширения\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>mixin Loggable {\n  void log(String message) =&gt; print(&#39;[$runtimeType]: $message&#39;);\n}\n\nclass Repo with Loggable {\n  void load() =&gt; log(&#39;Загрузка&#39;);\n}\n\nextension EmailCheck on String {\n  bool get isValidEmail =&gt; RegExp(r&#39;^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$&#39;).hasMatch(this);\n}\n&#39;ab1@mail.ru&#39;.isValidEmail; // true\u003c/code>\u003c/pre>\n\u003ch2>Enum с полями\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>enum GameCategory {\n  image(&#39;Image&#39;),\n  circle(&#39;Circle&#39;);\n\n  final String title;\n  const GameCategory(this.title);\n}\u003c/code>\u003c/pre>\n\u003ch2>Sealed-классы и паттерны (Dart 3)\u003c/h2>\n\u003cp>Удобны для состояний экрана и результатов запросов: компилятор проверит, что вы обработали \u003cstrong>все\u003c/strong> варианты.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>sealed class Result&lt;T&gt; {}\nclass Success&lt;T&gt; extends Result&lt;T&gt; { final T data; Success(this.data); }\nclass Failure&lt;T&gt; extends Result&lt;T&gt; { final String message; Failure(this.message); }\n\nString show(Result&lt;int&gt; r) =&gt; switch (r) {\n      Success(:final data) =&gt; &#39;Данные: $data&#39;,\n      Failure(:final message) =&gt; &#39;Ошибка: $message&#39;,\n    };\u003c/code>\u003c/pre>\n\u003ch2>Обобщения (generics)\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class Box&lt;T&gt; {\n  final T value;\n  Box(this.value);\n}\n\nabstract interface class Repository&lt;T&gt; {\n  Future&lt;List&lt;T&gt;&gt; getAll();\n  Future&lt;T?&gt; getById(String id);\n}\u003c/code>\u003c/pre>\n\u003ch2>Исключения\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class NoInternetException implements Exception {\n  final String message;\n  NoInternetException([this.message = &#39;Нет подключения к интернету&#39;]);\n  @override\n  String toString() =&gt; message;\n}\n\ntry {\n  await repo.load();\n} on NoInternetException catch (e) {\n  logger.error(&#39;Repo&#39;, &#39;Ошибка&#39;, &#39;$e&#39;, e);   // в try-catch обязательно писать лог ERROR\n} catch (e, stack) {\n  logger.error(&#39;Repo&#39;, &#39;Неизвестная ошибка&#39;, &#39;$stack&#39;, e);\n  rethrow;\n} finally {\n  // выполнится всегда\n}\u003c/code>\u003c/pre>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Написать класс с \u003ccode>fromJson\u003c/code> / \u003ccode>toJson\u003c/code>.\u003c/li>\n\u003cli>Объяснить разницу \u003ccode>extends\u003c/code>, \u003ccode>implements\u003c/code>, \u003ccode>with\u003c/code>.\u003c/li>\n\u003cli>Спрятать реализацию в \u003ccode>_приватных\u003c/code> членах и \u003ccode>lib/src\u003c/code>.\u003c/li>\n\u003cli>Использовать \u003ccode>sealed\u003c/code> для состояний.\u003c/li>\n\u003c/ul>\n", "text": " Класс и объект class Player { final String id; final String name; int score; Player({required this.id, required this.name, this.score = 0}); // Именованный конструктор Player.guest() : this(id: '0', name: 'Гость'); // Фабричный конструктор: собирает объект из JSON factory Player.fromJson(Map\u003cString, dynamic> json) => Player( id: json['id'] as String, name: json['name'] as String, score: (json['score'] as num?)?.toInt() ?? 0, ); Map\u003cString, dynamic> toJson() => {'id': id, 'name': name, 'score': score}; // Геттер bool get isWinner => score >= 10; } Инкапсуляция В Dart нет private ; всё, что начинается с _ , приватно в пределах файла (библиотеки) . Для UIKit это ключ к инкапсуляции: детали лежат в lib/src/ , наружу экспортируются только нужные классы. class Timer1 { int _seconds = 0; // не видно за пределами файла int get seconds => _seconds; } Наследование, абстракции, интерфейсы abstract class Shape { // нельзя создать объект напрямую double area(); } class Circle extends Shape { // наследование final double r; Circle(this.r); @override double area() => 3.14159 * r * r; } // В Dart 3 интерфейс удобно описывать так: abstract interface class HttpGateway { Future\u003cString> get(String url); } class RealGateway implements HttpGateway { // implements — реализовать контракт @override Future\u003cString> get(String url) async => '...'; } Слово Смысл extends Унаследовать код и поля implements Пообещать реализовать все методы контракта with Подмешать миксин abstract Класс с незаконченными методами abstract interface class Чистый интерфейс (Dart 3) Миксины и расширения mixin Loggable { void log(String message) => print('[$runtimeType]: $message'); } class Repo with Loggable { void load() => log('Загрузка'); } extension EmailCheck on String { bool get isValidEmail => RegExp(r'^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$').hasMatch(this); } 'ab1@mail.ru'.isValidEmail; // true Enum с полями enum GameCategory { image('Image'), circle('Circle'); final String title; const GameCategory(this.title); } Sealed-классы и паттерны (Dart 3) Удобны для состояний экрана и результатов запросов: компилятор проверит, что вы обработали все варианты. sealed class Result\u003cT> {} class Success\u003cT> extends Result\u003cT> { final T data; Success(this.data); } class Failure\u003cT> extends Result\u003cT> { final String message; Failure(this.message); } String show(Result\u003cint> r) => switch (r) { Success(:final data) => 'Данные: $data', Failure(:final message) => 'Ошибка: $message', }; Обобщения (generics) class Box\u003cT> { final T value; Box(this.value); } abstract interface class Repository\u003cT> { Future\u003cList\u003cT>> getAll(); Future\u003cT?> getById(String id); } Исключения class NoInternetException implements Exception { final String message; NoInternetException([this.message = 'Нет подключения к интернету']); @override String toString() => message; } try { await repo.load(); } on NoInternetException catch (e) { logger.error('Repo', 'Ошибка', '$e', e); // в try-catch обязательно писать лог ERROR } catch (e, stack) { logger.error('Repo', 'Неизвестная ошибка', '$stack', e); rethrow; } finally { // выполнится всегда } Что нужно уметь Написать класс с fromJson / toJson . Объяснить разницу extends , implements , with . Спрятать реализацию в _приватных членах и lib/src . Использовать sealed для состояний. ", "hours": 4, "minutes": 3}, {"id": "dart-async", "stage": 2, "title": "Dart: асинхронность и JSON", "lead": "Future, async/await, Stream, таймеры, работа с JSON. Без этого не сделать ни сеть, ни таймер игры.", "html": "\u003ch2>Зачем нужна асинхронность\u003c/h2>\n\u003cp>Сетевой запрос идёт сотни миллисекунд. Если ждать «стоя», интерфейс замрёт. \u003cstrong>Future\u003c/strong> — «обещание» значения в будущем: приложение продолжает работать, а когда ответ придёт, выполнится продолжение.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;String&gt; loadName() async {\n  await Future.delayed(const Duration(seconds: 1)); // имитация запроса\n  return &#39;Аня&#39;;\n}\n\nFuture&lt;void&gt; main() async {\n  final name = await loadName();   // подождали результат, UI при этом не заблокирован\n  print(name);\n}\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Правило\u003c/th>\n\u003cth>Пояснение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>async\u003c/code> помечает функцию, которая использует \u003ccode>await\u003c/code>\u003c/td>\n\u003ctd>Возвращает \u003ccode>Future&lt;T&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>await\u003c/code> работает только внутри \u003ccode>async\u003c/code>\u003c/td>\n\u003ctd>Ставит выполнение на паузу до результата\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Ошибки ловятся обычным \u003ccode>try/catch\u003c/code>\u003c/td>\n\u003ctd>И для \u003ccode>await\u003c/code>, и внутри \u003ccode>async\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Future.wait([a(), b()])\u003c/code>\u003c/td>\n\u003ctd>Выполнить несколько запросов параллельно\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Stream: поток событий\u003c/h2>\n\u003cp>Future даёт \u003cstrong>одно\u003c/strong> значение, Stream — \u003cstrong>много\u003c/strong> во времени. Пример: секундомер игры.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Stream&lt;int&gt; ticker() async* {\n  var seconds = 0;\n  while (true) {\n    await Future.delayed(const Duration(seconds: 1));\n    yield ++seconds;\n  }\n}\n\nfinal sub = ticker().listen((s) =&gt; print(&#39;Прошло $s с&#39;));\n// не забудьте: sub.cancel();\u003c/code>\u003c/pre>\n\u003cp>Для таймера на экране проще использовать \u003ccode>Timer.periodic\u003c/code> и \u003cstrong>обязательно отменять его в \u003ccode>dispose\u003c/code>\u003c/strong>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:async&#39;;\n\nTimer? _timer;\nvoid start() {\n  _timer = Timer.periodic(const Duration(seconds: 1), (_) {\n    setState(() =&gt; seconds++);\n  });\n}\n\n@override\nvoid dispose() {\n  _timer?.cancel();\n  super.dispose();\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Не вызывайте \u003ccode>setState\u003c/code> после \u003ccode>dispose\u003c/code>. Проверяйте \u003ccode>if (!mounted) return;\u003c/code> после каждого \u003ccode>await\u003c/code> в виджете.\u003c/p>\n\u003c/div>\n\u003ch2>JSON\u003c/h2>\n\u003cp>Сервер присылает строку JSON. Приложение превращает её в объекты.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:convert&#39;;\n\nconst raw = &#39;{&quot;id&quot;:&quot;7&quot;,&quot;name&quot;:&quot;Аня&quot;,&quot;score&quot;:12}&#39;;\nfinal Map&lt;String, dynamic&gt; map = jsonDecode(raw);   // строка -&gt; Map\nfinal player = Player.fromJson(map);                // Map -&gt; объект\n\nfinal body = jsonEncode(player.toJson());           // объект -&gt; строка\u003c/code>\u003c/pre>\n\u003cp>Список объектов:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final List&lt;dynamic&gt; raw = jsonDecode(response.body);\nfinal players = raw\n    .map((e) =&gt; Player.fromJson(e as Map&lt;String, dynamic&gt;))\n    .toList();\u003c/code>\u003c/pre>\n\u003ch2>Даты и время\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final now = DateTime.now();\nfinal start = DateTime(2027, 3, 15, 18, 30);\nfinal remind = start.subtract(const Duration(hours: 1));   // для уведомления за час\nfinal iso = start.toUtc().toIso8601String();                // для отправки на сервер\nfinal parsed = DateTime.parse(iso).toLocal();\nfinal left = start.difference(now);                         // Duration\u003c/code>\u003c/pre>\n\u003cp>Для вывода в нужном формате используют \u003ccode>intl\u003c/code> (\u003ccode>DateFormat('dd-MM-yyyy')\u003c/code>); если пакета нет, форматируйте вручную через \u003ccode>padLeft(2, '0')\u003c/code>.\u003c/p>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Написать \u003ccode>async\u003c/code>-функцию и обработать ошибку \u003ccode>try/catch\u003c/code>.\u003c/li>\n\u003cli>Запустить и корректно остановить \u003ccode>Timer.periodic\u003c/code>.\u003c/li>\n\u003cli>Разобрать JSON в модель и вернуть обратно.\u003c/li>\n\u003cli>Посчитать разницу между датами.\u003c/li>\n\u003c/ul>\n", "text": " Зачем нужна асинхронность Сетевой запрос идёт сотни миллисекунд. Если ждать «стоя», интерфейс замрёт. Future — «обещание» значения в будущем: приложение продолжает работать, а когда ответ придёт, выполнится продолжение. Future\u003cString> loadName() async { await Future.delayed(const Duration(seconds: 1)); // имитация запроса return 'Аня'; } Future\u003cvoid> main() async { final name = await loadName(); // подождали результат, UI при этом не заблокирован print(name); } Правило Пояснение async помечает функцию, которая использует await Возвращает Future\u003cT> await работает только внутри async Ставит выполнение на паузу до результата Ошибки ловятся обычным try/catch И для await , и внутри async Future.wait([a(), b()]) Выполнить несколько запросов параллельно Stream: поток событий Future даёт одно значение, Stream — много во времени. Пример: секундомер игры. Stream\u003cint> ticker() async* { var seconds = 0; while (true) { await Future.delayed(const Duration(seconds: 1)); yield ++seconds; } } final sub = ticker().listen((s) => print('Прошло $s с')); // не забудьте: sub.cancel(); Для таймера на экране проще использовать Timer.periodic и обязательно отменять его в dispose : import 'dart:async'; Timer? _timer; void start() { _timer = Timer.periodic(const Duration(seconds: 1), (_) { setState(() => seconds++); }); } @override void dispose() { _timer?.cancel(); super.dispose(); } Не вызывайте setState после dispose . Проверяйте if (!mounted) return; после каждого await в виджете. JSON Сервер присылает строку JSON. Приложение превращает её в объекты. import 'dart:convert'; const raw = '{\"id\":\"7\",\"name\":\"Аня\",\"score\":12}'; final Map\u003cString, dynamic> map = jsonDecode(raw); // строка -> Map final player = Player.fromJson(map); // Map -> объект final body = jsonEncode(player.toJson()); // объект -> строка Список объектов: final List\u003cdynamic> raw = jsonDecode(response.body); final players = raw .map((e) => Player.fromJson(e as Map\u003cString, dynamic>)) .toList(); Даты и время final now = DateTime.now(); final start = DateTime(2027, 3, 15, 18, 30); final remind = start.subtract(const Duration(hours: 1)); // для уведомления за час final iso = start.toUtc().toIso8601String(); // для отправки на сервер final parsed = DateTime.parse(iso).toLocal(); final left = start.difference(now); // Duration Для вывода в нужном формате используют intl ( DateFormat('dd-MM-yyyy') ); если пакета нет, форматируйте вручную через padLeft(2, '0') . Что нужно уметь Написать async -функцию и обработать ошибку try/catch . Запустить и корректно остановить Timer.periodic . Разобрать JSON в модель и вернуть обратно. Посчитать разницу между датами. ", "hours": 3, "minutes": 3}, {"id": "flutter-basics", "stage": 3, "title": "Flutter: виджеты и состояние", "lead": "Всё в Flutter — виджет. Stateless и Stateful, жизненный цикл, основные контейнеры, setState.", "html": "\u003ch2>Что такое Flutter\u003c/h2>\n\u003cp>Flutter — фреймворк Google для приложений Android, iOS и других платформ из одного кода на Dart. Интерфейс собирается из \u003cstrong>виджетов\u003c/strong>: кнопка, текст, отступ, строка, экран — всё виджеты. Дерево виджетов описывает, как выглядит экран \u003cstrong>сейчас\u003c/strong>; при изменении данных Flutter перестраивает нужную часть дерева.\u003c/p>\n\u003ch2>Минимальное приложение\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>import &#39;package:flutter/material.dart&#39;;\n\nvoid main() =&gt; runApp(const MyApp());\n\nclass MyApp extends StatelessWidget {\n  const MyApp({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return const MaterialApp(\n      debugShowCheckedModeBanner: false,\n      home: Scaffold(body: Center(child: Text(&#39;Привет&#39;))),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003ch2>StatelessWidget и StatefulWidget\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>\u003c/th>\n\u003cth>StatelessWidget\u003c/th>\n\u003cth>StatefulWidget\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Хранит изменяемое состояние\u003c/td>\n\u003ctd>нет\u003c/td>\n\u003ctd>да (в классе \u003ccode>State\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Когда\u003c/td>\n\u003ctd>Надпись, иконка, кнопка с параметрами\u003c/td>\n\u003ctd>Поле ввода, чекбокс, таймер\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Перерисовка\u003c/td>\n\u003ctd>только при изменении параметров\u003c/td>\n\u003ctd>при вызове \u003ccode>setState\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cpre class=\"dart\">\u003ccode>class Counter extends StatefulWidget {\n  const Counter({super.key});\n  @override\n  State&lt;Counter&gt; createState() =&gt; _CounterState();\n}\n\nclass _CounterState extends State&lt;Counter&gt; {\n  int _count = 0;\n\n  @override\n  Widget build(BuildContext context) {\n    return TextButton(\n      onPressed: () =&gt; setState(() =&gt; _count++), // setState запускает перерисовку\n      child: Text(&#39;Нажато: $_count&#39;),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003ch2>Жизненный цикл State (логируется в задании!)\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Метод\u003c/th>\n\u003cth>Когда вызывается\u003c/th>\n\u003cth>Что делать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>initState\u003c/code>\u003c/td>\n\u003ctd>Один раз при создании\u003c/td>\n\u003ctd>Создать контроллеры, подписки, запустить загрузку; \u003cstrong>лог INFO\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>didChangeDependencies\u003c/code>\u003c/td>\n\u003ctd>После \u003ccode>initState\u003c/code> и при изменении \u003ccode>InheritedWidget\u003c/code>\u003c/td>\n\u003ctd>Читать \u003ccode>Theme.of\u003c/code>, \u003ccode>MediaQuery\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>build\u003c/code>\u003c/td>\n\u003ctd>Каждый раз при перерисовке\u003c/td>\n\u003ctd>Только описывать UI, без запросов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>didUpdateWidget\u003c/code>\u003c/td>\n\u003ctd>Родитель передал новые параметры\u003c/td>\n\u003ctd>Обновить внутреннее состояние\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>dispose\u003c/code>\u003c/td>\n\u003ctd>Виджет удалён навсегда\u003c/td>\n\u003ctd>Отменить таймеры, закрыть контроллеры; \u003cstrong>лог INFO\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>В задании «жизненный цикл экранов» нужно логировать на уровне INFO. Во Flutter это в первую очередь \u003ccode>initState\u003c/code> и \u003ccode>dispose\u003c/code>; для остального (\u003ccode>paused\u003c/code>, \u003ccode>resumed\u003c/code>) используйте \u003ccode>WidgetsBindingObserver\u003c/code>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class _ScreenState extends State&lt;Screen&gt; with WidgetsBindingObserver {\n  @override\n  void initState() {\n    super.initState();\n    WidgetsBinding.instance.addObserver(this);\n    log.info(&#39;GameScreen&#39;, &#39;Жизненный цикл&#39;, &#39;initState&#39;);\n  }\n\n  @override\n  void didChangeAppLifecycleState(AppLifecycleState state) {\n    log.info(&#39;GameScreen&#39;, &#39;Жизненный цикл&#39;, state.name); // resumed / inactive / paused / detached\n  }\n\n  @override\n  void dispose() {\n    WidgetsBinding.instance.removeObserver(this);\n    log.info(&#39;GameScreen&#39;, &#39;Жизненный цикл&#39;, &#39;dispose&#39;);\n    super.dispose();\n  }\n  ...\n}\u003c/code>\u003c/pre>\n\u003ch2>Строительные блоки раскладки\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Виджет\u003c/th>\n\u003cth>Назначение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Row\u003c/code> / \u003ccode>Column\u003c/code>\u003c/td>\n\u003ctd>Элементы в строку / в столбец\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Stack\u003c/code> + \u003ccode>Positioned\u003c/code>\u003c/td>\n\u003ctd>Наложение слоёв\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Container\u003c/code>\u003c/td>\n\u003ctd>Размер, цвет, рамка, скругление, отступы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Padding\u003c/code>, \u003ccode>SizedBox\u003c/code>, \u003ccode>Spacer\u003c/code>\u003c/td>\n\u003ctd>Отступы и пустоты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Expanded\u003c/code>, \u003ccode>Flexible\u003c/code>\u003c/td>\n\u003ctd>Занять оставшееся место внутри \u003ccode>Row\u003c/code>/\u003ccode>Column\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Align\u003c/code>, \u003ccode>Center\u003c/code>\u003c/td>\n\u003ctd>Выравнивание\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>ListView\u003c/code>, \u003ccode>GridView\u003c/code>, \u003ccode>SingleChildScrollView\u003c/code>\u003c/td>\n\u003ctd>Прокрутка\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Wrap\u003c/code>\u003c/td>\n\u003ctd>Перенос элементов на новую строку\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>ClipRRect\u003c/code>, \u003ccode>DecoratedBox\u003c/code>\u003c/td>\n\u003ctd>Скругление и оформление\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cpre class=\"dart\">\u003ccode>Row(\n  crossAxisAlignment: CrossAxisAlignment.center,\n  children: [\n    const CircleAvatar(radius: 24),\n    const SizedBox(width: 12),\n    Expanded( // текст не вылезет за границы и перенесётся\n      child: Text(&#39;Длинное имя соперника&#39;, maxLines: 1, overflow: TextOverflow.ellipsis),\n    ),\n  ],\n)\u003c/code>\u003c/pre>\n\u003cdiv class=\"tip\">\n\u003cp>Ошибка «RenderFlex overflowed by N pixels» — элементы не поместились. Решения: обернуть в \u003ccode>Expanded\u003c/code>/\u003ccode>Flexible\u003c/code>, дать прокрутку (\u003ccode>SingleChildScrollView\u003c/code>), использовать \u003ccode>Wrap\u003c/code>, добавить \u003ccode>overflow: TextOverflow.ellipsis\u003c/code>. В задании требуется «без горизонтального скролла» и «текст не обрезается блоком».\u003c/p>\n\u003c/div>\n\u003ch2>Ограничения (constraints)\u003c/h2>\n\u003cp>Главное правило раскладки: \u003cstrong>родитель передаёт ограничения вниз, ребёнок выбирает размер и отдаёт его вверх, родитель его позиционирует.\u003c/strong> Поэтому \u003ccode>Column\u003c/code> внутри \u003ccode>Column\u003c/code> без \u003ccode>Expanded\u003c/code> вызывает ошибки высоты, а \u003ccode>ListView\u003c/code> внутри \u003ccode>Column\u003c/code> требует \u003ccode>Expanded\u003c/code> или \u003ccode>shrinkWrap: true\u003c/code>.\u003c/p>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Выбрать Stateless или Stateful.\u003c/li>\n\u003cli>Перечислить методы жизненного цикла и сказать, что в каждом делать.\u003c/li>\n\u003cli>Собрать экран из \u003ccode>Row\u003c/code>, \u003ccode>Column\u003c/code>, \u003ccode>Stack\u003c/code>, \u003ccode>Expanded\u003c/code>.\u003c/li>\n\u003cli>Объяснить причину ошибки overflow и исправить её.\u003c/li>\n\u003c/ul>\n", "text": " Что такое Flutter Flutter — фреймворк Google для приложений Android, iOS и других платформ из одного кода на Dart. Интерфейс собирается из виджетов : кнопка, текст, отступ, строка, экран — всё виджеты. Дерево виджетов описывает, как выглядит экран сейчас ; при изменении данных Flutter перестраивает нужную часть дерева. Минимальное приложение import 'package:flutter/material.dart'; void main() => runApp(const MyApp()); class MyApp extends StatelessWidget { const MyApp({super.key}); @override Widget build(BuildContext context) { return const MaterialApp( debugShowCheckedModeBanner: false, home: Scaffold(body: Center(child: Text('Привет'))), ); } } StatelessWidget и StatefulWidget StatelessWidget StatefulWidget Хранит изменяемое состояние нет да (в классе State ) Когда Надпись, иконка, кнопка с параметрами Поле ввода, чекбокс, таймер Перерисовка только при изменении параметров при вызове setState class Counter extends StatefulWidget { const Counter({super.key}); @override State\u003cCounter> createState() => _CounterState(); } class _CounterState extends State\u003cCounter> { int _count = 0; @override Widget build(BuildContext context) { return TextButton( onPressed: () => setState(() => _count++), // setState запускает перерисовку child: Text('Нажато: $_count'), ); } } Жизненный цикл State (логируется в задании!) Метод Когда вызывается Что делать initState Один раз при создании Создать контроллеры, подписки, запустить загрузку; лог INFO didChangeDependencies После initState и при изменении InheritedWidget Читать Theme.of , MediaQuery build Каждый раз при перерисовке Только описывать UI, без запросов didUpdateWidget Родитель передал новые параметры Обновить внутреннее состояние dispose Виджет удалён навсегда Отменить таймеры, закрыть контроллеры; лог INFO В задании «жизненный цикл экранов» нужно логировать на уровне INFO. Во Flutter это в первую очередь initState и dispose ; для остального ( paused , resumed ) используйте WidgetsBindingObserver : class _ScreenState extends State\u003cScreen> with WidgetsBindingObserver { @override void initState() { super.initState(); WidgetsBinding.instance.addObserver(this); log.info('GameScreen', 'Жизненный цикл', 'initState'); } @override void didChangeAppLifecycleState(AppLifecycleState state) { log.info('GameScreen', 'Жизненный цикл', state.name); // resumed / inactive / paused / detached } @override void dispose() { WidgetsBinding.instance.removeObserver(this); log.info('GameScreen', 'Жизненный цикл', 'dispose'); super.dispose(); } ... } Строительные блоки раскладки Виджет Назначение Row / Column Элементы в строку / в столбец Stack + Positioned Наложение слоёв Container Размер, цвет, рамка, скругление, отступы Padding , SizedBox , Spacer Отступы и пустоты Expanded , Flexible Занять оставшееся место внутри Row / Column Align , Center Выравнивание ListView , GridView , SingleChildScrollView Прокрутка Wrap Перенос элементов на новую строку ClipRRect , DecoratedBox Скругление и оформление Row( crossAxisAlignment: CrossAxisAlignment.center, children: [ const CircleAvatar(radius: 24), const SizedBox(width: 12), Expanded( // текст не вылезет за границы и перенесётся child: Text('Длинное имя соперника', maxLines: 1, overflow: TextOverflow.ellipsis), ), ], ) Ошибка «RenderFlex overflowed by N pixels» — элементы не поместились. Решения: обернуть в Expanded / Flexible , дать прокрутку ( SingleChildScrollView ), использовать Wrap , добавить overflow: TextOverflow.ellipsis . В задании требуется «без горизонтального скролла» и «текст не обрезается блоком». Ограничения (constraints) Главное правило раскладки: родитель передаёт ограничения вниз, ребёнок выбирает размер и отдаёт его вверх, родитель его позиционирует. Поэтому Column внутри Column без Expanded вызывает ошибки высоты, а ListView внутри Column требует Expanded или shrinkWrap: true . Что нужно уметь Выбрать Stateless или Stateful. Перечислить методы жизненного цикла и сказать, что в каждом делать. Собрать экран из Row , Column , Stack , Expanded . Объяснить причину ошибки overflow и исправить её. ", "hours": 4, "minutes": 3}, {"id": "flutter-ui", "stage": 3, "title": "Flutter: экраны, формы, навигация", "lead": "Тема, шрифты, ресурсы, поля ввода, навигация, диалоги, прокрутка. Всё для сборки реальных экранов.", "html": "\u003ch2>Структура проекта и pubspec.yaml\u003c/h2>\n\u003cpre>\u003ccode>my_app/\n  lib/\n    main.dart\n  assets/\n    images/\n    fonts/\n  pubspec.yaml\n  android/  ios/\n  test/\u003c/code>\u003c/pre>\n\u003cpre class=\"yaml\">\u003ccode>name: my_app\nenvironment:\n  sdk: ^3.11.0\n\ndependencies:\n  flutter:\n    sdk: flutter\n  http: ^1.2.0\n  shared_preferences: ^2.3.0\n\nflutter:\n  uses-material-design: true\n  assets:\n    - assets/images/\n  fonts:\n    - family: Manrope\n      fonts:\n        - asset: assets/fonts/Manrope-Regular.ttf\n          weight: 400\n        - asset: assets/fonts/Manrope-SemiBold.ttf\n          weight: 600\n        - asset: assets/fonts/Manrope-Bold.ttf\n          weight: 700\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Отступы в YAML — только пробелы, ровно по структуре. Каждому весу шрифта соответствует \u003cstrong>свой файл\u003c/strong>: \u003ccode>w800\u003c/code> — это \u003ccode>Manrope-ExtraBold.ttf\u003c/code>, а не \u003ccode>ExtraLight\u003c/code>.\u003c/p>\n\u003c/div>\n\u003cp>После изменения \u003ccode>pubspec.yaml\u003c/code> выполните \u003ccode>flutter pub get\u003c/code>.\u003c/p>\n\u003ch2>Тема и типографика (Material 3)\u003c/h2>\n\u003cp>Цвета и стили лучше хранить в одном месте (DRY): в UIKit это отдельные файлы \u003ccode>colors.dart\u003c/code> и \u003ccode>typography.dart\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>abstract final class AppColors {\n  static const primary = Color(0xFF004AC6);\n  static const white = Color(0xFFFFFFFF);\n}\n\nabstract final class AppText {\n  static const _family = &#39;Manrope&#39;;\n  static const header = TextStyle(\n    fontFamily: _family, fontWeight: FontWeight.w700,\n    fontSize: 24, height: 32 / 24, letterSpacing: -0.48,   // height = lineHeight / fontSize\n  );\n}\n\nMaterialApp(\n  theme: ThemeData(\n    useMaterial3: true,\n    colorScheme: ColorScheme.fromSeed(seedColor: AppColors.primary),\n    fontFamily: &#39;Manrope&#39;,\n  ),\n);\u003c/code>\u003c/pre>\n\u003cp>Из Figma берут: размер шрифта, начертание, \u003cstrong>межстрочный интервал\u003c/strong> (переводится в \u003ccode>height = lineHeight / fontSize\u003c/code>) и \u003cstrong>letter spacing\u003c/strong>.\u003c/p>\n\u003ch2>Поля ввода и формы\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final _email = TextEditingController();\nfinal _formKey = GlobalKey&lt;FormState&gt;();\nbool _hidden = true;\n\nForm(\n  key: _formKey,\n  child: Column(children: [\n    TextFormField(\n      controller: _email,\n      keyboardType: TextInputType.emailAddress,\n      validator: (v) =&gt; RegExp(r&#39;^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$&#39;).hasMatch(v ?? &#39;&#39;)\n          ? null\n          : &#39;Некорректный email&#39;,\n    ),\n    TextFormField(\n      obscureText: _hidden,\n      decoration: InputDecoration(\n        suffixIcon: IconButton(\n          icon: Icon(_hidden ? Icons.visibility_off : Icons.visibility),\n          onPressed: () =&gt; setState(() =&gt; _hidden = !_hidden),\n        ),\n      ),\n    ),\n    FilledButton(\n      onPressed: () {\n        if (_formKey.currentState!.validate()) { /* отправка */ }\n      },\n      child: const Text(&#39;Create Account&#39;),\n    ),\n  ]),\n)\n\n@override\nvoid dispose() { _email.dispose(); super.dispose(); } // контроллеры нужно освобождать\u003c/code>\u003c/pre>\n\u003cp>Состояния поля: обычное, фокус, ошибка, отключено. Фокус можно получить настоящим \u003ccode>FocusNode\u003c/code> (лучше, чем передавать «состояние» параметром).\u003c/p>\n\u003ch2>Навигация\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// Открыть экран\nNavigator.of(context).push(MaterialPageRoute(builder: (_) =&gt; const DetailsScreen()));\n\n// Заменить текущий (после Splash, после входа)\nNavigator.of(context).pushReplacement(MaterialPageRoute(builder: (_) =&gt; const HomeScreen()));\n\n// Очистить стек (после Success -&gt; Landing)\nNavigator.of(context).pushAndRemoveUntil(\n  MaterialPageRoute(builder: (_) =&gt; const LandingScreen()),\n  (route) =&gt; false,\n);\n\n// Назад\nNavigator.of(context).pop();\u003c/code>\u003c/pre>\n\u003cp>Если нужно сохранять «последний экран», дайте маршрутам \u003cstrong>имена\u003c/strong>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>MaterialApp(\n  initialRoute: &#39;/splash&#39;,\n  routes: {\n    &#39;/splash&#39;: (_) =&gt; const SplashScreen(),\n    &#39;/landing&#39;: (_) =&gt; const LandingScreen(),\n  },\n)\nNavigator.pushNamed(context, &#39;/landing&#39;);\u003c/code>\u003c/pre>\n\u003ch2>Диалоги, BottomSheet, SnackBar, пикеры\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// BottomSheet (для компонента Select)\nfinal picked = await showModalBottomSheet&lt;String&gt;(\n  context: context,\n  isScrollControlled: true,\n  shape: const RoundedRectangleBorder(\n    borderRadius: BorderRadius.vertical(top: Radius.circular(16)),\n  ),\n  builder: (_) =&gt; const OptionsList(),\n);\n\n// Дата и время (стандартные системные элементы)\nfinal date = await showDatePicker(\n  context: context,\n  initialDate: DateTime.now(),\n  firstDate: DateTime.now(),\n  lastDate: DateTime(2100),\n);\nfinal time = await showTimePicker(context: context, initialTime: TimeOfDay.now());\n\n// Уведомление об ошибке на 5 секунд\nScaffoldMessenger.of(context).showSnackBar(\n  const SnackBar(content: Text(&#39;Ошибка сети&#39;), duration: Duration(seconds: 5)),\n);\u003c/code>\u003c/pre>\n\u003ch2>Прокрутка и «закреплённый заголовок»\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>CustomScrollView(\n  slivers: [\n    SliverAppBar(pinned: true, title: Text(&#39;Create Account&#39;)),\n    SliverToBoxAdapter(child: Image.asset(&#39;assets/images/hero.png&#39;)),\n    SliverFillRemaining(hasScrollBody: false, child: FormContent()),\n  ],\n)\u003c/code>\u003c/pre>\n\u003cp>Это прямой ответ на требование спринта 3: «если контент не помещается, прокручивается картинка, а надпись Create Account остаётся сверху».\u003c/p>\n\u003ch2>Картинки\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>Image.asset(&#39;assets/images/logo.png&#39;, fit: BoxFit.cover);\nImage.network(url, fit: BoxFit.cover);       // без кэша!\u003c/code>\u003c/pre>\n\u003cp>Для кэширования сетевых изображений используйте \u003ccode>cached_network_image\u003c/code> (подробно в разделе спринта 4).\u003c/p>\n\u003cp>Внутри \u003cstrong>пакета\u003c/strong> (UIKit) ресурсы подключаются с параметром \u003ccode>package\u003c/code>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Image.asset(&#39;assets/eye.png&#39;, package: &#39;uikit&#39;);\u003c/code>\u003c/pre>\n\u003cp>Без него приложение будет искать файл в своих \u003ccode>assets\u003c/code> и не найдёт.\u003c/p>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Подключить шрифт и ресурсы в \u003ccode>pubspec.yaml\u003c/code>.\u003c/li>\n\u003cli>Собрать форму с валидацией и показом пароля.\u003c/li>\n\u003cli>Выбрать нужный способ навигации.\u003c/li>\n\u003cli>Открыть BottomSheet и системные пикеры даты и времени.\u003c/li>\n\u003c/ul>\n", "text": " Структура проекта и pubspec.yaml my_app/ lib/ main.dart assets/ images/ fonts/ pubspec.yaml android/ ios/ test/ name: my_app environment: sdk: ^3.11.0 dependencies: flutter: sdk: flutter http: ^1.2.0 shared_preferences: ^2.3.0 flutter: uses-material-design: true assets: - assets/images/ fonts: - family: Manrope fonts: - asset: assets/fonts/Manrope-Regular.ttf weight: 400 - asset: assets/fonts/Manrope-SemiBold.ttf weight: 600 - asset: assets/fonts/Manrope-Bold.ttf weight: 700 Отступы в YAML — только пробелы, ровно по структуре. Каждому весу шрифта соответствует свой файл : w800 — это Manrope-ExtraBold.ttf , а не ExtraLight . После изменения pubspec.yaml выполните flutter pub get . Тема и типографика (Material 3) Цвета и стили лучше хранить в одном месте (DRY): в UIKit это отдельные файлы colors.dart и typography.dart . abstract final class AppColors { static const primary = Color(0xFF004AC6); static const white = Color(0xFFFFFFFF); } abstract final class AppText { static const _family = 'Manrope'; static const header = TextStyle( fontFamily: _family, fontWeight: FontWeight.w700, fontSize: 24, height: 32 / 24, letterSpacing: -0.48, // height = lineHeight / fontSize ); } MaterialApp( theme: ThemeData( useMaterial3: true, colorScheme: ColorScheme.fromSeed(seedColor: AppColors.primary), fontFamily: 'Manrope', ), ); Из Figma берут: размер шрифта, начертание, межстрочный интервал (переводится в height = lineHeight / fontSize ) и letter spacing . Поля ввода и формы final _email = TextEditingController(); final _formKey = GlobalKey\u003cFormState>(); bool _hidden = true; Form( key: _formKey, child: Column(children: [ TextFormField( controller: _email, keyboardType: TextInputType.emailAddress, validator: (v) => RegExp(r'^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$').hasMatch(v ?? '') ? null : 'Некорректный email', ), TextFormField( obscureText: _hidden, decoration: InputDecoration( suffixIcon: IconButton( icon: Icon(_hidden ? Icons.visibility_off : Icons.visibility), onPressed: () => setState(() => _hidden = !_hidden), ), ), ), FilledButton( onPressed: () { if (_formKey.currentState!.validate()) { /* отправка */ } }, child: const Text('Create Account'), ), ]), ) @override void dispose() { _email.dispose(); super.dispose(); } // контроллеры нужно освобождать Состояния поля: обычное, фокус, ошибка, отключено. Фокус можно получить настоящим FocusNode (лучше, чем передавать «состояние» параметром). Навигация // Открыть экран Navigator.of(context).push(MaterialPageRoute(builder: (_) => const DetailsScreen())); // Заменить текущий (после Splash, после входа) Navigator.of(context).pushReplacement(MaterialPageRoute(builder: (_) => const HomeScreen())); // Очистить стек (после Success -> Landing) Navigator.of(context).pushAndRemoveUntil( MaterialPageRoute(builder: (_) => const LandingScreen()), (route) => false, ); // Назад Navigator.of(context).pop(); Если нужно сохранять «последний экран», дайте маршрутам имена : MaterialApp( initialRoute: '/splash', routes: { '/splash': (_) => const SplashScreen(), '/landing': (_) => const LandingScreen(), }, ) Navigator.pushNamed(context, '/landing'); Диалоги, BottomSheet, SnackBar, пикеры // BottomSheet (для компонента Select) final picked = await showModalBottomSheet\u003cString>( context: context, isScrollControlled: true, shape: const RoundedRectangleBorder( borderRadius: BorderRadius.vertical(top: Radius.circular(16)), ), builder: (_) => const OptionsList(), ); // Дата и время (стандартные системные элементы) final date = await showDatePicker( context: context, initialDate: DateTime.now(), firstDate: DateTime.now(), lastDate: DateTime(2100), ); final time = await showTimePicker(context: context, initialTime: TimeOfDay.now()); // Уведомление об ошибке на 5 секунд ScaffoldMessenger.of(context).showSnackBar( const SnackBar(content: Text('Ошибка сети'), duration: Duration(seconds: 5)), ); Прокрутка и «закреплённый заголовок» CustomScrollView( slivers: [ SliverAppBar(pinned: true, title: Text('Create Account')), SliverToBoxAdapter(child: Image.asset('assets/images/hero.png')), SliverFillRemaining(hasScrollBody: false, child: FormContent()), ], ) Это прямой ответ на требование спринта 3: «если контент не помещается, прокручивается картинка, а надпись Create Account остаётся сверху». Картинки Image.asset('assets/images/logo.png', fit: BoxFit.cover); Image.network(url, fit: BoxFit.cover); // без кэша! Для кэширования сетевых изображений используйте cached_network_image (подробно в разделе спринта 4). Внутри пакета (UIKit) ресурсы подключаются с параметром package : Image.asset('assets/eye.png', package: 'uikit'); Без него приложение будет искать файл в своих assets и не найдёт. Что нужно уметь Подключить шрифт и ресурсы в pubspec.yaml . Собрать форму с валидацией и показом пароля. Выбрать нужный способ навигации. Открыть BottomSheet и системные пикеры даты и времени. ", "hours": 5, "minutes": 3}, {"id": "adaptive", "stage": 3, "title": "Адаптивная верстка и Figma", "lead": "Как перенести макет в код так, чтобы он выглядел одинаково на разных экранах. Это самый дорогой по баллам навык.", "html": "\u003ch2>Что требует задание\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Требование\u003c/th>\n\u003cth>Как проверять у себя\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Нет большого пустого пространства\u003c/td>\n\u003ctd>Запустите на самом широком и самом высоком эмуляторе\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Элементы не искажаются\u003c/td>\n\u003ctd>У аватарок, превью и иконок зафиксировано соотношение сторон\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Всё на месте и в границах\u003c/td>\n\u003ctd>Нет горизонтального скролла, CTA-кнопки видны\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Отступы пропорциональны макету\u003c/td>\n\u003ctd>Либо масштабируются, либо фиксированы (если так в дизайн-системе)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Шрифты из макета\u003c/td>\n\u003ctd>Не системные, размеры и межстрочные как в Figma\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Текст не режется блоком\u003c/td>\n\u003ctd>\u003ccode>maxLines\u003c/code> + \u003ccode>TextOverflow.ellipsis\u003c/code>, перенос строк\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Инструменты Flutter\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final size = MediaQuery.sizeOf(context);          // размер экрана\nfinal padding = MediaQuery.paddingOf(context);    // вырезы и системные панели\n\nLayoutBuilder(\n  builder: (context, constraints) {\n    final isCompact = constraints.maxWidth &lt; 360;\n    return isCompact ? const SmallLayout() : const NormalLayout();\n  },\n)\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Инструмент\u003c/th>\n\u003cth>Для чего\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>SafeArea\u003c/code>\u003c/td>\n\u003ctd>Отступ от выреза камеры и жестовой панели\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Expanded\u003c/code> / \u003ccode>Flexible\u003c/code>\u003c/td>\n\u003ctd>Растянуть элемент на оставшееся место\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>AspectRatio\u003c/code>\u003c/td>\n\u003ctd>Фиксированное соотношение сторон (аватарка, превью)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>FittedBox\u003c/code>\u003c/td>\n\u003ctd>Вписать содержимое в блок\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>ConstrainedBox(constraints: BoxConstraints(maxWidth: 480))\u003c/code>\u003c/td>\n\u003ctd>Ограничить ширину на планшетах\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Spacer\u003c/code>\u003c/td>\n\u003ctd>Гибкая пустота между элементами\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>FractionallySizedBox\u003c/code>\u003c/td>\n\u003ctd>Размер в долях от родителя\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Wrap\u003c/code>\u003c/td>\n\u003ctd>Перенос в несколько строк\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Масштабирование от макета (подход «vize»)\u003c/h2>\n\u003cp>В вашем коде размеры считаются от размера макета: \u003ccode>Vize.init(context, figmaWidth: 390, figmaHeight: 884)\u003c/code>, дальше \u003ccode>16.fw\u003c/code>, \u003ccode>24.fh\u003c/code>, \u003ccode>8.r\u003c/code>. Идея простая: коэффициент равен \u003ccode>ширина экрана / ширина макета\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Scale {\n  static late double _w, _h;\n  static void init(BuildContext c, {double figmaW = 390, double figmaH = 884}) {\n    final s = MediaQuery.sizeOf(c);\n    _w = s.width / figmaW;\n    _h = s.height / figmaH;\n  }\n  static double w(double v) =&gt; v * _w;   // ширины и горизонтальные отступы\n  static double h(double v) =&gt; v * _h;   // высоты и вертикальные отступы\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Размеры вида \u003ccode>width: 350.fw\u003c/code> для блоков, которые должны тянуться, — риск. На планшете блок останется «колонкой» посередине. Для основного контента чаще лучше \u003ccode>double.infinity\u003c/code> + горизонтальные отступы, а числа из Figma использовать для отступов, радиусов, иконок и высот. Фиксируйте только то, что должно быть фиксировано (аватар 60×60 с \u003ccode>AspectRatio\u003c/code>).\u003c/p>\n\u003c/div>\n\u003ch2>Перенос макета в код\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Откройте макет, включите \u003cstrong>Dev Mode\u003c/strong> (режим разработчика) — там видны размеры, отступы, цвета и параметры шрифта.\u003c/li>\n\u003cli>Определите \u003cstrong>сетку\u003c/strong> экрана: боковые поля (обычно 20 или 24), шаг (8 px).\u003c/li>\n\u003cli>Идите сверху вниз: каркас (\u003ccode>Scaffold\u003c/code>, \u003ccode>AppBar\u003c/code>, \u003ccode>BottomBar\u003c/code>) → секции → детали.\u003c/li>\n\u003cli>Повторяющееся выносите в UIKit-компоненты.\u003c/li>\n\u003cli>Проверьте на трёх размерах: маленький телефон (≈360×640), обычный (≈390×844), большой (≈430×932 и планшет).\u003c/li>\n\u003c/ol>\n\u003ch2>Состояния компонентов\u003c/h2>\n\u003cp>Дизайн-система описывает не только «покой». Для каждого компонента проверьте:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Компонент\u003c/th>\n\u003cth>Состояния\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Кнопка\u003c/td>\n\u003ctd>default, pressed, disabled, loading; primary / secondary / destructive\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Поле ввода\u003c/td>\n\u003ctd>default, focused, filled, error, disabled; password, search\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Чекбокс\u003c/td>\n\u003ctd>unchecked, checked, disabled (checked и unchecked)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Селект\u003c/td>\n\u003ctd>закрыт, открыт (BottomSheet), выбран, ошибка\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Карточка\u003c/td>\n\u003ctd>обычная, выбранная, неактивная\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Нижнее меню\u003c/td>\n\u003ctd>активный пункт для каждого из пунктов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Таймер\u003c/td>\n\u003ctd>идёт, остановлен, время вышло\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Проверка перед сдачей\u003c/h2>\n\u003cul>\n\u003cli>Запущено минимум на двух эмуляторах разных размеров.\u003c/li>\n\u003cli>Включён увеличенный размер шрифта в системе: текст не ломает раскладку.\u003c/li>\n\u003cli>Повёрнут экран (если макет допускает) либо ориентация зафиксирована.\u003c/li>\n\u003cli>Клавиатура не перекрывает поле (\u003ccode>resizeToAvoidBottomInset\u003c/code>, прокрутка).\u003c/li>\n\u003c/ul>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Объяснить разницу между фиксированным и адаптивным размером.\u003c/li>\n\u003cli>Использовать \u003ccode>LayoutBuilder\u003c/code>, \u003ccode>MediaQuery\u003c/code>, \u003ccode>AspectRatio\u003c/code>, \u003ccode>Expanded\u003c/code>.\u003c/li>\n\u003cli>Снять размеры из Figma и перевести стили текста в \u003ccode>TextStyle\u003c/code>.\u003c/li>\n\u003c/ul>\n", "text": " Что требует задание Требование Как проверять у себя Нет большого пустого пространства Запустите на самом широком и самом высоком эмуляторе Элементы не искажаются У аватарок, превью и иконок зафиксировано соотношение сторон Всё на месте и в границах Нет горизонтального скролла, CTA-кнопки видны Отступы пропорциональны макету Либо масштабируются, либо фиксированы (если так в дизайн-системе) Шрифты из макета Не системные, размеры и межстрочные как в Figma Текст не режется блоком maxLines + TextOverflow.ellipsis , перенос строк Инструменты Flutter final size = MediaQuery.sizeOf(context); // размер экрана final padding = MediaQuery.paddingOf(context); // вырезы и системные панели LayoutBuilder( builder: (context, constraints) { final isCompact = constraints.maxWidth \u003c 360; return isCompact ? const SmallLayout() : const NormalLayout(); }, ) Инструмент Для чего SafeArea Отступ от выреза камеры и жестовой панели Expanded / Flexible Растянуть элемент на оставшееся место AspectRatio Фиксированное соотношение сторон (аватарка, превью) FittedBox Вписать содержимое в блок ConstrainedBox(constraints: BoxConstraints(maxWidth: 480)) Ограничить ширину на планшетах Spacer Гибкая пустота между элементами FractionallySizedBox Размер в долях от родителя Wrap Перенос в несколько строк Масштабирование от макета (подход «vize») В вашем коде размеры считаются от размера макета: Vize.init(context, figmaWidth: 390, figmaHeight: 884) , дальше 16.fw , 24.fh , 8.r . Идея простая: коэффициент равен ширина экрана / ширина макета . class Scale { static late double _w, _h; static void init(BuildContext c, {double figmaW = 390, double figmaH = 884}) { final s = MediaQuery.sizeOf(c); _w = s
