<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00d95f">
<title>Flutter к Профессионалам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky sidebar + single reading column; on phones the sidebar becomes a slide-in drawer.
   Palette: one saturated green on white, ink tinted toward green. */
:root {
  --bg: #ffffff;
  --mint: #effff5;
  --mint-2: #dcfbe8;
  --green: #00d95f;
  --green-hot: #00e86b;
  --green-ink: #007a35;
  --ink: #0a1f13;
  --muted: #476355;
  --line: #cfeedb;
  --code-bg: #f3fbf6;
  --warn-bg: #fff5dc;
  --warn-ink: #7a4b00;
  --blue: #0b64b5;
  --side-w: 300px;
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.65 var(--f-body); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--green); z-index: 60; }
button, input { font: inherit; color: inherit; }
a { color: var(--green-ink); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* top bar (phones) */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--green); color: var(--ink);
  display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.topbar .brand { font: 700 14px/1.1 var(--f-display); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--ink); background: var(--bg); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.mini-progress { font: 700 13px var(--f-display); background: var(--bg); border-radius: 999px; padding: 6px 12px; border: 2px solid var(--ink); }

/* sidebar */
.side { position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: min(88vw, 340px); background: var(--bg); border-right: 2px solid var(--ink);
  transform: translateX(-102%); transition: transform .25s ease; overflow-y: auto; overscroll-behavior: contain;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(24px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.side.open { transform: none; }
.scrim { position: fixed; inset: 0; background: rgba(10,31,19,.45); z-index: 45; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.show { opacity: 1; pointer-events: auto; }
.side-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--green); border: 2px solid var(--ink); display: grid; place-items: center; font: 800 18px var(--f-display); flex: none; }
.side-head .t { font: 700 14px/1.2 var(--f-display); }
.side-head .t small { display: block; font: 500 12px/1.3 var(--f-body); color: var(--muted); margin-top: 2px; }
.search { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--mint); margin-bottom: 14px; }
.search:focus { border-color: var(--ink); outline: none; background: var(--bg); }
.nav-home, .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 12px; padding: 9px 10px; cursor: pointer; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; line-height: 1.3; }
.nav-home:hover, .nav-item:hover { background: var(--mint); }
.nav-item[aria-current="page"], .nav-home[aria-current="page"] { background: var(--green); color: var(--ink); }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); flex: none; display: grid; place-items: center; background: var(--bg); }
.dot.on { background: var(--green); }
.dot.on::after { content: ""; width: 6px; height: 3px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(-45deg) translate(1px,-1px); }
.stage-title { font: 700 11px var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 10px 4px; }

/* main */
.main { min-width: 0; padding-block: 20px calc(60px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 780px; margin: 0 auto; min-width: 0; }

/* home */
.hero { background: var(--green); border-radius: 0 0 28px 28px; margin: -20px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 28px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
.hero-in { max-width: 780px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.hero h1 { font: 700 clamp(26px, 6.2vw, 44px)/1.08 var(--f-display); margin: 0 0 12px; text-wrap: balance; letter-spacing: -.02em; }
.hero p { margin: 0; font-weight: 600; max-width: 46ch; }
.ring { position: relative; width: 112px; height: 112px; background: var(--bg); border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { font: 700 22px var(--f-display); position: relative; }
.ring small { position: relative; display: block; font-size: 11px; text-align: center; color: var(--muted); font-weight: 700; margin-top: -4px; }
@media (max-width: 520px) { .hero-in { grid-template-columns: 1fr; } .ring { order: -1; width: 92px; height: 92px; } .ring b { font-size: 18px; } }

h2.sec { font: 700 clamp(20px, 4.6vw, 26px)/1.2 var(--f-display); margin: 36px 0 14px; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 22px; }
.fact { background: var(--mint); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.fact b { display: block; font: 700 22px var(--f-display); }
.fact span { font-size: 13px; color: var(--muted); font-weight: 600; }

.road { display: grid; gap: 14px; }
.stage { border: 2px solid var(--ink); border-radius: 20px; padding: 16px; background: var(--bg); min-width: 0; }
.stage-head { display: flex; gap: 12px; align-items: flex-start; }
.stage-no { width: 36px; height: 36px; border-radius: 50%; background: var(--green); border: 2px solid var(--ink); display: grid; place-items: center; font: 700 14px var(--f-display); flex: none; }
.stage h3 { margin: 0; font: 700 17px/1.25 var(--f-display); }
.stage .goal { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stage .hrs { margin-left: auto; font-weight: 800; font-size: 13px; background: var(--mint-2); border-radius: 999px; padding: 4px 10px; white-space: nowrap; flex: none; }
.stage ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 4px; }
.stage li a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; }
.stage li a:hover { background: var(--mint); }
.stage li a em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
.practice { margin-top: 10px; background: var(--mint); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.practice b { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--green-ink); display: block; }
.cta { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 800; padding: 12px 18px; border-radius: 14px; border: 0; cursor: pointer; }
.cta.green { background: var(--green); color: var(--ink); border: 2px solid var(--ink); }
.cta:hover { filter: brightness(1.08); }

/* article */
.crumb { font-size: 13px; font-weight: 700; color: var(--green-ink); text-transform: uppercase; letter-spacing: .08em; margin: 8px 0; }
article h1 { font: 700 clamp(26px, 6vw, 38px)/1.12 var(--f-display); margin: 0 0 10px; text-wrap: balance; letter-spacing: -.02em; }
.lead { font-size: 18px; color: var(--muted); font-weight: 500; margin: 0 0 18px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { background: var(--mint-2); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.toc { background: var(--mint); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; }
.toc b { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.toc div { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.toc button { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; font-weight: 700; }
.toc button:hover { border-color: var(--ink); }
.prose h2 { font: 700 clamp(19px, 4.4vw, 24px)/1.25 var(--f-display); margin: 38px 0 12px; scroll-margin-top: calc(80px + env(safe-area-inset-top, 0px)); text-wrap: balance; }
.prose h3 { font: 700 17px/1.3 var(--f-display); margin: 26px 0 8px; }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: 4px 0; }
.prose li::marker { color: var(--green-ink); font-weight: 800; }
.prose code { font: 500 .88em var(--f-mono); background: var(--mint-2); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }
.codewrap { position: relative; margin: 14px 0; }
.codewrap pre { margin: 0; background: var(--code-bg); border: 2px solid var(--line); border-radius: 14px; padding: 40px 16px 14px; overflow-x: auto; font: 400 13px/1.6 var(--f-mono); tab-size: 2; max-width: 100%; }
.codewrap pre code { background: none; padding: 0; font: inherit; overflow-wrap: normal; white-space: pre; }
.copy { position: absolute; top: 8px; right: 8px; border: 2px solid var(--ink); background: var(--green); border-radius: 8px; font-size: 12px; font-weight: 800; padding: 3px 10px; cursor: pointer; opacity: .95; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--green-ink); font-weight: 600; }
.hljs-string, .hljs-subst { color: #a24a00; }
.hljs-comment { color: #5f8171; font-style: italic; }
.hljs-number, .hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: var(--blue); }
.hljs-title.function_, .hljs-attr, .hljs-meta { color: #1b3c2a; font-weight: 700; }
.tablewrap { overflow-x: auto; margin: 16px 0; border: 2px solid var(--line); border-radius: 14px; max-width: 100%; }
.prose table { border-collapse: collapse; width: 100%; font-size: 14.5px; min-width: 460px; }
.prose th { background: var(--mint-2); text-align: left; font-weight: 800; }
.prose th, .prose td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose tr:last-child td { border-bottom: 0; }
.prose td { min-width: 90px; }
.prose td[align="right"], .prose th[align="right"], .prose td[style*="right"], .prose th[style*="right"] { font-variant-numeric: tabular-nums; white-space: nowrap; }
.prose .tip, .prose .warn { border-radius: 16px; padding: 14px 16px 14px; margin: 18px 0; position: relative; }
.prose .tip { background: var(--mint); border: 2px solid var(--green); }
.prose .warn { background: var(--warn-bg); border: 2px solid #f0c25a; }
.prose .tip::before, .prose .warn::before { display: block; font: 800 11px var(--f-body); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
.prose .tip::before { content: "Совет"; color: var(--green-ink); }
.prose .warn::before { content: "Важно"; color: var(--warn-ink); }
.prose .tip > :last-child, .prose .warn > :last-child { margin-bottom: 0; }
.prose .tip > :first-of-type, .prose .warn > :first-of-type { margin-top: 0; }
.prose ul.task-list { list-style: none; padding-left: 0; }
.prose .task-list-item { display: flex; gap: 10px; align-items: flex-start; }
.prose input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--green); flex: none; margin-top: 3px; cursor: pointer; }
.done-bar { margin-top: 40px; border: 2px solid var(--ink); border-radius: 18px; padding: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--mint); }
.done-bar label { display: flex; gap: 10px; align-items: center; font-weight: 800; cursor: pointer; }
.done-bar input { width: 24px; height: 24px; accent-color: var(--green); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.pager a { display: block; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; text-decoration: none; color: var(--ink); font-weight: 700; min-width: 0; }
.pager a:hover { border-color: var(--ink); background: var(--mint); }
.pager small { display: block; color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.pager a:last-child { text-align: right; }
.pager a.empty { visibility: hidden; }

/* quiz and search */
.quiz-card { border: 2px solid var(--ink); border-radius: 20px; padding: 18px; background: var(--bg); }
.qnum { font-weight: 800; color: var(--green-ink); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.qtext { font: 700 19px/1.35 var(--f-display); margin: 8px 0 14px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px 14px; cursor: pointer; font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--ink); background: var(--mint); }
.opt.right { background: var(--green); border-color: var(--ink); }
.opt.wrong { background: #ffe3e0; border-color: #c0392b; }
.why { margin-top: 12px; background: var(--mint); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.bar { height: 10px; border-radius: 99px; background: var(--mint-2); overflow: hidden; margin-bottom: 14px; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }
.score { font: 700 clamp(40px, 12vw, 64px)/1 var(--f-display); margin: 6px 0; }
.results { display: grid; gap: 8px; margin-top: 12px; }
.results a { display: block; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; text-decoration: none; color: var(--ink); }
.results a:hover { border-color: var(--ink); }
.results small { color: var(--muted); display: block; }
mark { background: var(--green-hot); color: var(--ink); border-radius: 4px; padding: 0 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

@media (min-width: 960px) {
  .topbar, .scrim { display: none; }
  .side { transform: none; width: var(--side-w); border-right: 2px solid var(--line); }
  .app { padding-left: var(--side-w); }
  .main { padding-top: 32px; }
  .hero { margin-top: -32px; border-radius: 0 0 36px 36px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ===== вход ===== */
body.locked .app { display: none; }
.login { position: fixed; inset: 0; z-index: 100; background: var(--green); display: grid; place-items: center; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.login-card { background: var(--bg); border: 2px solid var(--ink); border-radius: 24px; padding: 26px 22px; width: min(100%, 400px); display: grid; gap: 6px; }
.login-card h1 { font: 700 22px/1.2 var(--f-display); margin: 8px 0 0; }
.login-card label, .block label { font-weight: 800; font-size: 13px; margin-top: 8px; display: block; }
.logo.big { width: 52px; height: 52px; font-size: 24px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; justify-content: center; }
.login-err { color: #b3261e; font-weight: 700; min-height: 22px; font-size: 14px; }
input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="file"], select, textarea, .login-card input {
  width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); color: var(--ink); font: inherit; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; }
textarea { resize: vertical; min-height: 72px; }
.mini-timer { font: 700 13px var(--f-display); background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
.side-user { margin-top: 22px; padding: 12px 10px 0; border-top: 2px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--green-ink); font-weight: 800; cursor: pointer; text-decoration: underline; padding: 4px; }
.dot.tool { border-radius: 6px; background: var(--mint-2); }
.h1s { font: 700 clamp(24px, 5.5vw, 34px)/1.15 var(--f-display); margin: 0 0 12px; text-wrap: balance; }
.h3s { font: 700 16px var(--f-display); margin: 18px 0 8px; }
.chip.ok { background: var(--green); }

/* ===== подтемы ===== */
details.sub { border: 2px solid var(--line); border-radius: 18px; margin: 12px 0; background: var(--bg); }
details.sub[open] { border-color: var(--ink); }
details.sub > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary::after { content: "+"; margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: var(--mint-2); display: grid; place-items: center; font: 800 20px/1 var(--f-body); flex: none; }
details.sub[open] > summary::after { content: "−"; background: var(--green); }
details.sub > summary h2 { margin: 0 !important; font: 700 clamp(16px, 4vw, 20px)/1.3 var(--f-display); }
.sub-body { padding: 0 16px 16px; min-width: 0; }
.sub-body > :first-child { margin-top: 0; }
.row.tools { margin: 8px 0 4px; }
.mini { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 13px; cursor: pointer; }
.mini:hover { border-color: var(--ink); }

/* ===== блоки, тест, заметки ===== */
.block { margin-top: 28px; border: 2px solid var(--ink); border-radius: 20px; padding: 16px; background: var(--bg); min-width: 0; }
.block h2.blk { font: 700 clamp(18px, 4.4vw, 22px)/1.2 var(--f-display); margin: 0 0 8px; }
.note-area { margin-top: 6px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.mode { text-align: left; border: 2px solid var(--ink); background: var(--mint); border-radius: 16px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.mode b { font: 700 15px var(--f-display); } .mode span { font-size: 13px; color: var(--muted); font-weight: 600; }
.mode:hover:not(:disabled) { background: var(--green); } .mode:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.quiz-card .bar { margin: 0 0 12px; }
table.plain { min-width: 340px; }
.prose table.plain, table.plain { border-collapse: collapse; width: 100%; font-size: 14.5px; }
table.plain th, table.plain td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.plain th { background: var(--mint-2); }

/* ===== симуляция ===== */
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.chipbtn { border: 2px solid var(--ink); background: var(--bg); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 13px; cursor: pointer; }
.chipbtn:hover { background: var(--green); }
.timeform { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.timeform > div { min-width: 0; }
.timer-block { text-align: center; background: var(--mint); }
.timer-block.running { background: var(--green); }
.timer-block.finished { background: var(--warn-bg); }
.sim-display { font: 700 clamp(44px, 14vw, 84px)/1.05 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 6px 0; }
.bar.big { height: 14px; margin: 14px 0; background: var(--bg); border: 2px solid var(--ink); }
.bar.big i { background: var(--ink); }
.row.center { justify-content: center; }
.cta.ghost { background: var(--bg); color: var(--ink); border: 2px solid var(--ink); }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; background: var(--bg); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; margin-top: 12px; font-weight: 700; }
.confirm[hidden] { display: none; }
.notes { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.note { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--bg); min-width: 0; overflow-wrap: anywhere; }
.note-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.note-h .linkbtn { margin-left: auto; }

<script id="data" type="application/json">{"parts": [{"id": "start", "stage": 0, "title": "Карта чемпионата", "lead": "Что именно оценивают, сколько баллов в каждом модуле и какие правила нельзя нарушать.", "html": "\u003ch2>Что такое это задание\u003c/h2>\n\u003cp>Региональный этап «Профессионалов» по компетенции \u003cstrong>«Разработка мобильных приложений»\u003c/strong>. Вы за три дня (18 часов) делаете мобильное приложение для игры двух соперников: расписание боёв, поиск соперника, две игры-пазла (\u003cstrong>Image\u003c/strong> и \u003cstrong>Circle\u003c/strong>), статистика. Дизайн дан в Figma, бэкенд — готовый SaaS по REST API.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Параметр\u003c/th>\n\u003cth>Значение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Длительность\u003c/td>\n\u003ctd>18 часов, 3 конкурсных дня\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Модулей\u003c/td>\n\u003ctd>7 (5 обязательных + 2 вариативных)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Сумма баллов\u003c/td>\n\u003ctd>100\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Минимальные ОС\u003c/td>\n\u003ctd>Android 14, iOS 18\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Работа сдаётся\u003c/td>\n\u003ctd>через Git (удалённый репозиторий организаторов)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Задачи выдаются\u003c/td>\n\u003ctd>в таск-трекере, помечены спринтом\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Баллы по модулям\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Модуль\u003c/th>\n\u003cth>Название\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003cth>Тип\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>А\u003c/td>\n\u003ctd>Архитектура приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">17,70\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Б\u003c/td>\n\u003ctd>Верстка приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">34,36\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>В\u003c/td>\n\u003ctd>Клиент-серверное взаимодействие\u003c/td>\n\u003ctd style=\"text-align: right;\">24,14\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Г\u003c/td>\n\u003ctd>Хранение информации\u003c/td>\n\u003ctd style=\"text-align: right;\">4,85\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Д\u003c/td>\n\u003ctd>Аппаратные расширения устройства\u003c/td>\n\u003ctd style=\"text-align: right;\">5,00\u003c/td>\n\u003ctd>обязательный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Е\u003c/td>\n\u003ctd>Тестирование\u003c/td>\n\u003ctd style=\"text-align: right;\">4,95\u003c/td>\n\u003ctd>вариативный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Ж\u003c/td>\n\u003ctd>Подготовка продукта\u003c/td>\n\u003ctd style=\"text-align: right;\">9,00\u003c/td>\n\u003ctd>вариативный\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"tip\">\n\u003cp>Верстка и клиент-сервер дают \u003cstrong>58 из 100 баллов\u003c/strong>. Но верстка без архитектуры и логирования получает \u003cstrong>половину\u003c/strong> баллов: почти в каждом критерии написано «половина итоговой оценки, если отсутствуют комментарии и логирование согласно заданию».\u003c/p>\n\u003c/div>\n\u003ch2>Баллы по спринтам\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 23%\" />\n\u003ccol style=\"width: 23%\" />\n\u003ccol style=\"width: 23%\" />\n\u003ccol style=\"width: 30%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Спринт\u003c/th>\n\u003cth>Время\u003c/th>\n\u003cth>Что делаете\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>1\u003c/td>\n\u003ctd>1 ч 30 мин\u003c/td>\n\u003ctd>UIKit в отдельной библиотеке + приложение StoryBook\u003c/td>\n\u003ctd style=\"text-align: right;\">10,96\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>2\u003c/td>\n\u003ctd>1 ч 10 мин\u003c/td>\n\u003ctd>Сетевой слой в отдельной библиотеке + тесты\u003c/td>\n\u003ctd style=\"text-align: right;\">20,89\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>3\u003c/td>\n\u003ctd>1 ч\u003c/td>\n\u003ctd>Splash, приветствие, регистрация, вход, Landing, Schedule Game\u003c/td>\n\u003ctd style=\"text-align: right;\">21,95\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>4\u003c/td>\n\u003ctd>1 ч\u003c/td>\n\u003ctd>Discover, Combat Info, Player Info, Statistics, игра Image\u003c/td>\n\u003ctd style=\"text-align: right;\">25,55\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>5\u003c/td>\n\u003ctd>1 ч\u003c/td>\n\u003ctd>Игра Circle, автозавершение, победитель\u003c/td>\n\u003ctd style=\"text-align: right;\">11,65\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>6\u003c/td>\n\u003ctd>3 ч\u003c/td>\n\u003ctd>Презентация, Яндекс-метрика, публикация в RuStore\u003c/td>\n\u003ctd style=\"text-align: right;\">9,00\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Сумма: 100 баллов. Самые «дорогие» спринты: 4, 3 и 2. Спринт 2 стоит почти вдвое больше первого, и он целиком про сеть и тесты.\u003c/p>\n\u003ch2>Правила, за которые снимают баллы\u003c/h2>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Канбан-доска.\u003c/strong> Колонки: «Готово к разработке» → «В работе» (не более 2 задач одновременно) → «Готово к тестированию» (вы сами переносите карточку и указываете \u003cstrong>коммит\u003c/strong>) → «Завершена» (переносят эксперты). Карточка не в «Готово к тестированию» — задача не проверяется.\u003c/li>\n\u003cli>\u003cstrong>Git.\u003c/strong> Ветка на каждый спринт, проект сохранён в ветку, pull request / merge в \u003ccode>main\u003c/code>. Если приложение не собирается из репозитория, работа \u003cstrong>не оценивается\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Дизайн строго по Figma.\u003c/strong> Шрифты, отступы, пропорции, цвета.\u003c/li>\n\u003cli>\u003cstrong>Адаптивность.\u003c/strong> Без больших пустот, без искажений, без горизонтального скролла, шрифты не заменяются системными.\u003c/li>\n\u003cli>\u003cstrong>Интернет почти недоступен.\u003c/strong> Один выделенный компьютер, \u003cstrong>10 минут на спринт\u003c/strong>, очередь не чаще раза в 10 минут. Пакеты нужно заранее согласовать с главным экспертом в день ознакомления.\u003c/li>\n\u003cli>\u003cstrong>Документирование и логи\u003c/strong> во всех спринтах (раздел «Комментарии и логи»).\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"warn\">\n\u003cp>Из пункта 5 следует важное: \u003cstrong>заранее выучите, какие пакеты вам нужны и как их подключать\u003c/strong>, и держите под рукой шпаргалку. На площадке нельзя долго искать документацию.\u003c/p>\n\u003c/div>\n\u003ch2>Пакеты, которые стоит согласовать заранее\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Задача\u003c/th>\n\u003cth>Пакет\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Сеть\u003c/td>\n\u003ctd>\u003ccode>http\u003c/code> (или \u003ccode>dio\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Логи\u003c/td>\n\u003ctd>\u003ccode>logger\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Хранение настроек и сессии\u003c/td>\n\u003ctd>\u003ccode>shared_preferences\u003c/code>, \u003ccode>flutter_secure_storage\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Кэш картинок\u003c/td>\n\u003ctd>\u003ccode>cached_network_image\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Фото\u003c/td>\n\u003ctd>\u003ccode>image_picker\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Уведомления\u003c/td>\n\u003ctd>\u003ccode>flutter_local_notifications\u003c/code>, \u003ccode>timezone\u003c/code>, \u003ccode>permission_handler\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>PDF\u003c/td>\n\u003ctd>\u003ccode>pdfx\u003c/code> или \u003ccode>flutter_pdfview\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Графики\u003c/td>\n\u003ctd>\u003ccode>fl_chart\u003c/code> (или рисовать самим через \u003ccode>CustomPainter\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Тесты\u003c/td>\n\u003ctd>\u003ccode>flutter_test\u003c/code>, \u003ccode>mocktail\u003c/code>, \u003ccode>http/testing.dart\u003c/code> (идёт вместе с \u003ccode>http\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Метрика\u003c/td>\n\u003ctd>\u003ccode>appmetrica_plugin\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Адаптив\u003c/td>\n\u003ctd>\u003ccode>vize\u003c/code> (вы уже используете)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Состояние\u003c/td>\n\u003ctd>\u003ccode>get\u003c/code> (GetX) или \u003ccode>provider\u003c/code> / \u003ccode>flutter_bloc\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Как пользоваться сайтом\u003c/h2>\n\u003cul>\n\u003cli>Идите по этапам слева направо: от «что такое программирование» до разборов спринтов.\u003c/li>\n\u003cli>Отмечайте темы как \u003cstrong>изученные\u003c/strong> (прогресс хранится в вашем браузере).\u003c/li>\n\u003cli>После каждого этапа решайте \u003cstrong>тренажёр\u003c/strong> с вопросами.\u003c/li>\n\u003cli>Перед каждой репетицией спринта откройте раздел «Чек-лист баллов».\u003c/li>\n\u003c/ul>\n", "text": " Что такое это задание Региональный этап «Профессионалов» по компетенции «Разработка мобильных приложений» . Вы за три дня (18 часов) делаете мобильное приложение для игры двух соперников: расписание боёв, поиск соперника, две игры-пазла ( Image и Circle ), статистика. Дизайн дан в Figma, бэкенд — готовый SaaS по REST API. Параметр Значение Длительность 18 часов, 3 конкурсных дня Модулей 7 (5 обязательных + 2 вариативных) Сумма баллов 100 Минимальные ОС Android 14, iOS 18 Работа сдаётся через Git (удалённый репозиторий организаторов) Задачи выдаются в таск-трекере, помечены спринтом Баллы по модулям Модуль Название Баллы Тип А Архитектура приложения 17,70 обязательный Б Верстка приложения 34,36 обязательный В Клиент-серверное взаимодействие 24,14 обязательный Г Хранение информации 4,85 обязательный Д Аппаратные расширения устройства 5,00 обязательный Е Тестирование 4,95 вариативный Ж Подготовка продукта 9,00 вариативный Верстка и клиент-сервер дают 58 из 100 баллов . Но верстка без архитектуры и логирования получает половину баллов: почти в каждом критерии написано «половина итоговой оценки, если отсутствуют комментарии и логирование согласно заданию». Баллы по спринтам Спринт Время Что делаете Баллы 1 1 ч 30 мин UIKit в отдельной библиотеке + приложение StoryBook 10,96 2 1 ч 10 мин Сетевой слой в отдельной библиотеке + тесты 20,89 3 1 ч Splash, приветствие, регистрация, вход, Landing, Schedule Game 21,95 4 1 ч Discover, Combat Info, Player Info, Statistics, игра Image 25,55 5 1 ч Игра Circle, автозавершение, победитель 11,65 6 3 ч Презентация, Яндекс-метрика, публикация в RuStore 9,00 Сумма: 100 баллов. Самые «дорогие» спринты: 4, 3 и 2. Спринт 2 стоит почти вдвое больше первого, и он целиком про сеть и тесты. Правила, за которые снимают баллы Канбан-доска. Колонки: «Готово к разработке» → «В работе» (не более 2 задач одновременно) → «Готово к тестированию» (вы сами переносите карточку и указываете коммит ) → «Завершена» (переносят эксперты). Карточка не в «Готово к тестированию» — задача не проверяется. Git. Ветка на каждый спринт, проект сохранён в ветку, pull request / merge в main . Если приложение не собирается из репозитория, работа не оценивается . Дизайн строго по Figma. Шрифты, отступы, пропорции, цвета. Адаптивность. Без больших пустот, без искажений, без горизонтального скролла, шрифты не заменяются системными. Интернет почти недоступен. Один выделенный компьютер, 10 минут на спринт , очередь не чаще раза в 10 минут. Пакеты нужно заранее согласовать с главным экспертом в день ознакомления. Документирование и логи во всех спринтах (раздел «Комментарии и логи»). Из пункта 5 следует важное: заранее выучите, какие пакеты вам нужны и как их подключать , и держите под рукой шпаргалку. На площадке нельзя долго искать документацию. Пакеты, которые стоит согласовать заранее Задача Пакет Сеть http (или dio ) Логи logger Хранение настроек и сессии shared_preferences , flutter_secure_storage Кэш картинок cached_network_image Фото image_picker Уведомления flutter_local_notifications , timezone , permission_handler PDF pdfx или flutter_pdfview Графики fl_chart (или рисовать самим через CustomPainter ) Тесты flutter_test , mocktail , http/testing.dart (идёт вместе с http ) Метрика appmetrica_plugin Адаптив vize (вы уже используете) Состояние get (GetX) или provider / flutter_bloc Как пользоваться сайтом Идите по этапам слева направо: от «что такое программирование» до разборов спринтов. Отмечайте темы как изученные (прогресс хранится в вашем браузере). После каждого этапа решайте тренажёр с вопросами. Перед каждой репетицией спринта откройте раздел «Чек-лист баллов». ", "hours": 1, "minutes": 3}, {"id": "task-explained", "stage": 0, "title": "Конкурсное задание простыми словами", "lead": "Перевод документа с «канцелярского» на понятный язык: что вам дают, что от вас хотят и как это проверяют.", "html": "\u003ch2>Если коротко: что вам предстоит\u003c/h2>\n\u003cp>Представьте, что вы устроились в небольшую студию мобильной разработки. Вам дают:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>макет\u003c/strong> (дизайн в Figma): как приложение должно выглядеть;\u003c/li>\n\u003cli>\u003cstrong>список задач\u003c/strong> в таск-трекере (как Trello): «сделай экран входа», «сделай запрос на сервер»;\u003c/li>\n\u003cli>\u003cstrong>готовый сервер\u003c/strong>, к которому приложение отправляет запросы и получает данные;\u003c/li>\n\u003cli>\u003cstrong>репозиторий Git\u003c/strong>, куда нужно сохранять работу.\u003c/li>\n\u003c/ul>\n\u003cp>Ваша задача: за отведённое время сделать приложение, где два игрока соревнуются в сборке пазлов (картинка и круги), создают игры по расписанию и смотрят статистику. Эксперты проверяют не «красивую картинку», а \u003cstrong>код, структуру, логи, сеть, Git и то, как приложение работает на телефоне\u003c/strong>.\u003c/p>\n\u003cdiv class=\"tip\">\n\u003cp>Главное отличие от учебных работ в колледже: здесь оценивается \u003cstrong>процесс\u003c/strong> (ветки, карточки, комментарии, архитектура), а не только то, что экран «как-то открылся».\u003c/p>\n\u003c/div>\n\u003ch2>Как устроено время\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Что в документе\u003c/th>\n\u003cth>Что это значит на практике\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>«18 часов, 3 дня»\u003c/td>\n\u003ctd>Общая длительность соревнования\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Спринты 1–6\u003c/td>\n\u003ctd>Отдельные «забеги» с заданиями. Суммарно их время в документе меньше 18 часов; что в остальное время (перерывы, проверка, защита), в документе не сказано, это нужно уточнить у наставника\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>«Задание выдаётся на спринт единым комплектом модулей»\u003c/td>\n\u003ctd>В каждом спринте вы получаете сразу задачи по нескольким направлениям (вёрстка, сеть, хранение…) и сами решаете, в каком порядке делать\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>«Проверяется версия, сохранённая в Git во время спринта»\u003c/td>\n\u003ctd>Что не успели закоммитить до конца спринта, не засчитают\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Модули и спринты: в чём разница\u003c/h2>\n\u003cp>Это самая частая путаница.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Спринт\u003c/strong> отвечает на вопрос \u003cstrong>«когда»\u003c/strong>: в какой отрезок времени вам выдают задачи (спринт 1, спринт 2…).\u003c/li>\n\u003cli>\u003cstrong>Модуль\u003c/strong> отвечает на вопрос \u003cstrong>«за что баллы»\u003c/strong>: направление оценки (А — архитектура, Б — вёрстка и так далее).\u003c/li>\n\u003c/ul>\n\u003cp>Одна задача лежит на пересечении. Например, «экран авторизации»: по \u003cstrong>модулю Б\u003c/strong> оценят верстку, по \u003cstrong>модулю В\u003c/strong> сеть, по \u003cstrong>модулю А\u003c/strong> архитектуру и комментарии, по \u003cstrong>модулю Г\u003c/strong> сохранение сессии. Один экран — четыре набора баллов.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Модуль\u003c/th>\n\u003cth>Простыми словами\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>А. Архитектура\u003c/strong>\u003c/td>\n\u003ctd>Аккуратно ли разложен код по папкам и слоям, есть ли комментарии и логи, соблюдены ли SOLID и DRY\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>Б. Верстка\u003c/strong>\u003c/td>\n\u003ctd>Похоже ли на макет, все ли состояния кнопок и полей, адаптивно ли\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>В. Клиент-сервер\u003c/strong>\u003c/td>\n\u003ctd>Работают ли запросы, что происходит при ошибке или без интернета\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>Г. Хранение\u003c/strong>\u003c/td>\n\u003ctd>Запоминает ли приложение вход, последний экран; правильно ли работал Git\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>Д. Аппаратные возможности\u003c/strong>\u003c/td>\n\u003ctd>Камера, галерея, локальные уведомления\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>Е. Тестирование\u003c/strong>\u003c/td>\n\u003ctd>Автотесты сетевого слоя\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>Ж. Подготовка продукта\u003c/strong>\u003c/td>\n\u003ctd>Презентация, аналитика, страница в RuStore\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Обязательная и вариативная часть\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Инвариант\u003c/strong> (модули А, Б, В, Г, Д): их делают все регионы, пропустить нельзя.\u003c/li>\n\u003cli>\u003cstrong>Вариатив\u003c/strong> (модули Е, Ж): регион выбирает сам. В вашем документе они есть, поэтому готовьтесь к ним.\u003c/li>\n\u003c/ul>\n\u003ch2>Как читать таблицу критериев (Excel)\u003c/h2>\n\u003cp>В файле с критериями у каждой строки есть \u003cstrong>тип аспекта\u003c/strong>:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Буква\u003c/th>\n\u003cth>Название\u003c/th>\n\u003cth>Как оценивают\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>И\u003c/strong>\u003c/td>\n\u003ctd>Измеримый\u003c/td>\n\u003ctd>Есть/нет, объективно. Например, «создана ветка спринта»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>С\u003c/strong>\u003c/td>\n\u003ctd>Судейский\u003c/td>\n\u003ctd>Эксперты ставят оценку 0–3 по описанию: 0 нет, 1 плохо, 2 хорошо, 3 отлично. Например, «слайды удовлетворяют стандартам»\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Столбец «Методика проверки» самый полезный: там написано, \u003cstrong>за что снимут баллы\u003c/strong>. Например: «минус 0,02 за каждый отсутствующий цвет» или «половина итоговой оценки, если отсутствуют комментарии и логирование». Читайте его перед каждым спринтом.\u003c/p>\n\u003ch2>Разбор раздела «Общее» из документа\u003c/h2>\n\u003ch3>«Минимальная версия ОС: Android 14, iOS 18»\u003c/h3>\n\u003cp>Приложение должно запускаться на таких и более новых телефонах. В Flutter это настраивается в \u003ccode>android/app/build.gradle\u003c/code> (\u003ccode>minSdk\u003c/code>) и \u003ccode>ios/Podfile\u003c/code>. Практически: используйте актуальную версию Flutter, и ничего специально делать не придётся. Важно знать, что на Android 13+ \u003cstrong>уведомления требуют разрешения\u003c/strong> (\u003ccode>POST_NOTIFICATIONS\u003c/code>).\u003c/p>\n\u003ch3>«Бэкенд — SaaS-решение через REST API»\u003c/h3>\n\u003cp>\u003cstrong>SaaS\u003c/strong> — готовый сервис «в облаке». Вам не нужно писать сервер: организаторы выдадут адрес (например, \u003ccode>https://xxx.example.com/api\u003c/code>) и описание запросов. \u003cstrong>REST API\u003c/strong> — это договорённость: «чтобы войти, отправь \u003ccode>POST /auth/login\u003c/code> с email и паролем, получишь токен».\u003c/p>\n\u003ch3>«Задания выдаются в таск-трекере, каждая задача проходит этапы канбан-доски»\u003c/h3>\n\u003cp>Задача — карточка. Вы двигаете её слева направо: «Готово к разработке» → «В работе» (не больше двух сразу) → «Готово к тестированию» (с указанием коммита). Дальше карточку переносят эксперты. Если карточка осталась «в работе» — для эксперта вы эту задачу \u003cstrong>не сделали\u003c/strong>, даже если код написан.\u003c/p>\n\u003ch3>«Использовать Git»\u003c/h3>\n\u003cp>Каждый спринт — своя ветка, в конце pull request и merge в \u003ccode>main\u003c/code>. Организаторы выдадут адрес репозитория и аккаунт.\u003c/p>\n\u003ch3>«Необходимо строго следовать дизайну» и «Вся верстка адаптивная»\u003c/h3>\n\u003cp>Шесть требований из документа в переводе на язык действий:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Требование\u003c/th>\n\u003cth>Что делать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Нет большого пустого пространства\u003c/td>\n\u003ctd>Блоки должны растягиваться по ширине экрана, а не оставаться узкой полоской по центру\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Нет искажений\u003c/td>\n\u003ctd>Круглая аватарка не должна становиться овалом: фиксируйте пропорции (\u003ccode>AspectRatio\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Всё в границах и на месте\u003c/td>\n\u003ctd>Заголовки, кнопки и иконки целиком на экране, без горизонтальной прокрутки\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Отступы по пропорции\u003c/td>\n\u003ctd>Если на макете 20 px при ширине 390, на экране шириной 430 отступ чуть больше, либо фиксированный, если так в дизайн-системе\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Шрифты из макета\u003c/td>\n\u003ctd>Подключить Manrope (или тот, что в макете), не оставлять системный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Блоки как у дизайнера\u003c/td>\n\u003ctd>Расположение блоков на любом телефоне должно совпадать с макетом\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Разбор модуля А: документирование и логи\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Комментарий над классом\u003c/strong>: что делает (одна фраза), дата \u003ccode>ДД-ММ-ГГГГ\u003c/code>, номер участника.\u003c/li>\n\u003cli>\u003cstrong>Комментарий над публичным методом\u003c/strong>: что делает, что принимает, что возвращает.\u003c/li>\n\u003cli>\u003cstrong>Внутри длинных методов\u003c/strong> (больше 5 строк): строчные комментарии к условиям, циклам, формулам.\u003c/li>\n\u003cli>\u003cstrong>Логи\u003c/strong> трёх уровней (DEBUG, INFO, ERROR) в четырёх обязательных местах: жизненный цикл экрана, сеть/БД, нажатия на важные кнопки, \u003ccode>try-catch\u003c/code>. Формат: \u003ccode>[Тег]: Событие — Детали\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>Если этого нет, то \u003cstrong>почти каждый критерий оценивается вполовину\u003c/strong>. Это самое выгодное правило для подготовки: один раз настроить привычку, и вы сохраняете сотни процентов баллов.\u003c/p>\n\u003ch2>Разбор спринта 1: UIKit\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>UIKit\u003c/strong> — отдельная коробка с готовыми «деталями» интерфейса: кнопки, поля, чекбоксы. Пока они в основном приложении, это не UIKit.\u003c/li>\n\u003cli>\u003cstrong>Отдельный проект и репозиторий\u003c/strong>: библиотеку можно подключить к любому приложению.\u003c/li>\n\u003cli>\u003cstrong>StoryBook\u003c/strong> — приложение-витрина: на одной странице показаны все детали во всех состояниях. Эксперт смотрит не в код, а в StoryBook.\u003c/li>\n\u003cli>\u003cstrong>SOLID и DRY\u003c/strong> (таблицы с примерами есть в теме «Архитектура»).\u003c/li>\n\u003c/ul>\n\u003ch2>Разбор спринта 2: сетевой слой\u003c/h2>\n\u003cp>Аналогия: \u003cstrong>официант\u003c/strong> между кухней (сервер) и залом (экраны). Экран не ходит на кухню сам; он говорит официанту: «принеси список игр». Если завтра заменить официанта (с \u003ccode>http\u003c/code> на \u003ccode>dio\u003c/code>), залу ничего менять не нужно. Поэтому:\u003c/p>\n\u003cul>\n\u003cli>сетевая библиотека в \u003cstrong>отдельном проекте\u003c/strong>;\u003c/li>\n\u003cli>экраны вызывают \u003cstrong>интерфейс\u003c/strong> (абстракцию), а не конкретную реализацию;\u003c/li>\n\u003cli>ошибки (нет интернета, ошибка сервера) возвращаются единообразно;\u003c/li>\n\u003cli>на каждый из 11 запросов нужен тест.\u003c/li>\n\u003c/ul>\n\u003ch2>Разбор спринтов 3–5: приложение и архитектура\u003c/h2>\n\u003cp>Аналогия: \u003cstrong>ресторан\u003c/strong> из трёх зон.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Presentation\u003c/strong> (зал): экраны и кнопки;\u003c/li>\n\u003cli>\u003cstrong>Domain\u003c/strong> (правила ресторана): «как принять заказ», не зависит ни от зала, ни от кухни;\u003c/li>\n\u003cli>\u003cstrong>Data\u003c/strong> (кухня и склад): как достать данные: из сервера или из памяти телефона.\u003c/li>\n\u003c/ul>\n\u003cp>Требование «изменение одного экрана не ломает другие» значит: экраны не должны знать друг о друге, кроме переходов.\u003c/p>\n\u003ch2>Разбор модулей Г, Д, Е, Ж\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Модуль\u003c/th>\n\u003cth>Что значит\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Г\u003c/td>\n\u003ctd>Токен и последний экран сохраняются между запусками; политика конфиденциальности (PDF) и соглашение читаются в приложении; медиа кэшируется; закрытие игры = поражение; Git по шаблону\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Д\u003c/td>\n\u003ctd>Нажали на фото профиля → выбор галерея/камера; уведомление за 1 час до игры (если стояла галка)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Е\u003c/td>\n\u003ctd>Тесты на 11 запросов по тест-кейсам из карточек\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Ж\u003c/td>\n\u003ctd>Презентация для разработчиков, метрика (события в игре Image), страница приложения в RuStore\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Что в документе не сказано, но важно знать\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Вопрос\u003c/th>\n\u003cth>Как узнать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Адрес и документация API\u003c/td>\n\u003ctd>В карточке или в первый день на площадке\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Какие пакеты можно ставить\u003c/td>\n\u003ctd>Согласовывается с главным экспертом в день ознакомления\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Версия Flutter на стенде\u003c/td>\n\u003ctd>Спросить в день ознакомления\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Как именно называть ветки\u003c/td>\n\u003ctd>Обычно \u003ccode>sprint-1\u003c/code>, \u003ccode>sprint-2\u003c/code>… уточните\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Что считается «слоем» (папки)\u003c/td>\n\u003ctd>Опишите структуру на схеме и покажите эксперту\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Размер экранов для проверки\u003c/td>\n\u003ctd>Тестируйте на нескольких\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Вопросы главному эксперту в день ознакомления\u003c/h2>\n\u003cp>Запишите заранее (копируйте в заметки симуляции):\u003c/p>\n\u003col type=\"1\">\n\u003cli>Какая версия Flutter/Dart на рабочих местах?\u003c/li>\n\u003cli>Какие пакеты разрешены? Можно ли добавить \u003ccode>appmetrica_plugin\u003c/code>, \u003ccode>image_picker\u003c/code>, \u003ccode>flutter_local_notifications\u003c/code>, \u003ccode>cached_network_image\u003c/code>?\u003c/li>\n\u003cli>Где взять шрифты и иконки из Figma, нужно ли их экспортировать самим?\u003c/li>\n\u003cli>Как называть ветки и сообщения коммитов?\u003c/li>\n\u003cli>Как оформлять номер участника в шапке файла?\u003c/li>\n\u003cli>Какой телефон/эмулятор используется на проверке?\u003c/li>\n\u003cli>Как именно проверяется «закрытие игры»: сворачивание, закрытие через «назад» или оба варианта?\u003c/li>\n\u003cli>Можно ли использовать готовые шаблоны и сниппеты, подготовленные заранее?\u003c/li>\n\u003c/ol>\n", "text": " Если коротко: что вам предстоит Представьте, что вы устроились в небольшую студию мобильной разработки. Вам дают: макет (дизайн в Figma): как приложение должно выглядеть; список задач в таск-трекере (как Trello): «сделай экран входа», «сделай запрос на сервер»; готовый сервер , к которому приложение отправляет запросы и получает данные; репозиторий Git , куда нужно сохранять работу. Ваша задача: за отведённое время сделать приложение, где два игрока соревнуются в сборке пазлов (картинка и круги), создают игры по расписанию и смотрят статистику. Эксперты проверяют не «красивую картинку», а код, структуру, логи, сеть, Git и то, как приложение работает на телефоне . Главное отличие от учебных работ в колледже: здесь оценивается процесс (ветки, карточки, комментарии, архитектура), а не только то, что экран «как-то открылся». Как устроено время Что в документе Что это значит на практике «18 часов, 3 дня» Общая длительность соревнования Спринты 1–6 Отдельные «забеги» с заданиями. Суммарно их время в документе меньше 18 часов; что в остальное время (перерывы, проверка, защита), в документе не сказано, это нужно уточнить у наставника «Задание выдаётся на спринт единым комплектом модулей» В каждом спринте вы получаете сразу задачи по нескольким направлениям (вёрстка, сеть, хранение…) и сами решаете, в каком порядке делать «Проверяется версия, сохранённая в Git во время спринта» Что не успели закоммитить до конца спринта, не засчитают Модули и спринты: в чём разница Это самая частая путаница. Спринт отвечает на вопрос «когда» : в какой отрезок времени вам выдают задачи (спринт 1, спринт 2…). Модуль отвечает на вопрос «за что баллы» : направление оценки (А — архитектура, Б — вёрстка и так далее). Одна задача лежит на пересечении. Например, «экран авторизации»: по модулю Б оценят верстку, по модулю В сеть, по модулю А архитектуру и комментарии, по модулю Г сохранение сессии. Один экран — четыре набора баллов. Модуль Простыми словами А. Архитектура Аккуратно ли разложен код по папкам и слоям, есть ли комментарии и логи, соблюдены ли SOLID и DRY Б. Верстка Похоже ли на макет, все ли состояния кнопок и полей, адаптивно ли В. Клиент-сервер Работают ли запросы, что происходит при ошибке или без интернета Г. Хранение Запоминает ли приложение вход, последний экран; правильно ли работал Git Д. Аппаратные возможности Камера, галерея, локальные уведомления Е. Тестирование Автотесты сетевого слоя Ж. Подготовка продукта Презентация, аналитика, страница в RuStore Обязательная и вариативная часть Инвариант (модули А, Б, В, Г, Д): их делают все регионы, пропустить нельзя. Вариатив (модули Е, Ж): регион выбирает сам. В вашем документе они есть, поэтому готовьтесь к ним. Как читать таблицу критериев (Excel) В файле с критериями у каждой строки есть тип аспекта : Буква Название Как оценивают И Измеримый Есть/нет, объективно. Например, «создана ветка спринта» С Судейский Эксперты ставят оценку 0–3 по описанию: 0 нет, 1 плохо, 2 хорошо, 3 отлично. Например, «слайды удовлетворяют стандартам» Столбец «Методика проверки» самый полезный: там написано, за что снимут баллы . Например: «минус 0,02 за каждый отсутствующий цвет» или «половина итоговой оценки, если отсутствуют комментарии и логирование». Читайте его перед каждым спринтом. Разбор раздела «Общее» из документа «Минимальная версия ОС: Android 14, iOS 18» Приложение должно запускаться на таких и более новых телефонах. В Flutter это настраивается в android/app/build.gradle ( minSdk ) и ios/Podfile . Практически: используйте актуальную версию Flutter, и ничего специально делать не придётся. Важно знать, что на Android 13+ уведомления требуют разрешения ( POST_NOTIFICATIONS ). «Бэкенд — SaaS-решение через REST API» SaaS — готовый сервис «в облаке». Вам не нужно писать сервер: организаторы выдадут адрес (например, https://xxx.example.com/api ) и описание запросов. REST API — это договорённость: «чтобы войти, отправь POST /auth/login с email и паролем, получишь токен». «Задания выдаются в таск-трекере, каждая задача проходит этапы канбан-доски» Задача — карточка. Вы двигаете её слева направо: «Готово к разработке» → «В работе» (не больше двух сразу) → «Готово к тестированию» (с указанием коммита). Дальше карточку переносят эксперты. Если карточка осталась «в работе» — для эксперта вы эту задачу не сделали , даже если код написан. «Использовать Git» Каждый спринт — своя ветка, в конце pull request и merge в main . Организаторы выдадут адрес репозитория и аккаунт. «Необходимо строго следовать дизайну» и «Вся верстка адаптивная» Шесть требований из документа в переводе на язык действий: Требование Что делать Нет большого пустого пространства Блоки должны растягиваться по ширине экрана, а не оставаться узкой полоской по центру Нет искажений Круглая аватарка не должна становиться овалом: фиксируйте пропорции ( AspectRatio ) Всё в границах и на месте Заголовки, кнопки и иконки целиком на экране, без горизонтальной прокрутки Отступы по пропорции Если на макете 20 px при ширине 390, на экране шириной 430 отступ чуть больше, либо фиксированный, если так в дизайн-системе Шрифты из макета Подключить Manrope (или тот, что в макете), не оставлять системный Блоки как у дизайнера Расположение блоков на любом телефоне должно совпадать с макетом Разбор модуля А: документирование и логи Комментарий над классом : что делает (одна фраза), дата ДД-ММ-ГГГГ , номер участника. Комментарий над публичным методом : что делает, что принимает, что возвращает. Внутри длинных методов (больше 5 строк): строчные комментарии к условиям, циклам, формулам. Логи трёх уровней (DEBUG, INFO, ERROR) в четырёх обязательных местах: жизненный цикл экрана, сеть/БД, нажатия на важные кнопки, try-catch . Формат: [Тег]: Событие — Детали . Если этого нет, то почти каждый критерий оценивается вполовину . Это самое выгодное правило для подготовки: один раз настроить привычку, и вы сохраняете сотни процентов баллов. Разбор спринта 1: UIKit UIKit — отдельная коробка с готовыми «деталями» интерфейса: кнопки, поля, чекбоксы. Пока они в основном приложении, это не UIKit. Отдельный проект и репозиторий : библиотеку можно подключить к любому приложению. StoryBook — приложение-витрина: на одной странице показаны все детали во всех состояниях. Эксперт смотрит не в код, а в StoryBook. SOLID и DRY (таблицы с примерами есть в теме «Архитектура»). Разбор спринта 2: сетевой слой Аналогия: официант между кухней (сервер) и залом (экраны). Экран не ходит на кухню сам; он говорит официанту: «принеси список игр». Если завтра заменить официанта (с http на dio ), залу ничего менять не нужно. Поэтому: сетевая библиотека в отдельном проекте ; экраны вызывают интерфейс (абстракцию), а не конкретную реализацию; ошибки (нет интернета, ошибка сервера) возвращаются единообразно; на каждый из 11 запросов нужен тест. Разбор спринтов 3–5: приложение и архитектура Аналогия: ресторан из трёх зон. Presentation (зал): экраны и кнопки; Domain (правила ресторана): «как принять заказ», не зависит ни от зала, ни от кухни; Data (кухня и склад): как достать данные: из сервера или из памяти телефона. Требование «изменение одного экрана не ломает другие» значит: экраны не должны знать друг о друге, кроме переходов. Разбор модулей Г, Д, Е, Ж Модуль Что значит Г Токен и последний экран сохраняются между запусками; политика конфиденциальности (PDF) и соглашение читаются в приложении; медиа кэшируется; закрытие игры = поражение; Git по шаблону Д Нажали на фото профиля → выбор галерея/камера; уведомление за 1 час до игры (если стояла галка) Е Тесты на 11 запросов по тест-кейсам из карточек Ж Презентация для разработчиков, метрика (события в игре Image), страница приложения в RuStore Что в документе не сказано, но важно знать Вопрос Как узнать Адрес и документация API В карточке или в первый день на площадке Какие пакеты можно ставить Согласовывается с главным экспертом в день ознакомления Версия Flutter на стенде Спросить в день ознакомления Как именно называть ветки Обычно sprint-1 , sprint-2 … уточните Что считается «слоем» (папки) Опишите структуру на схеме и покажите эксперту Размер экранов для проверки Тестируйте на нескольких Вопросы главному эксперту в день ознакомления Запишите заранее (копируйте в заметки симуляции): Какая версия Flutter/Dart на рабочих местах? Какие пакеты разрешены? Можно ли добавить appmetrica_plugin , image_picker , flutter_local_notifications , cached_network_image ? Где взять шрифты и иконки из Figma, нужно ли их экспортировать самим? Как называть ветки и сообщения коммитов? Как оформлять номер участника в шапке файла? Какой телефон/эмулятор используется на проверке? Как именно проверяется «закрытие игры»: сворачивание, закрытие через «назад» или оба варианта? Можно ли использовать готовые шаблоны и сниппеты, подготовленные заранее? ", "hours": 2, "minutes": 8}, {"id": "programming", "stage": 1, "title": "Что такое программирование", "lead": "Алгоритм, переменная, условие, цикл, функция. Базовые идеи, на которых стоит любой код.", "html": "\u003ch2>Программа и алгоритм\u003c/h2>\n\u003cp>\u003cstrong>Алгоритм\u003c/strong> — конечная последовательность шагов, которая решает задачу. \u003cstrong>Программа\u003c/strong> — алгоритм, записанный на языке, который понимает компьютер. Мобильное приложение — большая программа, которая реагирует на касания, запрашивает данные у сервера и рисует экран.\u003c/p>\n\u003cp>Пример алгоритма «проверить пароль»:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Получить введённую строку.\u003c/li>\n\u003cli>Если её длина меньше 8 — показать ошибку и остановиться.\u003c/li>\n\u003cli>Иначе отправить пароль на сервер.\u003c/li>\n\u003c/ol>\n\u003ch2>Основные кирпичики\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Понятие\u003c/th>\n\u003cth>Что это\u003c/th>\n\u003cth>Пример на Dart\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Переменная\u003c/td>\n\u003ctd>Именованная ячейка памяти\u003c/td>\n\u003ctd>\u003ccode>int score = 5;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Тип данных\u003c/td>\n\u003ctd>Какие значения допустимы\u003c/td>\n\u003ctd>\u003ccode>int\u003c/code>, \u003ccode>double\u003c/code>, \u003ccode>String\u003c/code>, \u003ccode>bool\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Условие\u003c/td>\n\u003ctd>Выбор ветки выполнения\u003c/td>\n\u003ctd>\u003ccode>if (score &gt; 3) { ... }\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Цикл\u003c/td>\n\u003ctd>Повтор действий\u003c/td>\n\u003ctd>\u003ccode>for (var i = 0; i &lt; 3; i++) { ... }\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Функция\u003c/td>\n\u003ctd>Именованный кусок кода, который можно вызвать\u003c/td>\n\u003ctd>\u003ccode>int sum(int a, int b) =&gt; a + b;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Коллекция\u003c/td>\n\u003ctd>Много значений вместе\u003c/td>\n\u003ctd>\u003ccode>List&lt;int&gt;\u003c/code>, \u003ccode>Map&lt;String, int&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Класс\u003c/td>\n\u003ctd>Шаблон для объектов с данными и поведением\u003c/td>\n\u003ctd>\u003ccode>class Player { ... }\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Как язык превращается в приложение\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Вы пишете \u003cstrong>исходный код\u003c/strong> (\u003ccode>.dart\u003c/code>).\u003c/li>\n\u003cli>Компилятор превращает его в машинный код (Android — ARM, iOS — ARM) либо запускает в режиме отладки на виртуальной машине Dart (\u003cstrong>hot reload\u003c/strong> работает именно так).\u003c/li>\n\u003cli>Приложение запускается на устройстве и общается с системой: рисует экран, получает касания, обращается к камере и сети.\u003c/li>\n\u003c/ol>\n\u003ch2>Клиент и сервер\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Клиент\u003c/strong> — ваше мобильное приложение.\u003c/li>\n\u003cli>\u003cstrong>Сервер\u003c/strong> — компьютер в интернете, который хранит данные (пользователи, игры).\u003c/li>\n\u003cli>\u003cstrong>API\u003c/strong> — набор «адресов» сервера, к которым приложение обращается. В задании — \u003cstrong>REST API\u003c/strong>: запросы по HTTP, данные в формате \u003cstrong>JSON\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>Приложение --(POST /login, JSON)--&gt; Сервер\nПриложение &lt;--(200, JSON с токеном)-- Сервер\u003c/code>\u003c/pre>\n\u003ch2>Как думать при решении задач\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Разбейте задачу на мелкие шаги (декомпозиция).\u003c/li>\n\u003cli>Для каждого шага определите вход и выход.\u003c/li>\n\u003cli>Выделите повторяющиеся части в функции или классы (принцип DRY).\u003c/li>\n\u003cli>Сначала сделайте так, чтобы работало; потом так, чтобы было чисто.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tip\">\n\u003cp>На чемпионате это же умение называется \u003cstrong>тайм-менеджментом\u003c/strong>: спринт идёт 20–90 минут, и вы решаете, что делать в первую очередь. Начинайте с того, что даёт больше всего баллов за меньшее время.\u003c/p>\n\u003c/div>\n\u003ch2>Что нужно уметь после этой темы\u003c/h2>\n\u003cul>\n\u003cli>Объяснить разницу между алгоритмом и программой.\u003c/li>\n\u003cli>Назвать основные типы данных.\u003c/li>\n\u003cli>Написать условие, цикл и функцию.\u003c/li>\n\u003cli>Объяснить, что такое клиент, сервер, API и JSON.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: переменная как подписанная коробка\u003c/h2>\n\u003cp>Память компьютера похожа на склад с коробками. \u003cstrong>Переменная\u003c/strong> — коробка с наклейкой (именем), в которую можно положить значение определённого типа.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>int score = 5;      // коробка «score» для целых чисел, внутри 5\nscore = score + 2;  // достали 5, прибавили 2, положили 7\nString name = &#39;Аня&#39;;\u003c/code>\u003c/pre>\n\u003cp>Что важно понимать:\u003c/p>\n\u003cul>\n\u003cli>Тип нужен, чтобы нельзя было положить в коробку для чисел текст: компилятор остановит вас сразу.\u003c/li>\n\u003cli>Имя переменной должно объяснять содержимое: \u003ccode>score\u003c/code>, а не \u003ccode>a1\u003c/code>. Читать код будут эксперты.\u003c/li>\n\u003cli>Присваивание \u003ccode>=\u003c/code> не «равно» из математики, а команда «положи справа в коробку слева».\u003c/li>\n\u003c/ul>\n\u003cp>Таблица основных типов:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 25%\" />\n\u003ccol style=\"width: 25%\" />\n\u003ccol style=\"width: 25%\" />\n\u003ccol style=\"width: 25%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Тип\u003c/th>\n\u003cth>Что хранит\u003c/th>\n\u003cth>Пример значения\u003c/th>\n\u003cth>Где встретится в задании\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>int\u003c/code>\u003c/td>\n\u003ctd>Целые числа\u003c/td>\n\u003ctd>\u003ccode>42\u003c/code>, \u003ccode>-3\u003c/code>\u003c/td>\n\u003ctd>Номер хода, очки\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>double\u003c/code>\u003c/td>\n\u003ctd>Дробные\u003c/td>\n\u003ctd>\u003ccode>3.14\u003c/code>\u003c/td>\n\u003ctd>Размер, отступ\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>String\u003c/code>\u003c/td>\n\u003ctd>Текст\u003c/td>\n\u003ctd>\u003ccode>'Привет'\u003c/code>\u003c/td>\n\u003ctd>Email, название игры\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>bool\u003c/code>\u003c/td>\n\u003ctd>Да/нет\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003ctd>Флаг «уведомлять»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>DateTime\u003c/code>\u003c/td>\n\u003ctd>Дата и время\u003c/td>\n\u003ctd>\u003ccode>DateTime(2027,3,15)\u003c/code>\u003c/td>\n\u003ctd>Время начала игры\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>List&lt;T&gt;\u003c/code>\u003c/td>\n\u003ctd>Список\u003c/td>\n\u003ctd>\u003ccode>[1,2,3]\u003c/code>\u003c/td>\n\u003ctd>Список игр\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Map&lt;K,V&gt;\u003c/code>\u003c/td>\n\u003ctd>Словарь\u003c/td>\n\u003ctd>\u003ccode>{'id': 1}\u003c/code>\u003c/td>\n\u003ctd>Разобранный JSON\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: условия и циклы с трассировкой\u003c/h2>\n\u003cp>Лучший способ понять код — \u003cstrong>трассировка\u003c/strong>: пройти его по шагам и записывать значения.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>int sumEven(List&lt;int&gt; numbers) {\n  var total = 0;\n  for (final n in numbers) {\n    if (n % 2 == 0) {        // остаток от деления на 2 равен 0 — число чётное\n      total = total + n;\n    }\n  }\n  return total;\n}\nsumEven([1, 2, 3, 4]);\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth style=\"text-align: right;\">Шаг\u003c/th>\n\u003cth style=\"text-align: right;\">\u003ccode>n\u003c/code>\u003c/th>\n\u003cth>чётное?\u003c/th>\n\u003cth style=\"text-align: right;\">\u003ccode>total\u003c/code>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>нет\u003c/td>\n\u003ctd style=\"text-align: right;\">0\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003ctd>да\u003c/td>\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd>нет\u003c/td>\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">4\u003c/td>\n\u003ctd style=\"text-align: right;\">4\u003c/td>\n\u003ctd>да\u003c/td>\n\u003ctd style=\"text-align: right;\">6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Результат \u003ccode>6\u003c/code>. Привычка трассировать спасает при поиске ошибок в играх (проверка «пазл собран?») и в расчётах статистики (сумма баллов за неделю).\u003c/p>\n\u003cp>Три типа ошибок в условиях и циклах:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Сломанное условие\u003c/strong>: \u003ccode>&gt;\u003c/code> вместо \u003ccode>&gt;=\u003c/code>, из-за чего пограничное значение обрабатывается неверно.\u003c/li>\n\u003cli>\u003cstrong>Бесконечный цикл\u003c/strong>: условие никогда не становится ложным.\u003c/li>\n\u003cli>\u003cstrong>Ошибка на единицу\u003c/strong>: цикл идёт на один шаг меньше или больше нужного (\u003ccode>i &lt;= length\u003c/code> вместо \u003ccode>i &lt; length\u003c/code>).\u003c/li>\n\u003c/ol>\n\u003ch2>Подробно: функции — «мини-программы» с входом и выходом\u003c/h2>\n\u003cp>Функция принимает \u003cstrong>параметры\u003c/strong> (входные данные), что-то делает и \u003cstrong>возвращает результат\u003c/strong>. Хорошая функция делает одну вещь и называется глаголом.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Принимает email, возвращает true, если адрес корректен\nbool isValidEmail(String value) =&gt; RegExp(r&#39;^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$&#39;).hasMatch(value);\u003c/code>\u003c/pre>\n\u003cp>Почему это важно для баллов:\u003c/p>\n\u003cul>\n\u003cli>Одинаковый код в двух местах нарушает \u003cstrong>DRY\u003c/strong>. Вынесли в функцию, вызываем из обоих мест.\u003c/li>\n\u003cli>Функция, которая делает одно, проще \u003cstrong>протестировать\u003c/strong> и \u003cstrong>описать комментарием\u003c/strong> (что принимает, что возвращает) — это требование модуля А.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: как искать ошибки (отладка)\u003c/h2>\n\u003cp>Ошибки неизбежны. Нужен порядок действий:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Прочитайте сообщение\u003c/strong> целиком. Первая строка говорит, что произошло, ниже — где (файл и номер строки).\u003c/li>\n\u003cli>\u003cstrong>Найдите свою строку\u003c/strong> в стеке вызовов: ту, где указан ваш файл.\u003c/li>\n\u003cli>\u003cstrong>Проверьте значения\u003c/strong>: поставьте лог \u003ccode>AppLog.debug(...)\u003c/code> или \u003ccode>print\u003c/code> перед проблемным местом.\u003c/li>\n\u003cli>\u003cstrong>Сузьте область\u003c/strong>: закомментируйте часть кода и проверьте, исчезла ли ошибка.\u003c/li>\n\u003cli>\u003cstrong>Используйте отладчик\u003c/strong> Android Studio: точка останова (клик слева от номера строки) и запуск в режиме Debug. Можно смотреть значения переменных и идти по шагам.\u003c/li>\n\u003cli>\u003cstrong>Исправьте одну вещь\u003c/strong> и проверьте. Не меняйте пять мест сразу.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tip\">\n\u003cp>На соревновании не тратьте больше 5–7 минут на одну ошибку. Если не получается, оставьте комментарий \u003ccode>// TODO\u003c/code>, переходите к следующей задаче и вернитесь позже. Заметку о проблеме запишите во вкладке «Симуляция».\u003c/p>\n\u003c/div>\n\u003ch2>Подробно: как устроено мобильное приложение\u003c/h2>\n\u003cp>Приложение — это постоянный цикл «событие → реакция → перерисовка»:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Событие\u003c/strong>: пользователь коснулся кнопки, пришёл ответ от сервера, сработал таймер.\u003c/li>\n\u003cli>\u003cstrong>Реакция\u003c/strong>: ваш код изменил данные (\u003ccode>score++\u003c/code>), отправил запрос, сохранил токен.\u003c/li>\n\u003cli>\u003cstrong>Перерисовка\u003c/strong>: Flutter заново строит часть интерфейса по новым данным.\u003c/li>\n\u003c/ol>\n\u003cp>Поэтому код в приложении делится на три роли: \u003cstrong>что показать\u003c/strong> (UI), \u003cstrong>что сделать\u003c/strong> (логика), \u003cstrong>откуда взять данные\u003c/strong> (сервер и память). Слои архитектуры (Presentation, Domain, Data) — как раз эти три роли, аккуратно разложенные по папкам.\u003c/p>\n\u003ch2>Мини-практика\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Напишите функцию, которая принимает список очков и возвращает максимальное (без \u003ccode>max()\u003c/code>).\u003c/li>\n\u003cli>Напишите функцию \u003ccode>isPalindrome(String)\u003c/code>.\u003c/li>\n\u003cli>Протрассируйте вручную цикл \u003ccode>for (var i = 1; i &lt;= 3; i++) { total += i * 2; }\u003c/code>.\u003c/li>\n\u003cli>Опишите алгоритм «зарегистрироваться в приложении» в виде нумерованных шагов.\u003c/li>\n\u003cli>Объясните однокласснику, чем клиент отличается от сервера, своими словами.\u003c/li>\n\u003c/ol>\n", "text": " Программа и алгоритм Алгоритм — конечная последовательность шагов, которая решает задачу. Программа — алгоритм, записанный на языке, который понимает компьютер. Мобильное приложение — большая программа, которая реагирует на касания, запрашивает данные у сервера и рисует экран. Пример алгоритма «проверить пароль»: Получить введённую строку. Если её длина меньше 8 — показать ошибку и остановиться. Иначе отправить пароль на сервер. Основные кирпичики Понятие Что это Пример на Dart Переменная Именованная ячейка памяти int score = 5; Тип данных Какие значения допустимы int , double , String , bool Условие Выбор ветки выполнения if (score > 3) { ... } Цикл Повтор действий for (var i = 0; i \u003c 3; i++) { ... } Функция Именованный кусок кода, который можно вызвать int sum(int a, int b) => a + b; Коллекция Много значений вместе List\u003cint> , Map\u003cString, int> Класс Шаблон для объектов с данными и поведением class Player { ... } Как язык превращается в приложение Вы пишете исходный код ( .dart ). Компилятор превращает его в машинный код (Android — ARM, iOS — ARM) либо запускает в режиме отладки на виртуальной машине Dart ( hot reload работает именно так). Приложение запускается на устройстве и общается с системой: рисует экран, получает касания, обращается к камере и сети. Клиент и сервер Клиент — ваше мобильное приложение. Сервер — компьютер в интернете, который хранит данные (пользователи, игры). API — набор «адресов» сервера, к которым приложение обращается. В задании — REST API : запросы по HTTP, данные в формате JSON . Приложение --(POST /login, JSON)--> Сервер Приложение \u003c--(200, JSON с токеном)-- Сервер Как думать при решении задач Разбейте задачу на мелкие шаги (декомпозиция). Для каждого шага определите вход и выход. Выделите повторяющиеся части в функции или классы (принцип DRY). Сначала сделайте так, чтобы работало; потом так, чтобы было чисто. На чемпионате это же умение называется тайм-менеджментом : спринт идёт 20–90 минут, и вы решаете, что делать в первую очередь. Начинайте с того, что даёт больше всего баллов за меньшее время. Что нужно уметь после этой темы Объяснить разницу между алгоритмом и программой. Назвать основные типы данных. Написать условие, цикл и функцию. Объяснить, что такое клиент, сервер, API и JSON. Подробно: переменная как подписанная коробка Память компьютера похожа на склад с коробками. Переменная — коробка с наклейкой (именем), в которую можно положить значение определённого типа. int score = 5; // коробка «score» для целых чисел, внутри 5 score = score + 2; // достали 5, прибавили 2, положили 7 String name = 'Аня'; Что важно понимать: Тип нужен, чтобы нельзя было положить в коробку для чисел текст: компилятор остановит вас сразу. Имя переменной должно объяснять содержимое: score , а не a1 . Читать код будут эксперты. Присваивание = не «равно» из математики, а команда «положи справа в коробку слева». Таблица основных типов: Тип Что хранит Пример значения Где встретится в задании int Целые числа 42 , -3 Номер хода, очки double Дробные 3.14 Размер, отступ String Текст 'Привет' Email, название игры bool Да/нет true Флаг «уведомлять» DateTime Дата и время DateTime(2027,3,15) Время начала игры List\u003cT> Список [1,2,3] Список игр Map\u003cK,V> Словарь {'id': 1} Разобранный JSON Подробно: условия и циклы с трассировкой Лучший способ понять код — трассировка : пройти его по шагам и записывать значения. int sumEven(List\u003cint> numbers) { var total = 0; for (final n in numbers) { if (n % 2 == 0) { // остаток от деления на 2 равен 0 — число чётное total = total + n; } } return total; } sumEven([1, 2, 3, 4]); Шаг n чётное? total 1 1 нет 0 2 2 да 2 3 3 нет 2 4 4 да 6 Результат 6 . Привычка трассировать спасает при поиске ошибок в играх (проверка «пазл собран?») и в расчётах статистики (сумма баллов за неделю). Три типа ошибок в условиях и циклах: Сломанное условие : > вместо >= , из-за чего пограничное значение обрабатывается неверно. Бесконечный цикл : условие никогда не становится ложным. Ошибка на единицу : цикл идёт на один шаг меньше или больше нужного ( i \u003c= length вместо i \u003c length ). Подробно: функции — «мини-программы» с входом и выходом Функция принимает параметры (входные данные), что-то делает и возвращает результат . Хорошая функция делает одну вещь и называется глаголом. // Принимает email, возвращает true, если адрес корректен bool isValidEmail(String value) => RegExp(r'^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$').hasMatch(value); Почему это важно для баллов: Одинаковый код в двух местах нарушает DRY . Вынесли в функцию, вызываем из обоих мест. Функция, которая делает одно, проще протестировать и описать комментарием (что принимает, что возвращает) — это требование модуля А. Подробно: как искать ошибки (отладка) Ошибки неизбежны. Нужен порядок действий: Прочитайте сообщение целиком. Первая строка говорит, что произошло, ниже — где (файл и номер строки). Найдите свою строку в стеке вызовов: ту, где указан ваш файл. Проверьте значения : поставьте лог AppLog.debug(...) или print перед проблемным местом. Сузьте область : закомментируйте часть кода и проверьте, исчезла ли ошибка. Используйте отладчик Android Studio: точка останова (клик слева от номера строки) и запуск в режиме Debug. Можно смотреть значения переменных и идти по шагам. Исправьте одну вещь и проверьте. Не меняйте пять мест сразу. На соревновании не тратьте больше 5–7 минут на одну ошибку. Если не получается, оставьте комментарий // TODO , переходите к следующей задаче и вернитесь позже. Заметку о проблеме запишите во вкладке «Симуляция». Подробно: как устроено мобильное приложение Приложение — это постоянный цикл «событие → реакция → перерисовка»: Событие : пользователь коснулся кнопки, пришёл ответ от сервера, сработал таймер. Реакция : ваш код изменил данные ( score+
