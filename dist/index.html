ыть импортов Presentation\ngrep -rn &quot;import .*presentation/&quot; lib/data\u003c/code>\u003c/pre>\n\u003cp>Если нашли строки, исправьте:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Нашли\u003c/th>\n\u003cth>Как исправить\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Domain\u003c/code> импортирует \u003ccode>flutter\u003c/code>\u003c/td>\n\u003ctd>Вынести виджет из Domain; в Domain только чистый Dart\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Presentation\u003c/code> импортирует \u003ccode>data\u003c/code>\u003c/td>\n\u003ctd>Заменить на интерфейс из \u003ccode>domain\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Data\u003c/code> использует \u003ccode>Controller\u003c/code>\u003c/td>\n\u003ctd>Передавать результат через возвращаемое значение\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Общий код нужен всем\u003c/td>\n\u003ctd>В \u003ccode>common\u003c/code> (константы, утилиты, DI)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Папка \u003ccode>common\u003c/code> разрешена заданием «для общих файлов», но не складывайте туда всё подряд: чем меньше в \u003ccode>common\u003c/code>, тем чище.\u003c/p>\n\u003ch2>Подробно: GetX и слои\u003c/h2>\n\u003cp>Вы знаете GetX, поэтому поместим его по слоям:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Что\u003c/th>\n\u003cth>Слой\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>GetxController\u003c/code>\u003c/td>\n\u003ctd>Presentation\u003c/td>\n\u003ctd>\u003ccode>LoginController\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Obx\u003c/code>, \u003ccode>GetBuilder\u003c/code>\u003c/td>\n\u003ctd>Presentation\u003c/td>\n\u003ctd>в экранах\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Binding\u003c/code>\u003c/td>\n\u003ctd>Presentation (или \u003ccode>common/di\u003c/code>)\u003c/td>\n\u003ctd>Регистрация зависимостей для экрана\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Get.put\u003c/code>, \u003ccode>Get.find\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>common/di\u003c/code> и Binding\u003c/td>\n\u003ctd>Единственное место, которое знает про реализации\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Get.snackbar\u003c/code>\u003c/td>\n\u003ctd>Presentation\u003c/td>\n\u003ctd>Ошибки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Правила, чтобы не нарушить SOLID:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Не вызывайте \u003ccode>Get.find\u003c/code> внутри UseCase/Repository\u003c/strong>: зависимости передавайте через конструктор.\u003c/li>\n\u003cli>Контроллер получает \u003cstrong>UseCase\u003c/strong>, а не репозиторий и не \u003ccode>http\u003c/code>.\u003c/li>\n\u003cli>В Domain не должно быть \u003ccode>import 'package:get/get.dart'\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cpre class=\"dart\">\u003ccode>class LoginBinding extends Bindings {\n  @override\n  void dependencies() {\n    Get.lazyPut&lt;AuthRepository&gt;(() =&gt; AuthRepositoryImpl(Get.find&lt;AuthRemoteSource&gt;()));\n    Get.lazyPut(() =&gt; LoginUseCase(Get.find&lt;AuthRepository&gt;()));\n    Get.lazyPut(() =&gt; LoginController(Get.find&lt;LoginUseCase&gt;()));\n  }\n}\u003c/code>\u003c/pre>\n\u003ch2>Подробно: DRY на практике — как искать дублирование\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Поиск копий: выделите кусок кода и поищите его по проекту (Ctrl+Shift+F).\u003c/li>\n\u003cli>Если один и тот же блок встречается 2 раза и больше, вынесите в функцию, виджет или константу.\u003c/li>\n\u003cli>Если куски отличаются парой значений, сделайте параметры.\u003c/li>\n\u003cli>Если есть \u003ccode>if/else\u003c/code> по типу, который растёт, подумайте об \u003ccode>enum\u003c/code> и \u003ccode>switch\u003c/code> или об отдельных классах.\u003c/li>\n\u003c/ol>\n\u003cp>Примеры из вашей симуляции и что с ними делать:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Было\u003c/th>\n\u003cth>Стало\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>5 одинаковых \u003ccode>OutlineInputBorder(...)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>OutlineInputBorder _border(Color c)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>3 копии пункта \u003ccode>_item(icon, label, ...)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>items.map(_item)\u003c/code> по списку данных\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Цвета кнопки передаются снаружи во всех местах\u003c/td>\n\u003ctd>\u003ccode>enum UiButtonKind\u003c/code> внутри компонента\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>fontSize: 16\u003c/code> в \u003ccode>copyWith\u003c/code> в десяти местах\u003c/td>\n\u003ctd>Стиль \u003ccode>bodyMedium\u003c/code> с нужным размером\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Logging()\u003c/code> создаётся в каждом виджете\u003c/td>\n\u003ctd>Один статический \u003ccode>AppLog\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Практика\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Нарисуйте слои и стрелки зависимостей для запроса «Список игр».\u003c/li>\n\u003cli>Выполните grep-проверку на своём проекте и исправьте нарушения.\u003c/li>\n\u003cli>Перепишите экран, где в \u003ccode>build\u003c/code> вызывается \u003ccode>http.get\u003c/code>, на схему Controller → UseCase → Repository.\u003c/li>\n\u003cli>Найдите три места дублирования в своём коде и устраните.\u003c/li>\n\u003cli>Объясните вслух SOLID на примере своего \u003ccode>AuthRepository\u003c/code>.\u003c/li>\n\u003c/ol>\n", "text": " Зачем архитектура Требование задания: «изменение бизнес-логики или представления одного экрана не должно повлечь изменений на других экранах» . Для этого код делится на слои, а слои зависят друг от друга только в одну сторону. Три слоя Presentation ---> Domain \u003c--- Data (экраны, state) (ядро) (API, БД, DTO) Слой Что внутри Что нельзя Domain Entities, UseCases, интерфейсы репозиториев, доменные ошибки Импортировать Flutter, http , DTO, виджеты Presentation Screens, Controller / ViewModel / Bloc, виджеты, мапперы Domain→UI Знать про DTO и реализацию репозитория Data Реализации репозиториев, DataSource (remote/local), DTO, мапперы DTO↔︎Entity Знать про экраны Критерии А: «Слой DOMAIN не содержит других слоёв», то же для PRESENTATION и DATA. Проверка простая: откройте импорты файлов слоя. domain не должен импортировать presentation и data . Пример структуры lib/ main.dart common/ # общее: константы, утилиты, DI di.dart constants.dart domain/ entities/ game.dart player.dart repositories/ game_repository.dart # abstract interface class usecases/ create_game.dart get_games.dart exceptions/ domain_exception.dart data/ dto/ game_dto.dart mappers/ game_mapper.dart # DTO \u003c-> Entity datasources/ game_remote_source.dart # через абстракцию сетевого слоя session_local_source.dart # SharedPreferences repositories/ game_repository_impl.dart presentation/ screens/ auth/ login_screen.dart login_controller.dart landing/ ... widgets/ Как слои общаются (на примере «Создать игру») // domain/entities/game.dart class Game { final String id; final String title; final DateTime startAt; const Game({required this.id, required this.title, required this.startAt}); } // domain/repositories/game_repository.dart abstract interface class GameRepository { Future\u003cGame> createGame({required String title, required DateTime startAt}); Future\u003cList\u003cGame>> getGames(); } // domain/usecases/create_game.dart class CreateGame { final GameRepository _repo; CreateGame(this._repo); Future\u003cGame> call({required String title, required DateTime startAt}) { if (startAt.isBefore(DateTime.now())) { throw const DomainException('Время начала в прошлом'); } return _repo.createGame(title: title, startAt: startAt); } } // data/repositories/game_repository_impl.dart class GameRepositoryImpl implements GameRepository { final GameRemoteSource _remote; GameRepositoryImpl(this._remote); @override Future\u003cGame> createGame({required String title, required DateTime startAt}) async { final dto = await _remote.create(title: title, startAt: startAt); return GameMapper.toEntity(dto); } ... } // presentation/screens/schedule/schedule_controller.dart class ScheduleController extends ChangeNotifier { final CreateGame _createGame; bool loading = false; String? error; ScheduleController(this._createGame); Future\u003cbool> publish(String title, DateTime startAt) async { loading = true; notifyListeners(); try { await _createGame(title: title, startAt: startAt); return true; } on DomainException catch (e) { error = e.message; return false; } finally { loading = false; notifyListeners(); } } } Управление состоянием Задание не требует конкретного пакета. Выбирайте то, что умеете быстро и безошибочно. Подход Плюсы Минусы ChangeNotifier + ListenableBuilder Не нужны пакеты Больше ручной работы GetX ( GetxController , Obx ) Быстро, DI и навигация в комплекте Легко смешать слои, нужно дисциплины Provider Просто и привычно Нужен пакет Bloc / Cubit Строгая структура, тестируемость Больше кода Состояние экрана удобно описывать sealed -классом: Loading , Data , Error . Внедрение зависимостей (DI) Контроллер получает зависимость через конструктор , а не создаёт сам. // common/di.dart: единственное место, где знают реализации final ApiClient api = HttpApiClient(baseUrl: Env.baseUrl); final GameRepository gameRepo = GameRepositoryImpl(GameRemoteSource(api)); final createGame = CreateGame(gameRepo); SOLID на примерах Принцип Нарушение Как правильно S Одна ответственность LoginScreen сам парсит JSON и ходит в сеть Экран → контроллер → UseCase → репозиторий O Открыто/закрыто if (type == 'primary') ... else if ... в кнопке Параметры/фабрики вариантов; новые варианты без правки базового кода L Подстановка Лисков SecondaryButton ломает поведение Button Наследники не меняют контракт I Разделение интерфейсов Один Api с 30 методами AuthApi , GameApi , ProfileApi D Инверсия зависимостей Экран создаёт http.Client() Зависеть от ApiClient (абстракция), реализацию подставляет DI DRY: что обычно дублируют Место Дублирование Решение UIKit Пять одинаковых OutlineInputBorder(...) Один приватный метод _border(Color) UIKit Три одинаковых пункта нижнего меню Список данных + map Стили fontSize: 16 повторяется в copyWith Добавить стиль в типографику Сеть try/catch в каждом запросе Один обработчик ошибок в клиенте Экраны Одинаковый показ SnackBar ошибки Один общий метод/виджет Константы URL и ключи в нескольких местах Один конфиг Что нужно уметь Нарисовать схему слоёв и показать направление зависимостей. Создать сущность, интерфейс репозитория, UseCase, реализацию и контроллер. Объяснить каждую букву SOLID на своём коде. Найти и убрать дублирование. Подробно: путь данных на примере кнопки «Войти» Проследим, что происходит от нажатия до ответа, и в каком слое живёт каждый шаг. Шаг Слой Что происходит 1 Presentation LoginScreen : нажатие кнопки, лог INFO, валидация формы 2 Presentation LoginController.login(email, password) включает loading 3 Domain LoginUseCase : правила («пароль не пустой»), вызывает AuthRepository (интерфейс) 4 Data AuthRepositoryImpl : вызывает AuthRemoteSource 5 Data AuthRemoteSource : вызывает AuthApi из сетевой библиотеки (через абстракцию) 6 Сетевая библиотека HttpApiClient : запрос на сервер, обработка ошибок 7 Data Ответ превращается из UserDto в User (маппер) 8 Domain→Presentation User возвращается контроллеру 9 Presentation Сохранение токена, переход на Landing; при ошибке SnackBar на 5 секунд Стрелки зависимостей: Presentation → Domain ← Data. Domain ничего не импортирует ни из Presentation, ни из Data. Подробно: как сделать, чтобы слои были «чистыми» Критерий: «Слой DOMAIN не содержит других слоёв» (1 балл за каждый слой в спринтах 3 и 4). Проверка за минуту: # в Domain не должно быть импортов Data, Presentation, flutter, http grep -rnE \"import .*(presentation|data|flutter|http)\" lib/domain # в Presentation не должно быть импортов Data grep -rn \"import .*data/\" lib/presentation # в Data не должно быть импортов Presentation grep -rn \"import .*presentation/\" lib/data Если нашли строки, исправьте: Нашли Как исправить Domain импортирует flutter Вынести виджет из Domain; в Domain только чистый Dart Presentation импортирует data Заменить на интерфейс из domain Data использует Controller Передавать результат через возвращаемое значение Общий код нужен всем В common (константы, утилиты, DI) Папка common разрешена заданием «для общих файлов», но не складывайте туда всё подряд: чем меньше в common , тем чище. Подробно: GetX и слои Вы знаете GetX, поэтому поместим его по слоям: Что Слой Пример GetxController Presentation LoginController Obx , GetBuilder Presentation в экранах Binding Presentation (или common/di ) Регистрация зависимостей для экрана Get.put , Get.find common/di и Binding Единственное место, которое знает про реализации Get.snackbar Presentation Ошибки Правила, чтобы не нарушить SOLID: Не вызывайте Get.find внутри UseCase/Repository : зависимости передавайте через конструктор. Контроллер получает UseCase , а не репозиторий и не http . В Domain не должно быть import 'package:get/get.dart' . class LoginBinding extends Bindings { @override void dependencies() { Get.lazyPut\u003cAuthRepository>(() => AuthRepositoryImpl(Get.find\u003cAuthRemoteSource>())); Get.lazyPut(() => LoginUseCase(Get.find\u003cAuthRepository>())); Get.lazyPut(() => LoginController(Get.find\u003cLoginUseCase>())); } } Подробно: DRY на практике — как искать дублирование Поиск копий: выделите кусок кода и поищите его по проекту (Ctrl+Shift+F). Если один и тот же блок встречается 2 раза и больше, вынесите в функцию, виджет или константу. Если куски отличаются парой значений, сделайте параметры. Если есть if/else по типу, который растёт, подумайте об enum и switch или об отдельных классах. Примеры из вашей симуляции и что с ними делать: Было Стало 5 одинаковых OutlineInputBorder(...) OutlineInputBorder _border(Color c) 3 копии пункта _item(icon, label, ...) items.map(_item) по списку данных Цвета кнопки передаются снаружи во всех местах enum UiButtonKind внутри компонента fontSize: 16 в copyWith в десяти местах Стиль bodyMedium с нужным размером Logging() создаётся в каждом виджете Один статический AppLog Практика Нарисуйте слои и стрелки зависимостей для запроса «Список игр». Выполните grep-проверку на своём проекте и исправьте нарушения. Перепишите экран, где в build вызывается http.get , на схему Controller → UseCase → Repository. Найдите три места дублирования в своём коде и устраните. Объясните вслух SOLID на примере своего AuthRepository . ", "hours": 5, "minutes": 7}, {"id": "docs-logging", "stage": 5, "title": "Комментарии и логи", "lead": "Требование модуля А, которое действует во всех спринтах. Без него вы теряете половину баллов почти везде.", "html": "\u003ch2>Почему это важно\u003c/h2>\n\u003cp>В таблице критериев почти у каждого пункта методика: \u003cstrong>«половина итоговой оценки, если отсутствуют комментарии и логирование согласно заданию»\u003c/strong>. То есть идеальная верстка без комментариев и логов даёт 50%.\u003c/p>\n\u003ch2>Что комментировать\u003c/h2>\n\u003cp>\u003cstrong>Для каждого класса верхнего уровня\u003c/strong> (виджет, контроллер, репозиторий): краткое описание, дата создания в формате \u003ccode>ДД-ММ-ГГГГ\u003c/code> и автор (номер участника).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Репозиторий для работы с API игр.\n// Отвечает только за получение и отправку данных об играх (SRP).\n// Дата создания: 11-11-2026\n// Автор создания: 7\nclass GameRepositoryImpl implements GameRepository { ... }\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>В вашей симуляции даты записаны как \u003ccode>15.10.2026\u003c/code>, а в задании требуется \u003ccode>ДД-ММ-ГГГГ\u003c/code>, то есть \u003cstrong>\u003ccode>15-10-2026\u003c/code>\u003c/strong>. Мелочь, но это один из пунктов проверки.\u003c/p>\n\u003c/div>\n\u003cp>\u003cstrong>Публичные методы:\u003c/strong> что делает, что принимает, что возвращает (кроме тривиальных геттеров/сеттеров).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Создаёт новую игру на сервере.\n// Принимает: название [title] и время начала [startAt].\n// Возвращает: созданную игру [Game].\nFuture&lt;Game&gt; createGame({required String title, required DateTime startAt}) async { ... }\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Сложные алгоритмы (больше 5 строк):\u003c/strong> строчные комментарии внутри метода к условиям, циклам и вычислениям.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>bool isSolved(List&lt;int&gt; order) {\n  // Идём по списку и проверяем, что каждый элемент на своём месте\n  for (var i = 0; i &lt; order.length; i++) {\n    if (order[i] != i) return false; // нашли неправильный — пазл не собран\n  }\n  return true;\n}\u003c/code>\u003c/pre>\n\u003ch2>Логирование: уровни\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Уровень\u003c/th>\n\u003cth>Для чего\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>DEBUG\u003c/strong>\u003c/td>\n\u003ctd>Технические данные для отладки\u003c/td>\n\u003ctd>Содержимое ответа, результат вычисления\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>INFO\u003c/strong>\u003c/td>\n\u003ctd>Ключевые события\u003c/td>\n\u003ctd>\u003ccode>initState\u003c/code>, запрос отправлен, пользователь вошёл\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>ERROR\u003c/strong>\u003c/td>\n\u003ctd>Сбои и исключения\u003c/td>\n\u003ctd>Таймаут, код 500, пойманное исключение\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Обязательные точки логирования\u003c/h2>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Жизненный цикл экранов\u003c/strong> — уровень INFO (\u003ccode>initState\u003c/code>, \u003ccode>dispose\u003c/code>, \u003ccode>AppLifecycleState\u003c/code>).\u003c/li>\n\u003cli>\u003cstrong>Сетевые запросы и БД\u003c/strong> — начало (INFO), успех (DEBUG), ошибка с типом (ERROR).\u003c/li>\n\u003cli>\u003cstrong>Нажатия на критические кнопки\u003c/strong> («Отправить форму», «Начать игру») — INFO.\u003c/li>\n\u003cli>\u003cstrong>Любой \u003ccode>try-catch\u003c/code>\u003c/strong> — запись ERROR с сообщением исключения.\u003c/li>\n\u003c/ol>\n\u003ch2>Формат сообщения\u003c/h2>\n\u003cpre>\u003ccode>[Тег_компонента]: Событие — Детали\n[AuthController]: Авторизация — Успех для пользователя user@mail.com\n[ApiRepository]: Ошибка — Не удалось получить список игр (код 500)\u003c/code>\u003c/pre>\n\u003ch2>Готовая обёртка над \u003ccode>logger\u003c/code>\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>import &#39;package:logger/logger.dart&#39;;\n\n// Единая точка логирования приложения.\n// Дата создания: 11-11-2026\n// Автор создания: 7\nclass AppLog {\n  static final Logger _log = Logger(printer: SimplePrinter());\n\n  // Формирует сообщение по формату задания: [Тег]: Событие — Детали\n  static String _fmt(String tag, String event, String details) =&gt; &#39;[$tag]: $event — $details&#39;;\n\n  static void debug(String tag, String event, String details) =&gt; _log.d(_fmt(tag, event, details));\n  static void info(String tag, String event, String details) =&gt; _log.i(_fmt(tag, event, details));\n  static void error(String tag, String event, String details, [Object? err, StackTrace? st]) =&gt;\n      _log.e(_fmt(tag, event, details), error: err, stackTrace: st);\n}\u003c/code>\u003c/pre>\n\u003cp>Использование:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;void&gt; _onLoginTap() async {\n  AppLog.info(&#39;LoginScreen&#39;, &#39;Нажатие&#39;, &#39;Кнопка «Войти»&#39;);\n  try {\n    AppLog.info(&#39;AuthController&#39;, &#39;Запрос&#39;, &#39;POST /login отправлен&#39;);\n    final user = await _login(email, password);\n    AppLog.debug(&#39;AuthController&#39;, &#39;Ответ&#39;, &#39;userId=${user.id}&#39;);\n  } catch (e, st) {\n    AppLog.error(&#39;AuthController&#39;, &#39;Ошибка&#39;, &#39;Вход не выполнен&#39;, e, st);\n  }\n}\u003c/code>\u003c/pre>\n\u003ch2>Типичные ошибки\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ошибка\u003c/th>\n\u003cth>Исправление\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Формат с дефисом вместо тире\u003c/td>\n\u003ctd>Используйте \u003ccode>—\u003c/code> как в задании\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Логи только в \u003ccode>initState\u003c/code> кнопки, а не в сетевых вызовах\u003c/td>\n\u003ctd>Добавьте три точки логов на каждый запрос\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>catch\u003c/code> без лога\u003c/td>\n\u003ctd>В каждый \u003ccode>catch\u003c/code> добавить \u003ccode>AppLog.error\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Комментарии только на английском/смесь\u003c/td>\n\u003ctd>Выберите один язык и держитесь его\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Лог на каждом \u003ccode>build\u003c/code>\u003c/td>\n\u003ctd>Шумит; логируйте события, а не перерисовку\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Написать шапку класса и описание метода по шаблону.\u003c/li>\n\u003cli>Подключить \u003ccode>logger\u003c/code> и использовать формат задания.\u003c/li>\n\u003cli>Расставить 4 обязательные точки логирования.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: шапки для разных типов файлов\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Тип файла\u003c/th>\n\u003cth>Что написать в шапке\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Экран (\u003ccode>*_screen.dart\u003c/code>)\u003c/td>\n\u003ctd>«Экран \u003cназвание>: \u003cчто показывает и какие действия доступны>»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Контроллер\u003c/td>\n\u003ctd>«Контроллер экрана \u003cназвание>: управляет состоянием и вызывает \u003cUseCase>»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>UseCase\u003c/td>\n\u003ctd>«Сценарий \u003cдействие>: \u003cправило>, вызывает \u003cрепозиторий>»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Репозиторий (интерфейс)\u003c/td>\n\u003ctd>«Контракт получения/отправки \u003cданных>»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Репозиторий (реализация)\u003c/td>\n\u003ctd>«Реализация \u003cКонтракта>: берёт данные из \u003cисточника>, преобразует в Entity»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>DTO\u003c/td>\n\u003ctd>«Модель ответа сервера для \u003cзапроса>»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Mapper\u003c/td>\n\u003ctd>«Преобразование \u003cDTO> в \u003cEntity> и обратно»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Виджет-компонент\u003c/td>\n\u003ctd>«Компонент \u003cназвание>: \u003cчто отображает>, состояния: ...»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Файл цветов/типографики\u003c/td>\n\u003ctd>«Единый источник цветов/текстовых стилей приложения»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>main.dart\u003c/code>\u003c/td>\n\u003ctd>«Точка входа: инициализация зависимостей и запуск приложения»\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Все шапки содержат ещё и \u003cstrong>дату \u003ccode>ДД-ММ-ГГГГ\u003c/code> и номер участника\u003c/strong>. Настройте в Android Studio \u003cstrong>Live Template\u003c/strong>, чтобы шапка вставлялась одной командой (Settings → Editor → Live Templates → Dart).\u003c/p>\n\u003ch2>Подробно: где ставить логи — таблица по слоям\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Место\u003c/th>\n\u003cth>Уровень\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>initState\u003c/code> экрана\u003c/td>\n\u003ctd>INFO\u003c/td>\n\u003ctd>\u003ccode>[LoginScreen]: Жизненный цикл — initState\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>dispose\u003c/code> экрана\u003c/td>\n\u003ctd>INFO\u003c/td>\n\u003ctd>\u003ccode>[LoginScreen]: Жизненный цикл — dispose\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>didChangeAppLifecycleState\u003c/code>\u003c/td>\n\u003ctd>INFO\u003c/td>\n\u003ctd>\u003ccode>[GameScreen]: Жизненный цикл — paused\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Нажатие критической кнопки\u003c/td>\n\u003ctd>INFO\u003c/td>\n\u003ctd>\u003ccode>[LoginScreen]: Нажатие — «Войти»\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Начало запроса\u003c/td>\n\u003ctd>INFO\u003c/td>\n\u003ctd>\u003ccode>[HttpApiClient]: Запрос — POST /auth/login\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Успешный ответ\u003c/td>\n\u003ctd>DEBUG\u003c/td>\n\u003ctd>\u003ccode>[HttpApiClient]: Ответ — 200 /auth/login\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Ошибка сети\u003c/td>\n\u003ctd>ERROR\u003c/td>\n\u003ctd>\u003ccode>[HttpApiClient]: Ошибка — Нет интернета: /games\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Работа с хранилищем (чтение/запись)\u003c/td>\n\u003ctd>INFO / DEBUG / ERROR\u003c/td>\n\u003ctd>\u003ccode>[SessionStorage]: Чтение — token найден\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>catch\u003c/code>\u003c/td>\n\u003ctd>ERROR\u003c/td>\n\u003ctd>Всегда, с сообщением исключения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Результат игры отправлен\u003c/td>\n\u003ctd>INFO\u003c/td>\n\u003ctd>\u003ccode>[ImageGame]: Результат — время 00:42\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Что считается «критической» кнопкой:\u003c/strong> отправка формы, начало игры, публикация игры, выход, подключение к игре, выбор фото. Остальные («назад», «показать пароль») логировать не обязательно, но можно.\u003c/p>\n\u003ch2>Подробно: как в команде договариваются о стиле комментариев\u003c/h2>\n\u003cp>На соревновании вы одна, но эксперту должно быть видно единообразие:\u003c/p>\n\u003cul>\n\u003cli>Один язык (русский) во всех комментариях.\u003c/li>\n\u003cli>Одинаковая структура шапки.\u003c/li>\n\u003cli>Комментарий отвечает на вопрос \u003cstrong>«зачем»\u003c/strong>, а не пересказывает код.\u003c/li>\n\u003c/ul>\n\u003cp>Плохо и хорошо:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// плохо: пересказ\ni++; // увеличиваем i на 1\n\n// хорошо: смысл\nmoves++; // считаем ход для статистики и метрики\u003c/code>\u003c/pre>\n\u003ch2>Практика: автопроверка комментариев и логов\u003c/h2>\n\u003cp>Скрипт, который находит файлы без шапки и места без логов:\u003c/p>\n\u003cpre class=\"bash\">\u003ccode># файлы без шапки\ngrep -rL &quot;Автор создания&quot; lib --include=*.dart\n\n# catch без AppLog.error рядом (грубая проверка)\ngrep -rn -A3 &quot;catch&quot; lib --include=*.dart | grep -L &quot;AppLog.error&quot; || true\n\n# забытые print\ngrep -rn &quot;print(&quot; lib --include=*.dart\n\n# файлы с неверным форматом даты (точки вместо дефисов)\ngrep -rnE &quot;Дата создания: [0-9]{2}\\.[0-9]{2}\\.[0-9]{4}&quot; lib\u003c/code>\u003c/pre>\n\u003cp>Запускайте проверку \u003cstrong>за 10 минут до конца каждого спринта\u003c/strong>. Для тренировки:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Добавьте шапки во все файлы своего UIKit.\u003c/li>\n\u003cli>Замените Logging на AppLog с форматом из задания.\u003c/li>\n\u003cli>Проверьте, что в каждом \u003ccode>try-catch\u003c/code> есть запись ERROR.\u003c/li>\n\u003c/ol>\n", "text": " Почему это важно В таблице критериев почти у каждого пункта методика: «половина итоговой оценки, если отсутствуют комментарии и логирование согласно заданию» . То есть идеальная верстка без комментариев и логов даёт 50%. Что комментировать Для каждого класса верхнего уровня (виджет, контроллер, репозиторий): краткое описание, дата создания в формате ДД-ММ-ГГГГ и автор (номер участника). // Репозиторий для работы с API игр. // Отвечает только за получение и отправку данных об играх (SRP). // Дата создания: 11-11-2026 // Автор создания: 7 class GameRepositoryImpl implements GameRepository { ... } В вашей симуляции даты записаны как 15.10.2026 , а в задании требуется ДД-ММ-ГГГГ , то есть 15-10-2026 . Мелочь, но это один из пунктов проверки. Публичные методы: что делает, что принимает, что возвращает (кроме тривиальных геттеров/сеттеров). // Создаёт новую игру на сервере. // Принимает: название [title] и время начала [startAt]. // Возвращает: созданную игру [Game]. Future\u003cGame> createGame({required String title, required DateTime startAt}) async { ... } Сложные алгоритмы (больше 5 строк): строчные комментарии внутри метода к условиям, циклам и вычислениям. bool isSolved(List\u003cint> order) { // Идём по списку и проверяем, что каждый элемент на своём месте for (var i = 0; i \u003c order.length; i++) { if (order[i] != i) return false; // нашли неправильный — пазл не собран } return true; } Логирование: уровни Уровень Для чего Пример DEBUG Технические данные для отладки Содержимое ответа, результат вычисления INFO Ключевые события initState , запрос отправлен, пользователь вошёл ERROR Сбои и исключения Таймаут, код 500, пойманное исключение Обязательные точки логирования Жизненный цикл экранов — уровень INFO ( initState , dispose , AppLifecycleState ). Сетевые запросы и БД — начало (INFO), успех (DEBUG), ошибка с типом (ERROR). Нажатия на критические кнопки («Отправить форму», «Начать игру») — INFO. Любой try-catch — запись ERROR с сообщением исключения. Формат сообщения [Тег_компонента]: Событие — Детали [AuthController]: Авторизация — Успех для пользователя user@mail.com [ApiRepository]: Ошибка — Не удалось получить список игр (код 500) Готовая обёртка над logger import 'package:logger/logger.dart'; // Единая точка логирования приложения. // Дата создания: 11-11-2026 // Автор создания: 7 class AppLog { static final Logger _log = Logger(printer: SimplePrinter()); // Формирует сообщение по формату задания: [Тег]: Событие — Детали static String _fmt(String tag, String event, String details) => '[$tag]: $event — $details'; static void debug(String tag, String event, String details) => _log.d(_fmt(tag, event, details)); static void info(String tag, String event, String details) => _log.i(_fmt(tag, event, details)); static void error(String tag, String event, String details, [Object? err, StackTrace? st]) => _log.e(_fmt(tag, event, details), error: err, stackTrace: st); } Использование: Future\u003cvoid> _onLoginTap() async { AppLog.info('LoginScreen', 'Нажатие', 'Кнопка «Войти»'); try { AppLog.info('AuthController', 'Запрос', 'POST /login отправлен'); final user = await _login(email, password); AppLog.debug('AuthController', 'Ответ', 'userId=${user.id}'); } catch (e, st) { AppLog.error('AuthController', 'Ошибка', 'Вход не выполнен', e, st); } } Типичные ошибки Ошибка Исправление Формат с дефисом вместо тире Используйте — как в задании Логи только в initState кнопки, а не в сетевых вызовах Добавьте три точки логов на каждый запрос catch без лога В каждый catch добавить AppLog.error Комментарии только на английском/смесь Выберите один язык и держитесь его Лог на каждом build Шумит; логируйте события, а не перерисовку Что нужно уметь Написать шапку класса и описание метода по шаблону. Подключить logger и использовать формат задания. Расставить 4 обязательные точки логирования. Подробно: шапки для разных типов файлов Тип файла Что написать в шапке Экран ( *_screen.dart ) «Экран : » Контроллер «Контроллер экрана : управляет состоянием и вызывает » UseCase «Сценарий : , вызывает » Репозиторий (интерфейс) «Контракт получения/отправки » Репозиторий (реализация) «Реализация : берёт данные из , преобразует в Entity» DTO «Модель ответа сервера для » Mapper «Преобразование в и обратно» Виджет-компонент «Компонент : , состояния: ...» Файл цветов/типографики «Единый источник цветов/текстовых стилей приложения» main.dart «Точка входа: инициализация зависимостей и запуск приложения» Все шапки содержат ещё и дату ДД-ММ-ГГГГ и номер участника . Настройте в Android Studio Live Template , чтобы шапка вставлялась одной командой (Settings → Editor → Live Templates → Dart). Подробно: где ставить логи — таблица по слоям Место Уровень Пример initState экрана INFO [LoginScreen]: Жизненный цикл — initState dispose экрана INFO [LoginScreen]: Жизненный цикл — dispose didChangeAppLifecycleState INFO [GameScreen]: Жизненный цикл — paused Нажатие критической кнопки INFO [LoginScreen]: Нажатие — «Войти» Начало запроса INFO [HttpApiClient]: Запрос — POST /auth/login Успешный ответ DEBUG [HttpApiClient]: Ответ — 200 /auth/login Ошибка сети ERROR [HttpApiClient]: Ошибка — Нет интернета: /games Работа с хранилищем (чтение/запись) INFO / DEBUG / ERROR [SessionStorage]: Чтение — token найден catch ERROR Всегда, с сообщением исключения Результат игры отправлен INFO [ImageGame]: Результат — время 00:42 Что считается «критической» кнопкой: отправка формы, начало игры, публикация игры, выход, подключение к игре, выбор фото. Остальные («назад», «показать пароль») логировать не обязательно, но можно. Подробно: как в команде договариваются о стиле комментариев На соревновании вы одна, но эксперту должно быть видно единообразие: Один язык (русский) во всех комментариях. Одинаковая структура шапки. Комментарий отвечает на вопрос «зачем» , а не пересказывает код. Плохо и хорошо: // плохо: пересказ i++; // увеличиваем i на 1 // хорошо: смысл moves++; // считаем ход для статистики и метрики Практика: автопроверка комментариев и логов Скрипт, который находит файлы без шапки и места без логов: # файлы без шапки grep -rL \"Автор создания\" lib --include=*.dart # catch без AppLog.error рядом (грубая проверка) grep -rn -A3 \"catch\" lib --include=*.dart | grep -L \"AppLog.error\" || true # забытые print grep -rn \"print(\" lib --include=*.dart # файлы с неверным форматом даты (точки вместо дефисов) grep -rnE \"Дата создания: [0-9]{2}\\.[0-9]{2}\\.[0-9]{4}\" lib Запускайте проверку за 10 минут до конца каждого спринта . Для тренировки: Добавьте шапки во все файлы своего UIKit. Замените Logging на AppLog с форматом из задания. Проверьте, что в каждом try-catch есть запись ERROR. ", "hours": 2, "minutes": 6}, {"id": "sprint1", "stage": 6, "title": "Спринт 1: UIKit и StoryBook", "lead": "1 ч 30 мин. Отдельная библиотека компонентов и приложение, в котором видны все состояния. Максимум 10,96 балла.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 30%\" />\n\u003ccol style=\"width: 40%\" />\n\u003ccol style=\"width: 30%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Часть\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003cth>Что проверяют\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Цвета как на макете\u003c/td>\n\u003ctd style=\"text-align: right;\">0,24\u003c/td>\n\u003ctd>−0,02 за каждый отсутствующий цвет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Типографика (тема)\u003c/td>\n\u003ctd style=\"text-align: right;\">0,32\u003c/td>\n\u003ctd>−0,02 за каждый отсутствующий стиль\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Поле ввода и все состояния\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003ctd>−0,15 за отсутствующий элемент; нет в StoryBook — половина\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Select + BottomSheet\u003c/td>\n\u003ctd style=\"text-align: right;\">0,90 + 0,30\u003c/td>\n\u003ctd>Тап по селекту открывает BottomSheet\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Кнопка со всеми состояниями\u003c/td>\n\u003ctd style=\"text-align: right;\">1,50\u003c/td>\n\u003ctd>−0,1 за каждый отсутствующий вариант\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Pagination\u003c/td>\n\u003ctd style=\"text-align: right;\">0,30\u003c/td>\n\u003ctd>Все состояния\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Карточка со всеми состояниями\u003c/td>\n\u003ctd style=\"text-align: right;\">1,50\u003c/td>\n\u003ctd>−0,3 за отсутствующий вариант\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Bottom Bar\u003c/td>\n\u003ctd style=\"text-align: right;\">0,80\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Timer\u003c/td>\n\u003ctd style=\"text-align: right;\">0,60\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Checkbox\u003c/td>\n\u003ctd style=\"text-align: right;\">0,80\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Все компоненты адаптивны\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003ctd>−0,15 за каждый неадаптивный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектура: DRY, отдельная библиотека\u003c/td>\n\u003ctd style=\"text-align: right;\">0,50 + 0,50\u003c/td>\n\u003ctd>Половина, если нет комментариев и логов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Git: ветка, проект в ветке, merge\u003c/td>\n\u003ctd style=\"text-align: right;\">0,30\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"warn\">\n\u003cp>Три общих правила в критериях: \u003cstrong>нет библиотеки — ничего не проверяется\u003c/strong>; \u003cstrong>нет компонента в StoryBook — половина баллов\u003c/strong>; \u003cstrong>нет комментариев и логов — половина баллов\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003ch2>Порядок работы (план на 90 минут)\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Минуты\u003c/th>\n\u003cth>Действие\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>0–5\u003c/td>\n\u003ctd>Создать репозиторий и ветку \u003ccode>sprint-1\u003c/code>, создать Flutter-пакет, переместить карточки в «В работе» (не более 2)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>5–20\u003c/td>\n\u003ctd>Цвета, типографика, шрифты, логгер, \u003ccode>uikit.dart\u003c/code> с экспортами\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>20–55\u003c/td>\n\u003ctd>Поле, кнопка, чекбокс, карточка, bottom bar — самые дорогие\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>55–70\u003c/td>\n\u003ctd>Select + BottomSheet, Pagination, Timer\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>70–85\u003c/td>\n\u003ctd>StoryBook: все компоненты и все состояния\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>85–90\u003c/td>\n\u003ctd>Тег \u003ccode>v1.0.0\u003c/code>, push, PR, merge, перенос карточек с коммитами\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Создание библиотеки\u003c/h2>\n\u003cpre class=\"bash\">\u003ccode>flutter create --template=package uikit\ncd uikit &amp;&amp; git init\u003c/code>\u003c/pre>\n\u003cp>Структура с настоящей инкапсуляцией:\u003c/p>\n\u003cpre>\u003ccode>uikit/\n  lib/\n    uikit.dart                 # единственный публичный файл, только export\n    src/\n      theme/\n        colors.dart\n        typography.dart\n      components/\n        ui_button.dart\n        ui_text_field.dart\n        ui_select.dart\n        ...\n      core/\n        logger.dart\n        scale.dart\n  assets/ icons...\n  fonts/ Manrope-*.ttf\n  pubspec.yaml\n  CHANGELOG.md  README.md\u003c/code>\u003c/pre>\n\u003cpre class=\"dart\">\u003ccode>// lib/uikit.dart\nlibrary;\n\nexport &#39;src/theme/colors.dart&#39;;\nexport &#39;src/theme/typography.dart&#39;;\nexport &#39;src/components/ui_button.dart&#39;;\nexport &#39;src/components/ui_text_field.dart&#39;;\nexport &#39;src/components/ui_select.dart&#39;;\nexport &#39;src/components/ui_checkbox.dart&#39;;\n// ... всё, что должно быть доступно приложению\u003c/code>\u003c/pre>\n\u003cp>Приложение подключает \u003ccode>import 'package:uikit/uikit.dart';\u003c/code> и больше ничего. Это и есть \u003cstrong>инкапсуляция\u003c/strong>: «внутренняя реализация скрыта, наружу доступен только чётко определённый API».\u003c/p>\n\u003ch2>Шрифты и ресурсы внутри пакета\u003c/h2>\n\u003cpre class=\"yaml\">\u003ccode># pubspec.yaml библиотеки\nflutter:\n  assets:\n    - assets/\n  fonts:\n    - family: Manrope\n      fonts:\n        - asset: fonts/Manrope-Regular.ttf\n          weight: 400\n        - asset: fonts/Manrope-SemiBold.ttf\n          weight: 600\n        - asset: fonts/Manrope-Bold.ttf\n          weight: 700\n        - asset: fonts/Manrope-ExtraBold.ttf\n          weight: 800\u003c/code>\u003c/pre>\n\u003cp>В стиле указывайте пакет, тогда приложению не нужно дублировать шрифты в своём \u003ccode>pubspec.yaml\u003c/code>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>const TextStyle screenHeader = TextStyle(\n  fontFamily: &#39;Manrope&#39;,\n  package: &#39;uikit&#39;,\n  fontWeight: FontWeight.w700,\n  fontSize: 24,\n  height: 32 / 24,\n  letterSpacing: -0.48,\n);\u003c/code>\u003c/pre>\n\u003cp>Иконки из пакета: \u003ccode>Image.asset('assets/eye.png', package: 'uikit')\u003c/code>.\u003c/p>\n\u003ch2>Цвета и типографика\u003c/h2>\n\u003cp>Единый источник истины (DRY): цвета и стили определены один раз.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;package:flutter/painting.dart&#39;;\n\nabstract final class UiColors {\n  static const primary = Color(0xFF00C853);\n  static const onPrimary = Color(0xFFFFFFFF);\n  static const error = Color(0xFFBA1A1A);\n  static const border = Color(0xFFC3C6D7);\n  static const surface = Color(0xFFFAF8FF);\n  static const text = Color(0xFF191B23);\n}\u003c/code>\u003c/pre>\n\u003cp>Проверьте: в StoryBook должна быть страница «Цвета» (квадраты с названиями \u003cstrong>всех\u003c/strong> цветов макета) и «Типографика» (каждый стиль с подписью размера и начертания).\u003c/p>\n\u003ch2>Кнопка: варианты и состояния\u003c/h2>\n\u003cp>Один класс, варианты через enum (O из SOLID и фабрики из DRY):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Универсальная кнопка библиотеки. Отвечает только за отображение и нажатие.\n// Дата создания: 11-11-2026\n// Автор создания: 7\nenum UiButtonKind { primary, secondary, destructive }\n\nclass UiButton extends StatelessWidget {\n  final String text;\n  final UiButtonKind kind;\n  final bool isLoading;\n  final VoidCallback? onPressed; // null = кнопка отключена\n\n  const UiButton({\n    super.key,\n    required this.text,\n    this.kind = UiButtonKind.primary,\n    this.isLoading = false,\n    this.onPressed,\n  });\n\n  const UiButton.secondary({super.key, required this.text, this.isLoading = false, this.onPressed})\n      : kind = UiButtonKind.secondary;\n\n  bool get _enabled =&gt; onPressed != null &amp;&amp; !isLoading;\n\n  @override\n  Widget build(BuildContext context) {\n    final (bg, fg, border) = switch (kind) {\n      UiButtonKind.primary =&gt; (UiColors.primary, UiColors.onPrimary, UiColors.primary),\n      UiButtonKind.secondary =&gt; (UiColors.onPrimary, UiColors.primary, UiColors.primary),\n      UiButtonKind.destructive =&gt; (UiColors.error, UiColors.onPrimary, UiColors.error),\n    };\n    return Opacity(\n      opacity: _enabled ? 1 : 0.4, // состояние disabled\n      child: Material(\n        color: bg,\n        shape: RoundedRectangleBorder(\n          borderRadius: BorderRadius.circular(8),\n          side: BorderSide(color: border, width: 2),\n        ),\n        child: InkWell( // состояние pressed: ripple-эффект\n          borderRadius: BorderRadius.circular(8),\n          onTap: _enabled\n              ? () {\n                  UiLog.info(&#39;UiButton&#39;, &#39;Нажатие&#39;, text);\n                  onPressed!();\n                }\n              : null,\n          child: ConstrainedBox(\n            constraints: const BoxConstraints(minHeight: 48, minWidth: double.infinity),\n            child: Center(\n              child: isLoading\n                  ? SizedBox(width: 20, height: 20,\n                      child: CircularProgressIndicator(strokeWidth: 2, color: fg))\n                  : Text(text, style: bodyMedium.copyWith(color: fg)),\n            ),\n          ),\n        ),\n      ),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Кнопка тянется на ширину родителя (\u003ccode>minWidth: double.infinity\u003c/code>), поэтому на разных экранах не «плавает». Нужна половина ширины — оберните в \u003ccode>Expanded\u003c/code> или \u003ccode>SizedBox\u003c/code>.\u003c/p>\n\u003ch2>Поле ввода\u003c/h2>\n\u003cp>Варианты: обычное, в фокусе, с ошибкой, отключённое, пароль (с глазом), поиск (с иконкой).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class UiTextField extends StatefulWidget {\n  final String label, hint;\n  final String? errorText;\n  final bool enabled;\n  final UiTextFieldType type;           // normal | password | search\n  final TextEditingController? controller;\n  final ValueChanged&lt;String&gt;? onChanged;\n  const UiTextField({super.key, required this.label, required this.hint,\n    this.errorText, this.enabled = true, this.type = UiTextFieldType.normal,\n    this.controller, this.onChanged});\n  @override\n  State&lt;UiTextField&gt; createState() =&gt; _UiTextFieldState();\n}\n\nclass _UiTextFieldState extends State&lt;UiTextField&gt; {\n  final _focus = FocusNode();\n  bool _hidden = true;\n\n  @override\n  void initState() { super.initState(); _focus.addListener(() =&gt; setState(() {})); }\n  @override\n  void dispose() { _focus.dispose(); super.dispose(); }\n\n  // Один метод создаёт рамку для любого состояния (DRY: вместо пяти копий)\n  OutlineInputBorder _border(Color c) =&gt; OutlineInputBorder(\n        borderSide: BorderSide(color: c, width: 1),\n        borderRadius: BorderRadius.circular(8),\n      );\n\n  @override\n  Widget build(BuildContext context) {\n    final hasError = widget.errorText != null;\n    final color = hasError ? UiColors.error : _focus.hasFocus ? UiColors.primary : UiColors.border;\n    return Column(\n      crossAxisAlignment: CrossAxisAlignment.start,\n      children: [\n        Text(widget.label, style: fieldLabel.copyWith(color: color)),\n        const SizedBox(height: 4),\n        TextField(\n          focusNode: _focus,\n          enabled: widget.enabled,\n          controller: widget.controller,\n          onChanged: widget.onChanged,\n          obscureText: widget.type == UiTextFieldType.password &amp;&amp; _hidden,\n          decoration: InputDecoration(\n            filled: true, fillColor: UiColors.surface,\n            hintText: widget.hint,\n            errorText: widget.errorText,\n            enabledBorder: _border(color), focusedBorder: _border(color),\n            disabledBorder: _border(UiColors.border),\n            errorBorder: _border(UiColors.error), focusedErrorBorder: _border(UiColors.error),\n            suffixIcon: widget.type == UiTextFieldType.password\n                ? IconButton(\n                    icon: Icon(_hidden ? Icons.visibility_off : Icons.visibility),\n                    onPressed: () =&gt; setState(() =&gt; _hidden = !_hidden))\n                : null,\n          ),\n        ),\n      ],\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>В StoryBook показывайте \u003cstrong>настоящее\u003c/strong> состояние фокуса (поле с \u003ccode>autofocus\u003c/code> или принудительный \u003ccode>FocusNode.requestFocus()\u003c/code>), а не раскрашенную имитацию.\u003c/p>\n\u003ch2>Select и BottomSheet\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class UiSelect&lt;T&gt; extends StatelessWidget {\n  final String label, hint;\n  final T? value;\n  final List&lt;T&gt; options;\n  final String Function(T) titleOf;\n  final ValueChanged&lt;T&gt; onChanged;\n  const UiSelect({super.key, required this.label, required this.hint, required this.value,\n    required this.options, required this.titleOf, required this.onChanged});\n\n  @override\n  Widget build(BuildContext context) {\n    return GestureDetector(\n      behavior: HitTestBehavior.opaque,\n      onTap: () async {\n        final picked = await showModalBottomSheet&lt;T&gt;(\n          context: context,\n          builder: (_) =&gt; UiBottomSheet&lt;T&gt;(options: options, titleOf: titleOf, selected: value),\n        );\n        if (picked != null) onChanged(picked);\n      },\n      child: InputDecorator(\n        decoration: InputDecoration(labelText: label, suffixIcon: const Icon(Icons.keyboard_arrow_down)),\n        child: Text(value == null ? hint : titleOf(value as T)),\n      ),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>UiBottomSheet\u003c/code> — отдельный публичный компонент (в таблице он отдельная строка 0,3 балла): заголовок, список вариантов, отметка выбранного.\u003c/p>\n\u003ch2>Pagination, Timer, Card, Bottom Bar\u003c/h2>\n\u003cp>\u003cstrong>Pagination\u003c/strong> — точки приветственных экранов. Активная шире остальных:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class UiPagination extends StatelessWidget {\n  final int count, current;\n  const UiPagination({super.key, required this.count, required this.current});\n  @override\n  Widget build(BuildContext context) =&gt; Row(\n        mainAxisSize: MainAxisSize.min,\n        children: List.generate(count, (i) =&gt; AnimatedContainer(\n              duration: const Duration(milliseconds: 200),\n              margin: const EdgeInsets.symmetric(horizontal: 3),\n              width: i == current ? 24 : 8, height: 8,\n              decoration: BoxDecoration(\n                color: i == current ? UiColors.primary : UiColors.border,\n                borderRadius: BorderRadius.circular(4)),\n            )),\n      );\n}\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Timer\u003c/strong> — компонент \u003cem>отображает\u003c/em> время, а считает его тот, кто его использует (SRP). Принимает \u003ccode>Duration\u003c/code> и форматирует \u003ccode>мм:сс\u003c/code>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>String formatDuration(Duration d) {\n  final m = d.inMinutes.remainder(60).toString().padLeft(2, &#39;0&#39;);\n  final s = d.inSeconds.remainder(60).toString().padLeft(2, &#39;0&#39;);\n  return &#39;$m:$s&#39;;\n}\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Card\u003c/strong> — состояния: обычная, выбранная, неактивная; контент передаётся параметрами (\u003ccode>title\u003c/code>, \u003ccode>subtitle\u003c/code>, \u003ccode>leading\u003c/code>, \u003ccode>trailing\u003c/code>, \u003ccode>onTap\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Bottom Bar\u003c/strong> — список данных, а не три копии кода; центральная кнопка выделена (по ней открывается Schedule Game):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class UiBottomBarItem {\n  final String label;\n  final String iconAsset;\n  const UiBottomBarItem(this.label, this.iconAsset);\n}\n// в виджете: items.asMap().entries.map((e) =&gt; _Tab(...)).toList()\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Checkbox\u003c/strong> — состояния: выкл, вкл, отключён (с отметкой и без).\u003c/p>\n\u003ch2>StoryBook\u003c/h2>\n\u003cp>Приложение подключает библиотеку из Git по тегу и содержит \u003cstrong>одну страницу на компонент\u003c/strong> (или один длинный экран с заголовками), где видны \u003cstrong>все\u003c/strong> состояния.\u003c/p>\n\u003cpre class=\"yaml\">\u003ccode>dependencies:\n  uikit:\n    git:\n      url: https://github.com/&lt;логин&gt;/uikit.git\n      ref: v1.0.0\u003c/code>\u003c/pre>\n\u003cpre class=\"dart\">\u003ccode>import &#39;package:uikit/uikit.dart&#39;;   // только один импорт\n\nclass ButtonsPage extends StatelessWidget {\n  const ButtonsPage({super.key});\n  @override\n  Widget build(BuildContext context) =&gt; Padding(\n        padding: const EdgeInsets.all(20),\n        child: Column(spacing: 16, children: [\n          UiButton(text: &#39;Primary&#39;, onPressed: () {}),\n          const UiButton(text: &#39;Primary disabled&#39;),\n          UiButton.secondary(text: &#39;Secondary&#39;, onPressed: () {}),\n          UiButton(text: &#39;Destructive&#39;, kind: UiButtonKind.destructive, onPressed: () {}),\n          UiButton(text: &#39;Loading&#39;, isLoading: true, onPressed: () {}),\n        ]),\n      );\n}\u003c/code>\u003c/pre>\n\u003ch2>Разбор вашей симуляции (6,39 из 10,51)\u003c/h2>\n\u003cp>Я прочитал оба репозитория. Это \u003cstrong>вероятные\u003c/strong> причины потерь по коду; точные баллы по пунктам видите только вы по протоколу.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 25%\" />\n\u003ccol style=\"width: 25%\" />\n\u003ccol style=\"width: 25%\" />\n\u003ccol style=\"width: 25%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>#\u003c/th>\n\u003cth>Что вижу в коде\u003c/th>\n\u003cth>Вероятный эффект\u003c/th>\n\u003cth>Что делать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ccode>lib/uikit.dart\u003c/code> экспортирует только цвета, типографику и логи. Компоненты \u003cstrong>не экспортируются\u003c/strong>; StoryBook импортирует \u003ccode>package:uikit/components/custom_button.dart\u003c/code> напрямую\u003c/td>\n\u003ctd>Нарушена инкапсуляция («наружу — чётко определённый API»)\u003c/td>\n\u003ctd>Папка \u003ccode>src/\u003c/code>, все публичные классы в \u003ccode>uikit.dart\u003c/code>, в приложении один импорт\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>2\u003c/td>\n\u003ctd>Иконки подключены как \u003ccode>Image.asset('assets/eye.png')\u003c/code> без \u003ccode>package: 'uikit'\u003c/code>. В \u003ccode>storybook/assets\u003c/code> лежит только \u003ccode>ava.jpg\u003c/code>\u003c/td>\n\u003ctd>Иконки не найдутся (ошибка ассета), компоненты ломаются\u003c/td>\n\u003ctd>Всегда \u003ccode>package: 'uikit'\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>3\u003c/td>\n\u003ctd>В \u003ccode>pubspec.yaml\u003c/code> вес \u003ccode>800\u003c/code> указывает на \u003ccode>Manrope-ExtraLight.ttf\u003c/code> (файл \u003ccode>ExtraBold\u003c/code> лежит рядом, но не подключён)\u003c/td>\n\u003ctd>Неверное начертание, минус за типографику\u003c/td>\n\u003ctd>Исправить на \u003ccode>ExtraBold\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>4\u003c/td>\n\u003ctd>Даты в шапках \u003ccode>15.10.2026\u003c/code>\u003c/td>\n\u003ctd>Формат по заданию \u003ccode>ДД-ММ-ГГГГ\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>15-10-2026\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>5\u003c/td>\n\u003ctd>Размеры вида \u003ccode>width: 350.fw\u003c/code>, \u003ccode>SizedBox(height: 109.fh)\u003c/code> в самих компонентах и в StoryBook\u003c/td>\n\u003ctd>Критерий «Все компоненты адаптивны» (1,2 балла)\u003c/td>\n\u003ctd>Ширина от родителя; числа Figma — для отступов и радиусов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>6\u003c/td>\n\u003ctd>Кнопка получает \u003ccode>fillColor\u003c/code>, \u003ccode>borderColor\u003c/code>, \u003ccode>textColor\u003c/code> снаружи; в StoryBook цвета перечислены вручную в каждой кнопке\u003c/td>\n\u003ctd>DRY / OCP, «кнопка со всеми состояниями» не инкапсулирована\u003c/td>\n\u003ctd>Enum вариантов (\u003ccode>primary / secondary / destructive\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>7\u003c/td>\n\u003ctd>В \u003ccode>CustomTextField\u003c/code> пять одинаковых \u003ccode>OutlineInputBorder\u003c/code>; в \u003ccode>CustomBottomBar\u003c/code> три копии пункта\u003c/td>\n\u003ctd>DRY (0,5 балла)\u003c/td>\n\u003ctd>Метод \u003ccode>_border(color)\u003c/code>, список пунктов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>8\u003c/td>\n\u003ctd>Состояние поля («focused», «error») передаётся параметром, а не берётся из фокуса\u003c/td>\n\u003ctd>«Все состояния» могут считаться имитацией\u003c/td>\n\u003ctd>\u003ccode>FocusNode\u003c/code> и \u003ccode>errorText\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>9\u003c/td>\n\u003ctd>Нет Select/BottomSheet, Pagination, карточки, Timer; в зависимостях есть \u003ccode>modal_bottom_sheet\u003c/code>, но не используется\u003c/td>\n\u003ctd>В реальном КЗ это около 4 баллов (0,9+0,3+0,3+1,5+0,6)\u003c/td>\n\u003ctd>Тренировать эти компоненты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>10\u003c/td>\n\u003ctd>Один коммит в каждом репозитории, одна ветка \u003ccode>main\u003c/code>; тегов нет\u003c/td>\n\u003ctd>Критерии Г (ветка спринта, merge) и «независимое версионирование»\u003c/td>\n\u003ctd>Ветка \u003ccode>sprint-1\u003c/code>, PR, тег \u003ccode>v1.0.0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>11\u003c/td>\n\u003ctd>\u003ccode>README.md\u003c/code> и \u003ccode>CHANGELOG.md\u003c/code> — шаблонные \u003ccode>TODO\u003c/code>\u003c/td>\n\u003ctd>Мелкие потери по документации\u003c/td>\n\u003ctd>Пара строк о компонентах и версии\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>12\u003c/td>\n\u003ctd>Лог в каждом \u003ccode>initState\u003c/code> и \u003ccode>dispose\u003c/code> для кнопки: в UIKit это допустимо, но \u003ccode>Logging()\u003c/code> создаётся заново каждый раз; ошибка \u003ccode>error()\u003c/code> не используется нигде\u003c/td>\n\u003ctd>Минор\u003c/td>\n\u003ctd>Один синглтон, лог ERROR в \u003ccode>catch\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"tip\">\n\u003cp>Если в вашей симуляции был другой набор компонентов (HR Design System: appbar, avatar, textarea, progress bar), это нормально. Важно, что в реальном КЗ набор другой: Select, BottomSheet, Pagination, Card, Timer, Bottom Bar, Checkbox, Input, Button.\u003c/p>\n\u003c/div>\n\u003ch2>Чек-лист перед сдачей спринта 1\u003c/h2>\n\u003cul class=\"task-list\">\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Репозиторий \u003ccode>uikit\u003c/code> отдельный, ветка \u003ccode>sprint-1\u003c/code>, смёржена в \u003ccode>main\u003c/code>, тег \u003ccode>v1.0.0\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />\u003ccode>lib/uikit.dart\u003c/code> экспортирует все компоненты, \u003ccode>src/\u003c/code> приватен.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Ресурсы с \u003ccode>package: 'uikit'\u003c/code>, шрифты подключены правильными файлами.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Цвета и типографика: \u003cstrong>все\u003c/strong> из макета, с именами.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />В StoryBook: каждый компонент во всех состояниях.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />На узком (360 dp) и широком (430 dp) экране нет переполнений.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Шапка у каждого класса, описания публичных методов, логи с форматом \u003ccode>[Тег]: Событие — Детали\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Карточки перенесены в «Готово к тестированию» с хэшами коммитов.\u003c/label>\u003c/li>\n\u003c/ul>\n\u003ch2>Максимальный балл: критерий за критерием\u003c/h2>\n\u003cp>Это таблица «что смотрит эксперт → что вам сделать → как проверить себя». Идите по ней сверху вниз.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Критерий (макс.)\u003c/th>\n\u003cth>Что сделать точно\u003c/th>\n\u003cth>Проверка перед сдачей\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Библиотека UIKit в отдельном проекте (0,5)\u003c/td>\n\u003ctd>Отдельный репозиторий, \u003ccode>pubspec.yaml\u003c/code> с именем \u003ccode>uikit\u003c/code>\u003c/td>\n\u003ctd>Репозиторий открывается сам по себе, не внутри приложения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>DRY (0,5)\u003c/td>\n\u003ctd>Цвета, стили, рамки, пункты меню — в одном месте\u003c/td>\n\u003ctd>Нет двух одинаковых кусков кода\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Цвета (0,24)\u003c/td>\n\u003ctd>Все цвета макета как константы с именами, \u003cstrong>ни одного пропущенного\u003c/strong> (−0,02 за каждый)\u003c/td>\n\u003ctd>Сравнить палитру Figma с \u003ccode>colors.dart\u003c/code> по списку\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Типографика (0,32)\u003c/td>\n\u003ctd>Все текстовые стили макета (размер, начертание, высота строки, межбуквенный интервал)\u003c/td>\n\u003ctd>Каждый стиль есть в StoryBook с подписью\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Поле ввода (1,2)\u003c/td>\n\u003ctd>Состояния: default, focused, filled, error, disabled; типы: обычное, пароль, поиск; всё как в макете\u003c/td>\n\u003ctd>−0,15 за каждый отсутствующий элемент; нет в StoryBook — половина\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Select (0,9) + BottomSheet (0,3)\u003c/td>\n\u003ctd>Тап по полю открывает панель снизу с вариантами, выбранное значение отображается\u003c/td>\n\u003ctd>Работает кликом в StoryBook\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Кнопка (1,5)\u003c/td>\n\u003ctd>Все варианты и состояния макета (primary, secondary, destructive; default, pressed, disabled, loading)\u003c/td>\n\u003ctd>−0,1 за каждый отсутствующий\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Pagination (0,3)\u003c/td>\n\u003ctd>Точки с активной, все состояния\u003c/td>\n\u003ctd>Видно в StoryBook\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Карточка (1,5)\u003c/td>\n\u003ctd>Все варианты и состояния макета\u003c/td>\n\u003ctd>−0,3 за каждый отсутствующий\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Bottom Bar (0,8)\u003c/td>\n\u003ctd>Все пункты, активный пункт, центральная кнопка\u003c/td>\n\u003ctd>Видно в StoryBook\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Timer (0,6)\u003c/td>\n\u003ctd>Отображение времени по макету, формат \u003ccode>мм:сс\u003c/code>\u003c/td>\n\u003ctd>Показан в разных значениях\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Checkbox (0,8)\u003c/td>\n\u003ctd>Выкл, вкл, отключён (с отметкой и без)\u003c/td>\n\u003ctd>Нажимается\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Все компоненты адаптивны (1,2)\u003c/td>\n\u003ctd>Ширина от родителя, нет жёстких размеров экрана\u003c/td>\n\u003ctd>Открыть StoryBook на узком и широком эмуляторе\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Комментарии и логи\u003c/td>\n\u003ctd>Шапка у каждого класса, описания методов, логи \u003ccode>[Тег]: Событие — Детали\u003c/code>\u003c/td>\n\u003ctd>Скрипт из раздела «Комментарии и логи»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Git (0,3)\u003c/td>\n\u003ctd>Ветка \u003ccode>sprint-1\u003c/code>, проект сохранён, PR смёржен\u003c/td>\n\u003ctd>Ветка и PR видны в репозитории\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"warn\">\n\u003cp>\u003cstrong>Три «множителя» ×0,5:\u003c/strong> нет компонента в StoryBook, нет комментариев и логов, нет библиотеки. Проверьте их в первую очередь.\u003c/p>\n\u003c/div>\n\u003ch2>Подробно: как организовать StoryBook\u003c/h2>\n\u003cp>Эксперт открывает StoryBook на телефоне и должен быстро найти каждый компонент.\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Главная страница\u003c/strong> — список разделов: «Цвета», «Типографика», «Кнопки», «Поля», «Select», «Checkbox», «Pagination», «Карточки», «Bottom Bar», «Timer».\u003c/li>\n\u003cli>\u003cstrong>Страница раздела\u003c/strong> — заголовок и все состояния друг под другом, у каждого подпись («Primary / Disabled»).\u003c/li>\n\u003cli>Интерактивность: Select открывает BottomSheet, Checkbox переключается, Timer запускается, Pagination листается кнопками.\u003c/li>\n\u003cli>Один импорт \u003ccode>package:uikit/uikit.dart\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cpre class=\"dart\">\u003ccode>class StoryBookHome extends StatelessWidget {\n  const StoryBookHome({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    final sections = &lt;(String, Widget)&gt;[\n      (&#39;Цвета&#39;, const ColorsPage()),\n      (&#39;Типографика&#39;, const TypographyPage()),\n      (&#39;Кнопки&#39;, const ButtonsPage()),\n      (&#39;Поля ввода&#39;, const InputsPage()),\n      (&#39;Select&#39;, const SelectPage()),\n      (&#39;Checkbox&#39;, const CheckboxPage()),\n      (&#39;Pagination&#39;, const PaginationPage()),\n      (&#39;Карточки&#39;, const CardsPage()),\n      (&#39;Bottom Bar&#39;, const BottomBarPage()),\n      (&#39;Timer&#39;, const TimerPage()),\n    ];\n    return Scaffold(\n      appBar: AppBar(title: const Text(&#39;StoryBook&#39;)),\n      body: ListView(\n        children: [\n          for (final (title, page) in sections)\n            ListTile(\n              title: Text(title),\n              trailing: const Icon(Icons.chevron_right),\n              onTap: () =&gt; Navigator.push(context, MaterialPageRoute(builder: (_) =&gt; page)),\n            ),\n        ],\n      ),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Для обёртки раздела сделайте один общий виджет \u003ccode>StorySection(title, children)\u003c/code>, чтобы не дублировать оформление (DRY).\u003c/p>\n\u003ch2>Подробно: Timer как компонент\u003c/h2>\n\u003cp>В задании Timer — компонент интерфейса: плашка с временем. Продумайте: что он \u003cstrong>отображает\u003c/strong>, а что \u003cstrong>считает\u003c/strong>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Отображение таймера (без собственной логики отсчёта: SRP)\nclass UiTimer extends StatelessWidget {\n  final Duration time;\n  const UiTimer({super.key, required this.time});\n\n  @override\n  Widget build(BuildContext context) {\n    final m = time.inMinutes.remainder(60).toString().padLeft(2, &#39;0&#39;);\n    final s = time.inSeconds.remainder(60).toString().padLeft(2, &#39;0&#39;);\n    return Container(\n      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),\n      decoration: BoxDecoration(color: UiColors.surface, borderRadius: BorderRadius.circular(8)),\n      child: Text(&#39;$m:$s&#39;, style: subheader.copyWith(fontFeatures: const [FontFeature.tabularFigures()])),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>В StoryBook покажите его с живым отсчётом (\u003ccode>Timer.periodic\u003c/code> в \u003ccode>StatefulWidget\u003c/code> страницы) и с разными значениями (00:00, 01:30, 59:59).\u003c/p>\n\u003ch2>Подробно: как не потерять баллы на мелочах\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Названия\u003c/strong> цветов и стилей совпадают с макетом: \u003ccode>primary\u003c/code>, \u003ccode>secondary\u003c/code>, \u003ccode>screenHeader\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Состояние disabled\u003c/strong> должно быть видно визуально (прозрачность) и не реагировать на нажатие.\u003c/li>\n\u003cli>\u003cstrong>Нажатие\u003c/strong> в StoryBook логируется (\u003ccode>AppLog.info\u003c/code>): так эксперт увидит логи в консоли.\u003c/li>\n\u003cli>\u003cstrong>Пакеты\u003c/strong>: в \u003ccode>pubspec.yaml\u003c/code> UIKit только то, что реально нужно.\u003c/li>\n\u003cli>\u003cstrong>README\u003c/strong> библиотеки: 5–7 строк про компоненты и пример подключения.\u003c/li>\n\u003cli>\u003cstrong>CHANGELOG\u003c/strong>: \u003ccode>## 1.0.0\u003c/code> и список компонентов.\u003c/li>\n\u003cli>\u003cstrong>Тег\u003c/strong> \u003ccode>v1.0.0\u003c/code> после merge.\u003c/li>\n\u003c/ul>\n\u003ch2>Репетиция спринта 1\u003c/h2>\n\u003cp>Выполните за 90 минут с секундомером во вкладке «Симуляция». Для каждого компонента заведите заметку, если что-то не получилось, и в конце оцените результат по таблице выше.\u003c/p>\n", "text": " Что нужно сделать Часть Баллы Что проверяют Цвета как на макете 0,24 −0,02 за каждый отсутствующий цвет Типографика (тема) 0,32 −0,02 за каждый отсутствующий стиль Поле ввода и все состояния 1,20 −0,15 за отсутствующий элемент; нет в StoryBook — половина Select + BottomSheet 0,90 + 0,30 Тап по селекту открывает BottomSheet Кнопка со всеми состояниями 1,50 −0,1 за каждый отсутствующий вариант Pagination 0,30 Все состояния Карточка со всеми состояниями 1,50 −0,3 за отсутствующий вариант Bottom Bar 0,80 Timer 0,60 Checkbox 0,80 Все компоненты адаптивны 1,20 −0,15 за каждый неадаптивный Архитектура: DRY, отдельная библиотека 0,50 + 0,50 Половина, если нет комментариев и логов Git: ветка, проект в ветке, merge 0,30 Три общих правила в критериях: нет библиотеки — ничего не проверяется ; нет компонента в StoryBook — половина баллов ; нет комментариев и логов — половина баллов . Порядок работы (план на 90 минут) Минуты Действие 0–5 Создать репозиторий и ветку sprint-1 , создать Flutter-пакет, переместить карточки в «В работе» (не более 2) 5–20 Цвета, типографика, шрифты, логгер, uikit.dart с экспортами 20–55 Поле, кнопка, чекбокс, карточка, bottom bar — самые дорогие 55–70 Select + BottomSheet, Pagination, Timer 70–85 StoryBook: все компоненты и все состояния 85–90 Тег v1.0.0 , push, PR, merge, перенос карточек с коммитами Создание библиотеки flutter create --template=package uikit cd uikit && git init Структура с настоящей инкапсуляцией: uikit/ lib/ uikit.dart # единственный публичный файл, только export src/ theme/ colors.dart typography.dart components/ ui_button.dart ui_text_field.dart ui_select.dart ... core/ logger.dart scale.dart assets/ icons... fonts/ Manrope-*.ttf pubspec.yaml CHANGELOG.md README.md // lib/uikit.dart library; export 'src/theme/colors.dart'; export 'src/theme/typography.dart'; export 'src/components/ui_button.dart'; export 'src/components/ui_text_field.dart'; export 'src/components/ui_select.dart'; export 'src/components/ui_checkbox.dart'; // ... всё, что должно быть доступно приложению Приложение подключает import 'package:uikit/uikit.dart'; и больше ничего. Это и есть инкапсуляция : «внутренняя реализация скрыта, наружу доступен только чётко определённый API». Шрифты и ресурсы внутри пакета # pubspec.yaml библиотеки flutter: assets: - assets/ fonts: - family: Manrope fonts: - asset: fonts/Manrope-Regular.ttf weight: 400 - asset: fonts/Manrope-SemiBold.ttf weight: 600 - asset: fonts/Manrope-Bold.ttf weight: 700 - asset: fonts/Manrope-ExtraBold.ttf weight: 800 В стиле указывайте пакет, тогда приложению не нужно дублировать шрифты в своём pubspec.yaml : const TextStyle screenHeader = TextStyle( fontFamily: 'Manrope', package: 'uikit', fontWeight: FontWeight.w700, fontSize: 24, height: 32 / 24, letterSpacing: -0.48, ); Иконки из пакета: Image.asset('assets/eye.png', package: 'uikit') . Цвета и типографика Единый источник истины (DRY): цвета и стили определены один раз. import 'package:flutter/painting.dart'; abstract final class UiColors { static const primary = Color(0xFF00C853); static const onPrimary = Color(0xFFFFFFFF); static const error = Color(0xFFBA1A1A); static const border = Color(0xFFC3C6D7); static const surface = Color(0xFFFAF8FF); static const text = Color(0xFF191B23); } Проверьте: в StoryBook должна быть страница «Цвета» (квадраты с названиями всех цветов макета) и «Типографика» (каждый стиль с подписью размера и начертания). Кнопка: варианты и состояния Один класс, варианты через enum (O из SOLID и фабрики из DRY): // Универсальная кнопка библиотеки. Отвечает только за отображение и нажатие. // Дата создания: 11-11-2026 // Автор создания: 7 enum UiButtonKind { primary, secondary, destructive } class UiButton extends StatelessWidget { final String text; final UiButtonKind kind; final bool isLoading; final VoidCallback? onPressed; // null = кнопка отключена const UiButton({ super.key, required this.text, this.kind = UiButtonKind.primary, this.isLoading = false, this.onPressed, }); const UiButton.secondary({super.key, required this.text, this.isLoading = false, this.onPressed}) : kind = UiButtonKind.secondary; bool get _enabled => onPressed != null && !isLoading; @override Widget build(BuildContext context) { final (bg, fg, border) = switch (kind) { UiButtonKind.primary => (UiColors.primary, UiColors.onPrimary, UiColors.primary), UiButtonKind.secondary => (UiColors.onPrimary, UiColors.primary, UiColors.primary), UiButtonKind.destructive => (UiColors.error, UiColors.onPrimary, UiColors.error), }; return Opacity( opacity: _enabled ? 1 : 0.4, // состояние disabled child: Material( color: bg, shape: RoundedRectangleBorder( borderRadius: BorderRadius.circular(8), side: BorderSide(color: border, width: 2), ), child: InkWell( // состояние pressed: ripple-эффект borderRadius: BorderRadius.circular(8), onTap: _enabled ? () { UiLog.info('UiButton', 'Нажатие', text); onPressed!(); } : null, child: ConstrainedBox( constraints: const BoxConstraints(minHeight: 48, minWidth: double.infinity), child: Center( child: isLoading ? SizedBox(width: 20, height: 20, child: CircularProgressIndicator(strokeWidth: 2, color: fg)) : Text(text, style: bodyMedium.copyWith(color: fg)), ), ), ), ), ); } } Кнопка тянется на ширину родителя ( minWidth: double.infinity ), поэтому на разных экранах не «плавает». Нужна половина ширины — оберните в Expanded или SizedBox . Поле ввода Варианты: обычное, в фокусе, с ошибкой, отключённое, пароль (с глазом), поиск (с иконкой). class UiTextField extends StatefulWidget { final String label, hint; final String? errorText; final bool enabled; final UiTextFieldType type; // normal | password | search final TextEditingController? controller; final ValueChanged\u003cString>? onChanged; const UiTextField({super.key, required this.label, required this.hint, this.errorText, this.enabled = true, this.type = UiTextFieldType.normal, this.controller, this.onChanged}); @override State\u003cUiTextField> createState() => _UiTextFieldState(); } class _UiTextFieldState extends State\u003cUiTextField> { final _focus = FocusNode(); bool _hidden = true; @override void initState() { super.initState(); _focus.addListener(() => setState(() {})); } @override void dispose() { _focus.dispose(); super.dispose(); } // Один метод создаёт рамку для любого состояния (DRY: вместо пяти копий) OutlineInputBorder _border(Color c) => OutlineInputBorder( borderSide: BorderSide(color: c, width: 1), borderRadius: BorderRadius.circular(8), ); @override Widget build(BuildContext context) { final hasError = widget.errorText != null; final color = hasError ? UiColors.error : _focus.hasFocus ? UiColors.primary : UiColors.border; return Column( crossAxisAlignment: CrossAxisAlignment.start, children: [ Text(widget.label, style: fieldLabel.copyWith(color: color)), const SizedBox(height: 4), TextField( focusNode: _focus, enabled: widget.enabled, controller: widget.controller, onChanged: widget.onChanged, obscureText: widget.type == UiTextFieldType.password && _hidden, decoration: InputDecoration( filled: true, fillColor: UiColors.surface, hintText: widget.hint, errorText: widget.errorText, enabledBorder: _border(color), focusedBorder: _border(color), disabledBorder: _border(UiColors.border), errorBorder: _border(UiColors.error), focusedErrorBorder: _border(UiColors.error), suffixIcon: widget.type == UiTextFieldType.password ? IconButton( icon: Icon(_hidden ? Icons.visibility_off : Icons.visibility), onPressed: () => setState(() => _hidden = !_hidden)) : null, ), ), ], ); } } В StoryBook показывайте настоящее состояние фокуса (поле с autofocus или принудительный FocusNode.requestFocus() ), а не раскрашенную имитацию. Select и BottomSheet class UiSelect\u003cT> extends StatelessWidget { final String label, hint; final T? value; final List\u003cT> options; final String Function(T) titleOf; final ValueChanged\u003cT> onChanged; const UiSelect({super.key, required this.label, required this.hint, required this.value, required this.options, required this.titleOf, required this.onChanged}); @override Widget build(BuildContext context) { return GestureDetector( behavior: HitTestBehavior.opaque, onTap: () async { final picked = await showModalBottomSheet\u003cT>( context: context, builder: (_) => UiBottomSheet\u003cT>(options: options, titleOf: titleOf, selected: value), ); if (picked != null) onChanged(picked); }, child: InputDecorator( decoration: InputDecoration(labelText: label, suffixIcon: const Icon(Icons.keyboard_arrow_down)), child: Text(value == null ? hint : titleOf(value as T)), ), ); } } UiBottomSheet — отдельный публичный компонент (в таблице он отдельная строка 0,3 балла): заголовок, список вариантов, отметка выбранного. Pagination, Timer, Card, Bottom Bar Pagination — точки приветственных экранов. Активная шире остальных: class UiPagination extends StatelessWidget { final int count, current; const UiPagination({super.key, required this.count, required this.current}); @override Widget build(BuildContext context) => Row( mainAxisSize: MainAxisSize.min, children: List.generate(count, (i) => AnimatedContainer( duration: const Duration(milliseconds: 200), margin: const EdgeInsets.symmetric(horizontal: 3), width: i == current ? 24 : 8, height: 8, decoration: BoxDecoration( color: i == current ? UiColors.primary : UiColors.border, borderRadius: BorderRadius.circular(4)), )), ); } Timer — компонент отображает время, а считает его тот, кто его использует (SRP). Принимает Duration и форматирует мм:сс : String formatDuration(Duration d) { final m = d.inMinutes.remainder(60).toString().padLeft(2, '0'); final s = d.inSeconds.remainder(60).toString().padLeft(2, '0'); return '$m:$s'; } Card — состояния: обычная, выбранная, неактивная; контент передаётся параметрами ( title , subtitle , leading , trailing , onTap ). Bottom Bar — список данных, а не три копии кода; центральная кнопка выделена (по ней открывается Schedule Game): class UiBottomBarItem { final String label; final String iconAsset; const UiBottomBarItem(this.label, this.iconAsset); } // в виджете: items.asMap().entries.map((e) => _Tab(...)).toList() Checkbox — состояния: выкл, вкл, отключён (с отметкой и без). StoryBook Приложение подключает библиотеку из Git по тегу и содержит одну страницу на компонент (или один длинный экран с заголовками), где видны все состояния. dependencies: uikit: git: url: https://github.com/\u003cлогин>/uikit.git ref: v1.0.0 import 'package:uikit/uikit.dart'; // только один импорт class ButtonsPage extends StatelessWidget { const ButtonsPage({super.key}); @override Widget build(BuildContext context) => Padding( padding: const EdgeInsets.all(20), child: Column(spacing: 16, children: [ UiButton(text: 'Primary', onPressed: () {}), const UiButton(text: 'Primary disabled'), UiButton.secondary(text: 'Secondary', onPressed: () {}), UiButton(text: 'Destructive', kind: UiButtonKind.destructive, onPressed: () {}), UiButton(text: 'Loading', isLoading: true, onPressed: () {}), ]), ); } Разбор вашей симуляции (6,39 из 10
