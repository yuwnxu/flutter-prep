md и CHANGELOG.md — шаблонные TODO Мелкие потери по документации Пара строк о компонентах и версии 12 Лог в каждом initState и dispose для кнопки: в UIKit это допустимо, но Logging() создаётся заново каждый раз; ошибка error() не используется нигде Минор Один синглтон, лог ERROR в catch Если в вашей симуляции был другой набор компонентов (HR Design System: appbar, avatar, textarea, progress bar), это нормально. Важно, что в реальном КЗ набор другой: Select, BottomSheet, Pagination, Card, Timer, Bottom Bar, Checkbox, Input, Button. Чек-лист перед сдачей спринта 1 Репозиторий uikit отдельный, ветка sprint-1 , смёржена в main , тег v1.0.0 . lib/uikit.dart экспортирует все компоненты, src/ приватен. Ресурсы с package: 'uikit' , шрифты подключены правильными файлами. Цвета и типографика: все из макета, с именами. В StoryBook: каждый компонент во всех состояниях. На узком (360 dp) и широком (430 dp) экране нет переполнений. Шапка у каждого класса, описания публичных методов, логи с форматом [Тег]: Событие — Детали . Карточки перенесены в «Готово к тестированию» с хэшами коммитов. Максимальный балл: критерий за критерием Это таблица «что смотрит эксперт → что вам сделать → как проверить себя». Идите по ней сверху вниз. Критерий (макс.) Что сделать точно Проверка перед сдачей Библиотека UIKit в отдельном проекте (0,5) Отдельный репозиторий, pubspec.yaml с именем uikit Репозиторий открывается сам по себе, не внутри приложения DRY (0,5) Цвета, стили, рамки, пункты меню — в одном месте Нет двух одинаковых кусков кода Цвета (0,24) Все цвета макета как константы с именами, ни одного пропущенного (−0,02 за каждый) Сравнить палитру Figma с colors.dart по списку Типографика (0,32) Все текстовые стили макета (размер, начертание, высота строки, межбуквенный интервал) Каждый стиль есть в StoryBook с подписью Поле ввода (1,2) Состояния: default, focused, filled, error, disabled; типы: обычное, пароль, поиск; всё как в макете −0,15 за каждый отсутствующий элемент; нет в StoryBook — половина Select (0,9) + BottomSheet (0,3) Тап по полю открывает панель снизу с вариантами, выбранное значение отображается Работает кликом в StoryBook Кнопка (1,5) Все варианты и состояния макета (primary, secondary, destructive; default, pressed, disabled, loading) −0,1 за каждый отсутствующий Pagination (0,3) Точки с активной, все состояния Видно в StoryBook Карточка (1,5) Все варианты и состояния макета −0,3 за каждый отсутствующий Bottom Bar (0,8) Все пункты, активный пункт, центральная кнопка Видно в StoryBook Timer (0,6) Отображение времени по макету, формат мм:сс Показан в разных значениях Checkbox (0,8) Выкл, вкл, отключён (с отметкой и без) Нажимается Все компоненты адаптивны (1,2) Ширина от родителя, нет жёстких размеров экрана Открыть StoryBook на узком и широком эмуляторе Комментарии и логи Шапка у каждого класса, описания методов, логи [Тег]: Событие — Детали Скрипт из раздела «Комментарии и логи» Git (0,3) Ветка sprint-1 , проект сохранён, PR смёржен Ветка и PR видны в репозитории Три «множителя» ×0,5: нет компонента в StoryBook, нет комментариев и логов, нет библиотеки. Проверьте их в первую очередь. Подробно: как организовать StoryBook Эксперт открывает StoryBook на телефоне и должен быстро найти каждый компонент. Главная страница — список разделов: «Цвета», «Типографика», «Кнопки», «Поля», «Select», «Checkbox», «Pagination», «Карточки», «Bottom Bar», «Timer». Страница раздела — заголовок и все состояния друг под другом, у каждого подпись («Primary / Disabled»). Интерактивность: Select открывает BottomSheet, Checkbox переключается, Timer запускается, Pagination листается кнопками. Один импорт package:uikit/uikit.dart . class StoryBookHome extends StatelessWidget { const StoryBookHome({super.key}); @override Widget build(BuildContext context) { final sections = \u003c(String, Widget)>[ ('Цвета', const ColorsPage()), ('Типографика', const TypographyPage()), ('Кнопки', const ButtonsPage()), ('Поля ввода', const InputsPage()), ('Select', const SelectPage()), ('Checkbox', const CheckboxPage()), ('Pagination', const PaginationPage()), ('Карточки', const CardsPage()), ('Bottom Bar', const BottomBarPage()), ('Timer', const TimerPage()), ]; return Scaffold( appBar: AppBar(title: const Text('StoryBook')), body: ListView( children: [ for (final (title, page) in sections) ListTile( title: Text(title), trailing: const Icon(Icons.chevron_right), onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => page)), ), ], ), ); } } Для обёртки раздела сделайте один общий виджет StorySection(title, children) , чтобы не дублировать оформление (DRY). Подробно: Timer как компонент В задании Timer — компонент интерфейса: плашка с временем. Продумайте: что он отображает , а что считает . // Отображение таймера (без собственной логики отсчёта: SRP) class UiTimer extends StatelessWidget { final Duration time; const UiTimer({super.key, required this.time}); @override Widget build(BuildContext context) { final m = time.inMinutes.remainder(60).toString().padLeft(2, '0'); final s = time.inSeconds.remainder(60).toString().padLeft(2, '0'); return Container( padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6), decoration: BoxDecoration(color: UiColors.surface, borderRadius: BorderRadius.circular(8)), child: Text('$m:$s', style: subheader.copyWith(fontFeatures: const [FontFeature.tabularFigures()])), ); } } В StoryBook покажите его с живым отсчётом ( Timer.periodic в StatefulWidget страницы) и с разными значениями (00:00, 01:30, 59:59). Подробно: как не потерять баллы на мелочах Названия цветов и стилей совпадают с макетом: primary , secondary , screenHeader . Состояние disabled должно быть видно визуально (прозрачность) и не реагировать на нажатие. Нажатие в StoryBook логируется ( AppLog.info ): так эксперт увидит логи в консоли. Пакеты : в pubspec.yaml UIKit только то, что реально нужно. README библиотеки: 5–7 строк про компоненты и пример подключения. CHANGELOG : ## 1.0.0 и список компонентов. Тег v1.0.0 после merge. Репетиция спринта 1 Выполните за 90 минут с секундомером во вкладке «Симуляция». Для каждого компонента заведите заметку, если что-то не получилось, и в конце оцените результат по таблице выше. ", "hours": 6, "minutes": 15}, {"id": "sprint2", "stage": 6, "title": "Спринт 2: сетевой слой и тесты", "lead": "1 ч 10 мин. Отдельная библиотека для REST API, 11 запросов, обработка ошибок и тесты. Максимум 20,89 балла.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Часть\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Нет интернета → вернуть ошибку\u003c/td>\n\u003ctd style=\"text-align: right;\">0,70\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Ошибка сервера → вернуть ошибку\u003c/td>\n\u003ctd style=\"text-align: right;\">0,84\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>11 запросов, по 1,10 за каждый\u003c/td>\n\u003ctd style=\"text-align: right;\">12,10\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектура: библиотека, SOLID, DRY\u003c/td>\n\u003ctd style=\"text-align: right;\">0,5 + 1,0 + 0,5\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Тесты: 11 запросов, по 0,45 за каждый\u003c/td>\n\u003ctd style=\"text-align: right;\">4,95\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Git (ветка, merge)\u003c/td>\n\u003ctd style=\"text-align: right;\">0,30\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>11 запросов:\u003c/strong> авторизация, регистрация, изменение профиля, получение профиля, выход, создание игры, список игр, информация об игре, подключение к игре, статистика игрока, сохранение результата игры.\u003c/p>\n\u003cp>Это \u003cstrong>самый выгодный спринт по соотношению баллы/время\u003c/strong>: 20,89 балла за 70 минут, и все пункты однотипные. Сделав первый запрос «по шаблону», остальные добавляются за 2–3 минуты.\u003c/p>\n\u003cdiv class=\"tip\">\n\u003cp>Спринт 2 в вашей симуляции не проверялся, а он вторым по цене. Подготовьте шаблон и отрепетируйте его до автоматизма.\u003c/p>\n\u003c/div>\n\u003ch2>Требования к библиотеке\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Свойство\u003c/th>\n\u003cth>Как выполнить\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Изолированность\u003c/td>\n\u003ctd>Отдельный репозиторий и пакет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Абстрагированность\u003c/td>\n\u003ctd>Приложение зависит от \u003ccode>abstract interface class\u003c/code>, а не от \u003ccode>http\u003c/code> или \u003ccode>dio\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Заменяемость\u003c/td>\n\u003ctd>Реализация \u003ccode>HttpApiClient\u003c/code> может быть заменена на \u003ccode>DioApiClient\u003c/code> без правок приложения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Версионирование\u003c/td>\n\u003ctd>\u003ccode>version:\u003c/code> в pubspec и теги \u003ccode>v1.0.0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Структура пакета\u003c/h2>\n\u003cpre>\u003ccode>network_layer/\n  lib/\n    network_layer.dart             # экспорт публичного API\n    src/\n      config/api_config.dart       # baseUrl, заголовки, таймауты (единый источник)\n      client/api_client.dart       # abstract interface class\n      client/http_api_client.dart  # реализация на пакете http\n      errors/api_exception.dart    # NoInternet, Server, Timeout, Parse\n      models/                      # DTO: UserDto, GameDto, StatsDto, ...\n      api/auth_api.dart            # abstract + impl\n      api/game_api.dart\n      api/profile_api.dart\n  test/\n    auth_api_test.dart ...\u003c/code>\u003c/pre>\n\u003ch2>Ошибки\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// Базовая ошибка сетевого слоя.\nsealed class ApiException implements Exception {\n  final String message;\n  const ApiException(this.message);\n  @override\n  String toString() =&gt; message;\n}\n\nclass NoInternetException extends ApiException {\n  const NoInternetException() : super(&#39;Нет подключения к интернету&#39;);\n}\n\nclass TimeoutApiException extends ApiException {\n  const TimeoutApiException() : super(&#39;Превышено время ожидания&#39;);\n}\n\nclass ServerException extends ApiException {\n  final int statusCode;\n  const ServerException(this.statusCode, String message) : super(message);\n}\n\nclass ParseException extends ApiException {\n  const ParseException() : super(&#39;Не удалось обработать ответ сервера&#39;);\n}\u003c/code>\u003c/pre>\n\u003ch2>Конфиг и абстракция клиента\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class ApiConfig {\n  final String baseUrl;\n  final Duration timeout;\n  final Map&lt;String, String&gt; defaultHeaders;\n  const ApiConfig({\n    required this.baseUrl,\n    this.timeout = const Duration(seconds: 15),\n    this.defaultHeaders = const {&#39;Content-Type&#39;: &#39;application/json&#39;},\n  });\n}\n\nabstract interface class ApiClient {\n  Future&lt;Map&lt;String, dynamic&gt;&gt; get(String path, {Map&lt;String, String&gt;? query});\n  Future&lt;Map&lt;String, dynamic&gt;&gt; post(String path, {Object? body});\n  Future&lt;Map&lt;String, dynamic&gt;&gt; put(String path, {Object? body});\n  Future&lt;Map&lt;String, dynamic&gt;&gt; delete(String path);\n  void setToken(String? token);\n}\u003c/code>\u003c/pre>\n\u003cp>Для интерфейсов из задания (I из SOLID) можно разделить на \u003ccode>AuthApiClient\u003c/code>, \u003ccode>FileApiClient\u003c/code>. Минимум — отдельные \u003ccode>AuthApi\u003c/code>, \u003ccode>GameApi\u003c/code>, \u003ccode>ProfileApi\u003c/code> поверх одного \u003ccode>ApiClient\u003c/code>.\u003c/p>\n\u003ch2>Реализация на пакете http\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:async&#39;;\nimport &#39;dart:convert&#39;;\nimport &#39;dart:io&#39;;\nimport &#39;package:http/http.dart&#39; as http;\n\n// Реализация ApiClient поверх пакета http.\n// Единая точка выполнения запросов, ошибок и логирования.\nclass HttpApiClient implements ApiClient {\n  final ApiConfig _config;\n  final http.Client _client;\n  String? _token;\n\n  // client можно подставить в тестах (MockClient)\n  HttpApiClient(this._config, {http.Client? client}) : _client = client ?? http.Client();\n\n  @override\n  void setToken(String? token) =&gt; _token = token;\n\n  Map&lt;String, String&gt; get _headers =&gt; {\n        ..._config.defaultHeaders,\n        if (_token != null) &#39;Authorization&#39;: &#39;Bearer $_token&#39;,\n      };\n\n  Uri _uri(String path, [Map&lt;String, String&gt;? query]) =&gt;\n      Uri.parse(&#39;${_config.baseUrl}$path&#39;).replace(queryParameters: query);\n\n  @override\n  Future&lt;Map&lt;String, dynamic&gt;&gt; get(String path, {Map&lt;String, String&gt;? query}) =&gt;\n      _send(&#39;GET&#39;, path, () =&gt; _client.get(_uri(path, query), headers: _headers));\n\n  @override\n  Future&lt;Map&lt;String, dynamic&gt;&gt; post(String path, {Object? body}) =&gt; _send(&#39;POST&#39;, path,\n      () =&gt; _client.post(_uri(path), headers: _headers, body: jsonEncode(body)));\n\n  @override\n  Future&lt;Map&lt;String, dynamic&gt;&gt; put(String path, {Object? body}) =&gt; _send(&#39;PUT&#39;, path,\n      () =&gt; _client.put(_uri(path), headers: _headers, body: jsonEncode(body)));\n\n  @override\n  Future&lt;Map&lt;String, dynamic&gt;&gt; delete(String path) =&gt;\n      _send(&#39;DELETE&#39;, path, () =&gt; _client.delete(_uri(path), headers: _headers));\n\n  // Единый обработчик: логирование, таймаут, преобразование ошибок (DRY).\n  Future&lt;Map&lt;String, dynamic&gt;&gt; _send(\n      String method, String path, Future&lt;http.Response&gt; Function() request) async {\n    NetLog.info(&#39;HttpApiClient&#39;, &#39;Запрос&#39;, &#39;$method $path&#39;); // начало — INFO\n    try {\n      final response = await request().timeout(_config.timeout);\n      final body = utf8.decode(response.bodyBytes);\n\n      if (response.statusCode &gt;= 200 &amp;&amp; response.statusCode &lt; 300) {\n        NetLog.debug(&#39;HttpApiClient&#39;, &#39;Ответ&#39;, &#39;${response.statusCode} $path&#39;); // успех — DEBUG\n        if (body.isEmpty) return {};\n        final decoded = jsonDecode(body);\n        return decoded is Map&lt;String, dynamic&gt; ? decoded : {&#39;data&#39;: decoded};\n      }\n\n      // Код не 2xx — ошибка сервера: достаём message из тела, если оно есть\n      final message = _extractMessage(body) ?? &#39;Ошибка сервера (${response.statusCode})&#39;;\n      throw ServerException(response.statusCode, message);\n    } on SocketException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Нет интернета: $path&#39;);\n      throw const NoInternetException();\n    } on http.ClientException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Нет соединения: $path&#39;);\n      throw const NoInternetException();\n    } on TimeoutException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Таймаут: $path&#39;);\n      throw const TimeoutApiException();\n    } on FormatException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Некорректный JSON: $path&#39;);\n      throw const ParseException();\n    } on ApiException {\n      NetLog.error(&#39;HttpApiClient&#39;, &#39;Ошибка&#39;, &#39;Ответ сервера: $path&#39;);\n      rethrow;\n    }\n  }\n\n  String? _extractMessage(String body) {\n    try {\n      final json = jsonDecode(body);\n      if (json is Map) return (json[&#39;message&#39;] ?? json[&#39;error&#39;])?.toString();\n    } catch (_) {}\n    return null;\n  }\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Адреса, названия полей (\u003ccode>token\u003c/code>, \u003ccode>message\u003c/code>) и формат ответов зависят от выданного вам API. Внимательно прочитайте документацию/карточку запроса и сверяйте поля с реальным ответом (\u003ccode>curl\u003c/code> или Postman).\u003c/p>\n\u003c/div>\n\u003ch2>Модель, API и маппинг ответа\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class UserDto {\n  final String id;\n  final String email;\n  final String? name;\n  final String? photoUrl;\n  const UserDto({required this.id, required this.email, this.name, this.photoUrl});\n\n  factory UserDto.fromJson(Map&lt;String, dynamic&gt; json) =&gt; UserDto(\n        id: json[&#39;id&#39;].toString(),\n        email: json[&#39;email&#39;] as String,\n        name: json[&#39;name&#39;] as String?,\n        photoUrl: json[&#39;photo&#39;] as String?,\n      );\n}\n\nabstract interface class AuthApi {\n  Future&lt;AuthResultDto&gt; login({required String email, required String password});\n  Future&lt;AuthResultDto&gt; register({required String email, required String password});\n  Future&lt;void&gt; logout();\n}\n\nclass AuthApiImpl implements AuthApi {\n  final ApiClient _client;\n  AuthApiImpl(this._client);\n\n  @override\n  Future&lt;AuthResultDto&gt; login({required String email, required String password}) async {\n    final json = await _client.post(&#39;/auth/login&#39;, body: {&#39;email&#39;: email, &#39;password&#39;: password});\n    return AuthResultDto.fromJson(json);\n  }\n  ...\n}\u003c/code>\u003c/pre>\n\u003cp>Каждый следующий запрос: DTO + метод + строка в интерфейсе. Заведите шпаргалку-таблицу из 11 запросов (метод, путь, тело, ответ), как только получили документацию.\u003c/p>\n\u003ch2>Тестирование (модуль Е, 4,95 балла)\u003c/h2>\n\u003cp>Тест-кейсы выдают в карточках. Пример из задания: «Успешный GET с десериализацией» — запускается мок-сервер, возвращается корректный JSON, проверяется код 200, содержимое модели и \u003cstrong>адрес запроса\u003c/strong>. В Dart мок-сервер заменяет \u003ccode>MockClient\u003c/code> из \u003ccode>package:http/testing.dart\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:convert&#39;;\nimport &#39;package:flutter_test/flutter_test.dart&#39;;\nimport &#39;package:http/http.dart&#39; as http;\nimport &#39;package:http/testing.dart&#39;;\nimport &#39;package:network_layer/network_layer.dart&#39;;\n\nvoid main() {\n  group(&#39;ProfileApi.getProfile&#39;, () {\n    test(&#39;успешный GET с десериализацией&#39;, () async {\n      // Предусловие: мок-сервер возвращает корректный JSON\n      late http.Request captured;\n      final mock = MockClient((request) async {\n        captured = request;\n        return http.Response(\n          jsonEncode({&#39;id&#39;: &#39;123&#39;, &#39;email&#39;: &#39;a@b.ru&#39;, &#39;name&#39;: &#39;Аня&#39;}),\n          200,\n          headers: {&#39;content-type&#39;: &#39;application/json; charset=utf-8&#39;},\n        );\n      });\n      final client = HttpApiClient(const ApiConfig(baseUrl: &#39;https://test.local&#39;), client: mock);\n      final api = ProfileApiImpl(client);\n\n      // Шаг: вызвать метод\n      final user = await api.getProfile(&#39;123&#39;);\n\n      // Ожидаемый результат\n      expect(user.id, &#39;123&#39;);\n      expect(user.name, &#39;Аня&#39;);\n      expect(captured.method, &#39;GET&#39;);\n      expect(captured.url.path, &#39;/users/123&#39;); // мок зафиксировал правильный эндпоинт\n    });\n\n    test(&#39;ошибка сервера 500 → ServerException&#39;, () async {\n      final mock = MockClient((_) async =&gt; http.Response(&#39;{&quot;message&quot;:&quot;fail&quot;}&#39;, 500));\n      final api = ProfileApiImpl(HttpApiClient(const ApiConfig(baseUrl: &#39;https://t&#39;), client: mock));\n      expect(() =&gt; api.getProfile(&#39;1&#39;), throwsA(isA&lt;ServerException&gt;()));\n    });\n\n    test(&#39;нет интернета → NoInternetException&#39;, () async {\n      final mock = MockClient((_) async =&gt; throw http.ClientException(&#39;offline&#39;));\n      final api = ProfileApiImpl(HttpApiClient(const ApiConfig(baseUrl: &#39;https://t&#39;), client: mock));\n      expect(() =&gt; api.getProfile(&#39;1&#39;), throwsA(isA&lt;NoInternetException&gt;()));\n    });\n  });\n}\u003c/code>\u003c/pre>\n\u003cp>Запуск: \u003ccode>flutter test\u003c/code>. На каждый из 11 запросов минимум: успех, ошибка сервера, нет интернета (то, что требуют тест-кейсы карточки). Тест по каждому запросу стоит 0,45, поэтому сначала сделайте \u003cstrong>по одному успешному тесту на каждый запрос\u003c/strong>, потом добавляйте ошибки.\u003c/p>\n\u003cp>Если используете \u003ccode>dio\u003c/code>, подменяйте адаптер (\u003ccode>http_mock_adapter\u003c/code>) или реализуйте \u003ccode>HttpClientAdapter\u003c/code>. Если вы пишете только на \u003ccode>http\u003c/code>, \u003ccode>MockClient\u003c/code> проще.\u003c/p>\n\u003ch2>Порядок на 70 минут\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Минуты\u003c/th>\n\u003cth>Действие\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>0–5\u003c/td>\n\u003ctd>Репозиторий, ветка, пакет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>5–20\u003c/td>\n\u003ctd>Конфиг, ошибки, интерфейс клиента, реализация, логи\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>20–45\u003c/td>\n\u003ctd>11 запросов по шаблону (DTO + метод)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>45–65\u003c/td>\n\u003ctd>Тесты на каждый запрос\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>65–70\u003c/td>\n\u003ctd>Тег, PR, merge, карточки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Чек-лист\u003c/h2>\n\u003cul class=\"task-list\">\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Приложение/тесты зависят от \u003ccode>ApiClient\u003c/code>/\u003ccode>AuthApi\u003c/code>, не от \u003ccode>http\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Нет сети → \u003ccode>NoInternetException\u003c/code>; код не 2xx → \u003ccode>ServerException(statusCode, message)\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />URL, заголовки, таймаут — только в \u003ccode>ApiConfig\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Каждый запрос логируется: INFO старт, DEBUG успех, ERROR сбой.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Тесты запускаются командой \u003ccode>flutter test\u003c/code> без сети.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Версия и тег \u003ccode>v1.0.0\u003c/code>.\u003c/label>\u003c/li>\n\u003c/ul>\n\u003ch2>Максимальный балл: критерий за критерием\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Критерий (макс.)\u003c/th>\n\u003cth>Что сделать точно\u003c/th>\n\u003cth>Проверка\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Создана библиотека (0,5)\u003c/td>\n\u003ctd>Отдельный репозиторий и пакет \u003ccode>network_layer\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>flutter pub get\u003c/code> проходит, экспорт в \u003ccode>network_layer.dart\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>SOLID (1,0)\u003c/td>\n\u003ctd>Интерфейс клиента, реализация отдельно, API-классы по областям, ошибки отдельно\u003c/td>\n\u003ctd>Объясните каждую букву на своём коде\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>DRY (0,5)\u003c/td>\n\u003ctd>Конфиг, обработчик ошибок и базовые методы GET/POST в одном месте\u003c/td>\n\u003ctd>Нет повторяющегося \u003ccode>try/catch\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Нет интернета → ошибка (0,7)\u003c/td>\n\u003ctd>\u003ccode>SocketException\u003c/code>/\u003ccode>ClientException\u003c/code> превращается в \u003ccode>NoInternetException\u003c/code>\u003c/td>\n\u003ctd>Отключите сеть и вызовите любой запрос\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Ошибка сервера → ошибка (0,84)\u003c/td>\n\u003ctd>Код вне 200–299 превращается в \u003ccode>ServerException(code, message)\u003c/code>\u003c/td>\n\u003ctd>Тест с ответом 500\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Каждый из 11 запросов (по 1,1)\u003c/td>\n\u003ctd>Метод, DTO, правильный путь и тело\u003c/td>\n\u003ctd>Проверьте по документации API\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Тест на каждый запрос (по 0,45)\u003c/td>\n\u003ctd>\u003ccode>test(...)\u003c/code> с \u003ccode>MockClient\u003c/code>, проверка пути, метода, результата\u003c/td>\n\u003ctd>\u003ccode>flutter test\u003c/code> зелёный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Комментарии и логи\u003c/td>\n\u003ctd>Шапки, описания методов, логи на каждый запрос\u003c/td>\n\u003ctd>Скрипт-проверка\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Git\u003c/td>\n\u003ctd>Ветка \u003ccode>sprint-2\u003c/code>, PR, merge, тег \u003ccode>v1.0.0\u003c/code>\u003c/td>\n\u003ctd>Видно в репозитории\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: шаблон запроса «в три шага»\u003c/h2>\n\u003cp>Чтобы сделать 11 запросов быстро, у каждого одинаковая структура:\u003c/p>\n\u003cp>\u003cstrong>Шаг 1. DTO ответа и тела запроса.\u003c/strong>\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class LoginRequest {\n  final String email, password;\n  const LoginRequest(this.email, this.password);\n  Map&lt;String, dynamic&gt; toJson() =&gt; {&#39;email&#39;: email, &#39;password&#39;: password};\n}\n\nclass AuthResultDto {\n  final String token; final UserDto user;\n  const AuthResultDto(this.token, this.user);\n  factory AuthResultDto.fromJson(Map&lt;String, dynamic&gt; j) =&gt;\n      AuthResultDto(j[&#39;token&#39;] as String, UserDto.fromJson(j[&#39;user&#39;] as Map&lt;String, dynamic&gt;));\n}\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Шаг 2. Метод в интерфейсе и реализации.\u003c/strong>\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;AuthResultDto&gt; login(LoginRequest r) async =&gt;\n    AuthResultDto.fromJson(await _client.post(&#39;/auth/login&#39;, body: r.toJson()));\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Шаг 3. Тест.\u003c/strong>\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>test(&#39;login: успех&#39;, () async { /* MockClient → expect */ });\u003c/code>\u003c/pre>\n\u003cp>Одиннадцать запросов — одиннадцать повторений этого шаблона. Заранее составьте таблицу из документации:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Запрос\u003c/th>\n\u003cth>Метод\u003c/th>\n\u003cth>Путь\u003c/th>\n\u003cth>Тело\u003c/th>\n\u003cth>Ответ\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Авторизация\u003c/td>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003ccode>/...\u003c/code>\u003c/td>\n\u003ctd>email, password\u003c/td>\n\u003ctd>token, user\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Регистрация\u003c/td>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Изменение профиля\u003c/td>\n\u003ctd>PUT\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Получение профиля\u003c/td>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Выход\u003c/td>\n\u003ctd>POST/DELETE\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Создание игры\u003c/td>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Список игр\u003c/td>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Информация об игре\u003c/td>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Подключение к игре\u003c/td>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Статистика игрока\u003c/td>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Сохранение результата\u003c/td>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>(Пути и поля узнаете из документации API на соревновании.)\u003c/p>\n\u003ch2>Подробно: как тестировать ошибки\u003c/h2>\n\u003cp>Эксперт проверяет не только успех, но и ошибки. Для каждого запроса сделайте три теста:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>group(&#39;GameApi.getGames&#39;, () {\n  test(&#39;успех: возвращает список&#39;, () async { /* 200 + JSON */ });\n  test(&#39;ошибка сервера: ServerException(500)&#39;, () async {\n    final api = _api(MockClient((_) async =&gt; http.Response(&#39;{&quot;message&quot;:&quot;boom&quot;}&#39;, 500)));\n    expect(api.getGames(), throwsA(isA&lt;ServerException&gt;()\n        .having((e) =&gt; e.statusCode, &#39;statusCode&#39;, 500)));\n  });\n  test(&#39;нет интернета: NoInternetException&#39;, () async {\n    final api = _api(MockClient((_) async =&gt; throw http.ClientException(&#39;offline&#39;)));\n    expect(api.getGames(), throwsA(isA&lt;NoInternetException&gt;()));\n  });\n});\n\nGameApi _api(http.Client c) =&gt; GameApiImpl(HttpApiClient(const ApiConfig(baseUrl: &#39;https://t&#39;), client: c));\u003c/code>\u003c/pre>\n\u003cp>Если тест-кейс в карточке требует проверить \u003cstrong>тело запроса\u003c/strong> (для POST), проверьте его:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final body = jsonDecode(request.body) as Map&lt;String, dynamic&gt;;\nexpect(body[&#39;email&#39;], &#39;a@b.ru&#39;);\u003c/code>\u003c/pre>\n\u003cp>и \u003cstrong>заголовок авторизации\u003c/strong>: \u003ccode>expect(request.headers['Authorization'], 'Bearer token');\u003c/code>.\u003c/p>\n\u003ch2>Подробно: отдельная библиотека — что это значит технически\u003c/h2>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Свой репозиторий\u003c/strong>: \u003ccode>git init\u003c/code>, свой удалённый репозиторий, свои ветки и теги.\u003c/li>\n\u003cli>\u003cstrong>Свой \u003ccode>pubspec.yaml\u003c/code>\u003c/strong>: имя, версия, зависимости (\u003ccode>http\u003c/code>, \u003ccode>logger\u003c/code>).\u003c/li>\n\u003cli>\u003cstrong>Публичный API\u003c/strong>: \u003ccode>lib/network_layer.dart\u003c/code> экспортирует только то, что нужно приложению (интерфейсы, DTO, ошибки, конфиг, реализация). Остальное в \u003ccode>src/\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Подключение в приложение\u003c/strong>: \u003ccode>git: url: ... ref: v1.0.0\u003c/code> либо \u003ccode>path: ../network_layer\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Заменяемость\u003c/strong>: приложение пишет \u003ccode>ApiClient client = HttpApiClient(config);\u003c/code> в одном месте (DI). Заменить на \u003ccode>DioApiClient\u003c/code> значит поменять \u003cstrong>одну строку\u003c/strong>.\u003c/li>\n\u003c/ol>\n\u003cp>Проверка «заменяемости» — сделайте второй класс \u003ccode>FakeApiClient implements ApiClient\u003c/code>, возвращающий готовые данные, и подставьте его в тесте. Если приложение работает, архитектура правильная.\u003c/p>\n\u003ch2>Репетиция спринта 2\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Возьмите любой открытый API с авторизацией и списками (например, \u003ccode>jsonplaceholder.typicode.com\u003c/code>).\u003c/li>\n\u003cli>Сымитируйте 11 запросов (посты, пользователи, комментарии).\u003c/li>\n\u003cli>Реализуйте за 70 минут вместе с тестами.\u003c/li>\n\u003cli>В симуляции запишите, на каком запросе замедлились.\u003c/li>\n\u003c/ol>\n", "text": " Что нужно сделать Часть Баллы Нет интернета → вернуть ошибку 0,70 Ошибка сервера → вернуть ошибку 0,84 11 запросов, по 1,10 за каждый 12,10 Архитектура: библиотека, SOLID, DRY 0,5 + 1,0 + 0,5 Тесты: 11 запросов, по 0,45 за каждый 4,95 Git (ветка, merge) 0,30 11 запросов: авторизация, регистрация, изменение профиля, получение профиля, выход, создание игры, список игр, информация об игре, подключение к игре, статистика игрока, сохранение результата игры. Это самый выгодный спринт по соотношению баллы/время : 20,89 балла за 70 минут, и все пункты однотипные. Сделав первый запрос «по шаблону», остальные добавляются за 2–3 минуты. Спринт 2 в вашей симуляции не проверялся, а он вторым по цене. Подготовьте шаблон и отрепетируйте его до автоматизма. Требования к библиотеке Свойство Как выполнить Изолированность Отдельный репозиторий и пакет Абстрагированность Приложение зависит от abstract interface class , а не от http или dio Заменяемость Реализация HttpApiClient может быть заменена на DioApiClient без правок приложения Версионирование version: в pubspec и теги v1.0.0 Структура пакета network_layer/ lib/ network_layer.dart # экспорт публичного API src/ config/api_config.dart # baseUrl, заголовки, таймауты (единый источник) client/api_client.dart # abstract interface class client/http_api_client.dart # реализация на пакете http errors/api_exception.dart # NoInternet, Server, Timeout, Parse models/ # DTO: UserDto, GameDto, StatsDto, ... api/auth_api.dart # abstract + impl api/game_api.dart api/profile_api.dart test/ auth_api_test.dart ... Ошибки // Базовая ошибка сетевого слоя. sealed class ApiException implements Exception { final String message; const ApiException(this.message); @override String toString() => message; } class NoInternetException extends ApiException { const NoInternetException() : super('Нет подключения к интернету'); } class TimeoutApiException extends ApiException { const TimeoutApiException() : super('Превышено время ожидания'); } class ServerException extends ApiException { final int statusCode; const ServerException(this.statusCode, String message) : super(message); } class ParseException extends ApiException { const ParseException() : super('Не удалось обработать ответ сервера'); } Конфиг и абстракция клиента class ApiConfig { final String baseUrl; final Duration timeout; final Map\u003cString, String> defaultHeaders; const ApiConfig({ required this.baseUrl, this.timeout = const Duration(seconds: 15), this.defaultHeaders = const {'Content-Type': 'application/json'}, }); } abstract interface class ApiClient { Future\u003cMap\u003cString, dynamic>> get(String path, {Map\u003cString, String>? query}); Future\u003cMap\u003cString, dynamic>> post(String path, {Object? body}); Future\u003cMap\u003cString, dynamic>> put(String path, {Object? body}); Future\u003cMap\u003cString, dynamic>> delete(String path); void setToken(String? token); } Для интерфейсов из задания (I из SOLID) можно разделить на AuthApiClient , FileApiClient . Минимум — отдельные AuthApi , GameApi , ProfileApi поверх одного ApiClient . Реализация на пакете http import 'dart:async'; import 'dart:convert'; import 'dart:io'; import 'package:http/http.dart' as http; // Реализация ApiClient поверх пакета http. // Единая точка выполнения запросов, ошибок и логирования. class HttpApiClient implements ApiClient { final ApiConfig _config; final http.Client _client; String? _token; // client можно подставить в тестах (MockClient) HttpApiClient(this._config, {http.Client? client}) : _client = client ?? http.Client(); @override void setToken(String? token) => _token = token; Map\u003cString, String> get _headers => { ..._config.defaultHeaders, if (_token != null) 'Authorization': 'Bearer $_token', }; Uri _uri(String path, [Map\u003cString, String>? query]) => Uri.parse('${_config.baseUrl}$path').replace(queryParameters: query); @override Future\u003cMap\u003cString, dynamic>> get(String path, {Map\u003cString, String>? query}) => _send('GET', path, () => _client.get(_uri(path, query), headers: _headers)); @override Future\u003cMap\u003cString, dynamic>> post(String path, {Object? body}) => _send('POST', path, () => _client.post(_uri(path), headers: _headers, body: jsonEncode(body))); @override Future\u003cMap\u003cString, dynamic>> put(String path, {Object? body}) => _send('PUT', path, () => _client.put(_uri(path), headers: _headers, body: jsonEncode(body))); @override Future\u003cMap\u003cString, dynamic>> delete(String path) => _send('DELETE', path, () => _client.delete(_uri(path), headers: _headers)); // Единый обработчик: логирование, таймаут, преобразование ошибок (DRY). Future\u003cMap\u003cString, dynamic>> _send( String method, String path, Future\u003chttp.Response> Function() request) async { NetLog.info('HttpApiClient', 'Запрос', '$method $path'); // начало — INFO try { final response = await request().timeout(_config.timeout); final body = utf8.decode(response.bodyBytes); if (response.statusCode >= 200 && response.statusCode \u003c 300) { NetLog.debug('HttpApiClient', 'Ответ', '${response.statusCode} $path'); // успех — DEBUG if (body.isEmpty) return {}; final decoded = jsonDecode(body); return decoded is Map\u003cString, dynamic> ? decoded : {'data': decoded}; } // Код не 2xx — ошибка сервера: достаём message из тела, если оно есть final message = _extractMessage(body) ?? 'Ошибка сервера (${response.statusCode})'; throw ServerException(response.statusCode, message); } on SocketException { NetLog.error('HttpApiClient', 'Ошибка', 'Нет интернета: $path'); throw const NoInternetException(); } on http.ClientException { NetLog.error('HttpApiClient', 'Ошибка', 'Нет соединения: $path'); throw const NoInternetException(); } on TimeoutException { NetLog.error('HttpApiClient', 'Ошибка', 'Таймаут: $path'); throw const TimeoutApiException(); } on FormatException { NetLog.error('HttpApiClient', 'Ошибка', 'Некорректный JSON: $path'); throw const ParseException(); } on ApiException { NetLog.error('HttpApiClient', 'Ошибка', 'Ответ сервера: $path'); rethrow; } } String? _extractMessage(String body) { try { final json = jsonDecode(body); if (json is Map) return (json['message'] ?? json['error'])?.toString(); } catch (_) {} return null; } } Адреса, названия полей ( token , message ) и формат ответов зависят от выданного вам API. Внимательно прочитайте документацию/карточку запроса и сверяйте поля с реальным ответом ( curl или Postman). Модель, API и маппинг ответа class UserDto { final String id; final String email; final String? name; final String? photoUrl; const UserDto({required this.id, required this.email, this.name, this.photoUrl}); factory UserDto.fromJson(Map\u003cString, dynamic> json) => UserDto( id: json['id'].toString(), email: json['email'] as String, name: json['name'] as String?, photoUrl: json['photo'] as String?, ); } abstract interface class AuthApi { Future\u003cAuthResultDto> login({required String email, required String password}); Future\u003cAuthResultDto> register({required String email, required String password}); Future\u003cvoid> logout(); } class AuthApiImpl implements AuthApi { final ApiClient _client; AuthApiImpl(this._client); @override Future\u003cAuthResultDto> login({required String email, required String password}) async { final json = await _client.post('/auth/login', body: {'email': email, 'password': password}); return AuthResultDto.fromJson(json); } ... } Каждый следующий запрос: DTO + метод + строка в интерфейсе. Заведите шпаргалку-таблицу из 11 запросов (метод, путь, тело, ответ), как только получили документацию. Тестирование (модуль Е, 4,95 балла) Тест-кейсы выдают в карточках. Пример из задания: «Успешный GET с десериализацией» — запускается мок-сервер, возвращается корректный JSON, проверяется код 200, содержимое модели и адрес запроса . В Dart мок-сервер заменяет MockClient из package:http/testing.dart . import 'dart:convert'; import 'package:flutter_test/flutter_test.dart'; import 'package:http/http.dart' as http; import 'package:http/testing.dart'; import 'package:network_layer/network_layer.dart'; void main() { group('ProfileApi.getProfile', () { test('успешный GET с десериализацией', () async { // Предусловие: мок-сервер возвращает корректный JSON late http.Request captured; final mock = MockClient((request) async { captured = request; return http.Response( jsonEncode({'id': '123', 'email': 'a@b.ru', 'name': 'Аня'}), 200, headers: {'content-type': 'application/json; charset=utf-8'}, ); }); final client = HttpApiClient(const ApiConfig(baseUrl: 'https://test.local'), client: mock); final api = ProfileApiImpl(client); // Шаг: вызвать метод final user = await api.getProfile('123'); // Ожидаемый результат expect(user.id, '123'); expect(user.name, 'Аня'); expect(captured.method, 'GET'); expect(captured.url.path, '/users/123'); // мок зафиксировал правильный эндпоинт }); test('ошибка сервера 500 → ServerException', () async { final mock = MockClient((_) async => http.Response('{\"message\":\"fail\"}', 500)); final api = ProfileApiImpl(HttpApiClient(const ApiConfig(baseUrl: 'https://t'), client: mock)); expect(() => api.getProfile('1'), throwsA(isA\u003cServerException>())); }); test('нет интернета → NoInternetException', () async { final mock = MockClient((_) async => throw http.ClientException('offline')); final api = ProfileApiImpl(HttpApiClient(const ApiConfig(baseUrl: 'https://t'), client: mock)); expect(() => api.getProfile('1'), throwsA(isA\u003cNoInternetException>())); }); }); } Запуск: flutter test . На каждый из 11 запросов минимум: успех, ошибка сервера, нет интернета (то, что требуют тест-кейсы карточки). Тест по каждому запросу стоит 0,45, поэтому сначала сделайте по одному успешному тесту на каждый запрос , потом добавляйте ошибки. Если используете dio , подменяйте адаптер ( http_mock_adapter ) или реализуйте HttpClientAdapter . Если вы пишете только на http , MockClient проще. Порядок на 70 минут Минуты Действие 0–5 Репозиторий, ветка, пакет 5–20 Конфиг, ошибки, интерфейс клиента, реализация, логи 20–45 11 запросов по шаблону (DTO + метод) 45–65 Тесты на каждый запрос 65–70 Тег, PR, merge, карточки Чек-лист Приложение/тесты зависят от ApiClient / AuthApi , не от http . Нет сети → NoInternetException ; код не 2xx → ServerException(statusCode, message) . URL, заголовки, таймаут — только в ApiConfig . Каждый запрос логируется: INFO старт, DEBUG успех, ERROR сбой. Тесты запускаются командой flutter test без сети. Версия и тег v1.0.0 . Максимальный балл: критерий за критерием Критерий (макс.) Что сделать точно Проверка Создана библиотека (0,5) Отдельный репозиторий и пакет network_layer flutter pub get проходит, экспорт в network_layer.dart SOLID (1,0) Интерфейс клиента, реализация отдельно, API-классы по областям, ошибки отдельно Объясните каждую букву на своём коде DRY (0,5) Конфиг, обработчик ошибок и базовые методы GET/POST в одном месте Нет повторяющегося try/catch Нет интернета → ошибка (0,7) SocketException / ClientException превращается в NoInternetException Отключите сеть и вызовите любой запрос Ошибка сервера → ошибка (0,84) Код вне 200–299 превращается в ServerException(code, message) Тест с ответом 500 Каждый из 11 запросов (по 1,1) Метод, DTO, правильный путь и тело Проверьте по документации API Тест на каждый запрос (по 0,45) test(...) с MockClient , проверка пути, метода, результата flutter test зелёный Комментарии и логи Шапки, описания методов, логи на каждый запрос Скрипт-проверка Git Ветка sprint-2 , PR, merge, тег v1.0.0 Видно в репозитории Подробно: шаблон запроса «в три шага» Чтобы сделать 11 запросов быстро, у каждого одинаковая структура: Шаг 1. DTO ответа и тела запроса. class LoginRequest { final String email, password; const LoginRequest(this.email, this.password); Map\u003cString, dynamic> toJson() => {'email': email, 'password': password}; } class AuthResultDto { final String token; final UserDto user; const AuthResultDto(this.token, this.user); factory AuthResultDto.fromJson(Map\u003cString, dynamic> j) => AuthResultDto(j['token'] as String, UserDto.fromJson(j['user'] as Map\u003cString, dynamic>)); } Шаг 2. Метод в интерфейсе и реализации. Future\u003cAuthResultDto> login(LoginRequest r) async => AuthResultDto.fromJson(await _client.post('/auth/login', body: r.toJson())); Шаг 3. Тест. test('login: успех', () async { /* MockClient → expect */ }); Одиннадцать запросов — одиннадцать повторений этого шаблона. Заранее составьте таблицу из документации: Запрос Метод Путь Тело Ответ Авторизация POST /... email, password token, user Регистрация POST Изменение профиля PUT Получение профиля GET Выход POST/DELETE Создание игры POST Список игр GET Информация об игре GET Подключение к игре POST Статистика игрока GET Сохранение результата POST (Пути и поля узнаете из документации API на соревновании.) Подробно: как тестировать ошибки Эксперт проверяет не только успех, но и ошибки. Для каждого запроса сделайте три теста: group('GameApi.getGames', () { test('успех: возвращает список', () async { /* 200 + JSON */ }); test('ошибка сервера: ServerException(500)', () async { final api = _api(MockClient((_) async => http.Response('{\"message\":\"boom\"}', 500))); expect(api.getGames(), throwsA(isA\u003cServerException>() .having((e) => e.statusCode, 'statusCode', 500))); }); test('нет интернета: NoInternetException', () async { final api = _api(MockClient((_) async => throw http.ClientException('offline'))); expect(api.getGames(), throwsA(isA\u003cNoInternetException>())); }); }); GameApi _api(http.Client c) => GameApiImpl(HttpApiClient(const ApiConfig(baseUrl: 'https://t'), client: c)); Если тест-кейс в карточке требует проверить тело запроса (для POST), проверьте его: final body = jsonDecode(request.body) as Map\u003cString, dynamic>; expect(body['email'], 'a@b.ru'); и заголовок авторизации : expect(request.headers['Authorization'], 'Bearer token'); . Подробно: отдельная библиотека — что это значит технически Свой репозиторий : git init , свой удалённый репозиторий, свои ветки и теги. Свой pubspec.yaml : имя, версия, зависимости ( http , logger ). Публичный API : lib/network_layer.dart экспортирует только то, что нужно приложению (интерфейсы, DTO, ошибки, конфиг, реализация). Остальное в src/ . Подключение в приложение : git: url: ... ref: v1.0.0 либо path: ../network_layer . Заменяемость : приложение пишет ApiClient client = HttpApiClient(config); в одном месте (DI). Заменить на DioApiClient значит поменять одну строку . Проверка «заменяемости» — сделайте второй класс FakeApiClient implements ApiClient , возвращающий готовые данные, и подставьте его в тесте. Если приложение работает, архитектура правильная. Репетиция спринта 2 Возьмите любой открытый API с авторизацией и списками (например, jsonplaceholder.typicode.com ). Сымитируйте 11 запросов (посты, пользователи, комментарии). Реализуйте за 70 минут вместе с тестами. В симуляции запишите, на каком запросе замедлились. ", "hours": 6, "minutes": 11}, {"id": "sprint3", "stage": 6, "title": "Спринт 3: вход и расписание игры", "lead": "1 ч. Первые экраны приложения на архитектуре с тремя слоями. Максимум 21,95 балла.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 30%\" />\n\u003ccol style=\"width: 40%\" />\n\u003ccol style=\"width: 30%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Задача\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы (верстка)\u003c/th>\n\u003cth>Где ещё баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>SplashScreen\u003c/td>\n\u003ctd style=\"text-align: right;\">0,15\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>3 приветственных экрана, только при первом запуске, с кнопкой «Пропустить»\u003c/td>\n\u003ctd style=\"text-align: right;\">0,60\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Экран «Регистрация»\u003c/td>\n\u003ctd style=\"text-align: right;\">1,10 + 0,70 (скролл)\u003c/td>\n\u003ctd>Сеть 1,10\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Проверка email\u003c/td>\n\u003ctd style=\"text-align: right;\">0,50\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Показ пароля\u003c/td>\n\u003ctd style=\"text-align: right;\">0,20\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Авторизация\u003c/td>\n\u003ctd style=\"text-align: right;\">0,70\u003c/td>\n\u003ctd>Сеть 1,10\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Landing Screen\u003c/td>\n\u003ctd style=\"text-align: right;\">0,40\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Меню-«гамбургер» слева с анимацией, закрывается свайпом и крестиком\u003c/td>\n\u003ctd style=\"text-align: right;\">1,00\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Центральная кнопка нижнего меню → Schedule Game\u003c/td>\n\u003ctd style=\"text-align: right;\">0,05\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Schedule Game, системные дата/время\u003c/td>\n\u003ctd style=\"text-align: right;\">1,10 + 0,10\u003c/td>\n\u003ctd>Сеть 1,10\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Publish → Success → Landing\u003c/td>\n\u003ctd style=\"text-align: right;\">0,05\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектура: папки, три слоя, SOLID, DRY\u003c/td>\n\u003ctd style=\"text-align: right;\">6,20\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Хранение: PDF-политика, соглашение, сессия, последний экран\u003c/td>\n\u003ctd style=\"text-align: right;\">1,50\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Аппаратная часть: фото профиля (галерея/камера)\u003c/td>\n\u003ctd style=\"text-align: right;\">4,00\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Архитектура здесь стоит \u003cstrong>6,2 балла\u003c/strong> — почти как вся верстка. Не откладывайте слои «на потом».\u003c/p>\n\u003ch2>Подготовка (первые 10 минут)\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Ветка \u003ccode>sprint-3\u003c/code> от \u003ccode>main\u003c/code>.\u003c/li>\n\u003cli>Создать проект, добавить \u003ccode>uikit\u003c/code> и \u003ccode>network_layer\u003c/code> из Git (по тегам), пакеты \u003ccode>shared_preferences\u003c/code>, \u003ccode>image_picker\u003c/code>, \u003ccode>logger\u003c/code>.\u003c/li>\n\u003cli>Создать папки \u003ccode>domain / data / presentation / common\u003c/code>.\u003c/li>\n\u003cli>Подключить DI-файл (\u003ccode>common/di.dart\u003c/code>).\u003c/li>\n\u003cli>Поднять \u003ccode>ScaffoldMessenger\u003c/code> для ошибок сети на 5 секунд.\u003c/li>\n\u003c/ol>\n\u003ch2>Splash и первый запуск\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// presentation/screens/splash/splash_screen.dart\nclass _SplashScreenState extends State&lt;SplashScreen&gt; {\n  @override\n  void initState() {\n    super.initState();\n    AppLog.info(&#39;SplashScreen&#39;, &#39;Жизненный цикл&#39;, &#39;initState&#39;);\n    _decide();\n  }\n\n  // Решает, какой экран открыть: онбординг, вход или последний сохранённый\n  Future&lt;void&gt; _decide() async {\n    await Future.delayed(const Duration(seconds: 2)); // время показа Splash по макету\n    final prefs = await SharedPreferences.getInstance();\n    final seenOnboarding = prefs.getBool(&#39;seen_onboarding&#39;) ?? false;\n    final token = prefs.getString(&#39;token&#39;);\n    final lastRoute = prefs.getString(&#39;last_route&#39;);\n\n    if (!mounted) return;\n    final next = !seenOnboarding\n        ? &#39;/onboarding&#39;\n        : token == null\n            ? &#39;/login&#39;\n            : (lastRoute ?? &#39;/landing&#39;);\n    Navigator.of(context).pushReplacementNamed(next);\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Приветственные экраны: \u003ccode>PageView\u003c/code> + \u003ccode>UiPagination\u003c/code> + кнопка «Skip», которая ведёт на \u003cstrong>регистрацию\u003c/strong>. Флаг \u003ccode>seen_onboarding = true\u003c/code> сохраняйте в момент выхода из онбординга (как через «Пропустить», так и на последнем экране).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>PageView(\n  controller: _page,\n  onPageChanged: (i) =&gt; setState(() =&gt; _index = i),\n  children: const [OnboardingPage1(), OnboardingPage2(), OnboardingPage3()],\n)\u003c/code>\u003c/pre>\n\u003ch2>Регистрация и вход\u003c/h2>\n\u003cp>Шаблон: \u003ccode>ЭкранRegistration\u003c/code> → \u003ccode>RegistrationController\u003c/code> → \u003ccode>RegisterUseCase\u003c/code> → \u003ccode>AuthRepository\u003c/code> (интерфейс в domain) → \u003ccode>AuthRepositoryImpl\u003c/code> (в data) → \u003ccode>AuthApi\u003c/code> (сетевая библиотека).\u003c/p>\n\u003cp>Проверка email по заданию (только маленькие буквы и цифры в имени и домене):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Проверяет email на соответствие шаблону name@domenname.ru\n// Принимает: строку [value]. Возвращает: true, если адрес корректен.\nbool isValidEmail(String value) =&gt;\n    RegExp(r&#39;^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$&#39;).hasMatch(value);\u003c/code>\u003c/pre>\n\u003cp>В реальном задании уточните по макету: допустимы ли точки в домене (\u003ccode>mail.co.uk\u003c/code>), нужна ли проверка на «живую» при вводе или при нажатии кнопки.\u003c/p>\n\u003cp>Макет регистрации: картинка сверху + заголовок «Create Account», который должен оставаться на месте при прокрутке — используйте \u003ccode>CustomScrollView\u003c/code> с \u003ccode>SliverAppBar(pinned: true)\u003c/code> или \u003ccode>Stack\u003c/code> с фиксированным заголовком.\u003c/p>\n\u003cp>Ошибки сети на 5 секунд с закрытием по кнопке:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>void showError(BuildContext context, String text) {\n  final messenger = ScaffoldMessenger.of(context);\n  messenger.hideCurrentSnackBar();\n  messenger.showSnackBar(SnackBar(\n    duration: const Duration(seconds: 5),\n    content: Text(text),\n    action: SnackBarAction(label: &#39;OK&#39;, onPressed: messenger.hideCurrentSnackBar),\n  ));\n}\u003c/code>\u003c/pre>\n\u003cp>Лучше сделать это компонентом UIKit (\u003ccode>UiToast\u003c/code>/\u003ccode>showErrorToast\u003c/code>), если макет отличается от стандартного SnackBar.\u003c/p>\n\u003ch2>Сессия и последний экран\u003c/h2>\n\u003cp>Модуль Г: «данные входа и активная сессия сохраняются после перезапуска» и «сохранять состояние последнего экрана».\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Сохранение токена после успешного входа\nfinal prefs = await SharedPreferences.getInstance();\nawait prefs.setString(&#39;token&#39;, result.token);\napiClient.setToken(result.token);   // и при старте приложения — восстановить\n\n// Запоминаем последний открытый экран через NavigatorObserver\nclass LastRouteObserver extends NavigatorObserver {\n  @override\n  void didPush(Route&lt;dynamic&gt; route, Route&lt;dynamic&gt;? previousRoute) {\n    final name = route.settings.name;\n    if (name != null) _save(name);\n  }\n\n  @override\n  void didPop(Route&lt;dynamic&gt; route, Route&lt;dynamic&gt;? previousRoute) {\n    final name = previousRoute?.settings.name;\n    if (name != null) _save(name);\n  }\n\n  Future&lt;void&gt; _save(String name) async {\n    final prefs = await SharedPreferences.getInstance();\n    await prefs.setString(&#39;last_route&#39;, name);\n  }\n}\n\nMaterialApp(navigatorObservers: [LastRouteObserver()], ...)\u003c/code>\u003c/pre>\n\u003cp>Если экран зависит от параметра (например, \u003ccode>gameId\u003c/code>), сохраняйте и его: \u003ccode>last_route_args\u003c/code>.\u003c/p>\n\u003cp>Выход из аккаунта: запрос \u003ccode>logout\u003c/code>, удалить токен и последний экран, вернуться на логин.\u003c/p>\n\u003ch2>Меню слева\u003c/h2>\n\u003cp>Самый простой и надёжный способ: \u003ccode>Scaffold.drawer\u003c/code>. Он выезжает слева с анимацией и закрывается свайпом влево.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Scaffold(\n  key: _scaffoldKey,\n  drawer: AppDrawer(),           // стилизуйте под макет: ширина, фон, скругления\n  appBar: AppBar(leading: IconButton(\n    icon: const Icon(Icons.menu),\n    onPressed: () =&gt; _scaffoldKey.currentState?.openDrawer())),\n)\n\n// Внутри AppDrawer кнопка закрытия:\nIconButton(icon: const Icon(Icons.close), onPressed: () =&gt; Navigator.of(context).pop())\u003c/code>\u003c/pre>\n\u003cp>Если дизайн не похож на стандартный Drawer, соберите свой через \u003ccode>Stack\u003c/code> + \u003ccode>AnimatedSlide\u003c/code> + \u003ccode>GestureDetector(onHorizontalDragEnd: ...)\u003c/code>.\u003c/p>\n\u003ch2>Schedule Game\u003c/h2>\n\u003cp>Поля: название, категория (Select), дата и время, галка уведомления. Для даты и времени — \u003ccode>showDatePicker\u003c/code> / \u003ccode>showTimePicker\u003c/code>. После Publish:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Валидация.\u003c/li>\n\u003cli>Вызов UseCase → репозиторий → сеть (игра сохраняется на сервере).\u003c/li>\n\u003cli>Переход на \u003ccode>Success\u003c/code>, оттуда — \u003ccode>pushAndRemoveUntil\u003c/code> на Landing.\u003c/li>\n\u003c/ol>\n\u003cpre class=\"dart\">\u003ccode>final start = DateTime(d.year, d.month, d.day, t.hour, t.minute);\u003c/code>\u003c/pre>\n\u003cp>Если стоит галка уведомления, сохраните это поле (оно понадобится в спринте 4).\u003c/p>\n\u003ch2>Политика и соглашение\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// PDF из assets: пакет pdfx\nfinal doc = await PdfDocument.openAsset(&#39;assets/docs/privacy.pdf&#39;);\n// Пользовательское соглашение: обычный экран с текстом и прокруткой\u003c/code>\u003c/pre>\n\u003cp>Пропишите файлы в \u003ccode>pubspec.yaml\u003c/code> в \u003ccode>assets\u003c/code>. Без пакета для PDF можно открыть файл через \u003ccode>url_launcher\u003c/code>, но проще и надёжнее показать внутри приложения.\u003c/p>\n\u003ch2>Фото профиля (камера и галерея)\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final picker = ImagePicker();\n\nFuture&lt;void&gt; pickPhoto() async {\n  final source = await showModalBottomSheet&lt;ImageSource&gt;(\n    context: context,\n    builder: (_) =&gt; const PhotoSourceSheet(), // Галерея / Камера\n  );\n  if (source == null) return;\n  try {\n    final file = await picker.pickImage(source: source, maxWidth: 1024, imageQuality: 85);\n    if (file == null) return; // пользователь отменил\n    // отправить на сервер или сохранить, затем обновить аватар на экране\n  } catch (e, st) {\n    AppLog.error(&#39;PlayerScreen&#39;, &#39;Фото&#39;, &#39;Не удалось выбрать фото&#39;, e, st);\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Права:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Android\u003c/strong> — \u003ccode>AndroidManifest.xml\u003c/code>: \u003ccode>&lt;uses-permission android:name=\"android.permission.CAMERA\"/&gt;\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>iOS\u003c/strong> — \u003ccode>Info.plist\u003c/code>: \u003ccode>NSCameraUsageDescription\u003c/code>, \u003ccode>NSPhotoLibraryUsageDescription\u003c/code> с текстом на русском.\u003c/li>\n\u003c/ul>\n\u003cp>Проверьте поведение при \u003cstrong>отказе\u003c/strong> в разрешении: приложение не должно падать, показывает понятное сообщение.\u003c/p>\n\u003ch2>Что чаще всего теряют в спринте 3\u003c/h2>\n\u003cul>\n\u003cli>Слои смешаны: экран импортирует \u003ccode>data/\u003c/code>, \u003ccode>domain\u003c/code> знает про \u003ccode>http\u003c/code>.\u003c/li>\n\u003cli>Файлы лежат вне нужных папок (−0,1 за файл).\u003c/li>\n\u003cli>Нет проверки «только первый запуск»: онбординг показывается снова.\u003c/li>\n\u003cli>Забыли \u003ccode>mounted\u003c/code> после \u003ccode>await\u003c/code> — падение при переходе.\u003c/li>\n\u003cli>Не закрыли Success → Landing через очистку стека (можно вернуться назад).\u003c/li>\n\u003c/ul>\n\u003ch2>Чек-лист\u003c/h2>\n\u003cul class=\"task-list\">\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Три слоя, Domain без импортов Flutter и сети.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Все обращения в сеть идут через интерфейс репозитория → интерфейс сетевого слоя.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Ошибки: SnackBar 5 секунд + закрытие.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Перезапуск приложения возвращает на сохранённый экран, сессия сохранена.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Фото: галерея и камера, права прописаны.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Комментарии и логи во всех классах.\u003c/label>\u003c/li>\n\u003c/ul>\n\u003ch2>Максимальный балл: критерий за критерием\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Критерий (макс.)\u003c/th>\n\u003cth>Что сделать точно\u003c/th>\n\u003cth>Проверка\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>SplashScreen (0,15)\u003c/td>\n\u003ctd>Экран по макету, показывается 1–3 секунды\u003c/td>\n\u003ctd>Сравнить с макетом\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>3 приветственных экрана только при первом запуске (0,6)\u003c/td>\n\u003ctd>\u003ccode>PageView\u003c/code>, пагинация, «Пропустить» → регистрация, флаг \u003ccode>seen_onboarding\u003c/code>\u003c/td>\n\u003ctd>Удалить данные приложения → показываются; второй запуск → нет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Регистрация по макету (1,1)\u003c/td>\n\u003ctd>Все элементы, состояния полей, шрифты\u003c/td>\n\u003ctd>Наложить на макет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Прокрутка с фиксированным заголовком (0,7)\u003c/td>\n\u003ctd>\u003ccode>SliverAppBar(pinned)\u003c/code> либо \u003ccode>Stack\u003c/code>\u003c/td>\n\u003ctd>Открыть на маленьком экране с клавиатурой\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Проверка email (0,5)\u003c/td>\n\u003ctd>RegExp, ошибка под полем\u003c/td>\n\u003ctd>Ввести \u003ccode>Abc@mail.ru\u003c/code>, \u003ccode>a@b\u003c/code>, \u003ccode>a@b.ru\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Показ пароля (0,2)\u003c/td>\n\u003ctd>Иконка-глаз переключает \u003ccode>obscureText\u003c/code>\u003c/td>\n\u003ctd>Нажать\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Авторизация по макету (0,7)\u003c/td>\n\u003ctd>Экран входа со всеми состояниями\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Landing Screen (0,4)\u003c/td>\n\u003ctd>По макету, Bottom Bar\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Меню-гамбургер (1,0)\u003c/td>\n\u003ctd>Слева, с анимацией, закрывается свайпом влево и крестиком\u003c/td>\n\u003ctd>Проверить оба способа\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Центральная кнопка → Schedule Game (0,05)\u003c/td>\n\u003ctd>\u003ccode>onTap\u003c/code> центральной кнопки\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Schedule Game (1,1)\u003c/td>\n\u003ctd>Все поля и состояния\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Системные дата/время (0,1)\u003c/td>\n\u003ctd>\u003ccode>showDatePicker\u003c/code>, \u003ccode>showTimePicker\u003c/code>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Publish → Success → Landing (0,05)\u003c/td>\n\u003ctd>\u003ccode>pushAndRemoveUntil\u003c/code>\u003c/td>\n\u003ctd>Назад не возвращает на форму\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сеть: вход, регистрация, Schedule Game (по 1,1)\u003c/td>\n\u003ctd>Через UseCase → репозиторий → сетевая библиотека; ошибка на 5 секунд\u003c/td>\n\u003ctd>Отключить интернет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Папки (0,3)\u003c/td>\n\u003ctd>Каждый файл в \u003ccode>domain/data/presentation/common\u003c/code> (−0,1 за файл вне папок)\u003c/td>\n\u003ctd>Посмотреть дерево\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Слои чистые (по 1,0)\u003c/td>\n\u003ctd>grep-проверка из раздела «Архитектура»\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>SOLID, DRY (по 1,0)\u003c/td>\n\u003ctd>Нет дублей, зависимости через интерфейсы\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Хранение (1,5)\u003c/td>\n\u003ctd>PDF-политика, соглашение, сессия, последний экран\u003c/td>\n\u003ctd>Перезапустить приложение\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Фото профиля (4,0 в модуле Д)\u003c/td>\n\u003ctd>Галерея и камера, фото сменяется\u003c/td>\n\u003ctd>Проверить на устройстве\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Комментарии и логи\u003c/td>\n\u003ctd>Шапки, методы, логи\u003c/td>\n\u003ctd>Скрипт-проверка\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: алгоритм «последний экран» без ошибок\u003c/h2>\n\u003cp>Требование: после перезапуска приложение открывает тот экран, где пользователь остановился.\u003c/p>\n\u003col type=\"1\">\n\u003cli>У каждого маршрута есть \u003cstrong>имя\u003c/strong> (\u003ccode>'/landing'\u003c/code>, \u003ccode>'/schedule'\u003c/code>, \u003ccode>'/profile'\u003c/code>).\u003c/li>\n\u003cli>\u003ccode>NavigatorObserver\u003c/code> записывает имя в \u003ccode>SharedPreferences\u003c/code> при открытии и закрытии маршрутов.\u003c/li>\n\u003cli>\u003ccode>SplashScreen\u003c/code> (или \u003ccode>main\u003c/code>) читает \u003ccode>last_route\u003c/code> и открывает его, \u003cstrong>если есть токен\u003c/strong>.\u003c/li>\n\u003cli>Для экранов с параметрами (\u003ccode>gameId\u003c/code>) сохраняйте аргумент отдельным ключом.\u003c/li>\n\u003cli>После выхода из аккаунта \u003ccode>last_route\u003c/code> стирается.\u003c/li>\n\u003c/ol>\n\u003cp>Пограничные случаи, о которых забывают:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Случай\u003c/th>\n\u003cth>Что делать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Последний экран — Splash или онбординг\u003c/td>\n\u003ctd>Не сохранять эти маршруты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Нет токена, но есть \u003ccode>last_route\u003c/code>\u003c/td>\n\u003ctd>Открыть вход\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Экран игры в процессе\u003c/td>\n\u003ctd>Не восстанавливать игру, а засчитать поражение (спринты 4–5)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сохранённый \u003ccode>gameId\u003c/code> больше не существует\u003c/td>\n\u003ctd>Показать ошибку и открыть Landing\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: слои для экрана авторизации (структура файлов)\u003c/h2>\n\u003cpre>\u003ccode>lib/\n  common/di.dart\n  domain/\n    entities/user.dart\n    repositories/auth_repository.dart\n    usecases/login.dart\n    usecases/register.dart\n    exceptions/domain_exception.dart\n  data/\n    datasources/auth_remote_source.dart\n    datasources/session_local_source.dart\n    mappers/user_mapper.dart\n    repositories/auth_repository_impl.dart\n  presentation/\n    screens/login/login_screen.dart\n    screens/login/login_controller.dart\n    screens/register/register_screen.dart\n    screens/register/register_controller.dart\n    widgets/error_snackbar.dart\u003c/code>\u003c/pre>\n\u003cp>Пошагово:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003ccode>User\u003c/code> (Entity) без зависимостей.\u003c/li>\n\u003cli>\u003ccode>AuthRepository\u003c/code> (абстрактный интерфейс).\u003c/li>\n\u003cli>\u003ccode>LoginUseCase\u003c/code> и \u003ccode>RegisterUseCase\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>AuthRemoteSource\u003c/code> вызывает \u003ccode>AuthApi\u003c/code> из сетевой библиотеки.\u003c/li>\n\u003cli>\u003ccode>UserMapper\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>AuthRepositoryImpl\u003c/code>.\u003c/li>\n\u003cli>Контроллеры экранов.\u003c/li>\n\u003cli>Экраны.\u003c/li>\n\u003cli>\u003ccode>di.dart\u003c/code> собирает всё в одном месте.\u003c/li>\n\u003c/ol>\n\u003cp>Каждая шапка файла: описание, дата, номер.\u003c/p>\n\u003ch2>Подробно: меню слева — вариант без \u003ccode>Drawer\u003c/code>\u003c/h2>\n\u003cp>Если макет требует нестандартного вида, сделайте свою панель:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Stack(children: [\n  content,\n  if (open) GestureDetector(onTap: close, child: Container(color: Colors.black54)), // затемнение\n  AnimatedSlide(\n    offset: open ? Offset.zero : const Offset(-1, 0),\n    duration: const Duration(milliseconds: 250),\n    curve: Curves.easeOut,\n    child: GestureDetector(\n      onHorizontalDragEnd: (d) { if ((d.primaryVelocity ?? 0) &lt; 0) close(); },\n      child: SizedBox(width: MediaQuery.sizeOf(context).width * 0.8, child: const MenuPanel()),\n    ),\n  ),\n])\u003c/code>\u003c/pre>\n\u003cp>Обязательно: крестик внутри панели вызывает \u003ccode>close()\u003c/code>; тап по затемнению тоже закрывает; свайп влево закрывает.\u003c/p>\n\u003ch2>Подробно: фото профиля — полный сценарий\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Нажатие на «Фото» → лог INFO → BottomSheet «Галерея / Камера».\u003c/li>\n\u003cli>\u003ccode>ImagePicker().pickImage(source: ...)\u003c/code>.\u003c/li>\n\u003cli>Пользователь отменил → \u003ccode>null\u003c/code> → ничего не делать.\u003c/li>\n\u003cli>Загрузка фото на сервер (запрос «изменение профиля»), если API это поддерживает; либо сохранить локально (путь в \u003ccode>SharedPreferences\u003c/code>).\u003c/li>\n\u003cli>Обновить аватар на экране (через контроллер), показать индикатор загрузки.\u003c/li>\n\u003cli>Ошибки сети — SnackBar на 5 секунд.\u003c/li>\n\u003cli>Отказ в разрешении — понятное сообщение, приложение не падает.\u003c/li>\n\u003c/ol>\n\u003cp>Манифесты (Android: \u003ccode>CAMERA\u003c/code>; iOS: \u003ccode>NSCameraUsageDescription\u003c/code>, \u003ccode>NSPhotoLibraryUsageDescription\u003c/code>) настройте \u003cstrong>заранее на симуляции\u003c/strong>, чтобы на соревновании не искать.\u003c/p>\n\u003ch2>Репетиция спринта 3\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Соберите экраны Splash → Onboarding → Регистрация → Вход → Landing по макету (любому).\u003c/li>\n\u003cli>Проведите проверку «перезапуск приложения на каждом экране».\u003c/li>\n\u003cli>Проверьте grep-скриптом слои.\u003c/li>\n\u003cli>Запишите в заметках симуляции всё, что вызвало вопросы.\u003c/li>\n\u003c/ol>\n", "text": " Что нужно сделать Задача Баллы (верстка) Где ещё баллы SplashScreen 0,15 3 приветственных экрана, только при первом запуске, с кнопкой «Пропустить» 0,60 Экран «Регистрация» 1,10 + 0,70 (скролл) Сеть 1,10 Проверка email 0,50 Показ пароля 0,20 Авторизация 0,70 Сеть 1,10 Landing Screen 0,40 Меню-«гамбургер» слева с анимацией, закрывается свайпом и крестиком 1,00 Центральная кнопка нижнего меню → Schedule Game 0,05 Schedule Game, системные дата/время 1,10 + 0,10 Сеть 1,10 Publish → Success → Landing 0,05 Архитектура: папки, три слоя, SOLID, DRY 6,20 Хранение: PDF-политика, соглашение, сессия, последний экран 1,50 Аппаратная часть: фото профиля (галерея/камера) 4,00 Архитектура здесь стоит 6,2 балла — почти как вся верстка. Не откладывайте слои «на потом». Подготовка (первые 10 минут) Ветка sprint-3 от main . Создать проект, добавить uikit и network_layer из Git (по тегам), пакеты shared_preferences , image_picker , logger . Создать папки domain / data / presentation / common . Подключить DI-файл ( common/di.dart ). Поднять ScaffoldMessenger для ошибок сети на 5 секунд. Splash и первый запуск // presentation/screens/splash/splash_screen.dart class _SplashScreenState extends State\u003cSplashScreen> { @override void initState() { super.initState(); AppLog.info('SplashScreen', 'Жизненный цикл', 'initState'); _decide(); } // Решает, какой экран открыть: онбординг, вход или последний сохранённый Future\u003cvoid> _decide() async { await Future.delayed(const Duration(seconds: 2)); // время показа Splash по макету final prefs = await SharedPreferences.getInstance(); final seenOnboarding = prefs.getBool('seen_onboarding') ?? false; final token = prefs.getString('token'); final lastRoute = prefs.getString('last_route'); if (!mounted) return; final next = !seenOnboarding ? '/onboarding' : token == null ? '/login' : (lastRoute ?? '/landing'); Navigator.of(context).pushReplacementNamed(next); } } Приветственные экраны: PageView + UiPagination + кнопка «Skip», которая ведёт на регистрацию . Флаг seen_onboarding = true сохраняйте в момент выхода из онбординга (как через «Пропустить», так и на последнем экране). PageView( controller: _page, onPageChanged: (i) => setState(() => _index = i), children: const [OnboardingPage1(), OnboardingPage2(), OnboardingPage3()], ) Регистрация и вход Шаблон: ЭкранRegistration → RegistrationController → RegisterUseCase → AuthRepository (интерфейс в domain) → AuthRepositoryImpl (в data) → AuthApi (сетевая библиотека). Проверка email по заданию (только маленькие буквы и цифры в имени и домене): // Проверяет email на соответствие шаблону name@domenname.ru // Принимает: строку [value]. Возвращает: true, если адрес корректен. bool isValidEmail(String value) => RegExp(r'^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$').hasMatch(value); В реальном задании уточните по макету: допустимы ли точки в домене ( mail.co.uk ), нужна ли проверка на «живую» при вводе или при нажатии кнопки. Макет регистрации: картинка сверху + заголовок «Create Account», который должен оставаться на месте при прокрутке — используйте CustomScrollView с SliverAppBar(pinned: true) или Stack с фиксированным заголовком. Ошибки сети на 5 секунд с закрытием по кнопке: void showError(BuildContext context, String text) { final messenger = ScaffoldMessenger.of(context); messenger.hideCurrentSnackBar(); messenger.showSnackBar(SnackBar( duration: const Duration(seconds: 5), content: Text(text), action: SnackBarAction(label: 'OK', onPressed: messenger.hideCurrentSnackBar), )); } Лучше сделать это компонентом UIKit ( UiToast / showErrorToast ), если макет отличается от стандартного SnackBar. Сессия и последний экран Модуль Г: «данные входа и активная сессия сохраняются после перезапуска» и «сохранять состояние последнего экрана». // Сохранение токена после успешного входа final prefs = await SharedPreferences.getInstance(); await prefs.setString('token', result.token); apiClient.setToken(result.token); // и при старте приложения — восстановить // Запоминаем последний открытый экран через NavigatorObserver class LastRouteObserver extends NavigatorObserver { @override void didPush(Route\u003cdynamic> route, Route\u003cdynamic>? previousRoute) { final name = route.settings.name; if (name != null) _save(name); } @override void didPop(Route\u003cdynamic> route, Route\u003cdynamic>? previousRoute) { final name = previousRoute?.settings.name; if (name != null) _save(name); } Future\u003cvoid> _save(String name) async { final prefs = await SharedPreferences.getInstance(); await prefs.setString('last_route', name); } } MaterialApp(navigatorObservers: [LastRouteObserver()], ...) Если экран зависит от параметра (например, gameId ), сохраняйте и его: last_route_args . Выход из аккаунта: запрос logout , удалить токен и последний экран, вернуться на логин. Меню слева Самый простой и надёжный способ: Scaffold.drawer . Он выезжает слева с анимацией и закрывается свайпом влево. Scaffold( key: _scaffoldKey, drawer: AppDrawer(), // стилизуйте под макет: ширина, фон, скругления appBar: AppBar(leading: IconButton( icon: const Icon(Icons.menu), onPressed: () => _scaffoldKey.currentState?.openDrawer())), ) // Внутри AppDrawer кнопка закрытия: IconButton(icon: const Icon(Icons.close), onPressed: () => Navigator.of(context).pop()) Если дизайн не похож на стандартный Drawer, соберите свой через Stack + AnimatedSlide + GestureDetector(onHorizontalDragEnd: ...) . Schedule Game Поля: название, категория (Select), дата и время, галка уведомления. Для даты и времени — showDatePicker / showTimePicker . После Publish: Валидация. Вызов UseCase → репозиторий → сеть (игра сохраняется на сервере). Переход на Success , оттуда — pushAndRemoveUntil на Landing. final start = DateTime(d.year, d.month, d.day, t.hour, t.minute); Если стоит галка уведомления, сохраните это поле (оно понадобится в спринте 4). Политика и соглашение // PDF из assets: пакет pdfx final doc = await PdfDocument.openAsset('assets/docs/privacy.pdf'); // Пользовательское соглашение: обычный экран с текстом и прокруткой Пропишите файлы в pubspec.yaml в assets . Без пакета для PDF можно открыть файл через url_launcher , но проще и надёжнее показать внутри приложения. Фото профиля (камера и галерея) final picker = ImagePicker(); Future\u003cvoid> pickPhoto() async { final source = await showModalBottomSheet\u003cImageSource>( context: context, builder: (_) => const PhotoSourceSheet(), // Галерея / Камера ); if (source == null) return; try { final file = await picker.pickImage(source: source, maxWidth: 1024, imageQuality: 85); if (file == null) return; // пользователь отменил // отправить на сервер или сохранить, затем обновить аватар на экране } catch (e, st) { AppLog.error('PlayerScreen', 'Фото', 'Не удалось выбрать фото', e, st); } } Права: Android — AndroidManifest.xml : \u003cuses-permission android:name=\"android.permission.CAMERA\"/> . iOS — Info.plist : NSCameraUsageDescription , NSPhotoLibraryUsageDescription с текстом на русском. Проверьте поведение при отказе в разрешении: приложение не должно падать, показывает понятное сообщение. Что чаще всего теряют в спринте 3 Слои смешаны: экран импортирует data/ , domain знает про http . Файлы лежат вне нужных папок (−0,1 за файл). Нет проверки «только первый запуск»: онбординг показывается снова. Забыли mounted после await — падение при переходе. Не закрыли Success → Landing через очистку стека (можно вернуться назад). Чек-лист Три слоя, Domain без импортов Flutter и сети. Все обращения в сеть идут через интерфейс репозитория → интерфейс сетевого слоя. Ошибки: SnackBar 5 секунд + закрытие. Перезапуск приложения возвращает на сохранённый экран, сессия сохранена. Фото: галерея и камера, права прописаны. Комментарии и логи во всех классах. Максимальный балл: критерий за критерием Критерий (макс.) Что сделать точно Проверка SplashScreen (0,15) Экран по макету, показывается 1–3 секунды Сравнить с макетом 3 приветственных экрана только при первом запуске (0,6) PageView , пагинация, «Пропустить» → регистрация, флаг seen_onboarding Удалить данные приложения → показываются; второй запуск → нет Регистрация по макету (1,1) Все элементы, состояния полей, шрифты Наложить на макет Прокрутка с фиксированным заголовком (0,7) SliverAppBar(pinned) либо Stack Открыть на маленьком экране с клавиатурой Проверка email (0,5) RegExp, ошибка под полем Ввести Abc@mail.ru , a@b , a@b.ru Показ пароля (0,2) Иконка-глаз переключает obscureText Нажать Авторизация по макету (0,7) Экран входа со всеми состояниями Landing Screen (0,4) По макету, Bottom Bar Меню-гамбургер (1,0) Слева, с анимацией, закрывается свайпом влево и крестиком Проверить оба способа Центральная кнопка → Schedule Game (0,05) onTap центральной кнопки Schedule Game (1,1) Все поля и состояния Системные дата/время (0,1) showDatePicker , showTimePicker Publish → Success → Landing (0,05) pushAndRemoveUntil Назад не возвращает на форму Сеть: вход, регистрация, Schedule Game (по 1,1) Через UseCase → репозиторий → сетевая библиотека; ошибка на 5 секунд Отключить интернет Папки (0,3) Каждый файл в domain/data/presentation/common (−0,1 за файл вне папок) Посмотреть дерево Слои чистые (по 1,0) grep-проверка из раздела «Архитектура» SOLID, DRY (по 1,0) Нет дублей, зависимости через интерфейсы Хранение (1,5) PDF-
