+ ), отправил запрос, сохранил токен. Перерисовка : Flutter заново строит часть интерфейса по новым данным. Поэтому код в приложении делится на три роли: что показать (UI), что сделать (логика), откуда взять данные (сервер и память). Слои архитектуры (Presentation, Domain, Data) — как раз эти три роли, аккуратно разложенные по папкам. Мини-практика Напишите функцию, которая принимает список очков и возвращает максимальное (без max() ). Напишите функцию isPalindrome(String) . Протрассируйте вручную цикл for (var i = 1; i \u003c= 3; i++) { total += i * 2; } . Опишите алгоритм «зарегистрироваться в приложении» в виде нумерованных шагов. Объясните однокласснику, чем клиент отличается от сервера, своими словами. ", "hours": 2, "minutes": 6}, {"id": "dart-basics", "stage": 2, "title": "Dart: основы языка", "lead": "Синтаксис, типы, null safety, функции, коллекции. Всё, что нужно для чтения и написания кода во Flutter.", "html": "\u003ch2>Переменные и типы\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>void main() {\n  int age = 18;                 // целое\n  double price = 19.99;         // дробное\n  String name = &#39;Юлдуз&#39;;        // строка\n  bool isReady = true;          // логическое\n  var city = &#39;Сургут&#39;;          // тип выводится сам (String)\n  final today = DateTime.now(); // нельзя переприсвоить, значение известно при запуске\n  const maxScore = 100;         // константа времени компиляции\n\n  print(&#39;Привет, $name! Тебе $age, баллов: ${maxScore - 5}&#39;);\n}\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ключевое слово\u003c/th>\n\u003cth>Когда\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>var\u003c/code>\u003c/td>\n\u003ctd>Тип понятен из значения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>final\u003c/code>\u003c/td>\n\u003ctd>Значение задаётся один раз во время работы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>const\u003c/code>\u003c/td>\n\u003ctd>Значение известно ещё при компиляции (цвета, отступы, константные виджеты)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Null safety\u003c/h2>\n\u003cp>Обычный тип не может хранить \u003ccode>null\u003c/code>. Чтобы разрешить, добавьте \u003ccode>?\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>String? nickname;                 // может быть null\nString title = nickname ?? &#39;Игрок&#39;; // ?? — значение по умолчанию\nprint(nickname?.length);          // ?. — безопасный вызов, вернёт null\nprint(nickname!.length);          // ! — «я уверена, что не null» (упадёт, если null)\n\nlate String token;                // будет присвоено позже, до первого чтения\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Оператор \u003ccode>!\u003c/code> — частая причина падений. Используйте \u003ccode>??\u003c/code>, \u003ccode>?.\u003c/code> или проверку \u003ccode>if (x != null)\u003c/code>.\u003c/p>\n\u003c/div>\n\u003ch2>Условия и циклы\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>if (score &gt;= 10) {\n  print(&#39;Победа&#39;);\n} else if (score &gt;= 5) {\n  print(&#39;Ничья&#39;);\n} else {\n  print(&#39;Поражение&#39;);\n}\n\nfinal label = score &gt; 5 ? &#39;много&#39; : &#39;мало&#39;; // тернарный оператор\n\nfor (var i = 0; i &lt; 3; i++) print(i);\nfor (final item in [&#39;a&#39;, &#39;b&#39;]) print(item);\nwhile (score &lt; 10) { score++; }\n\nswitch (status) {\n  case &#39;win&#39;:\n    print(&#39;Победа&#39;);\n  default:\n    print(&#39;Другое&#39;);\n}\u003c/code>\u003c/pre>\n\u003cp>В Dart 3 есть \u003cstrong>switch-выражения\u003c/strong> и \u003cstrong>паттерны\u003c/strong>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final text = switch (status) {\n  &#39;win&#39; =&gt; &#39;Победа&#39;,\n  &#39;lose&#39; =&gt; &#39;Поражение&#39;,\n  _ =&gt; &#39;Игра идёт&#39;,\n};\u003c/code>\u003c/pre>\n\u003ch2>Функции\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>int sum(int a, int b) =&gt; a + b;                 // короткая запись\n\n// Именованные параметры: удобно для виджетов и конфигураций\nString greet({required String name, int age = 18}) =&gt; &#39;$name, $age&#39;;\ngreet(name: &#39;Аня&#39;);\n\n// Необязательный позиционный\nString join(String a, [String? b]) =&gt; b == null ? a : &#39;$a$b&#39;;\n\n// Функция — это значение\nfinal doubler = (int x) =&gt; x * 2;\n[1, 2, 3].map(doubler);                         // (2, 4, 6)\n\ntypedef Callback = void Function(int value);    // тип функции\u003c/code>\u003c/pre>\n\u003ch2>Коллекции\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final list = &lt;int&gt;[3, 1, 2];\nlist.add(4);\nlist.sort();                                   // [1, 2, 3, 4]\nfinal even = list.where((e) =&gt; e.isEven).toList();\nfinal names = list.map((e) =&gt; &#39;№$e&#39;).toList();\nfinal sumAll = list.fold(0, (acc, e) =&gt; acc + e);\n\nfinal map = &lt;String, int&gt;{&#39;Аня&#39;: 5, &#39;Боря&#39;: 3};\nmap[&#39;Вика&#39;] = 7;\nfor (final e in map.entries) print(&#39;${e.key}: ${e.value}&#39;);\n\nfinal set = {1, 2, 2, 3};                      // {1, 2, 3}, дубликаты исчезают\n\n// Расширение коллекций прямо в литерале\nfinal all = [...list, if (isAdmin) 99, for (var i in [7, 8]) i];\u003c/code>\u003c/pre>\n\u003ch2>Строки\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final s = &#39;Hello&#39;;\ns.toUpperCase(); s.substring(1, 3); s.contains(&#39;el&#39;);\ns.padLeft(8, &#39;0&#39;); s.split(&#39;,&#39;).join(&#39;;&#39;);\nfinal multi = &#39;&#39;&#39;Много\nстрок&#39;&#39;&#39;;\nfinal path = r&#39;C:\\raw\\no\\escape&#39;;             // r — «сырая» строка\u003c/code>\u003c/pre>\n\u003ch2>Типичные ошибки новичков\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ошибка\u003c/th>\n\u003cth>Исправление\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>int x = 5.5;\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>double x = 5.5;\u003c/code> или \u003ccode>x.toInt()\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Null check operator used on a null value\u003c/code>\u003c/td>\n\u003ctd>заменить \u003ccode>!\u003c/code> на проверку\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>late\u003c/code> без присваивания\u003c/td>\n\u003ctd>присвоить до чтения или сделать nullable\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Забыли \u003ccode>await\u003c/code>\u003c/td>\n\u003ctd>функция вернула \u003ccode>Future\u003c/code>, а не значение\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Забыли \u003ccode>;\u003c/code>\u003c/td>\n\u003ctd>компилятор подсвечит красным\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Выбрать между \u003ccode>var\u003c/code>, \u003ccode>final\u003c/code>, \u003ccode>const\u003c/code>.\u003c/li>\n\u003cli>Читать \u003ccode>?\u003c/code>, \u003ccode>??\u003c/code>, \u003ccode>?.\u003c/code>, \u003ccode>!\u003c/code>.\u003c/li>\n\u003cli>Писать функции с именованными параметрами.\u003c/li>\n\u003cli>Работать со списками и словарями (\u003ccode>map\u003c/code>, \u003ccode>where\u003c/code>, \u003ccode>fold\u003c/code>).\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: типы и их преобразования\u003c/h2>\n\u003cp>Часто нужно превратить один тип в другой: пользователь вводит число в поле, а там строка.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final s = &#39;42&#39;;\nfinal a = int.parse(s);          // 42; но упадёт с FormatException на &#39;abc&#39;\nfinal b = int.tryParse(&#39;abc&#39;);   // null — безопасный вариант\nfinal c = double.parse(&#39;3.5&#39;);\nfinal text = 42.toString();      // &#39;42&#39;\nfinal rounded = 3.7.round();     // 4\nfinal intFromDouble = 3.7.toInt(); // 3 (отбрасывает дробную часть)\u003c/code>\u003c/pre>\n\u003cp>Правило: \u003cstrong>ввод пользователя всегда проверяйте\u003c/strong> через \u003ccode>tryParse\u003c/code>, а не \u003ccode>parse\u003c/code>. Так приложение не упадёт из-за пустого поля.\u003c/p>\n\u003cp>Различие \u003ccode>num\u003c/code>, \u003ccode>int\u003c/code> и \u003ccode>double\u003c/code>: \u003ccode>num\u003c/code> — общий родитель. JSON часто присылает число то как \u003ccode>5\u003c/code>, то как \u003ccode>5.0\u003c/code>, поэтому надёжнее разбирать так:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final score = (json[&#39;score&#39;] as num?)?.toInt() ?? 0;\u003c/code>\u003c/pre>\n\u003ch2>Подробно: null safety на живом примере\u003c/h2>\n\u003cp>Допустим, пользователь заполняет форму регистрации. Поле «имя» необязательное.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Profile {\n  final String email;     // обязательное: null нельзя\n  final String? name;     // необязательное: может быть null\n  Profile({required this.email, this.name});\n}\n\nString greeting(Profile p) {\n  // p.name может быть null, поэтому нужна защита:\n  final shown = p.name ?? p.email;     // если имени нет, показываем email\n  return &#39;Привет, $shown&#39;;\n}\n\nint nameLength(Profile p) =&gt; p.name?.length ?? 0;\u003c/code>\u003c/pre>\n\u003cp>Алгоритм выбора:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Значение может отсутствовать? Делайте тип с \u003ccode>?\u003c/code>.\u003c/li>\n\u003cli>Используете значение с \u003ccode>?\u003c/code>? Выберите: \u003ccode>??\u003c/code> (значение по умолчанию), \u003ccode>?.\u003c/code> (безопасный доступ) или \u003ccode>if (x != null)\u003c/code>.\u003c/li>\n\u003cli>Пишете \u003ccode>!\u003c/code>? Остановитесь и подумайте: что будет, если там всё же \u003ccode>null\u003c/code>?\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Промоция типа.\u003c/strong> После проверки \u003ccode>if (name != null)\u003c/code> внутри блока Dart сам считает \u003ccode>name\u003c/code> ненулевым (но только для локальных переменных и \u003ccode>final\u003c/code>-полей текущего класса).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final String? name = getName();\nif (name != null) {\n  print(name.length); // здесь name — уже String\n}\u003c/code>\u003c/pre>\n\u003ch2>Подробно: коллекции на примере списка игр\u003c/h2>\n\u003cp>Списки и словари — рабочие инструменты для экранов Discover и Statistics.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Game {\n  final String id; final String title; final DateTime startAt; final bool finished;\n  const Game(this.id, this.title, this.startAt, this.finished);\n}\n\nfinal games = &lt;Game&gt;[ /* ... пришли с сервера ... */ ];\n\n// Предстоящие игры, отсортированные по времени\nfinal upcoming = games.where((g) =&gt; g.startAt.isAfter(DateTime.now())).toList()\n  ..sort((a, b) =&gt; a.startAt.compareTo(b.startAt));\n\n// Количество созданных игр на этой неделе\nfinal monday = DateTime.now().subtract(Duration(days: DateTime.now().weekday - 1));\nfinal thisWeek = games.where((g) =&gt; g.startAt.isAfter(monday)).length;\n\n// Сгруппировать по дням: Map&lt;день, список игр&gt;\nfinal byDay = &lt;String, List&lt;Game&gt;&gt;{};\nfor (final g in games) {\n  final key = &#39;${g.startAt.day}-${g.startAt.month}&#39;;\n  byDay.putIfAbsent(key, () =&gt; []).add(g);\n}\n\n// Есть ли хоть одна завершённая? Все ли завершены?\nfinal anyDone = games.any((g) =&gt; g.finished);\nfinal allDone = games.every((g) =&gt; g.finished);\n\n// Первая подходящая игра или null\nfinal next = games.where((g) =&gt; !g.finished).firstOrNull;\u003c/code>\u003c/pre>\n\u003cp>Шпаргалка по методам:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Метод\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003cth>Возвращает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>where\u003c/code>\u003c/td>\n\u003ctd>Отфильтровать\u003c/td>\n\u003ctd>\u003ccode>Iterable\u003c/code> (добавьте \u003ccode>.toList()\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>map\u003c/code>\u003c/td>\n\u003ctd>Преобразовать каждый элемент\u003c/td>\n\u003ctd>\u003ccode>Iterable\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>fold\u003c/code> / \u003ccode>reduce\u003c/code>\u003c/td>\n\u003ctd>Свернуть в одно значение\u003c/td>\n\u003ctd>значение\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>sort\u003c/code>\u003c/td>\n\u003ctd>Отсортировать на месте\u003c/td>\n\u003ctd>\u003ccode>void\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>any\u003c/code> / \u003ccode>every\u003c/code>\u003c/td>\n\u003ctd>Хотя бы один / все подходят\u003c/td>\n\u003ctd>\u003ccode>bool\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>firstWhere\u003c/code>\u003c/td>\n\u003ctd>Найти первый\u003c/td>\n\u003ctd>элемент (или ошибка)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>take(n)\u003c/code> / \u003ccode>skip(n)\u003c/code>\u003c/td>\n\u003ctd>Взять / пропустить n\u003c/td>\n\u003ctd>\u003ccode>Iterable\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>contains\u003c/code>\u003c/td>\n\u003ctd>Есть ли значение\u003c/td>\n\u003ctd>\u003ccode>bool\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: как читать сообщения компилятора\u003c/h2>\n\u003cp>Dart подсвечивает ошибки красным до запуска. Типичные:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Сообщение\u003c/th>\n\u003cth>Причина\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>The name 'x' isn't defined\u003c/code>\u003c/td>\n\u003ctd>Опечатка или забыт импорт\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>A value of type 'int?' can't be assigned to a variable of type 'int'\u003c/code>\u003c/td>\n\u003ctd>Значение может быть \u003ccode>null\u003c/code>: обработайте\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>The argument type 'String' can't be assigned to the parameter type 'int'\u003c/code>\u003c/td>\n\u003ctd>Передан не тот тип\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Missing required argument\u003c/code>\u003c/td>\n\u003ctd>Не указан параметр с \u003ccode>required\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Expected to find ';'\u003c/code>\u003c/td>\n\u003ctd>Пропущена точка с запятой\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Undefined class\u003c/code>\u003c/td>\n\u003ctd>Нет импорта: наведите курсор и нажмите Alt+Enter (импортировать)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Читайте ошибки \u003cstrong>снизу вверх по важности\u003c/strong>: сначала исправьте первую красную, остальные часто исчезают сами.\u003c/p>\n\u003ch2>Практика\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Напишите функцию \u003ccode>parseAge(String)\u003c/code>, которая возвращает \u003ccode>int?\u003c/code> и не падает на пустой строке.\u003c/li>\n\u003cli>Из списка \u003ccode>[5, 3, 9, 1]\u003c/code> получите сумму, максимум и список чётных.\u003c/li>\n\u003cli>Составьте \u003ccode>Map&lt;String,int&gt;\u003c/code> «ник → очки» и выведите лидера.\u003c/li>\n\u003cli>Запишите функцию с именованными параметрами \u003ccode>createGame({required title, DateTime? startAt})\u003c/code>.\u003c/li>\n\u003cli>Исправьте код: \u003ccode>String s = null;\u003c/code> двумя способами.\u003c/li>\n\u003c/ol>\n", "text": " Переменные и типы void main() { int age = 18; // целое double price = 19.99; // дробное String name = 'Юлдуз'; // строка bool isReady = true; // логическое var city = 'Сургут'; // тип выводится сам (String) final today = DateTime.now(); // нельзя переприсвоить, значение известно при запуске const maxScore = 100; // константа времени компиляции print('Привет, $name! Тебе $age, баллов: ${maxScore - 5}'); } Ключевое слово Когда var Тип понятен из значения final Значение задаётся один раз во время работы const Значение известно ещё при компиляции (цвета, отступы, константные виджеты) Null safety Обычный тип не может хранить null . Чтобы разрешить, добавьте ? . String? nickname; // может быть null String title = nickname ?? 'Игрок'; // ?? — значение по умолчанию print(nickname?.length); // ?. — безопасный вызов, вернёт null print(nickname!.length); // ! — «я уверена, что не null» (упадёт, если null) late String token; // будет присвоено позже, до первого чтения Оператор ! — частая причина падений. Используйте ?? , ?. или проверку if (x != null) . Условия и циклы if (score >= 10) { print('Победа'); } else if (score >= 5) { print('Ничья'); } else { print('Поражение'); } final label = score > 5 ? 'много' : 'мало'; // тернарный оператор for (var i = 0; i \u003c 3; i++) print(i); for (final item in ['a', 'b']) print(item); while (score \u003c 10) { score++; } switch (status) { case 'win': print('Победа'); default: print('Другое'); } В Dart 3 есть switch-выражения и паттерны : final text = switch (status) { 'win' => 'Победа', 'lose' => 'Поражение', _ => 'Игра идёт', }; Функции int sum(int a, int b) => a + b; // короткая запись // Именованные параметры: удобно для виджетов и конфигураций String greet({required String name, int age = 18}) => '$name, $age'; greet(name: 'Аня'); // Необязательный позиционный String join(String a, [String? b]) => b == null ? a : '$a$b'; // Функция — это значение final doubler = (int x) => x * 2; [1, 2, 3].map(doubler); // (2, 4, 6) typedef Callback = void Function(int value); // тип функции Коллекции final list = \u003cint>[3, 1, 2]; list.add(4); list.sort(); // [1, 2, 3, 4] final even = list.where((e) => e.isEven).toList(); final names = list.map((e) => '№$e').toList(); final sumAll = list.fold(0, (acc, e) => acc + e); final map = \u003cString, int>{'Аня': 5, 'Боря': 3}; map['Вика'] = 7; for (final e in map.entries) print('${e.key}: ${e.value}'); final set = {1, 2, 2, 3}; // {1, 2, 3}, дубликаты исчезают // Расширение коллекций прямо в литерале final all = [...list, if (isAdmin) 99, for (var i in [7, 8]) i]; Строки final s = 'Hello'; s.toUpperCase(); s.substring(1, 3); s.contains('el'); s.padLeft(8, '0'); s.split(',').join(';'); final multi = '''Много строк'''; final path = r'C:\\raw\\no\\escape'; // r — «сырая» строка Типичные ошибки новичков Ошибка Исправление int x = 5.5; double x = 5.5; или x.toInt() Null check operator used on a null value заменить ! на проверку late без присваивания присвоить до чтения или сделать nullable Забыли await функция вернула Future , а не значение Забыли ; компилятор подсвечит красным Что нужно уметь Выбрать между var , final , const . Читать ? , ?? , ?. , ! . Писать функции с именованными параметрами. Работать со списками и словарями ( map , where , fold ). Подробно: типы и их преобразования Часто нужно превратить один тип в другой: пользователь вводит число в поле, а там строка. final s = '42'; final a = int.parse(s); // 42; но упадёт с FormatException на 'abc' final b = int.tryParse('abc'); // null — безопасный вариант final c = double.parse('3.5'); final text = 42.toString(); // '42' final rounded = 3.7.round(); // 4 final intFromDouble = 3.7.toInt(); // 3 (отбрасывает дробную часть) Правило: ввод пользователя всегда проверяйте через tryParse , а не parse . Так приложение не упадёт из-за пустого поля. Различие num , int и double : num — общий родитель. JSON часто присылает число то как 5 , то как 5.0 , поэтому надёжнее разбирать так: final score = (json['score'] as num?)?.toInt() ?? 0; Подробно: null safety на живом примере Допустим, пользователь заполняет форму регистрации. Поле «имя» необязательное. class Profile { final String email; // обязательное: null нельзя final String? name; // необязательное: может быть null Profile({required this.email, this.name}); } String greeting(Profile p) { // p.name может быть null, поэтому нужна защита: final shown = p.name ?? p.email; // если имени нет, показываем email return 'Привет, $shown'; } int nameLength(Profile p) => p.name?.length ?? 0; Алгоритм выбора: Значение может отсутствовать? Делайте тип с ? . Используете значение с ? ? Выберите: ?? (значение по умолчанию), ?. (безопасный доступ) или if (x != null) . Пишете ! ? Остановитесь и подумайте: что будет, если там всё же null ? Промоция типа. После проверки if (name != null) внутри блока Dart сам считает name ненулевым (но только для локальных переменных и final -полей текущего класса). final String? name = getName(); if (name != null) { print(name.length); // здесь name — уже String } Подробно: коллекции на примере списка игр Списки и словари — рабочие инструменты для экранов Discover и Statistics. class Game { final String id; final String title; final DateTime startAt; final bool finished; const Game(this.id, this.title, this.startAt, this.finished); } final games = \u003cGame>[ /* ... пришли с сервера ... */ ]; // Предстоящие игры, отсортированные по времени final upcoming = games.where((g) => g.startAt.isAfter(DateTime.now())).toList() ..sort((a, b) => a.startAt.compareTo(b.startAt)); // Количество созданных игр на этой неделе final monday = DateTime.now().subtract(Duration(days: DateTime.now().weekday - 1)); final thisWeek = games.where((g) => g.startAt.isAfter(monday)).length; // Сгруппировать по дням: Map\u003cдень, список игр> final byDay = \u003cString, List\u003cGame>>{}; for (final g in games) { final key = '${g.startAt.day}-${g.startAt.month}'; byDay.putIfAbsent(key, () => []).add(g); } // Есть ли хоть одна завершённая? Все ли завершены? final anyDone = games.any((g) => g.finished); final allDone = games.every((g) => g.finished); // Первая подходящая игра или null final next = games.where((g) => !g.finished).firstOrNull; Шпаргалка по методам: Метод Что делает Возвращает where Отфильтровать Iterable (добавьте .toList() ) map Преобразовать каждый элемент Iterable fold / reduce Свернуть в одно значение значение sort Отсортировать на месте void any / every Хотя бы один / все подходят bool firstWhere Найти первый элемент (или ошибка) take(n) / skip(n) Взять / пропустить n Iterable contains Есть ли значение bool Подробно: как читать сообщения компилятора Dart подсвечивает ошибки красным до запуска. Типичные: Сообщение Причина The name 'x' isn't defined Опечатка или забыт импорт A value of type 'int?' can't be assigned to a variable of type 'int' Значение может быть null : обработайте The argument type 'String' can't be assigned to the parameter type 'int' Передан не тот тип Missing required argument Не указан параметр с required Expected to find ';' Пропущена точка с запятой Undefined class Нет импорта: наведите курсор и нажмите Alt+Enter (импортировать) Читайте ошибки снизу вверх по важности : сначала исправьте первую красную, остальные часто исчезают сами. Практика Напишите функцию parseAge(String) , которая возвращает int? и не падает на пустой строке. Из списка [5, 3, 9, 1] получите сумму, максимум и список чётных. Составьте Map\u003cString,int> «ник → очки» и выведите лидера. Запишите функцию с именованными параметрами createGame({required title, DateTime? startAt}) . Исправьте код: String s = null; двумя способами. ", "hours": 4, "minutes": 7}, {"id": "dart-oop", "stage": 2, "title": "Dart: ООП и обобщения", "lead": "Классы, наследование, интерфейсы, миксины, enum, sealed. Основа для SOLID и чистой архитектуры.", "html": "\u003ch2>Класс и объект\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class Player {\n  final String id;\n  final String name;\n  int score;\n\n  Player({required this.id, required this.name, this.score = 0});\n\n  // Именованный конструктор\n  Player.guest() : this(id: &#39;0&#39;, name: &#39;Гость&#39;);\n\n  // Фабричный конструктор: собирает объект из JSON\n  factory Player.fromJson(Map&lt;String, dynamic&gt; json) =&gt; Player(\n        id: json[&#39;id&#39;] as String,\n        name: json[&#39;name&#39;] as String,\n        score: (json[&#39;score&#39;] as num?)?.toInt() ?? 0,\n      );\n\n  Map&lt;String, dynamic&gt; toJson() =&gt; {&#39;id&#39;: id, &#39;name&#39;: name, &#39;score&#39;: score};\n\n  // Геттер\n  bool get isWinner =&gt; score &gt;= 10;\n}\u003c/code>\u003c/pre>\n\u003ch2>Инкапсуляция\u003c/h2>\n\u003cp>В Dart нет \u003ccode>private\u003c/code>; всё, что начинается с \u003ccode>_\u003c/code>, приватно \u003cstrong>в пределах файла (библиотеки)\u003c/strong>. Для UIKit это ключ к инкапсуляции: детали лежат в \u003ccode>lib/src/\u003c/code>, наружу экспортируются только нужные классы.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Timer1 {\n  int _seconds = 0;           // не видно за пределами файла\n  int get seconds =&gt; _seconds;\n}\u003c/code>\u003c/pre>\n\u003ch2>Наследование, абстракции, интерфейсы\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>abstract class Shape {          // нельзя создать объект напрямую\n  double area();\n}\n\nclass Circle extends Shape {    // наследование\n  final double r;\n  Circle(this.r);\n  @override\n  double area() =&gt; 3.14159 * r * r;\n}\n\n// В Dart 3 интерфейс удобно описывать так:\nabstract interface class HttpGateway {\n  Future&lt;String&gt; get(String url);\n}\n\nclass RealGateway implements HttpGateway { // implements — реализовать контракт\n  @override\n  Future&lt;String&gt; get(String url) async =&gt; &#39;...&#39;;\n}\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Слово\u003c/th>\n\u003cth>Смысл\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>extends\u003c/code>\u003c/td>\n\u003ctd>Унаследовать код и поля\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>implements\u003c/code>\u003c/td>\n\u003ctd>Пообещать реализовать все методы контракта\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>with\u003c/code>\u003c/td>\n\u003ctd>Подмешать миксин\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>abstract\u003c/code>\u003c/td>\n\u003ctd>Класс с незаконченными методами\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>abstract interface class\u003c/code>\u003c/td>\n\u003ctd>Чистый интерфейс (Dart 3)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Миксины и расширения\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>mixin Loggable {\n  void log(String message) =&gt; print(&#39;[$runtimeType]: $message&#39;);\n}\n\nclass Repo with Loggable {\n  void load() =&gt; log(&#39;Загрузка&#39;);\n}\n\nextension EmailCheck on String {\n  bool get isValidEmail =&gt; RegExp(r&#39;^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$&#39;).hasMatch(this);\n}\n&#39;ab1@mail.ru&#39;.isValidEmail; // true\u003c/code>\u003c/pre>\n\u003ch2>Enum с полями\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>enum GameCategory {\n  image(&#39;Image&#39;),\n  circle(&#39;Circle&#39;);\n\n  final String title;\n  const GameCategory(this.title);\n}\u003c/code>\u003c/pre>\n\u003ch2>Sealed-классы и паттерны (Dart 3)\u003c/h2>\n\u003cp>Удобны для состояний экрана и результатов запросов: компилятор проверит, что вы обработали \u003cstrong>все\u003c/strong> варианты.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>sealed class Result&lt;T&gt; {}\nclass Success&lt;T&gt; extends Result&lt;T&gt; { final T data; Success(this.data); }\nclass Failure&lt;T&gt; extends Result&lt;T&gt; { final String message; Failure(this.message); }\n\nString show(Result&lt;int&gt; r) =&gt; switch (r) {\n      Success(:final data) =&gt; &#39;Данные: $data&#39;,\n      Failure(:final message) =&gt; &#39;Ошибка: $message&#39;,\n    };\u003c/code>\u003c/pre>\n\u003ch2>Обобщения (generics)\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class Box&lt;T&gt; {\n  final T value;\n  Box(this.value);\n}\n\nabstract interface class Repository&lt;T&gt; {\n  Future&lt;List&lt;T&gt;&gt; getAll();\n  Future&lt;T?&gt; getById(String id);\n}\u003c/code>\u003c/pre>\n\u003ch2>Исключения\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class NoInternetException implements Exception {\n  final String message;\n  NoInternetException([this.message = &#39;Нет подключения к интернету&#39;]);\n  @override\n  String toString() =&gt; message;\n}\n\ntry {\n  await repo.load();\n} on NoInternetException catch (e) {\n  logger.error(&#39;Repo&#39;, &#39;Ошибка&#39;, &#39;$e&#39;, e);   // в try-catch обязательно писать лог ERROR\n} catch (e, stack) {\n  logger.error(&#39;Repo&#39;, &#39;Неизвестная ошибка&#39;, &#39;$stack&#39;, e);\n  rethrow;\n} finally {\n  // выполнится всегда\n}\u003c/code>\u003c/pre>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Написать класс с \u003ccode>fromJson\u003c/code> / \u003ccode>toJson\u003c/code>.\u003c/li>\n\u003cli>Объяснить разницу \u003ccode>extends\u003c/code>, \u003ccode>implements\u003c/code>, \u003ccode>with\u003c/code>.\u003c/li>\n\u003cli>Спрятать реализацию в \u003ccode>_приватных\u003c/code> членах и \u003ccode>lib/src\u003c/code>.\u003c/li>\n\u003cli>Использовать \u003ccode>sealed\u003c/code> для состояний.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: зачем нужны классы\u003c/h2>\n\u003cp>Без классов данные игры — набор разрозненных переменных: \u003ccode>gameTitle\u003c/code>, \u003ccode>gameDate\u003c/code>, \u003ccode>gamePlayers\u003c/code>. Класс объединяет их в \u003cstrong>одну сущность\u003c/strong> и добавляет поведение.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Game {\n  final String id;\n  final String title;\n  final DateTime startAt;\n  final List&lt;String&gt; playerIds;\n\n  const Game({required this.id, required this.title, required this.startAt, this.playerIds = const []});\n\n  // Поведение рядом с данными\n  bool get hasOpponent =&gt; playerIds.length &gt;= 2;\n  bool get isUpcoming =&gt; startAt.isAfter(DateTime.now());\n}\u003c/code>\u003c/pre>\n\u003cp>Теперь вместо трёх проверок в разных экранах — \u003ccode>game.hasOpponent\u003c/code>. Если правило изменится, меняем в одном месте (\u003cstrong>DRY\u003c/strong>). Класс — это ещё и точка, куда вешают шапку-комментарий и где живёт \u003cstrong>одна ответственность\u003c/strong> (S).\u003c/p>\n\u003ch2>Подробно: extends, implements или with — что выбрать\u003c/h2>\n\u003cp>Простое правило выбора:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ситуация\u003c/th>\n\u003cth>Что использовать\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>«Это разновидность» с общим кодом\u003c/td>\n\u003ctd>\u003ccode>extends\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>PrimaryButton extends BaseButton\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Нужен только \u003cstrong>контракт\u003c/strong>, реализация разная\u003c/td>\n\u003ctd>\u003ccode>implements\u003c/code> (интерфейс)\u003c/td>\n\u003ctd>\u003ccode>HttpApiClient implements ApiClient\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Нужно подмешать способность нескольким классам\u003c/td>\n\u003ctd>\u003ccode>with\u003c/code> (миксин)\u003c/td>\n\u003ctd>\u003ccode>with Loggable\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Почему интерфейсы важны для задания: \u003cstrong>приложение зависит от \u003ccode>ApiClient\u003c/code>\u003c/strong> (контракт), а не от \u003ccode>HttpApiClient\u003c/code>. Заменить реализацию можно без правок остального кода (D из SOLID).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>abstract interface class GameRepository {\n  Future&lt;List&lt;Game&gt;&gt; getGames();\n}\n\nclass RemoteGameRepository implements GameRepository { /* ходит на сервер */ }\nclass FakeGameRepository implements GameRepository { /* возвращает тестовые данные */ }\u003c/code>\u003c/pre>\n\u003cp>Фейковую реализацию удобно использовать в тестах и пока нет сервера.\u003c/p>\n\u003ch2>Подробно: неизменяемые объекты и copyWith\u003c/h2>\n\u003cp>Если поля \u003ccode>final\u003c/code>, объект нельзя изменить после создания. Это защищает от случайных ошибок: Flutter сразу видит, что состояние «новое», когда вы создаёте новый объект.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class GameState {\n  final int moves;\n  final bool finished;\n  const GameState({this.moves = 0, this.finished = false});\n\n  // Создаёт копию с заменой отдельных полей\n  GameState copyWith({int? moves, bool? finished}) =&gt;\n      GameState(moves: moves ?? this.moves, finished: finished ?? this.finished);\n}\n\nvar state = const GameState();\nstate = state.copyWith(moves: state.moves + 1);\u003c/code>\u003c/pre>\n\u003ch2>Подробно: равенство, hashCode, toString\u003c/h2>\n\u003cp>По умолчанию два объекта с одинаковыми полями \u003cstrong>не равны\u003c/strong> (сравниваются адреса в памяти). Для сравнения по содержимому переопределяют \u003ccode>==\u003c/code> и \u003ccode>hashCode\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Point {\n  final int x, y;\n  const Point(this.x, this.y);\n\n  @override\n  bool operator ==(Object other) =&gt; other is Point &amp;&amp; other.x == x &amp;&amp; other.y == y;\n\n  @override\n  int get hashCode =&gt; Object.hash(x, y);\n\n  @override\n  String toString() =&gt; &#39;Point($x, $y)&#39;; // удобно для логов\n}\u003c/code>\u003c/pre>\n\u003cp>Для игры Image это пригодится, когда сравниваете порядок плиток; а \u003ccode>toString\u003c/code> делает логи читаемыми (формат из задания: \u003ccode>[Тег]: Событие — Детали\u003c/code>).\u003c/p>\n\u003ch2>Подробно: DTO и Entity — зачем два класса\u003c/h2>\n\u003cp>\u003cstrong>DTO\u003c/strong> (Data Transfer Object) повторяет формат сервера: поля называются как в JSON, типы могут быть «сырыми». \u003cstrong>Entity\u003c/strong> — удобная для приложения модель.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// data/dto/game_dto.dart — как пришло с сервера\nclass GameDto {\n  final String id;\n  final String title;\n  final String startAt;        // строка ISO\n  GameDto({required this.id, required this.title, required this.startAt});\n  factory GameDto.fromJson(Map&lt;String, dynamic&gt; j) =&gt;\n      GameDto(id: j[&#39;id&#39;].toString(), title: j[&#39;title&#39;] as String, startAt: j[&#39;start_at&#39;] as String);\n}\n\n// domain/entities/game.dart — как нужно приложению\nclass Game { final String id; final String title; final DateTime startAt; /* ... */ }\n\n// data/mappers/game_mapper.dart\nclass GameMapper {\n  static Game toEntity(GameDto d) =&gt; Game(id: d.id, title: d.title, startAt: DateTime.parse(d.startAt).toLocal());\n}\u003c/code>\u003c/pre>\n\u003cp>Если сервер переименует поле, поменяется только DTO и маппер. Экраны и бизнес-логика останутся нетронутыми (требование «изменение в одном месте не ломает другие»).\u003c/p>\n\u003ch2>Практика\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Напишите класс \u003ccode>Player\u003c/code> с \u003ccode>fromJson\u003c/code>, \u003ccode>toJson\u003c/code>, \u003ccode>copyWith\u003c/code>.\u003c/li>\n\u003cli>Создайте \u003ccode>abstract interface class Timer\u003c/code> и две реализации.\u003c/li>\n\u003cli>Напишите \u003ccode>enum GameCategory\u003c/code> с полем \u003ccode>title\u003c/code> и методом \u003ccode>fromString\u003c/code>.\u003c/li>\n\u003cli>Сделайте \u003ccode>sealed class\u003c/code> состояния экрана с тремя вариантами и \u003ccode>switch\u003c/code> по нему.\u003c/li>\n\u003cli>Объясните, чем DTO отличается от Entity, и приведите пример из своей симуляции.\u003c/li>\n\u003c/ol>\n", "text": " Класс и объект class Player { final String id; final String name; int score; Player({required this.id, required this.name, this.score = 0}); // Именованный конструктор Player.guest() : this(id: '0', name: 'Гость'); // Фабричный конструктор: собирает объект из JSON factory Player.fromJson(Map\u003cString, dynamic> json) => Player( id: json['id'] as String, name: json['name'] as String, score: (json['score'] as num?)?.toInt() ?? 0, ); Map\u003cString, dynamic> toJson() => {'id': id, 'name': name, 'score': score}; // Геттер bool get isWinner => score >= 10; } Инкапсуляция В Dart нет private ; всё, что начинается с _ , приватно в пределах файла (библиотеки) . Для UIKit это ключ к инкапсуляции: детали лежат в lib/src/ , наружу экспортируются только нужные классы. class Timer1 { int _seconds = 0; // не видно за пределами файла int get seconds => _seconds; } Наследование, абстракции, интерфейсы abstract class Shape { // нельзя создать объект напрямую double area(); } class Circle extends Shape { // наследование final double r; Circle(this.r); @override double area() => 3.14159 * r * r; } // В Dart 3 интерфейс удобно описывать так: abstract interface class HttpGateway { Future\u003cString> get(String url); } class RealGateway implements HttpGateway { // implements — реализовать контракт @override Future\u003cString> get(String url) async => '...'; } Слово Смысл extends Унаследовать код и поля implements Пообещать реализовать все методы контракта with Подмешать миксин abstract Класс с незаконченными методами abstract interface class Чистый интерфейс (Dart 3) Миксины и расширения mixin Loggable { void log(String message) => print('[$runtimeType]: $message'); } class Repo with Loggable { void load() => log('Загрузка'); } extension EmailCheck on String { bool get isValidEmail => RegExp(r'^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$').hasMatch(this); } 'ab1@mail.ru'.isValidEmail; // true Enum с полями enum GameCategory { image('Image'), circle('Circle'); final String title; const GameCategory(this.title); } Sealed-классы и паттерны (Dart 3) Удобны для состояний экрана и результатов запросов: компилятор проверит, что вы обработали все варианты. sealed class Result\u003cT> {} class Success\u003cT> extends Result\u003cT> { final T data; Success(this.data); } class Failure\u003cT> extends Result\u003cT> { final String message; Failure(this.message); } String show(Result\u003cint> r) => switch (r) { Success(:final data) => 'Данные: $data', Failure(:final message) => 'Ошибка: $message', }; Обобщения (generics) class Box\u003cT> { final T value; Box(this.value); } abstract interface class Repository\u003cT> { Future\u003cList\u003cT>> getAll(); Future\u003cT?> getById(String id); } Исключения class NoInternetException implements Exception { final String message; NoInternetException([this.message = 'Нет подключения к интернету']); @override String toString() => message; } try { await repo.load(); } on NoInternetException catch (e) { logger.error('Repo', 'Ошибка', '$e', e); // в try-catch обязательно писать лог ERROR } catch (e, stack) { logger.error('Repo', 'Неизвестная ошибка', '$stack', e); rethrow; } finally { // выполнится всегда } Что нужно уметь Написать класс с fromJson / toJson . Объяснить разницу extends , implements , with . Спрятать реализацию в _приватных членах и lib/src . Использовать sealed для состояний. Подробно: зачем нужны классы Без классов данные игры — набор разрозненных переменных: gameTitle , gameDate , gamePlayers . Класс объединяет их в одну сущность и добавляет поведение. class Game { final String id; final String title; final DateTime startAt; final List\u003cString> playerIds; const Game({required this.id, required this.title, required this.startAt, this.playerIds = const []}); // Поведение рядом с данными bool get hasOpponent => playerIds.length >= 2; bool get isUpcoming => startAt.isAfter(DateTime.now()); } Теперь вместо трёх проверок в разных экранах — game.hasOpponent . Если правило изменится, меняем в одном месте ( DRY ). Класс — это ещё и точка, куда вешают шапку-комментарий и где живёт одна ответственность (S). Подробно: extends, implements или with — что выбрать Простое правило выбора: Ситуация Что использовать Пример «Это разновидность» с общим кодом extends PrimaryButton extends BaseButton Нужен только контракт , реализация разная implements (интерфейс) HttpApiClient implements ApiClient Нужно подмешать способность нескольким классам with (миксин) with Loggable Почему интерфейсы важны для задания: приложение зависит от ApiClient (контракт), а не от HttpApiClient . Заменить реализацию можно без правок остального кода (D из SOLID). abstract interface class GameRepository { Future\u003cList\u003cGame>> getGames(); } class RemoteGameRepository implements GameRepository { /* ходит на сервер */ } class FakeGameRepository implements GameRepository { /* возвращает тестовые данные */ } Фейковую реализацию удобно использовать в тестах и пока нет сервера. Подробно: неизменяемые объекты и copyWith Если поля final , объект нельзя изменить после создания. Это защищает от случайных ошибок: Flutter сразу видит, что состояние «новое», когда вы создаёте новый объект. class GameState { final int moves; final bool finished; const GameState({this.moves = 0, this.finished = false}); // Создаёт копию с заменой отдельных полей GameState copyWith({int? moves, bool? finished}) => GameState(moves: moves ?? this.moves, finished: finished ?? this.finished); } var state = const GameState(); state = state.copyWith(moves: state.moves + 1); Подробно: равенство, hashCode, toString По умолчанию два объекта с одинаковыми полями не равны (сравниваются адреса в памяти). Для сравнения по содержимому переопределяют == и hashCode . class Point { final int x, y; const Point(this.x, this.y); @override bool operator ==(Object other) => other is Point && other.x == x && other.y == y; @override int get hashCode => Object.hash(x, y); @override String toString() => 'Point($x, $y)'; // удобно для логов } Для игры Image это пригодится, когда сравниваете порядок плиток; а toString делает логи читаемыми (формат из задания: [Тег]: Событие — Детали ). Подробно: DTO и Entity — зачем два класса DTO (Data Transfer Object) повторяет формат сервера: поля называются как в JSON, типы могут быть «сырыми». Entity — удобная для приложения модель. // data/dto/game_dto.dart — как пришло с сервера class GameDto { final String id; final String title; final String startAt; // строка ISO GameDto({required this.id, required this.title, required this.startAt}); factory GameDto.fromJson(Map\u003cString, dynamic> j) => GameDto(id: j['id'].toString(), title: j['title'] as String, startAt: j['start_at'] as String); } // domain/entities/game.dart — как нужно приложению class Game { final String id; final String title; final DateTime startAt; /* ... */ } // data/mappers/game_mapper.dart class GameMapper { static Game toEntity(GameDto d) => Game(id: d.id, title: d.title, startAt: DateTime.parse(d.startAt).toLocal()); } Если сервер переименует поле, поменяется только DTO и маппер. Экраны и бизнес-логика останутся нетронутыми (требование «изменение в одном месте не ломает другие»). Практика Напишите класс Player с fromJson , toJson , copyWith . Создайте abstract interface class Timer и две реализации. Напишите enum GameCategory с полем title и методом fromString . Сделайте sealed class состояния экрана с тремя вариантами и switch по нему. Объясните, чем DTO отличается от Entity, и приведите пример из своей симуляции. ", "hours": 4, "minutes": 6}, {"id": "dart-async", "stage": 2, "title": "Dart: асинхронность и JSON", "lead": "Future, async/await, Stream, таймеры, работа с JSON. Без этого не сделать ни сеть, ни таймер игры.", "html": "\u003ch2>Зачем нужна асинхронность\u003c/h2>\n\u003cp>Сетевой запрос идёт сотни миллисекунд. Если ждать «стоя», интерфейс замрёт. \u003cstrong>Future\u003c/strong> — «обещание» значения в будущем: приложение продолжает работать, а когда ответ придёт, выполнится продолжение.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;String&gt; loadName() async {\n  await Future.delayed(const Duration(seconds: 1)); // имитация запроса\n  return &#39;Аня&#39;;\n}\n\nFuture&lt;void&gt; main() async {\n  final name = await loadName();   // подождали результат, UI при этом не заблокирован\n  print(name);\n}\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Правило\u003c/th>\n\u003cth>Пояснение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>async\u003c/code> помечает функцию, которая использует \u003ccode>await\u003c/code>\u003c/td>\n\u003ctd>Возвращает \u003ccode>Future&lt;T&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>await\u003c/code> работает только внутри \u003ccode>async\u003c/code>\u003c/td>\n\u003ctd>Ставит выполнение на паузу до результата\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Ошибки ловятся обычным \u003ccode>try/catch\u003c/code>\u003c/td>\n\u003ctd>И для \u003ccode>await\u003c/code>, и внутри \u003ccode>async\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Future.wait([a(), b()])\u003c/code>\u003c/td>\n\u003ctd>Выполнить несколько запросов параллельно\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Stream: поток событий\u003c/h2>\n\u003cp>Future даёт \u003cstrong>одно\u003c/strong> значение, Stream — \u003cstrong>много\u003c/strong> во времени. Пример: секундомер игры.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Stream&lt;int&gt; ticker() async* {\n  var seconds = 0;\n  while (true) {\n    await Future.delayed(const Duration(seconds: 1));\n    yield ++seconds;\n  }\n}\n\nfinal sub = ticker().listen((s) =&gt; print(&#39;Прошло $s с&#39;));\n// не забудьте: sub.cancel();\u003c/code>\u003c/pre>\n\u003cp>Для таймера на экране проще использовать \u003ccode>Timer.periodic\u003c/code> и \u003cstrong>обязательно отменять его в \u003ccode>dispose\u003c/code>\u003c/strong>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:async&#39;;\n\nTimer? _timer;\nvoid start() {\n  _timer = Timer.periodic(const Duration(seconds: 1), (_) {\n    setState(() =&gt; seconds++);\n  });\n}\n\n@override\nvoid dispose() {\n  _timer?.cancel();\n  super.dispose();\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Не вызывайте \u003ccode>setState\u003c/code> после \u003ccode>dispose\u003c/code>. Проверяйте \u003ccode>if (!mounted) return;\u003c/code> после каждого \u003ccode>await\u003c/code> в виджете.\u003c/p>\n\u003c/div>\n\u003ch2>JSON\u003c/h2>\n\u003cp>Сервер присылает строку JSON. Приложение превращает её в объекты.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:convert&#39;;\n\nconst raw = &#39;{&quot;id&quot;:&quot;7&quot;,&quot;name&quot;:&quot;Аня&quot;,&quot;score&quot;:12}&#39;;\nfinal Map&lt;String, dynamic&gt; map = jsonDecode(raw);   // строка -&gt; Map\nfinal player = Player.fromJson(map);                // Map -&gt; объект\n\nfinal body = jsonEncode(player.toJson());           // объект -&gt; строка\u003c/code>\u003c/pre>\n\u003cp>Список объектов:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final List&lt;dynamic&gt; raw = jsonDecode(response.body);\nfinal players = raw\n    .map((e) =&gt; Player.fromJson(e as Map&lt;String, dynamic&gt;))\n    .toList();\u003c/code>\u003c/pre>\n\u003ch2>Даты и время\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final now = DateTime.now();\nfinal start = DateTime(2027, 3, 15, 18, 30);\nfinal remind = start.subtract(const Duration(hours: 1));   // для уведомления за час\nfinal iso = start.toUtc().toIso8601String();                // для отправки на сервер\nfinal parsed = DateTime.parse(iso).toLocal();\nfinal left = start.difference(now);                         // Duration\u003c/code>\u003c/pre>\n\u003cp>Для вывода в нужном формате используют \u003ccode>intl\u003c/code> (\u003ccode>DateFormat('dd-MM-yyyy')\u003c/code>); если пакета нет, форматируйте вручную через \u003ccode>padLeft(2, '0')\u003c/code>.\u003c/p>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Написать \u003ccode>async\u003c/code>-функцию и обработать ошибку \u003ccode>try/catch\u003c/code>.\u003c/li>\n\u003cli>Запустить и корректно остановить \u003ccode>Timer.periodic\u003c/code>.\u003c/li>\n\u003cli>Разобрать JSON в модель и вернуть обратно.\u003c/li>\n\u003cli>Посчитать разницу между датами.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: как Dart выполняет async\u003c/h2>\n\u003cp>Dart выполняет код \u003cstrong>в одном потоке\u003c/strong>, но не стоит на месте во время ожидания. Представьте повара (поток): он ставит суп вариться (отправил запрос) и пока жарит котлету (рисует интерфейс). Когда суп готов, повар возвращается к нему.\u003c/p>\n\u003cul>\n\u003cli>Есть \u003cstrong>очередь событий\u003c/strong>: «пришёл ответ», «нажали кнопку», «сработал таймер».\u003c/li>\n\u003cli>\u003ccode>await\u003c/code> значит: «приостанови эту функцию, продолжи, когда будет результат, а пока обрабатывай другие события».\u003c/li>\n\u003cli>Интерфейс не «зависает», пока вы ждёте сеть.\u003c/li>\n\u003c/ul>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;void&gt; onTap() async {\n  print(&#39;1 — до запроса&#39;);\n  final games = await repo.getGames();   // здесь функция «засыпает»\n  print(&#39;3 — после запроса: ${games.length}&#39;);\n}\nprint(&#39;2 — сразу после вызова onTap()&#39;); // выполнится до строки «3»\u003c/code>\u003c/pre>\n\u003cp>Тяжёлые вычисления (например, обработка большой картинки) всё же блокируют поток. Для них используют \u003ccode>compute()\u003c/code> / изоляты, но для задания это обычно не нужно.\u003c/p>\n\u003ch2>Подробно: ошибки, таймауты, отмена\u003c/h2>\n\u003cp>Любой запрос может завершиться неудачей. Три инструмента:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;List&lt;Game&gt;&gt; load() async {\n  try {\n    final games = await repo.getGames().timeout(const Duration(seconds: 15)); // ограничили ожидание\n    return games;\n  } on TimeoutException {\n    throw const TimeoutApiException();\n  } on SocketException {\n    throw const NoInternetException();\n  } finally {\n    AppLog.debug(&#39;GameController&#39;, &#39;Загрузка&#39;, &#39;завершена&#39;); // выполнится всегда\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Параллельные запросы:\u003c/strong>\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final results = await Future.wait([repo.getGames(), repo.getStats()]);\nfinal games = results[0] as List&lt;Game&gt;;\nfinal stats = results[1] as Stats;\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Отмена Stream-подписки и таймера\u003c/strong> — в \u003ccode>dispose\u003c/code>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>late final StreamSubscription&lt;int&gt; _sub;\n_sub = ticker().listen(...);\n@override void dispose() { _sub.cancel(); super.dispose(); }\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Защита от двойного нажатия\u003c/strong>: пока идёт запрос, отключайте кнопку (флаг \u003ccode>isLoading\u003c/code>), иначе игра создастся дважды.\u003c/p>\n\u003ch2>Подробно: JSON с вложенными данными\u003c/h2>\n\u003cp>Ответ сервера часто содержит вложенные объекты и списки:\u003c/p>\n\u003cpre class=\"json\">\u003ccode>{\n  &quot;id&quot;: &quot;5&quot;,\n  &quot;title&quot;: &quot;Evening battle&quot;,\n  &quot;players&quot;: [{&quot;id&quot;: &quot;1&quot;, &quot;name&quot;: &quot;Аня&quot;}, {&quot;id&quot;: &quot;2&quot;, &quot;name&quot;: &quot;Боря&quot;}],\n  &quot;result&quot;: null\n}\u003c/code>\u003c/pre>\n\u003cpre class=\"dart\">\u003ccode>class GameDto {\n  final String id;\n  final String title;\n  final List&lt;PlayerDto&gt; players;\n  final ResultDto? result;\n\n  GameDto({required this.id, required this.title, required this.players, this.result});\n\n  factory GameDto.fromJson(Map&lt;String, dynamic&gt; j) =&gt; GameDto(\n        id: j[&#39;id&#39;].toString(),\n        title: j[&#39;title&#39;] as String,\n        players: (j[&#39;players&#39;] as List? ?? [])\n            .map((e) =&gt; PlayerDto.fromJson(e as Map&lt;String, dynamic&gt;))\n            .toList(),\n        result: j[&#39;result&#39;] == null ? null : ResultDto.fromJson(j[&#39;result&#39;] as Map&lt;String, dynamic&gt;),\n      );\n}\u003c/code>\u003c/pre>\n\u003cp>Правила надёжного разбора:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Список может прийти \u003ccode>null\u003c/code>, поэтому \u003ccode>?? []\u003c/code>.\u003c/li>\n\u003cli>Число может быть \u003ccode>int\u003c/code> или \u003ccode>double\u003c/code>, поэтому \u003ccode>as num\u003c/code>.\u003c/li>\n\u003cli>Идентификатор может быть числом или строкой, поэтому \u003ccode>.toString()\u003c/code>.\u003c/li>\n\u003cli>Поле может отсутствовать, поэтому тип с \u003ccode>?\u003c/code>.\u003c/li>\n\u003cli>Кириллица в ответе: декодируйте \u003ccode>utf8.decode(response.bodyBytes)\u003c/code>, а не \u003ccode>response.body\u003c/code>, если видите «кракозябры».\u003c/li>\n\u003c/ol>\n\u003ch2>Практика\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Напишите \u003ccode>Future&lt;int&gt; slowSum()\u003c/code> с задержкой 2 секунды и вызовите её через \u003ccode>await\u003c/code>.\u003c/li>\n\u003cli>Запустите два «запроса» через \u003ccode>Future.wait\u003c/code> и замерьте время.\u003c/li>\n\u003cli>Сделайте секундомер на \u003ccode>Timer.periodic\u003c/code> с кнопкой пауза.\u003c/li>\n\u003cli>Разберите JSON из примера в модели и выведите имена игроков.\u003c/li>\n\u003cli>Придумайте, как показать пользователю ошибку таймаута, и напишите соответствующий \u003ccode>catch\u003c/code>.\u003c/li>\n\u003c/ol>\n", "text": " Зачем нужна асинхронность Сетевой запрос идёт сотни миллисекунд. Если ждать «стоя», интерфейс замрёт. Future — «обещание» значения в будущем: приложение продолжает работать, а когда ответ придёт, выполнится продолжение. Future\u003cString> loadName() async { await Future.delayed(const Duration(seconds: 1)); // имитация запроса return 'Аня'; } Future\u003cvoid> main() async { final name = await loadName(); // подождали результат, UI при этом не заблокирован print(name); } Правило Пояснение async помечает функцию, которая использует await Возвращает Future\u003cT> await работает только внутри async Ставит выполнение на паузу до результата Ошибки ловятся обычным try/catch И для await , и внутри async Future.wait([a(), b()]) Выполнить несколько запросов параллельно Stream: поток событий Future даёт одно значение, Stream — много во времени. Пример: секундомер игры. Stream\u003cint> ticker() async* { var seconds = 0; while (true) { await Future.delayed(const Duration(seconds: 1)); yield ++seconds; } } final sub = ticker().listen((s) => print('Прошло $s с')); // не забудьте: sub.cancel(); Для таймера на экране проще использовать Timer.periodic и обязательно отменять его в dispose : import 'dart:async'; Timer? _timer; void start() { _timer = Timer.periodic(const Duration(seconds: 1), (_) { setState(() => seconds++); }); } @override void dispose() { _timer?.cancel(); super.dispose(); } Не вызывайте setState после dispose . Проверяйте if (!mounted) return; после каждого await в виджете. JSON Сервер присылает строку JSON. Приложение превращает её в объекты. import 'dart:convert'; const raw = '{\"id\":\"7\",\"name\":\"Аня\",\"score\":12}'; final Map\u003cString, dynamic> map = jsonDecode(raw); // строка -> Map final player = Player.fromJson(map); // Map -> объект final body = jsonEncode(player.toJson()); // объект -> строка Список объектов: final List\u003cdynamic> raw = jsonDecode(response.body); final players = raw .map((e) => Player.fromJson(e as Map\u003cString, dynamic>)) .toList(); Даты и время final now = DateTime.now(); final start = DateTime(2027, 3, 15, 18, 30); final remind = start.subtract(const Duration(hours: 1)); // для уведомления за час final iso = start.toUtc().toIso8601String(); // для отправки на сервер final parsed = DateTime.parse(iso).toLocal(); final left = start.difference(now); // Duration Для вывода в нужном формате используют intl ( DateFormat('dd-MM-yyyy') ); если пакета нет, форматируйте вручную через padLeft(2, '0') . Что нужно уметь Написать async -функцию и обработать ошибку try/catch . Запустить и корректно остановить Timer.periodic . Разобрать JSON в модель и вернуть обратно. Посчитать разницу между датами. Подробно: как Dart выполняет async Dart выполняет код в одном потоке , но не стоит на месте во время ожидания. Представьте повара (поток): он ставит суп вариться (отправил запрос) и пока жарит котлету (рисует интерфейс). Когда суп готов, повар возвращается к нему. Есть очередь событий : «пришёл ответ», «нажали кнопку», «сработал таймер». await значит: «приостанови эту функцию, продолжи, когда будет результат, а пока обрабатывай другие события». Интерфейс не «зависает», пока вы ждёте сеть. Future\u003cvoid> onTap() async { print('1 — до запроса'); final games = await repo.getGames(); // здесь функция «засыпает» print('3 — после запроса: ${games.length}'); } print('2 — сразу после вызова onTap()'); // выполнится до строки «3» Тяжёлые вычисления (например, обработка большой картинки) всё же блокируют поток. Для них используют compute() / изоляты, но для задания это обычно не нужно. Подробно: ошибки, таймауты, отмена Любой запрос может завершиться неудачей. Три инструмента: Future\u003cList\u003cGame>> load() async { try { final games = await repo.getGames().timeout(const Duration(seconds: 15)); // ограничили ожидание return games; } on TimeoutException { throw const TimeoutApiException(); } on SocketException { throw const NoInternetException(); } finally { AppLog.debug('GameController', 'Загрузка', 'завершена'); // выполнится всегда } } Параллельные запросы: final results = await Future.wait([repo.getGames(), repo.getStats()]); final games = results[0] as List\u003cGame>; final stats = results[1] as Stats; Отмена Stream-подписки и таймера — в dispose : late final StreamSubscription\u003cint> _sub; _sub = ticker().listen(...); @override void dispose() { _sub.cancel(); super.dispose(); } Защита от двойного нажатия : пока идёт запрос, отключайте кнопку (флаг isLoading ), иначе игра создастся дважды. Подробно: JSON с вложенными данными Ответ сервера часто содержит вложенные объекты и списки: { \"id\": \"5\", \"title\": \"Evening battle\", \"players\": [{\"id\": \"1\", \"name\": \"Аня\"}, {\"id\": \"2\", \"name\": \"Боря\"}], \"result\": null } class GameDto { final String id; final String title; final List\u003cPlayerDto> players; final ResultDto? result; GameDto({required this.id, required this.title, required this.players, this.result}); factory GameDto.fromJson(Map\u003cString, dynamic> j) => GameDto( id: j['id'].toString(), title: j['title'] as String, players: (j['players'] as List? ?? []) .map((e) => PlayerDto.fromJson(e as Map\u003cString, dynamic>)) .toList(), result: j['result'] == null ? null : ResultDto.fromJson(j['result'] as Map\u003cString, dynamic>), ); } Правила надёжного разбора: Список может прийти null , поэтому ?? [] . Число может быть int или double , поэтому as num . Идентификатор может быть числом или строкой, поэтому .toString() . Поле может отсутствовать, поэтому тип с ? . Кириллица в ответе: декодируйте utf8.decode(response.bodyBytes) , а не response.body , если видите «кракозябры». Практика Напишите Future\u003cint> slowSum() с задержкой 2 секунды и вызовите её через await . Запустите два «запроса» через Future.wait и замерьте время. Сделайте секундомер на Timer.periodic с кнопкой пауза. Разберите JSON из примера в модели и выведите имена игроков. Придумайте, как показать пользователю ошибку таймаута, и напишите соответствующий catch . ", "hours": 3, "minutes": 5}, {"id": "flutter-basics", "stage": 3, "title": "Flutter: виджеты и состояние", "lead": "Всё в Flutter — виджет. Stateless и Stateful, жизненный цикл, основные контейнеры, setState.", "html": "\u003ch2>Что такое Flutter\u003c/h2>\n\u003cp>Flutter — фреймворк Google для приложений Android, iOS и других платформ из одного кода на Dart. Интерфейс собирается из \u003cstrong>виджетов\u003c/strong>: кнопка, текст, отступ, строка, экран — всё виджеты. Дерево виджетов описывает, как выглядит экран \u003cstrong>сейчас\u003c/strong>; при изменении данных Flutter перестраивает нужную часть дерева.\u003c/p>\n\u003ch2>Минимальное приложение\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>import &#39;package:flutter/material.dart&#39;;\n\nvoid main() =&gt; runApp(const MyApp());\n\nclass MyApp extends StatelessWidget {\n  const MyApp({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return const MaterialApp(\n      debugShowCheckedModeBanner: false,\n      home: Scaffold(body: Center(child: Text(&#39;Привет&#39;))),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003ch2>StatelessWidget и StatefulWidget\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>\u003c/th>\n\u003cth>StatelessWidget\u003c/th>\n\u003cth>StatefulWidget\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Хранит изменяемое состояние\u003c/td>\n\u003ctd>нет\u003c/td>\n\u003ctd>да (в классе \u003ccode>State\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Когда\u003c/td>\n\u003ctd>Надпись, иконка, кнопка с параметрами\u003c/td>\n\u003ctd>Поле ввода, чекбокс, таймер\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Перерисовка\u003c/td>\n\u003ctd>только при изменении параметров\u003c/td>\n\u003ctd>при вызове \u003ccode>setState\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cpre class=\"dart\">\u003ccode>class Counter extends StatefulWidget {\n  const Counter({super.key});\n  @override\n  State&lt;Counter&gt; createState() =&gt; _CounterState();\n}\n\nclass _CounterState extends State&lt;Counter&gt; {\n  int _count = 0;\n\n  @override\n  Widget build(BuildContext context) {\n    return TextButton(\n      onPressed: () =&gt; setState(() =&gt; _count++), // setState запускает перерисовку\n      child: Text(&#39;Нажато: $_count&#39;),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003ch2>Жизненный цикл State (логируется в задании!)\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Метод\u003c/th>\n\u003cth>Когда вызывается\u003c/th>\n\u003cth>Что делать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>initState\u003c/code>\u003c/td>\n\u003ctd>Один раз при создании\u003c/td>\n\u003ctd>Создать контроллеры, подписки, запустить загрузку; \u003cstrong>лог INFO\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>didChangeDependencies\u003c/code>\u003c/td>\n\u003ctd>После \u003ccode>initState\u003c/code> и при изменении \u003ccode>InheritedWidget\u003c/code>\u003c/td>\n\u003ctd>Читать \u003ccode>Theme.of\u003c/code>, \u003ccode>MediaQuery\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>build\u003c/code>\u003c/td>\n\u003ctd>Каждый раз при перерисовке\u003c/td>\n\u003ctd>Только описывать UI, без запросов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>didUpdateWidget\u003c/code>\u003c/td>\n\u003ctd>Родитель передал новые параметры\u003c/td>\n\u003ctd>Обновить внутреннее состояние\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>dispose\u003c/code>\u003c/td>\n\u003ctd>Виджет удалён навсегда\u003c/td>\n\u003ctd>Отменить таймеры, закрыть контроллеры; \u003cstrong>лог INFO\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>В задании «жизненный цикл экранов» нужно логировать на уровне INFO. Во Flutter это в первую очередь \u003ccode>initState\u003c/code> и \u003ccode>dispose\u003c/code>; для остального (\u003ccode>paused\u003c/code>, \u003ccode>resumed\u003c/code>) используйте \u003ccode>WidgetsBindingObserver\u003c/code>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class _ScreenState extends State&lt;Screen&gt; with WidgetsBindingObserver {\n  @override\n  void initState() {\n    super.initState();\n    WidgetsBinding.instance.addObserver(this);\n    log.info(&#39;GameScreen&#39;, &#39;Жизненный цикл&#39;, &#39;initState&#39;);\n  }\n\n  @override\n  void didChangeAppLifecycleState(AppLifecycleState state) {\n    log.info(&#39;GameScreen&#39;, &#39;Жизненный цикл&#39;, state.name); // resumed / inactive / paused / detached\n  }\n\n  @override\n  void dispose() {\n    WidgetsBinding.instance.removeObserver(this);\n    log.info(&#39;GameScreen&#39;, &#39;Жизненный цикл&#39;, &#39;dispose&#39;);\n    super.dispose();\n  }\n  ...\n}\u003c/code>\u003c/pre>\n\u003ch2>Строительные блоки раскладки\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Виджет\u003c/th>\n\u003cth>Назначение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Row\u003c/code> / \u003ccode>Column\u003c/code>\u003c/td>\n\u003ctd>Элементы в строку / в столбец\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Stack\u003c/code> + \u003ccode>Positioned\u003c/code>\u003c/td>\n\u003ctd>Наложение слоёв\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Container\u003c/code>\u003c/td>\n\u003ctd>Размер, цвет, рамка, скругление, отступы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Padding\u003c/code>, \u003ccode>SizedBox\u003c/code>, \u003ccode>Spacer\u003c/code>\u003c/td>\n\u003ctd>Отступы и пустоты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Expanded\u003c/code>, \u003ccode>Flexible\u003c/code>\u003c/td>\n\u003ctd>Занять оставшееся место внутри \u003ccode>Row\u003c/code>/\u003ccode>Column\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Align\u003c/code>, \u003ccode>Center\u003c/code>\u003c/td>\n\u003ctd>Выравнивание\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>ListView\u003c/code>, \u003ccode>GridView\u003c/code>, \u003ccode>SingleChildScrollView\u003c/code>\u003c/td>\n\u003ctd>Прокрутка\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Wrap\u003c/code>\u003c/td>\n\u003ctd>Перенос элементов на новую строку\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>ClipRRect\u003c/code>, \u003ccode>DecoratedBox\u003c/code>\u003c/td>\n\u003ctd>Скругление и оформление\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cpre class=\"dart\">\u003ccode>Row(\n  crossAxisAlignment: CrossAxisAlignment.center,\n  children: [\n    const CircleAvatar(radius: 24),\n    const SizedBox(width: 12),\n    Expanded( // текст не вылезет за границы и перенесётся\n      child: Text(&#39;Длинное имя соперника&#39;, maxLines: 1, overflow: TextOverflow.ellipsis),\n    ),\n  ],\n)\u003c/code>\u003c/pre>\n\u003cdiv class=\"tip\">\n\u003cp>Ошибка «RenderFlex overflowed by N pixels» — элементы не поместились. Решения: обернуть в \u003ccode>Expanded\u003c/code>/\u003ccode>Flexible\u003c/code>, дать прокрутку (\u003ccode>SingleChildScrollView\u003c/code>), использовать \u003ccode>Wrap\u003c/code>, добавить \u003ccode>overflow: TextOverflow.ellipsis\u003c/code>. В задании требуется «без горизонтального скролла» и «текст не обрезается блоком».\u003c/p>\n\u003c/div>\n\u003ch2>Ограничения (constraints)\u003c/h2>\n\u003cp>Главное правило раскладки: \u003cstrong>родитель передаёт ограничения вниз, ребёнок выбирает размер и отдаёт его вверх, родитель его позиционирует.\u003c/strong> Поэтому \u003ccode>Column\u003c/code> внутри \u003ccode>Column\u003c/code> без \u003ccode>Expanded\u003c/code> вызывает ошибки высоты, а \u003ccode>ListView\u003c/code> внутри \u003ccode>Column\u003c/code> требует \u003ccode>Expanded\u003c/code> или \u003ccode>shrinkWrap: true\u003c/code>.\u003c/p>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Выбрать Stateless или Stateful.\u003c/li>\n\u003cli>Перечислить методы жизненного цикла и сказать, что в каждом делать.\u003c/li>\n\u003cli>Собрать экран из \u003ccode>Row\u003c/code>, \u003ccode>Column\u003c/code>, \u003ccode>Stack\u003c/code>, \u003ccode>Expanded\u003c/code>.\u003c/li>\n\u003cli>Объяснить причину ошибки overflow и исправить её.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: дерево виджетов и перерисовка\u003c/h2>\n\u003cp>Экран в Flutter — \u003cstrong>дерево\u003c/strong>. Корень — \u003ccode>MaterialApp\u003c/code>, внутри \u003ccode>Scaffold\u003c/code>, внутри \u003ccode>Column\u003c/code>, внутри \u003ccode>Text\u003c/code> и так далее. Дерево не рисуется один раз: при изменении состояния Flutter \u003cstrong>перестраивает\u003c/strong> нужную ветку.\u003c/p>\n\u003cpre>\u003ccode>MaterialApp\n └─ Scaffold\n     ├─ AppBar\n     └─ Column\n         ├─ Text(&#39;Счёт: 5&#39;)      ← при setState перестроится\n         └─ ElevatedButton\u003c/code>\u003c/pre>\n\u003cp>Как это работает:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Вы вызываете \u003ccode>setState(() =&gt; score++)\u003c/code>.\u003c/li>\n\u003cli>Flutter помечает этот \u003ccode>State\u003c/code> «грязным» и вызывает \u003ccode>build\u003c/code> заново.\u003c/li>\n\u003cli>Новое дерево сравнивается со старым, обновляются только изменившиеся части.\u003c/li>\n\u003c/ol>\n\u003cp>Выводы:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>build\u003c/code> вызывается \u003cstrong>часто\u003c/strong>; не делайте в нём запросы и тяжёлые вычисления.\u003c/li>\n\u003cli>Чем ниже по дереву \u003ccode>setState\u003c/code>, тем меньше перерисовывается. Выносите изменяющийся кусок в отдельный виджет.\u003c/li>\n\u003cli>Виджеты — «чертежи», они лёгкие; создавать их много не страшно.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: const и Key\u003c/h2>\n\u003cp>\u003cstrong>\u003ccode>const\u003c/code>\u003c/strong> сообщает Flutter, что виджет не меняется, поэтому его можно создать один раз и не перестраивать:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>const SizedBox(height: 16);          // всегда один и тот же объект\nconst Text(&#39;Заголовок&#39;);\u003c/code>\u003c/pre>\n\u003cp>Если виджет зависит от переменной, \u003ccode>const\u003c/code> ставить нельзя. Линтер подскажет, где можно: \u003ccode>prefer_const_constructors\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>Key\u003c/code>\u003c/strong> нужен, чтобы Flutter различал одинаковые виджеты в списках, особенно при перестановках. В игре Image плитки меняются местами, и без ключей состояние (например, анимация) может «прилипнуть» не к той плитке.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>for (final tile in tiles) TileWidget(key: ValueKey(tile.id), tile: tile),\u003c/code>\u003c/pre>\n\u003ch2>Подробно: constraints на примерах\u003c/h2>\n\u003cp>Правило: \u003cstrong>родитель задаёт границы, ребёнок выбирает размер внутри них, родитель ставит ребёнка на место.\u003c/strong>\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Родитель\u003c/th>\n\u003cth>Что передаёт ребёнку\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Scaffold.body\u003c/code>\u003c/td>\n\u003ctd>Размер экрана (tight)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Center\u003c/code>\u003c/td>\n\u003ctd>«Можешь быть от нуля до всего экрана» (loose)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Column\u003c/code>\u003c/td>\n\u003ctd>По ширине — ограничение родителя, по высоте — без ограничений\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Row\u003c/code>\u003c/td>\n\u003ctd>По высоте — ограничение родителя, по ширине — без ограничений\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>Expanded\u003c/code>\u003c/td>\n\u003ctd>Ровно оставшееся место по главной оси\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>SizedBox(width: 100)\u003c/code>\u003c/td>\n\u003ctd>Ровно 100\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Поэтому:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>Container(width: 100)\u003c/code> внутри \u003ccode>Center\u003c/code> будет 100, а внутри \u003ccode>Scaffold.body\u003c/code> без \u003ccode>Center\u003c/code> растянется на весь экран (родитель «жёсткий»).\u003c/li>\n\u003cli>\u003ccode>ListView\u003c/code> внутри \u003ccode>Column\u003c/code> получает бесконечную высоту и падает, пока не обернёте в \u003ccode>Expanded\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cpre class=\"dart\">\u003ccode>Column(children: [\n  const Header(),\n  Expanded(child: ListView(children: items)),   // список занимает всё оставшееся место\n  const BottomButton(),\n])\u003c/code>\u003c/pre>\n\u003ch2>Подробно: как выбрать способ управления состоянием\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Вопрос\u003c/th>\n\u003cth>Ответ → решение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Состояние нужно одному маленькому виджету (раскрыт ли блок)\u003c/td>\n\u003ctd>\u003ccode>StatefulWidget\u003c/code> + \u003ccode>setState\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Состояние экрана (загрузка, список, ошибка)\u003c/td>\n\u003ctd>Контроллер: \u003ccode>ChangeNotifier\u003c/code> / GetX / Bloc\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Состояние нужно многим экранам (пользователь)\u003c/td>\n\u003ctd>Хранить в репозитории/сервисе и отдавать через DI\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Минимальный контроллер без пакетов:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class CounterController extends ChangeNotifier {\n  int value = 0;\n  void inc() { value++; notifyListeners(); }\n}\n\nfinal controller = CounterController();\n\nListenableBuilder(\n  listenable: controller,\n  builder: (_, __) =&gt; Text(&#39;${controller.value}&#39;),\n)\u003c/code>\u003c/pre>\n\u003cp>С GetX:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class CounterController extends GetxController {\n  final value = 0.obs;\n  void inc() =&gt; value.value++;\n}\nObx(() =&gt; Text(&#39;${controller.value}&#39;));\u003c/code>\u003c/pre>\n\u003cp>Главное правило из задания: \u003cstrong>контроллер лежит в Presentation и не знает о сети\u003c/strong>; он вызывает UseCase, а тот — репозиторий.\u003c/p>\n\u003ch2>Практика\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Сделайте экран-счётчик на \u003ccode>StatefulWidget\u003c/code>, затем перепишите на \u003ccode>ChangeNotifier\u003c/code>.\u003c/li>\n\u003cli>Соберите карточку игры: аватар, два текста, иконка справа; проверьте на узком экране, что нет overflow.\u003c/li>\n\u003cli>Добавьте \u003ccode>initState\u003c/code>/\u003ccode>dispose\u003c/code> с логами по формату задания.\u003c/li>\n\u003cli>Сделайте список из 20 элементов с кнопкой внизу, прибитой к низу экрана.\u003c/li>\n\u003cli>Объясните вслух, что произойдёт при нажатии на кнопку со \u003ccode>setState\u003c/code>.\u003c/li>\n\u003c/ol>\n", "text": " Что такое Flutter Flutter — фреймворк Google для приложений Android, iOS и других платформ из одного кода на Dart. Интерфейс собирается из виджетов : кнопка, текст, отступ, строка, экран — всё виджеты. Дерево виджетов описывает, как выглядит экран сейчас ; при изменении данных Flutter перестраивает нужную часть дерева. Минимальное приложение import 'package:flutter/material.dart'; void main() => runApp(const MyApp()); class MyApp extends StatelessWidget { const MyApp({super.key}); @override Widget build(BuildContext context) { return const MaterialApp( debugShowCheckedModeBanner: false, home: Scaffold(body: Center(child: Text('Привет'))), ); } } StatelessWidget и StatefulWidget StatelessWidget StatefulWidget Хранит изменяемое состояние нет да (в классе State ) Когда Надпись, иконка, кнопка с параметрами Поле ввода, чекбокс, таймер Перерисовка только при изменении параметров при вызове setState class Counter extends StatefulWidget { const Counter({super.key}); @override State\u003cCounter> createState() => _CounterState(); } class _CounterState extends State\u003cCounter> { int _count = 0; @override Widget build(BuildContext context) { return TextButton( onPressed: () => setState(() => _count++), // setState запускает перерисовку child: Text('Нажато: $_count'), ); } } Жизненный цикл State (логируется в задании!) Метод Когда вызывается Что делать initState Один раз при создании Создать контроллеры, подписки, запустить загрузку; лог INFO didChangeDependencies После initState и при изменении InheritedWidget Читать Theme.of , MediaQuery build Каждый раз при перерисовке Только описывать UI, без запросов didUpdateWidget Родитель передал новые параметры Обновить внутреннее состояние dispose Виджет удалён навсегда Отменить таймеры, закрыть контроллеры; лог INFO В задании «жизненный цикл экранов» нужно логировать на уровне INFO. Во Flutter это в первую очередь initState и dispose ; для остального ( paused , resumed ) используйте WidgetsBindingObserver : class _ScreenState extends State\u003cScreen> with WidgetsBindingObserver { @override void initState() { super.initState(); WidgetsBinding.instance.addObserver(this); log.info('GameScreen', 'Жизненный цикл', 'initState'); } @override void didChangeAppLifecycleState(AppLifecycleState state) { log.info('GameScreen', 'Жизненный цикл', state.name); // resumed / inactive / paused / detached } @override void dispose() { WidgetsBinding.instance.removeObserver(this); log.info('GameScreen', 'Жизненный цикл', 'dispose'); super.dispose(); } ... } Строительные блоки раскладки Виджет Назначение Row / Column Элементы в строку / в столбец Stack + Positioned Наложение слоёв Container Размер, цвет, рамка, скругление, отступы Padding , SizedBox , Spacer Отступы и пустоты Expanded , Flexible Занять оставшееся место внутри Row / Column Align , Center Выравнивание ListView , GridView , SingleChildScrollView Прокрутка Wrap Перенос элементов на новую строку ClipRRect , DecoratedBox Скругление и оформление Row( crossAxisAlignment: CrossAxisAlignment.center, children: [ const CircleAvatar(radius: 24), const SizedBox(width: 12), Expanded( // текст не вылезет за границы и перенесётся child: Text('Длинное имя соперника', maxLines: 1, overflow: TextOverflow.ellipsis), ), ], ) Ошибка «RenderFlex overflowed by N pixels» — элементы не поместились. Решения: обернуть в Expanded / Flexible , дать прокрутку ( SingleChildScrollView ), использовать Wrap , добавить overflow: TextOverflow.ellipsis . В задании требуется «без горизонтального скролла» и «текст не обрезается блоком». Ограничения (constraints) Главное правило раскладки: родитель передаёт ограничения вниз, ребёнок выбирает размер и отдаёт его вверх, родитель его позиционирует. Поэтому Column внутри Column без Expanded вызывает ошибки высоты, а ListView внутри Column требует Expanded или shrinkWrap: true . Что нужно уметь Выбрать Stateless или Stateful. Перечислить методы жизненного цикла и сказать, что в каждом делать. Собрать экран из Row , Column , Stack , Expanded . Объяснить причину ошибки overflow и исправить её. Подробно: дерево виджетов и перерисовка Экран в Flutter — дерево . Корень — MaterialApp , внутри Scaffold , внутри Column , внутри Text и так далее. Дерево не рисуется один раз: при изменении состояния Flutter перестраивает нужную ветку. MaterialApp └─ Scaffold ├─ AppBar └─ Column ├─ Text('Счёт: 5') ← при setState перестроится └─ ElevatedButton Как это работает: Вы вызываете setState(() => score++) . Flutter помечает этот State «грязным» и вызывает build заново. Новое дерево сравнивается со старым, обновляются только изменившиеся части. Выводы: build вызывается часто ; не делайте в нём запросы и тяжёлые вычисления. Чем ниже по дереву setState , тем меньше перерисов
