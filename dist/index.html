ли радиусы идут по убыванию @override bool get isSolved { for (var i = 0; i \u003c items.length - 1; i++) { if (items[i].radius \u003c items[i + 1].radius) return false; } return true; } @override void onUserMove() => afterMove(); // Перемещение круга на новое место void move(int from, int to) { final item = items.removeAt(from); items.insert(to, item); onUserMove(); } @override void onFinished() {/* отправка результата */} } Рисование кругов — Container с BoxShape.circle или CustomPaint . Для перетаскивания — ReorderableListView (если макет линейный) либо Draggable + DragTarget . ReorderableListView( onReorder: (oldIndex, newIndex) { if (newIndex > oldIndex) newIndex -= 1; // особенность ReorderableListView controller.move(oldIndex, newIndex); }, children: [ for (final c in controller.items) CircleWidget(key: ValueKey(c.id), radius: c.radius), ], ) Завершение и победитель Алгоритм одинаковый для обеих игр: isSolved == true → таймер остановлен → экран заблокирован. Запрос «сохранение результата» со временем и категорией. Определение победителя (кто быстрее) по правилам API. Экран результата и возврат на Landing. Данные попадают в статистику: «Played Games» делится на Circle (синий) и Image (красный) , поэтому категорию нужно отправлять корректно. Закрытие игры = поражение То же, что в спринте 4 ( WidgetsBindingObserver , PopScope , флаг active_game_id ). Вынесите это в общий миксин для игровых экранов, а не копируйте: mixin GameLifecycleMixin\u003cT extends StatefulWidget> on State\u003cT> implements WidgetsBindingObserver { // ... общий код: подписка на lifecycle и вызов onGameAbandoned() } Если мешает implements WidgetsBindingObserver , используйте обычный базовый State -класс. Проверка перед сдачей Играйте две игры подряд, статистика растёт, круги не дублируются. Выйдите из игры: засчитано поражение. Перезапустите приложение посреди игры: вернулись на экран, где были, и не потеряли данные (либо засчитано поражение, если так сказано в карточке). Отключите интернет: ошибка на 5 секунд, приложение живо. Нет дублирования между ImageGame и CircleGame . Если не успеваете Сначала сделайте игру без анимации и красоты. Затем экран результата и отправка. Потом перетаскивание и стили. ", "hours": 4, "minutes": 4}, {"id": "sprint6", "stage": 6, "title": "Спринт 6: защита и публикация", "lead": "3 ч. Презентация, Яндекс-метрика и подготовка страницы в RuStore. 9 баллов.", "html": "\u003ch2>Что оценивают\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 42%\" />\n\u003ccol style=\"width: 57%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Блок\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Презентация создана (0,4) + 5 обязательных разделов (по 0,2)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,40\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Яндекс-метрика инициализирована\u003c/td>\n\u003ctd style=\"text-align: right;\">1,00\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Сценарий активности в Image + диаграмма в презентации\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Слайды, диаграммы, доклад, ответы на вопросы, поведение\u003c/td>\n\u003ctd style=\"text-align: right;\">3,30\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Публикация: название, иконка, APK, тип, возраст, категория, описания, скриншоты\u003c/td>\n\u003ctd style=\"text-align: right;\">2,10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Всего 9 баллов, из них около 3,3 даёт \u003cstrong>ваше выступление\u003c/strong> (экспертная оценка), остальное проверяется по наличию.\u003c/p>\n\u003ch2>Презентация для разработчиков\u003c/h2>\n\u003cp>Аудитория — разработчики. «Вы не должны продавать приложение!» Показывайте инженерные решения.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Раздел\u003c/th>\n\u003cth>Что показать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Реализация приложения\u003c/td>\n\u003ctd>Экраны (по 1–2 скриншота), основные сценарии, стек\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Схема классов\u003c/td>\n\u003ctd>Диаграмма (UML): UseCase, Repository, DTO/Entity, Controller, экран\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Производительность\u003c/td>\n\u003ctd>Сценарий «Игра Image»: FPS, время перестановки, память, что сделали для плавности\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектурные решения\u003c/td>\n\u003ctd>Слои, DI, SOLID, почему Clean Architecture, отдельные библиотеки\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Библиотеки\u003c/td>\n\u003ctd>Таблица: пакет → зачем; и \u003cstrong>что не использовали и почему\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Метрика\u003c/td>\n\u003ctd>Скриншот диаграммы активности в Image по событиям\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Структура на 7–8 слайдов:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Название и цель.\u003c/li>\n\u003cli>Стек и состав проекта (приложение + UIKit + сетевая библиотека).\u003c/li>\n\u003cli>Архитектура (схема слоёв).\u003c/li>\n\u003cli>Схема классов.\u003c/li>\n\u003cli>Используемые библиотеки и обоснование.\u003c/li>\n\u003cli>Производительность в сценарии Image.\u003c/li>\n\u003cli>Метрика и диаграмма.\u003c/li>\n\u003cli>Итоги, что улучшили бы.\u003c/li>\n\u003c/ol>\n\u003cp>Диаграмму классов можно нарисовать в Mermaid или любом редакторе:\u003c/p>\n\u003cpre>\u003ccode>GameScreen\n   └─ GameController (Presentation)\n         └─ SubmitResult  — UseCase (Domain)\n               └─ GameRepository  — interface (Domain)\n                     ▲\n        GameRepositoryImpl (Data) ──► ApiClient — interface сетевой библиотеки\n                                           ▲\n                                     HttpApiClient\u003c/code>\u003c/pre>\n\u003ch3>Производительность: что сказать\u003c/h3>\n\u003cul>\n\u003cli>Открыть \u003cstrong>Flutter DevTools → Performance\u003c/strong> и записать сценарий «собрать пазл».\u003c/li>\n\u003cli>Показать, что кадры укладываются в ~16 мс (60 fps) или ~8 мс (120 fps).\u003c/li>\n\u003cli>Что вы сделали: \u003ccode>const\u003c/code> конструкторы, \u003ccode>RepaintBoundary\u003c/code> вокруг плиток, перестройка только нужных виджетов, кэширование картинок, \u003ccode>dispose\u003c/code> таймеров.\u003c/li>\n\u003cli>Запускайте профилирование в режиме \u003ccode>flutter run --profile\u003c/code>, не в debug.\u003c/li>\n\u003c/ul>\n\u003ch2>Яндекс.Метрика (AppMetrica)\u003c/h2>\n\u003cp>Нужны: API-ключ (его выдадут организаторы или создадите в кабинете), пакет \u003ccode>appmetrica_plugin\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;void&gt; main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await AppMetrica.activate(const AppMetricaConfig(&#39;API_KEY&#39;));\n  runApp(const MyApp());\n}\u003c/code>\u003c/pre>\n\u003cp>События в игре Image: \u003cstrong>каждое движение\u003c/strong> и \u003cstrong>отправка\u003c/strong> результата.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Analytics {\n  static void imageMove(int moveNumber) =&gt;\n      AppMetrica.reportEventWithMap(&#39;image_move&#39;, {&#39;move&#39;: moveNumber});\n\n  static void imageSubmit(int seconds, int moves) =&gt;\n      AppMetrica.reportEventWithMap(&#39;image_submit&#39;, {&#39;seconds&#39;: seconds, &#39;moves&#39;: moves});\n}\n\n// в контроллере игры\nvoid swap(int a, int b) {\n  ...\n  Analytics.imageMove(moves);\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>API плагина и версии меняются: сверьтесь с README \u003ccode>appmetrica_plugin\u003c/code> и инструкцией для Android/iOS. Событие должно улететь в метрику \u003cstrong>до\u003c/strong> презентации — данные появляются в кабинете с задержкой.\u003c/p>\n\u003c/div>\n\u003cp>Сделайте пару прогонов игры, затем в кабинете откройте отчёт по событиям и сделайте \u003cstrong>скриншот диаграммы\u003c/strong>.\u003c/p>\n\u003ch2>Подготовка к публикации в RuStore\u003c/h2>\n\u003cp>Что понадобится (по критериям):\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Пункт\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Название соответствует заданию\u003c/td>\n\u003ctd style=\"text-align: right;\">0,1\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Иконка приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">0,1\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>APK-файл загружен\u003c/td>\n\u003ctd style=\"text-align: right;\">0,2\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Название для пользователя и тип приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">0,2\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Возрастная категория\u003c/td>\n\u003ctd style=\"text-align: right;\">0,2\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Категория приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">0,1\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Краткое описание\u003c/td>\n\u003ctd style=\"text-align: right;\">0,3\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Основное описание\u003c/td>\n\u003ctd style=\"text-align: right;\">0,6\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Скриншоты (−0,1 за каждый отсутствующий до 5)\u003c/td>\n\u003ctd style=\"text-align: right;\">0,5\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3>Сборка APK с подписью\u003c/h3>\n\u003cpre class=\"bash\">\u003ccode>keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>android/key.properties\u003c/code> (\u003cstrong>не коммитьте!\u003c/strong>):\u003c/p>\n\u003cpre>\u003ccode>storePassword=...\nkeyPassword=...\nkeyAlias=upload\nstoreFile=../upload-keystore.jks\u003c/code>\u003c/pre>\n\u003cp>В \u003ccode>android/app/build.gradle\u003c/code> подключите \u003ccode>signingConfigs\u003c/code> и используйте их в \u003ccode>release\u003c/code>. Затем:\u003c/p>\n\u003cpre class=\"bash\">\u003ccode>flutter build apk --release\u003c/code>\u003c/pre>\n\u003cp>Файл лежит в \u003ccode>build/app/outputs/flutter-apk/app-release.apk\u003c/code>.\u003c/p>\n\u003ch3>Иконка и название\u003c/h3>\n\u003cul>\n\u003cli>Иконка приложения: пакет \u003ccode>flutter_launcher_icons\u003c/code> или замена файлов в \u003ccode>mipmap-*\u003c/code>.\u003c/li>\n\u003cli>Название приложения: \u003ccode>android:label\u003c/code> в \u003ccode>AndroidManifest.xml\u003c/code> и \u003ccode>CFBundleDisplayName\u003c/code> в \u003ccode>Info.plist\u003c/code>.\u003c/li>\n\u003cli>Идентификатор: \u003ccode>applicationId\u003c/code> (Android) и \u003ccode>Bundle Identifier\u003c/code> (iOS), например \u003ccode>ru.example.combats\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch3>Тексты\u003c/h3>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Поле\u003c/th>\n\u003cth>Как писать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Краткое описание\u003c/td>\n\u003ctd>1–2 предложения: что делает приложение\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Основное описание\u003c/td>\n\u003ctd>Для кого, основные функции, как играть, особенности\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Категория\u003c/td>\n\u003ctd>Например, «Игры» / «Развлечения»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Возраст\u003c/td>\n\u003ctd>Как требует магазин (0+, 6+, 12+ …); игры без насилия и покупок — низкая категория\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Скриншоты\u003c/td>\n\u003ctd>5 экранов приложения в порядке сценария\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Как отвечать на вопросы комиссии\u003c/h2>\n\u003cp>Подготовьте ответы на:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Почему вы разделили слои именно так?\u003c/li>\n\u003cli>Чем \u003ccode>implements\u003c/code> отличается от \u003ccode>extends\u003c/code>?\u003c/li>\n\u003cli>Как вы убедились, что картинка у игроков одинакова?\u003c/li>\n\u003cli>Как приложение ведёт себя без интернета?\u003c/li>\n\u003cli>Что в вашем коде нарушает SOLID и как бы вы исправили?\u003c/li>\n\u003cli>Зачем нужны отдельные библиотеки и версионирование?\u003c/li>\n\u003cli>Почему не использовали (или использовали) \u003ccode>dio\u003c/code>/\u003ccode>GetX\u003c/code>/\u003ccode>Bloc\u003c/code>?\u003c/li>\n\u003c/ol>\n\u003cp>Говорите простыми словами, с примерами из своего кода, и называйте честно, что не успели.\u003c/p>\n\u003ch2>Тайминг на 3 часа\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Время\u003c/th>\n\u003cth>Что\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>0:00–0:20\u003c/td>\n\u003ctd>Метрика, события, прогоны\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>0:20–1:10\u003c/td>\n\u003ctd>Сборка, иконка, описание, скриншоты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>1:10–2:10\u003c/td>\n\u003ctd>Презентация, диаграммы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>2:10–2:40\u003c/td>\n\u003ctd>Репетиция доклада, ответы на вопросы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>2:40–3:00\u003c/td>\n\u003ctd>Git: ветка, PR, merge, финальная проверка сборки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n", "text": " Что оценивают Блок Баллы Презентация создана (0,4) + 5 обязательных разделов (по 0,2) 1,40 Яндекс-метрика инициализирована 1,00 Сценарий активности в Image + диаграмма в презентации 1,20 Слайды, диаграммы, доклад, ответы на вопросы, поведение 3,30 Публикация: название, иконка, APK, тип, возраст, категория, описания, скриншоты 2,10 Всего 9 баллов, из них около 3,3 даёт ваше выступление (экспертная оценка), остальное проверяется по наличию. Презентация для разработчиков Аудитория — разработчики. «Вы не должны продавать приложение!» Показывайте инженерные решения. Раздел Что показать Реализация приложения Экраны (по 1–2 скриншота), основные сценарии, стек Схема классов Диаграмма (UML): UseCase, Repository, DTO/Entity, Controller, экран Производительность Сценарий «Игра Image»: FPS, время перестановки, память, что сделали для плавности Архитектурные решения Слои, DI, SOLID, почему Clean Architecture, отдельные библиотеки Библиотеки Таблица: пакет → зачем; и что не использовали и почему Метрика Скриншот диаграммы активности в Image по событиям Структура на 7–8 слайдов: Название и цель. Стек и состав проекта (приложение + UIKit + сетевая библиотека). Архитектура (схема слоёв). Схема классов. Используемые библиотеки и обоснование. Производительность в сценарии Image. Метрика и диаграмма. Итоги, что улучшили бы. Диаграмму классов можно нарисовать в Mermaid или любом редакторе: GameScreen └─ GameController (Presentation) └─ SubmitResult — UseCase (Domain) └─ GameRepository — interface (Domain) ▲ GameRepositoryImpl (Data) ──► ApiClient — interface сетевой библиотеки ▲ HttpApiClient Производительность: что сказать Открыть Flutter DevTools → Performance и записать сценарий «собрать пазл». Показать, что кадры укладываются в ~16 мс (60 fps) или ~8 мс (120 fps). Что вы сделали: const конструкторы, RepaintBoundary вокруг плиток, перестройка только нужных виджетов, кэширование картинок, dispose таймеров. Запускайте профилирование в режиме flutter run --profile , не в debug. Яндекс.Метрика (AppMetrica) Нужны: API-ключ (его выдадут организаторы или создадите в кабинете), пакет appmetrica_plugin . Future\u003cvoid> main() async { WidgetsFlutterBinding.ensureInitialized(); await AppMetrica.activate(const AppMetricaConfig('API_KEY')); runApp(const MyApp()); } События в игре Image: каждое движение и отправка результата. class Analytics { static void imageMove(int moveNumber) => AppMetrica.reportEventWithMap('image_move', {'move': moveNumber}); static void imageSubmit(int seconds, int moves) => AppMetrica.reportEventWithMap('image_submit', {'seconds': seconds, 'moves': moves}); } // в контроллере игры void swap(int a, int b) { ... Analytics.imageMove(moves); } API плагина и версии меняются: сверьтесь с README appmetrica_plugin и инструкцией для Android/iOS. Событие должно улететь в метрику до презентации — данные появляются в кабинете с задержкой. Сделайте пару прогонов игры, затем в кабинете откройте отчёт по событиям и сделайте скриншот диаграммы . Подготовка к публикации в RuStore Что понадобится (по критериям): Пункт Баллы Название соответствует заданию 0,1 Иконка приложения 0,1 APK-файл загружен 0,2 Название для пользователя и тип приложения 0,2 Возрастная категория 0,2 Категория приложения 0,1 Краткое описание 0,3 Основное описание 0,6 Скриншоты (−0,1 за каждый отсутствующий до 5) 0,5 Сборка APK с подписью keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload android/key.properties ( не коммитьте! ): storePassword=... keyPassword=... keyAlias=upload storeFile=../upload-keystore.jks В android/app/build.gradle подключите signingConfigs и используйте их в release . Затем: flutter build apk --release Файл лежит в build/app/outputs/flutter-apk/app-release.apk . Иконка и название Иконка приложения: пакет flutter_launcher_icons или замена файлов в mipmap-* . Название приложения: android:label в AndroidManifest.xml и CFBundleDisplayName в Info.plist . Идентификатор: applicationId (Android) и Bundle Identifier (iOS), например ru.example.combats . Тексты Поле Как писать Краткое описание 1–2 предложения: что делает приложение Осн ку, перенос в «Готово к тестированию» с хэшем.\u003c/li>\n\u003cli>Pull request и merge за 5 минут до конца.\u003c/li>\n\u003c/ol>\n\u003ch2>Что даёт половину баллов или ноль\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ситуация\u003c/th>\n\u003cth>Последствие\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Нет комментариев и логов\u003c/td>\n\u003ctd>\u003cstrong>×0,5\u003c/strong> почти в каждом критерии\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Нет библиотеки UIKit\u003c/td>\n\u003ctd>Верстка компонентов не проверяется\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Нет компонента в StoryBook\u003c/td>\n\u003ctd>Половина баллов компонента\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектура не по заданию\u003c/td>\n\u003ctd>0 за слои\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Файл лежит вне своей папки\u003c/td>\n\u003ctd>−0,1 за файл\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Приложение не собирается из репозитория\u003c/td>\n\u003ctd>Ничего не оценивается\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Карточка не в «Готово к тестированию»\u003c/td>\n\u003ctd>Задача не проверяется\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Больше двух задач «В работе»\u003c/td>\n\u003ctd>Ограничение баллов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Нет мёржа в main\u003c/td>\n\u003ctd>Потеря баллов модуля Г\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Приоритеты по «стоимость / время»\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Приоритет\u003c/th>\n\u003cth>Что\u003c/th>\n\u003cth>Почему\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>1\u003c/td>\n\u003ctd>11 запросов сетевого слоя (спринт 2)\u003c/td>\n\u003ctd>12,1 балла, задачи однотипные\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>2\u003c/td>\n\u003ctd>Тесты на запросы\u003c/td>\n\u003ctd>4,95 балла по шаблону\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>3\u003c/td>\n\u003ctd>Игра Image + завершение + победитель\u003c/td>\n\u003ctd>6,3 балла в спринте 4\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>4\u003c/td>\n\u003ctd>Архитектура спринтов 3–4\u003c/td>\n\u003ctd>6,2 + 5,3 балла\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>5\u003c/td>\n\u003ctd>Экраны и их сеть\u003c/td>\n\u003ctd>по 1,1–1,2 за экран\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>6\u003c/td>\n\u003ctd>Камера, уведомления\u003c/td>\n\u003ctd>5 баллов за два небольших блока\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>7\u003c/td>\n\u003ctd>Защита и публикация\u003c/td>\n\u003ctd>9 баллов, 3,3 из них — выступление\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подготовка к чемпионату: что тренировать\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Навык\u003c/th>\n\u003cth>Как тренировать\u003c/th>\n\u003cth>Критерий готовности\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>UIKit за 90 минут\u003c/td>\n\u003ctd>Секундомер, макет из симуляции + недостающие компоненты\u003c/td>\n\u003ctd>Все 10 компонентов, StoryBook, PR\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сетевой слой за 70 минут\u003c/td>\n\u003ctd>Любой публичный API (например, jsonplaceholder)\u003c/td>\n\u003ctd>11 методов, тесты проходят\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Экран по макету за 10 минут\u003c/td>\n\u003ctd>Открыть Figma, собрать экран\u003c/td>\n\u003ctd>Разница с макетом не заметна\u003c/td>\n\u003c/tr>\n\u003ctr class=\"e <script>
(function () {

  var done = load('fp_done', {});

      if (!items.length) return;
      var hrs = items.reduce(function (s, p) { return s + p.hours; }, 0);
      h += '<section class="stage"><div class="stage-head"><div class="stage-no">' + st.n + '</div><div><h3>' + esc(st.title) + '</h3><p class="goal">' + esc(st.goal) + '</p></div><span class="hrs">' + hrs + ' ч</span></div><ul>';
      items.forEach(function (p) {
        h += '<li><a href="#' + p.id + '"><span class="dot' + (done[p.id] ? ' on' : '') + '"></span>' + esc(p.title) + '<em>' + p.hours + ' ч</em></a></li>';
      });
      h += '</ul><div class="practice"><b>Практика</b>' + esc(st.practice) + '</div></section>';
    });
    h += '</div><h2 class="sec">Как идти по плану</h2><div class="prose"><ul><li>Темы идут от простого к сложному. Следующий этап опирается на предыдущий.</li><li>После каждого этапа пройдите тренажёр и сделайте практическое задание.</li><li>Спринты 1–2 лучше отрепетировать с секундомером дважды: они задают фундамент для остальных.</li><li>Если вам удобно по два часа в день, весь план занимает около ' + Math.ceil(totalHours / 2 / 7) + ' недель вместе с практикой в запасе.</li></ul></div>';
    h += '<div class="row"><a class="cta green" href="#start">Начать с карты чемпионата</a><a class="cta" href="#quiz">Открыть тренажёр</a></div></div>';
    main.innerHTML = h;
  }

  /* ---------- статья ---------- */
  function renderPart(p) {
    var st = STAGES.filter(function (s) { return s.n === p.stage; })[0];
    var prev = PARTS[p.index - 1], next = PARTS[p.index + 1];
    var h = '<div class="col"><article><div class="crumb">Этап ' + p.stage + ' · ' + esc(st.title) + '</div><h1>' + esc(p.title) + '</h1><p class="lead">' + esc(p.lead) + '</p><div class="meta"><span class="chip">≈ ' + p.hours + ' ч</span><span class="chip">' + p.minutes + ' мин чтения</span></div><div class="toc" id="toc"></div><div class="prose" id="prose">' + p.html + '</div>';
    h += '<div class="done-bar"><label><input type="checkbox" id="doneBox"' + (done[p.id] ? ' checked' : '') + '> Тема изучена</label><div class="row" style="margin:0"><a class="cta green" href="#quiz-' + p.id + '">Проверить себя</a></div></div>';
    h += '<nav class="pager" aria-label="Соседние темы">' + (prev ? '<a href="#' + prev.id + '"><small>Назад</small>' + esc(prev.title) + '</a>' : '<a class="empty" aria-hidden="true"></a>') + (next ? '<a href="#' + next.id + '"><small>Дальше</small>' + esc(next.title) + '</a>' : '<a href="#quiz"><small>Дальше</small>Тренажёр</a>') + '</nav></article></div>';
    main.innerHTML = h;
    var prose = document.getElementById('prose');
    enhance(prose, p.id);
    document.getElementById('doneBox').addEventListener('change', function (e) { done[p.id] = e.target.checked; if (!e.target.checked) delete done[p.id]; save('fp_done', done); renderNav(p.id); });
  }
  function enhance(root, pid) {
    // таблицы в прокручиваемый контейнер
    root.querySelectorAll('table').forEach(function (t) { var w = document.createElement('div'); w.className = 'tablewrap'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
    // блоки кода: подсветка и кнопка копирования
    root.querySelectorAll('pre').forEach(function (pre) {
      var code = pre.querySelector('code') || pre;
      var lang = (pre.className.match(/\b(dart|yaml|bash|xml|json)\b/) || [])[1];
      var w = document.createElement('div'); w.className = 'codewrap'; pre.parentNode.insertBefore(w, pre); w.appendChild(pre);
      if (lang) { code.className = 'language-' + lang; }
      if (window.hljs && lang) { try { window.hljs.highlightElement(code); } catch (e) { /* без подсветки */ } }
      var b = document.createElement('button'); b.className = 'copy'; b.type = 'button'; b.textContent = 'Копировать';
      b.addEventListener('click', function () {
        var text = code.textContent;
        function ok() { b.textContent = 'Готово'; setTimeout(function () { b.textContent = 'Копировать'; }, 1400); }
        function fallback() { var r = document.createRange(); r.selectNodeContents(code); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Выделено'; }
        try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
      });
      w.appendChild(b);
    });
    // оглавление
    var heads = root.querySelectorAll('h2'), toc = document.getElementById('toc');
    if (heads.length > 2 && toc) {
      toc.innerHTML = '<b>На странице</b><div></div>';
      heads.forEach(function (hd) {
        var bt = document.createElement('button'); bt.type = 'button'; bt.textContent = hd.textContent;
        bt.addEventListener('click', function () { hd.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        toc.lastChild.appendChild(bt);
      });
    } else if (toc) { toc.remove(); }
    // интерактивные чек-листы
    var boxes = root.querySelectorAll('input[type="checkbox"]'), key = 'fp_chk_' + pid, saved = load(key, []);
    boxes.forEach(function (bx, i) {
      bx.disabled = false; bx.checked = saved.indexOf(i) >= 0;
      bx.addEventListener('change', function () {
        var arr = []; boxes.forEach(function (x, j) { if (x.checked) arr.push(j); }); save(key, arr);
      });
    });
  }

  /* ---------- тренажёр ---------- */
  var quiz = null;
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function startQuiz(partId) {
    var pool = partId ? QUIZ.filter(function (q) { return q.part === partId; }) : shuffle(QUIZ).slice(0, 10);
    quiz = { partId: partId, items: partId ? shuffle(pool) : pool, i: 0, score: 0, answered: false, missed: [] };
  }
  function renderQuiz(partId) {
    if (!quiz || quiz.partId !== (partId || null) || quiz.fresh) startQuiz(partId || null);
    quiz.fresh = false;
    if (partId && !quiz.items.length) {
      main.innerHTML = '<div class="col"><h1 class="sec" style="margin-top:0">Тренажёр</h1><p>По теме «' + esc(byId[partId].title) + '» пока нет вопросов.</p><a class="cta green" href="#quiz">Все вопросы</a></div>'; return;
    }
    if (quiz.i >= quiz.items.length) { return renderQuizEnd(); }
    var q = quiz.items[quiz.i], total = quiz.items.length;
    var title = partId ? 'Тема: ' + byId[partId].title : '10 случайных вопросов';
    var h = '<div class="col"><div class="crumb">Тренажёр</div><h1 style="font:700 clamp(22px,5vw,30px)/1.15 var(--f-display);margin:0 0 14px">' + esc(title) + '</h1><div class="bar"><i style="width:' + (quiz.i / total * 100) + '%"></i></div><div class="quiz-card"><div class="qnum">Вопрос ' + (quiz.i + 1) + ' из ' + total + '</div><div class="qtext">' + inline(q.q) + '</div><div class="opts">';
    q.o.forEach(function (o, k) { h += '<button class="opt" type="button" data-k="' + k + '">' + inline(o) + '</button>'; });
    h += '</div><div id="why"></div></div></div>';
    main.innerHTML = h;
    main.querySelectorAll('.opt').forEach(function (b) {
      b.addEventListener('click', function () {
        if (quiz.answered) return; quiz.answered = true;
        var k = +b.dataset.k, ok = k === q.a;
        if (ok) quiz.score++; else quiz.missed.push(q);
        main.querySelectorAll('.opt').forEach(function (x) { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        document.getElementById('why').innerHTML = '<div class="why"><b>' + (ok ? 'Верно. ' : 'Неверно. ') + '</b>' + inline(q.w) + '</div><div class="row"><button class="cta green" type="button" id="nextQ">' + (quiz.i + 1 >= total ? 'Показать результат' : 'Дальше') + '</button></div>';
        document.getElementById('nextQ').addEventListener('click', function () { quiz.i++; quiz.answered = false; renderQuiz(partId); window.scrollTo({ top: 0 }); });
      });
    });
  }
  function inline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
  function renderQuizEnd() {
    var total = quiz.items.length, pc = Math.round(quiz.score / total * 100);
    var h = '<div class="col"><div class="crumb">Результат</div><div class="score">' + quiz.score + ' / ' + total + '</div><p class="lead">' + (pc >= 80 ? 'Отличный результат. Можно идти дальше.' : pc >= 50 ? 'Неплохо. Просмотрите темы с ошибками.' : 'Вернитесь к теории и попробуйте снова.') + '</p>';
    if (quiz.missed.length) {
      var seen = {}; h += '<h2 class="sec" style="margin-top:20px">Повторить</h2><div class="results">';
      quiz.missed.forEach(function (q) { if (seen[q.part]) return; seen[q.part] = 1; h += '<a href="#' + q.part + '"><b>' + esc(byId[q.part].title) + '</b><small>' + inline(q.q) + '</small></a>'; });
      h += '</div>';
    }
    h += '<div class="row"><button class="cta green" type="button" id="again">Ещё раз</button><a class="cta" href="#home">К плану</a></div></div>';
    main.innerHTML = h;
    document.getElementById('again').addEventListener('click', function () { var pid = quiz.partId; quiz = null; renderQuiz(pid); });
  }

  /* ---------- поиск ---------- */
  function renderSearch(q) {
    var ql = q.toLowerCase(), res = [];
    PARTS.forEach(function (p) {
      var i = p.text.toLowerCase().indexOf(ql), inTitle = p.title.toLowerCase().indexOf(ql) >= 0;
      if (i >= 0 || inTitle) {
        var from = Math.max(0, i - 60), snip = i >= 0 ? p.text.slice(from, i + q.length + 90).replace(/\s+/g, ' ') : p.lead;
        res.push({ p: p, snip: snip, w: inTitle ? 0 : 1 });
      }
    });
    res.sort(function (a, b) { return a.w - b.w; });
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    var h = '<div class="col"><div class="crumb">Поиск</div><h1 style="font:700 clamp(22px,5vw,30px)/1.15 var(--f-display);margin:0 0 14px">«' + esc(q) + '»: ' + res.length + '</h1><div class="results">';
    res.forEach(function (r) { h += '<a href="#' + r.p.id + '"><b>' + esc(r.p.title) + '</b><small>…' + esc(r.snip).replace(re, '<mark>$1</mark>') + '…</small></a>'; });
    if (!res.length) h += '<p>Ничего не найдено. Попробуйте другое слово.</p>';
    main.innerHTML = h + '</div></div>';
  }
  searchEl.addEventListener('input', function () {
    var q = searchEl.value.trim();
    if (q.length >= 2) renderSearch(q); else route();
  });

  /* ---------- маршрутизация ---------- */
  function route() {
    var id = location.hash.replace('#', '') || 'home';
    var cur = id;
    if (id === 'home') renderHome();
    else if (id === 'quiz') { quiz = null; renderQuiz(null); cur = 'quiz'; }
    else if (id.indexOf('quiz-') === 0 && byId[id.slice(5)]) { quiz = null; renderQuiz(id.slice(5)); cur = id.slice(5); }
    else if (byId[id]) renderPart(byId[id]);
    else { cur = 'home'; renderHome(); }
    renderNav(cur);
    window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', function () { searchEl.value = ''; route(); });
  route();
})();

</script>
