.width / figmaW; _h = s.height / figmaH; } static double w(double v) => v * _w; // ширины и горизонтальные отступы static double h(double v) => v * _h; // высоты и вертикальные отступы } Размеры вида width: 350.fw для блоков, которые должны тянуться, — риск. На планшете блок останется «колонкой» посередине. Для основного контента чаще лучше double.infinity + горизонтальные отступы, а числа из Figma использовать для отступов, радиусов, иконок и высот. Фиксируйте только то, что должно быть фиксировано (аватар 60×60 с AspectRatio ). Перенос макета в код Откройте макет, включите Dev Mode (режим разработчика) — там видны размеры, отступы, цвета и параметры шрифта. Определите сетку экрана: боковые поля (обычно 20 или 24), шаг (8 px). Идите сверху вниз: каркас ( Scaffold , AppBar , BottomBar ) → секции → детали. Повторяющееся выносите в UIKit-компоненты. Проверьте на трёх размерах: маленький телефон (≈360×640), обычный (≈390×844), большой (≈430×932 и планшет). Состояния компонентов Дизайн-система описывает не только «покой». Для каждого компонента проверьте: Компонент Состояния Кнопка default, pressed, disabled, loading; primary / secondary / destructive Поле ввода default, focused, filled, error, disabled; password, search Чекбокс unchecked, checked, disabled (checked и unchecked) Селект закрыт, открыт (BottomSheet), выбран, ошибка Карточка обычная, выбранная, неактивная Нижнее меню активный пункт для каждого из пунктов Таймер идёт, остановлен, время вышло Проверка перед сдачей Запущено минимум на двух эмуляторах разных размеров. Включён увеличенный размер шрифта в системе: текст не ломает раскладку. Повёрнут экран (если макет допускает) либо ориентация зафиксирована. Клавиатура не перекрывает поле ( resizeToAvoidBottomInset , прокрутка). Что нужно уметь Объяснить разницу между фиксированным и адаптивным размером. Использовать LayoutBuilder , MediaQuery , AspectRatio , Expanded . Снять размеры из Figma и перевести стили текста в TextStyle . ", "hours": 4, "minutes": 3}, {"id": "git", "stage": 4, "title": "Git, канбан и пакеты", "lead": "Ветка на спринт, коммиты, pull request, теги версий и подключение библиотек из Git.", "html": "\u003ch2>Зачем Git на чемпионате\u003c/h2>\n\u003cul>\n\u003cli>Работа \u003cstrong>сдаётся только через репозиторий\u003c/strong>; если проект не собирается из него, оценки нет.\u003c/li>\n\u003cli>Эксперты проверяют версию, сохранённую в \u003cstrong>вашей ветке спринта\u003c/strong>.\u003c/li>\n\u003cli>Карточку задачи нужно перенести в «Готово к тестированию» и указать \u003cstrong>хэш коммита\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch2>Основные команды\u003c/h2>\n\u003cpre class=\"bash\">\u003ccode>git clone &lt;url&gt;                 # получить репозиторий\ngit status                      # что изменилось\ngit add .                       # подготовить все изменения\ngit commit -m &quot;feat: экран регистрации&quot;\ngit push                        # отправить на сервер\ngit pull                        # получить изменения\ngit log --oneline               # история, видно хэши коммитов\u003c/code>\u003c/pre>\n\u003ch2>Рабочий цикл спринта\u003c/h2>\n\u003cpre class=\"bash\">\u003ccode>git checkout main\ngit pull\ngit checkout -b sprint-1        # создали ветку для спринта\n\n# ... работа, несколько коммитов, по одному на задачу ...\ngit add .\ngit commit -m &quot;feat(uikit): button with all states&quot;\ngit push -u origin sprint-1     # первая отправка ветки\n\n# в конце спринта: pull request sprint-1 -&gt; main, затем merge\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Критерий из таблицы\u003c/th>\n\u003cth>Что сделать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Создана ветка для спринта\u003c/td>\n\u003ctd>\u003ccode>git checkout -b sprint-N\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Проект сохранён в ветку и не требует разархивирования\u003c/td>\n\u003ctd>Код лежит в репозитории, \u003cstrong>не zip-файл\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Выполнен merge / pull request в \u003ccode>main\u003c/code>\u003c/td>\n\u003ctd>PR создан через веб-интерфейс, смёржен и закрыт\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"tip\">\n\u003cp>Делайте \u003cstrong>один коммит на задачу\u003c/strong> (карточку). Тогда хэш коммита в карточке однозначно показывает, где выполнена задача. Хэш смотрите в \u003ccode>git log --oneline\u003c/code>.\u003c/p>\n\u003c/div>\n\u003ch2>Канбан\u003c/h2>\n\u003cpre>\u003ccode>Готово к разработке -&gt; В работе (не более 2) -&gt; Готово к тестированию (+ коммит) -&gt; Завершена (эксперты)\u003c/code>\u003c/pre>\n\u003cp>Типичные потери: больше двух задач в «В работе», карточка не передвинута, коммит не указан, задача сделана позже закрытия спринта.\u003c/p>\n\u003ch2>Файл .gitignore\u003c/h2>\n\u003cp>Не коммитьте \u003ccode>build/\u003c/code>, \u003ccode>.dart_tool/\u003c/code>, \u003ccode>.idea/\u003c/code>, ключи и \u003ccode>local.properties\u003c/code>. Flutter создаёт нужный \u003ccode>.gitignore\u003c/code> сам.\u003c/p>\n\u003ch2>Версионирование библиотек (semver)\u003c/h2>\n\u003cp>Версия \u003ccode>МАЖОР.МИНОР.ПАТЧ\u003c/code>, например \u003ccode>1.2.0\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Часть\u003c/th>\n\u003cth>Когда увеличиваем\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>МАЖОР (1.x.x → 2.0.0)\u003c/td>\n\u003ctd>Несовместимое изменение API\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>МИНОР (1.1.x → 1.2.0)\u003c/td>\n\u003ctd>Новая функция, всё старое работает\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>ПАТЧ (1.2.0 → 1.2.1)\u003c/td>\n\u003ctd>Исправление ошибки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cpre class=\"bash\">\u003ccode># в pubspec.yaml библиотеки\nversion: 1.0.0\n\ngit tag v1.0.0\ngit push origin v1.0.0\u003c/code>\u003c/pre>\n\u003cp>Описывайте изменения в \u003ccode>CHANGELOG.md\u003c/code> (в вашем шаблоне там пока \u003ccode>TODO: Describe initial release\u003c/code>, замените его реальным текстом).\u003c/p>\n\u003ch2>Подключение библиотеки из Git в приложение\u003c/h2>\n\u003cpre class=\"yaml\">\u003ccode>dependencies:\n  uikit:\n    git:\n      url: https://github.com/&lt;логин&gt;/uikit.git\n      ref: v1.0.0            # тег; можно ветка или хэш коммита\n  network_layer:\n    git:\n      url: https://github.com/&lt;логин&gt;/network_layer.git\n      ref: v1.0.0\u003c/code>\u003c/pre>\n\u003cp>Если библиотеки лежат в папке рядом, для разработки удобно:\u003c/p>\n\u003cpre class=\"yaml\">\u003ccode>dependencies:\n  uikit:\n    path: ../uikit\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>\u003ccode>ref: main\u003c/code> работает, но после каждого изменения библиотеки приложение получит новую версию неожиданно. Для «независимого версионирования» из задания используйте \u003cstrong>теги\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Создать ветку, закоммитить, отправить и смёржить через PR.\u003c/li>\n\u003cli>Найти хэш коммита и вставить его в карточку.\u003c/li>\n\u003cli>Назвать правила semver и поставить тег.\u003c/li>\n\u003cli>Подключить пакет из Git и из локальной папки.\u003c/li>\n\u003c/ul>\n", "text": " Зачем Git на чемпионате Работа сдаётся только через репозиторий ; если проект не собирается из него, оценки нет. Эксперты проверяют версию, сохранённую в вашей ветке спринта . Карточку задачи нужно перенести в «Готово к тестированию» и указать хэш коммита . Основные команды git clone \u003curl> # получить репозиторий git status # что изменилось git add . # подготовить все изменения git commit -m \"feat: экран регистрации\" git push # отправить на сервер git pull # получить изменения git log --oneline # история, видно хэши коммитов Рабочий цикл спринта git checkout main git pull git checkout -b sprint-1 # создали ветку для спринта # ... работа, несколько коммитов, по одному на задачу ... git add . git commit -m \"feat(uikit): button with all states\" git push -u origin sprint-1 # первая отправка ветки # в конце спринта: pull request sprint-1 -> main, затем merge Критерий из таблицы Что сделать Создана ветка для спринта git checkout -b sprint-N Проект сохранён в ветку и не требует разархивирования Код лежит в репозитории, не zip-файл Выполнен merge / pull request в main PR создан через веб-интерфейс, смёржен и закрыт Делайте один коммит на задачу (карточку). Тогда хэш коммита в карточке однозначно показывает, где выполнена задача. Хэш смотрите в git log --oneline . Канбан Готово к разработке -> В работе (не более 2) -> Готово к тестированию (+ коммит) -> Завершена (эксперты) Типичные потери: больше двух задач в «В работе», карточка не передвинута, коммит не указан, задача сделана позже закрытия спринта. Файл .gitignore Не коммитьте build/ , .dart_tool/ , .idea/ , ключи и local.properties . Flutter создаёт нужный .gitignore сам. Версионирование библиотек (semver) Версия МАЖОР.МИНОР.ПАТЧ , например 1.2.0 . Часть Когда увеличиваем МАЖОР (1.x.x → 2.0.0) Несовместимое изменение API МИНОР (1.1.x → 1.2.0) Новая функция, всё старое работает ПАТЧ (1.2.0 → 1.2.1) Исправление ошибки # в pubspec.yaml библиотеки version: 1.0.0 git tag v1.0.0 git push origin v1.0.0 Описывайте изменения в CHANGELOG.md (в вашем шаблоне там пока TODO: Describe initial release , замените его реальным текстом). Подключение библиотеки из Git в приложение dependencies: uikit: git: url: https://github.com/\u003cлогин>/uikit.git ref: v1.0.0 # тег; можно ветка или хэш коммита network_layer: git: url: https://github.com/\u003cлогин>/network_layer.git ref: v1.0.0 Если библиотеки лежат в папке рядом, для разработки удобно: dependencies: uikit: path: ../uikit ref: main работает, но после каждого изменения библиотеки приложение получит новую версию неожиданно. Для «независимого версионирования» из задания используйте теги . Что нужно уметь Создать ветку, закоммитить, отправить и смёржить через PR. Найти хэш коммита и вставить его в карточку. Назвать правила semver и поставить тег. Подключить пакет из Git и из локальной папки. ", "hours": 2, "minutes": 3}, {"id": "architecture", "stage": 5, "title": "Архитектура, SOLID и DRY", "lead": "Слои Domain, Presentation, Data. Принципы, по которым эксперты ставят баллы за архитектуру.", "html": "\u003ch2>Зачем архитектура\u003c/h2>\n\u003cp>Требование задания: \u003cstrong>«изменение бизнес-логики или представления одного экрана не должно повлечь изменений на других экранах»\u003c/strong>. Для этого код делится на слои, а слои зависят друг от друга только в одну сторону.\u003c/p>\n\u003ch2>Три слоя\u003c/h2>\n\u003cpre>\u003ccode>Presentation  ---&gt;  Domain  &lt;---  Data\n(экраны, state)    (ядро)        (API, БД, DTO)\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Слой\u003c/th>\n\u003cth>Что внутри\u003c/th>\n\u003cth>Что нельзя\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>Domain\u003c/strong>\u003c/td>\n\u003ctd>Entities, UseCases, интерфейсы репозиториев, доменные ошибки\u003c/td>\n\u003ctd>Импортировать Flutter, \u003ccode>http\u003c/code>, DTO, виджеты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>Presentation\u003c/strong>\u003c/td>\n\u003ctd>Screens, Controller / ViewModel / Bloc, виджеты, мапперы Domain→UI\u003c/td>\n\u003ctd>Знать про DTO и реализацию репозитория\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>Data\u003c/strong>\u003c/td>\n\u003ctd>Реализации репозиториев, DataSource (remote/local), DTO, мапперы DTO↔︎Entity\u003c/td>\n\u003ctd>Знать про экраны\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Критерии А: «Слой DOMAIN не содержит других слоёв», то же для PRESENTATION и DATA. Проверка простая: откройте импорты файлов слоя. \u003ccode>domain\u003c/code> не должен импортировать \u003ccode>presentation\u003c/code> и \u003ccode>data\u003c/code>.\u003c/p>\n\u003ch2>Пример структуры\u003c/h2>\n\u003cpre>\u003ccode>lib/\n  main.dart\n  common/                       # общее: константы, утилиты, DI\n    di.dart\n    constants.dart\n  domain/\n    entities/\n      game.dart\n      player.dart\n    repositories/\n      game_repository.dart      # abstract interface class\n    usecases/\n      create_game.dart\n      get_games.dart\n    exceptions/\n      domain_exception.dart\n  data/\n    dto/\n      game_dto.dart\n    mappers/\n      game_mapper.dart          # DTO &lt;-&gt; Entity\n    datasources/\n      game_remote_source.dart   # через абстракцию сетевого слоя\n      session_local_source.dart # SharedPreferences\n    repositories/\n      game_repository_impl.dart\n  presentation/\n    screens/\n      auth/\n        login_screen.dart\n        login_controller.dart\n      landing/ ...\n    widgets/\u003c/code>\u003c/pre>\n\u003ch2>Как слои общаются (на примере «Создать игру»)\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// domain/entities/game.dart\nclass Game {\n  final String id;\n  final String title;\n  final DateTime startAt;\n  const Game({required this.id, required this.title, required this.startAt});\n}\n\n// domain/repositories/game_repository.dart\nabstract interface class GameRepository {\n  Future&lt;Game&gt; createGame({required String title, required DateTime startAt});\n  Future&lt;List&lt;Game&gt;&gt; getGames();\n}\n\n// domain/usecases/create_game.dart\nclass CreateGame {\n  final GameRepository _repo;\n  CreateGame(this._repo);\n  Future&lt;Game&gt; call({required String title, required DateTime startAt}) {\n    if (startAt.isBefore(DateTime.now())) {\n      throw const DomainException(&#39;Время начала в прошлом&#39;);\n    }\n    return _repo.createGame(title: title, startAt: startAt);\n  }\n}\n\n// data/repositories/game_repository_impl.dart\nclass GameRepositoryImpl implements GameRepository {\n  final GameRemoteSource _remote;\n  GameRepositoryImpl(this._remote);\n  @override\n  Future&lt;Game&gt; createGame({required String title, required DateTime startAt}) async {\n    final dto = await _remote.create(title: title, startAt: startAt);\n    return GameMapper.toEntity(dto);\n  }\n  ...\n}\n\n// presentation/screens/schedule/schedule_controller.dart\nclass ScheduleController extends ChangeNotifier {\n  final CreateGame _createGame;\n  bool loading = false;\n  String? error;\n  ScheduleController(this._createGame);\n\n  Future&lt;bool&gt; publish(String title, DateTime startAt) async {\n    loading = true; notifyListeners();\n    try {\n      await _createGame(title: title, startAt: startAt);\n      return true;\n    } on DomainException catch (e) {\n      error = e.message;\n      return false;\n    } finally {\n      loading = false; notifyListeners();\n    }\n  }\n}\u003c/code>\u003c/pre>\n\u003ch2>Управление состоянием\u003c/h2>\n\u003cp>Задание не требует конкретного пакета. Выбирайте то, что умеете быстро и безошибочно.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Подход\u003c/th>\n\u003cth>Плюсы\u003c/th>\n\u003cth>Минусы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>ChangeNotifier\u003c/code> + \u003ccode>ListenableBuilder\u003c/code>\u003c/td>\n\u003ctd>Не нужны пакеты\u003c/td>\n\u003ctd>Больше ручной работы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>GetX (\u003ccode>GetxController\u003c/code>, \u003ccode>Obx\u003c/code>)\u003c/td>\n\u003ctd>Быстро, DI и навигация в комплекте\u003c/td>\n\u003ctd>Легко смешать слои, нужно дисциплины\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Provider\u003c/td>\n\u003ctd>Просто и привычно\u003c/td>\n\u003ctd>Нужен пакет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Bloc / Cubit\u003c/td>\n\u003ctd>Строгая структура, тестируемость\u003c/td>\n\u003ctd>Больше кода\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Состояние экрана удобно описывать \u003ccode>sealed\u003c/code>-классом: \u003ccode>Loading\u003c/code>, \u003ccode>Data\u003c/code>, \u003ccode>Error\u003c/code>.\u003c/p>\n\u003ch2>Внедрение зависимостей (DI)\u003c/h2>\n\u003cp>Контроллер получает зависимость \u003cstrong>через конструктор\u003c/strong>, а не создаёт сам.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// common/di.dart: единственное место, где знают реализации\nfinal ApiClient api = HttpApiClient(baseUrl: Env.baseUrl);\nfinal GameRepository gameRepo = GameRepositoryImpl(GameRemoteSource(api));\nfinal createGame = CreateGame(gameRepo);\u003c/code>\u003c/pre>\n\u003ch2>SOLID на примерах\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Принцип\u003c/th>\n\u003cth>Нарушение\u003c/th>\n\u003cth>Как правильно\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>S\u003c/strong> Одна ответственность\u003c/td>\n\u003ctd>\u003ccode>LoginScreen\u003c/code> сам парсит JSON и ходит в сеть\u003c/td>\n\u003ctd>Экран → контроллер → UseCase → репозиторий\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>O\u003c/strong> Открыто/закрыто\u003c/td>\n\u003ctd>\u003ccode>if (type == 'primary') ... else if ...\u003c/code> в кнопке\u003c/td>\n\u003ctd>Параметры/фабрики вариантов; новые варианты без правки базового кода\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>L\u003c/strong> Подстановка Лисков\u003c/td>\n\u003ctd>\u003ccode>SecondaryButton\u003c/code> ломает поведение \u003ccode>Button\u003c/code>\u003c/td>\n\u003ctd>Наследники не меняют контракт\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>I\u003c/strong> Разделение интерфейсов\u003c/td>\n\u003ctd>Один \u003ccode>Api\u003c/code> с 30 методами\u003c/td>\n\u003ctd>\u003ccode>AuthApi\u003c/code>, \u003ccode>GameApi\u003c/code>, \u003ccode>ProfileApi\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>D\u003c/strong> Инверсия зависимостей\u003c/td>\n\u003ctd>Экран создаёт \u003ccode>http.Client()\u003c/code>\u003c/td>\n\u003ctd>Зависеть от \u003ccode>ApiClient\u003c/code> (абстракция), реализацию подставляет DI\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>DRY: что обычно дублируют\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Место\u003c/th>\n\u003cth>Дублирование\u003c/th>\n\u003cth>Решение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>UIKit\u003c/td>\n\u003ctd>Пять одинаковых \u003ccode>OutlineInputBorder(...)\u003c/code>\u003c/td>\n\u003ctd>Один приватный метод \u003ccode>_border(Color)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>UIKit\u003c/td>\n\u003ctd>Три одинаковых пункта нижнего меню\u003c/td>\n\u003ctd>Список данных + \u003ccode>map\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Стили\u003c/td>\n\u003ctd>\u003ccode>fontSize: 16\u003c/code> повторяется в \u003ccode>copyWith\u003c/code>\u003c/td>\n\u003ctd>Добавить стиль в типографику\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сеть\u003c/td>\n\u003ctd>\u003ccode>try/catch\u003c/code> в каждом запросе\u003c/td>\n\u003ctd>Один обработчик ошибок в клиенте\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Экраны\u003c/td>\n\u003ctd>Одинаковый показ SnackBar ошибки\u003c/td>\n\u003ctd>Один общий метод/виджет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Константы\u003c/td>\n\u003ctd>URL и ключи в нескольких местах\u003c/td>\n\u003ctd>Один конфиг\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Нарисовать схему слоёв и показать направление зависимостей.\u003c/li>\n\u003cli>Создать сущность, интерфейс репозитория, UseCase, реализацию и контроллер.\u003c/li>\n\u003cli>Объяснить каждую букву SOLID на своём коде.\u003c/li>\n\u003cli>Найти и убрать дублирование.\u003c/li>\n\u003c/ul>\n", "text": " Зачем архитектура Требование задания: «изменение бизнес-логики или представления одного экрана не должно повлечь изменений на других экранах» . Для этого код делится на слои, а слои зависят друг от друга только в одну сторону. Три слоя Presentation ---> Domain \u003c--- Data (экраны, state) (ядро) (API, БД, DTO) Слой Что внутри Что нельзя Domain Entities, UseCases, интерфейсы репозиториев, доменные ошибки Импортировать Flutter, http , DTO, виджеты Presentation Screens, Controller / ViewModel / Bloc, виджеты, мапперы Domain→UI Знать про DTO и реализацию репозитория Data Реализации репозиториев, DataSource (remote/local), DTO, мапперы DTO↔︎Entity Знать про экраны Критерии А: «Слой DOMAIN не содержит других слоёв», то же для PRESENTATION и DATA. Проверка простая: откройте импорты файлов слоя. domain не должен импортировать presentation и data . Пример структуры lib/ main.dart common/ # общее: константы, утилиты, DI di.dart constants.dart domain/ entities/ game.dart player.dart repositories/ game_repository.dart # abstract interface class usecases/ create_game.dart get_games.dart exceptions/ domain_exception.dart data/ dto/ game_dto.dart mappers/ game_mapper.dart # DTO \u003c-> Entity datasources/ game_remote_source.dart # через абстракцию сетевого слоя session_local_source.dart # SharedPreferences repositories/ game_repository_impl.dart presentation/ screens/ auth/ login_screen.dart login_controller.dart landing/ ... widgets/ Как слои общаются (на примере «Создать игру») // domain/entities/game.dart class Game { final String id; final String title; final DateTime startAt; const Game({required this.id, required this.title, required this.startAt}); } // domain/repositories/game_repository.dart abstract interface class GameRepository { Future\u003cGame> createGame({required String title, required DateTime startAt}); Future\u003cList\u003cGame>> getGames(); } // domain/usecases/create_game.dart class CreateGame { final GameRepository _repo; CreateGame(this._repo); Future\u003cGame> call({required String title, required DateTime startAt}) { if (startAt.isBefore(DateTime.now())) { throw const DomainException('Время начала в прошлом'); } return _repo.createGame(title: title, startAt: startAt); } } // data/repositories/game_repository_impl.dart class GameRepositoryImpl implements GameRepository { final GameRemoteSource _remote; GameRepositoryImpl(this._remote); @override Future\u003cGame> createGame({required String title, required DateTime startAt}) async { final dto = await _remote.create(title: title, startAt: startAt); return GameMapper.toEntity(dto); } ... } // presentation/screens/schedule/schedule_controller.dart class ScheduleController extends ChangeNotifier { final CreateGame _createGame; bool loading = false; String? error; ScheduleController(this._createGame); Future\u003cbool> publish(String title, DateTime startAt) async { loading = true; notifyListeners(); try { await _createGame(title: title, startAt: startAt); return true; } on DomainException catch (e) { error = e.message; return false; } finally { loading = false; notifyListeners(); } } } Управление состоянием Задание не требует конкретного пакета. Выбирайте то, что умеете быстро и безошибочно. Подход Плюсы Минусы ChangeNotifier + ListenableBuilder Не нужны пакеты Больше ручной работы GetX ( GetxController , Obx ) Быстро, DI и навигация в комплекте Легко смешать слои, нужно дисциплины Provider Просто и привычно Нужен пакет Bloc / Cubit Строгая структура, тестируемость Больше кода Состояние экрана удобно описывать sealed -классом: Loading , Data , Error . Внедрение зависимостей (DI) Контроллер получает зависимость через конструктор , а не создаёт сам. // common/di.dart: единственное место, где знают реализации final ApiClient api = HttpApiClient(baseUrl: Env.baseUrl); final GameRepository gameRepo = GameRepositoryImpl(GameRemoteSource(api)); final createGame = CreateGame(gameRepo); SOLID на примерах Принцип Нарушение Как правильно S Одна ответственность LoginScreen сам парсит JSON и ходит в сеть Экран → контроллер → UseCase → репозиторий O Открыто/закрыто if (type == 'primary') ... else if ... в кнопке Параметры/фабрики вариантов; новые варианты без правки базового кода L Подстановка Лисков SecondaryButton ломает поведение Button Наследники не меняют контракт I Разделение интерфейсов Один Api с 30 методами AuthApi , GameApi , ProfileApi D Инверсия зависимостей Экран создаёт http.Client() Зависеть от ApiClient (абстракция), реализацию подставляет DI DRY: что обычно дублируют Место Дублирование Решение UIKit Пять одинаковых OutlineInputBorder(...) Один приватный метод _border(Color) UIKit Три одинаковых пункта нижнего меню Список данных + map Стили fontSize: 16 повторяется в copyWith Добавить стиль в типографику Сеть try/catch в каждом запросе Один обработчик ошибок в клиенте Экраны Одинаковый показ SnackBar ошибки Один общий метод/виджет Константы URL и ключи в нескольких местах Один конфиг Что нужно уметь Нарисовать схему слоёв и показать направление зависимостей. Создать сущность, интерфейс репозитория, UseCase, реализацию и контроллер. Объяснить каждую букву SOLID на своём коде. Найти и убрать дублирование. ", "hours": 5, "minutes": 4}, {"id": "docs-logging", "stage": 5, "title": "Комментарии и логи", "lead": "Требование модуля А, которое действует во всех спринтах. Без него вы теряете половину баллов почти везде.", "html": "\u003ch2>Почему это важно\u003c/h2>\n\u003cp>В таблице критериев почти у каждого пункта методика: \u003cstrong>«половина итоговой оценки, если отсутствуют комментарии и логирование согласно заданию»\u003c/strong>. То есть идеальная верстка без комментариев и логов даёт 50%.\u003c/p>\n\u003ch2>Что комментировать\u003c/h2>\n\u003cp>\u003cstrong>Для каждого класса верхнего уровня\u003c/strong> (виджет, контроллер, репозиторий): краткое описание, дата создания в формате \u003ccode>ДД-ММ-ГГГГ\u003c/code> и автор (номер участника).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Репозиторий для работы с API игр.\n// Отвечает только за получение и отправку данных об играх (SRP).\n// Дата создания: 11-11-2026\n// Автор создания: 7\nclass GameRepositoryImpl implements GameRepository { ... }\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>В вашей симуляции даты записаны как \u003ccode>15.10.2026\u003c/code>, а в задании требуется \u003ccode>ДД-ММ-ГГГГ\u003c/code>, то есть \u003cstrong>\u003ccode>15-10-2026\u003c/code>\u003c/strong>. Мелочь, но это один из пунктов проверки.\u003c/p>\n\u003c/div>\n\u003cp>\u003cstrong>Публичные методы:\u003c/strong> что делает, что принимает, что возвращает (кроме тривиальных геттеров/сеттеров).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Создаёт новую игру на сервере.\n// Принимает: название [title] и время начала [startAt].\n// Возвращает: созданную игру [Game].\nFuture&lt;Game&gt; createGame({required String title, required DateTime startAt}) async { ... }\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Сложные алгоритмы (больше 5 строк):\u003c/strong> строчные комментарии внутри метода к условиям, циклам и вычислениям.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>bool isSolved(List&lt;int&gt; order) {\n  // Идём по списку и проверяем, что каждый элемент на своём месте\n  for (var i = 0; i &lt; order.length; i++) {\n    if (order[i] != i) return false; // нашли неправильный — пазл не собран\n  }\n  return true;\n}\u003c/code>\u003c/pre>\n\u003ch2>Логирование: уровни\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Уровень\u003c/th>\n\u003cth>Для чего\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>DEBUG\u003c/strong>\u003c/td>\n\u003ctd>Технические данные для отладки\u003c/td>\n\u003ctd>Содержимое ответа, результат вычисления\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>INFO\u003c/strong>\u003c/td>\n\u003ctd>Ключевые события\u003c/td>\n\u003ctd>\u003ccode>initState\u003c/code>, запрос отправлен, пользователь вошёл\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>ERROR\u003c/strong>\u003c/td>\n\u003ctd>Сбои и исключения\u003c/td>\n\u003ctd>Таймаут, код 500, пойманное исключение\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Обязательные точки логирования\u003c/h2>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Жизненный цикл экранов\u003c/strong> — уровень INFO (\u003ccode>initState\u003c/code>, \u003ccode>dispose\u003c/code>, \u003ccode>AppLifecycleState\u003c/code>).\u003c/li>\n\u003cli>\u003cstrong>Сетевые запросы и БД\u003c/strong> — начало (INFO), успех (DEBUG), ошибка с типом (ERROR).\u003c/li>\n\u003cli>\u003cstrong>Нажатия на критические кнопки\u003c/strong> («Отправить форму», «Начать игру») — INFO.\u003c/li>\n\u003cli>\u003cstrong>Любой \u003ccode>try-catch\u003c/code>\u003c/strong> — запись ERROR с сообщением исключения.\u003c/li>\n\u003c/ol>\n\u003ch2>Формат сообщения\u003c/h2>\n\u003cpre>\u003ccode>[Тег_компонента]: Событие — Детали\n[AuthController]: Авторизация — Успех для пользователя user@mail.com\n[ApiRepository]: Ошибка — Не удалось получить список игр (код 500)\u003c/code>\u003c/pre>\n\u003ch2>Готовая обёртка над \u003ccode>logger\u003c/code>\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>import &#39;package:logger/logger.dart&#39;;\n\n// Единая точка логирования приложения.\n// Дата создания: 11-11-2026\n// Автор создания: 7\nclass AppLog {\n  static final Logger _log = Logger(printer: SimplePrinter());\n\n  // Формирует сообщение по формату задания: [Тег]: Событие — Детали\n  static String _fmt(String tag, String event, String details) =&gt; &#39;[$tag]: $event — $details&#39;;\n\n  static void debug(String tag, String event, String details) =&gt; _log.d(_fmt(tag, event, details));\n  static void info(String tag, String event, String details) =&gt; _log.i(_fmt(tag, event, details));\n  static void error(String tag, String event, String details, [Object? err, StackTrace? st]) =&gt;\n      _log.e(_fmt(tag, event, details), error: err, stackTrace: st);\n}\u003c/code>\u003c/pre>\n\u003cp>Использование:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;void&gt; _onLoginTap() async {\n  AppLog.info(&#39;LoginScreen&#39;, &#39;Нажатие&#39;, &#39;Кнопка «Войти»&#39;);\n  try {\n    AppLog.info(&#39;AuthController&#39;, &#39;Запрос&#39;, &#39;POST /login отправлен&#39;);\n    final user = await _login(email, password);\n    AppLog.debug(&#39;AuthController&#39;, &#39;Ответ&#39;, &#39;userId=${user.id}&#39;);\n  } catch (e, st) {\n    AppLog.error(&#39;AuthController&#39;, &#39;Ошибка&#39;, &#39;Вход не выполнен&#39;, e, st);\n  }\n}\u003c/code>\u003c/pre>\n\u003ch2>Типичные ошибки\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ошибка\u003c/th>\n\u003cth>Исправление\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Формат с дефисом вместо тире\u003c/td>\n\u003ctd>Используйте \u003ccode>—\u003c/code> как в задании\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Логи только в \u003ccode>initState\u003c/code> кнопки, а не в сетевых вызовах\u003c/td>\n\u003ctd>Добавьте три точки логов на каждый запрос\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>catch\u003c/code> без лога\u003c/td>\n\u003ctd>В каждый \u003ccode>catch\u003c/code> добавить \u003ccode>AppLog.error\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Комментарии только на английском/смесь\u003c/td>\n\u003ctd>Выберите один язык и держитесь его\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Лог на каждом \u003ccode>build\u003c/code>\u003c/td>\n\u003ctd>Шумит; логируйте события, а не перерисовку\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Написать шапку класса и описание метода по шаблону.\u003c/li>\n\u003cli>Подключить \u003ccode>logger\u003c/code> и использовать формат задания.\u003c/li>\n\u003cli>Расставить 4 обязательные точки логирования.\u003c/li>\n\u003c/ul>\n", "text": " Почему это важно В таблице критериев почти у каждого пункта методика: «половина итоговой оценки, если отсутствуют комментарии и логирование согласно заданию» . То есть идеальная верстка без комментариев и логов даёт 50%. Что комментировать Для каждого класса верхнего уровня (виджет, контроллер, репозиторий): краткое описание, дата создания в формате ДД-ММ-ГГГГ и автор (номер участника). // Репозиторий для работы с API игр. // Отвечает только за получение и отправку данных об играх (SRP). // Дата создания: 11-11-2026 // Автор создания: 7 class GameRepositoryImpl implements GameRepository { ... } В вашей симуляции даты записаны как 15.10.2026 , а в задании требуется ДД-ММ-ГГГГ , то есть 15-10-2026 . Мелочь, но это один из пунктов проверки. Публичные методы: что делает, что принимает, что возвращает (кроме тривиальных геттеров/сеттеров). // Создаёт новую игру на сервере. // Принимает: название [title] и время начала [startAt]. // Возвращает: созданную игру [Game]. Future\u003cGame> createGame({required String title, required DateTime startAt}) async { ... } Сложные алгоритмы (больше 5 строк): строчные комментарии внутри метода к условиям, циклам и вычислениям. bool isSolved(List\u003cint> order) { // Идём по списку и проверяем, что каждый элемент на своём месте for (var i = 0; i \u003c order.length; i++) { if (order[i] != i) return false; // нашли неправильный — пазл не собран } return true; } Логирование: уровни Уровень Для чего Пример DEBUG Технические данные для отладки Содержимое ответа, результат вычисления INFO Ключевые события initState , запрос отправлен, пользователь вошёл ERROR Сбои и исключения Таймаут, код 500, пойманное исключение Обязательные точки логирования Жизненный цикл экранов — уровень INFO ( initState , dispose , AppLifecycleState ). Сетевые запросы и БД — начало (INFO), успех (DEBUG), ошибка с типом (ERROR). Нажатия на критические кнопки («Отправить форму», «Начать игру») — INFO. Любой try-catch — запись ERROR с сообщением исключения. Формат сообщения [Тег_компонента]: Событие — Детали [AuthController]: Авторизация — Успех для пользователя user@mail.com [ApiRepository]: Ошибка — Не удалось получить список игр (код 500) Готовая обёртка над logger import 'package:logger/logger.dart'; // Единая точка логирования приложения. // Дата создания: 11-11-2026 // Автор создания: 7 class AppLog { static final Logger _log = Logger(printer: SimplePrinter()); // Формирует сообщение по формату задания: [Тег]: Событие — Детали static String _fmt(String tag, String event, String details) => '[$tag]: $event — $details'; static void debug(String tag, String event, String details) => _log.d(_fmt(tag, event, details)); static void info(String tag, String event, String details) => _log.i(_fmt(tag, event, details)); static void error(String tag, String event, String details, [Object? err, StackTrace? st]) => _log.e(_fmt(tag, event, details), error: err, stackTrace: st); } Использование: Future\u003cvoid> _onLoginTap() async { AppLog.info('LoginScreen', 'Нажатие', 'Кнопка «Войти»'); try { AppLog.info('AuthController', 'Запрос', 'POST /login отправлен'); final user = await _login(email, password); AppLog.debug('AuthController', 'Ответ', 'userId=${user.id}'); } catch (e, st) { AppLog.error('AuthController', 'Ошибка', 'Вход не выполнен', e, st); } } Типичные ошибки Ошибка Исправление Формат с дефисом вместо тире Используйте — как в задании Логи только в initState кнопки, а не в сетевых вызовах Добавьте три точки логов на каждый запрос catch без лога В каждый catch добавить AppLog.error Комментарии только на английском/смесь Выберите один язык и держитесь его Лог на каждом build Шумит; логируйте события, а не перерисовку Что нужно уметь Написать шапку класса и описание метода по шаблону. Подключить logger и использовать формат задания. Расставить 4 обязательные точки логирования. ", "hours": 2, "minutes": 3}, {"id": "sprint1", "stage": 6, "title": "Спринт 1: UIKit и StoryBook", "lead": "1 ч 30 мин. Отдельная библиотека компонентов и приложение, в котором видны все состояния. Максимум 10,96 балла.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 30%\" />\n\u003ccol style=\"width: 40%\" />\n\u003ccol style=\"width: 30%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Часть\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003cth>Что проверяют\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Цвета как на макете\u003c/td>\n\u003ctd style=\"text-align: right;\">0,24\u003c/td>\n\u003ctd>−0,02 за каждый отсутствующий цвет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Типографика (тема)\u003c/td>\n\u003ctd style=\"text-align: right;\">0,32\u003c/td>\n\u003ctd>−0,02 за каждый отсутствующий стиль\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Поле ввода и все состояния\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003ctd>−0,15 за отсутствующий элемент; нет в StoryBook — половина\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Select + BottomSheet\u003c/td>\n\u003ctd style=\"text-align: right;\">0,90 + 0,30\u003c/td>\n\u003ctd>Тап по селекту открывает BottomSheet\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Кнопка со всеми состояниями\u003c/td>\n\u003ctd style=\"text-align: right;\">1,50\u003c/td>\n\u003ctd>−0,1 за каждый отсутствующий вариант\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Pagination\u003c/td>\n\u003ctd style=\"text-align: right;\">0,30\u003c/td>\n\u003ctd>Все состояния\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Карточка со всеми состояниями\u003c/td>\n\u003ctd style=\"text-align: right;\">1,50\u003c/td>\n\u003ctd>−0,3 за отсутствующий вариант\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Bottom Bar\u003c/td>\n\u003ctd style=\"text-align: right;\">0,80\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Timer\u003c/td>\n\u003ctd style=\"text-align: right;\">0,60\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Checkbox\u003c/td>\n\u003ctd style=\"text-align: right;\">0,80\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Все компоненты адаптивны\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003ctd>−0,15 за каждый неадаптивный\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектура: DRY, отдельная библиотека\u003c/td>\n\u003ctd style=\"text-align: right;\">0,50 + 0,50\u003c/td>\n\u003ctd>Половина, если нет комментариев и логов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Git: ветка, проект в ветке, merge\u003c/td>\n\u003ctd style=\"text-align: right;\">0,30\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"warn\">\n\u003cp>Три общих правила в критериях: \u003cstrong>нет библиотеки — ничего не проверяется\u003c/strong>; \u003cstrong>нет компонента в StoryBook — половина баллов\u003c/strong>; \u003cstrong>нет комментариев и логов — половина баллов\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003ch2>Порядок работы (план на 90 минут)\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Минуты\u003c/th>\n\u003cth>Действие\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>0–5\u003c/td>\n\u003ctd>Создать репозиторий и ветку \u003ccode>sprint-1\u003c/code>, создать Flutter-пакет, переместить карточки в «В работе» (не более 2)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>5–20\u003c/td>\n\u003ctd>Цвета, типографика, шрифты, логгер, \u003ccode>uikit.dart\u003c/code> с экспортами\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>20–55\u003c/td>\n\u003ctd>Поле, кнопка, чекбокс, карточка, bottom bar — самые дорогие\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>55–70\u003c/td>\n\u003ctd>Select + BottomSheet, Pagination, Timer\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>70–85\u003c/td>\n\u003ctd>StoryBook: все компоненты и все состояния\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>85–90\u003c/td>\n\u003ctd>Тег \u003ccode>v1.0.0\u003c/code>, push, PR, merge, перенос карточек с коммитами\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Создание библиотеки\u003c/h2>\n\u003cpre class=\"bash\">\u003ccode>flutter create --template=package uikit\ncd uikit &amp;&amp; git init\u003c/code>\u003c/pre>\n\u003cp>Структура с настоящей инкапсуляцией:\u003c/p>\n\u003cpre>\u003ccode>uikit/\n  lib/\n    uikit.dart                 # единственный публичный файл, только export\n    src/\n      theme/\n        colors.dart\n        typography.dart\n      components/\n        ui_button.dart\n        ui_text_field.dart\n        ui_select.dart\n        ...\n      core/\n        logger.dart\n        scale.dart\n  assets/ icons...\n  fonts/ Manrope-*.ttf\n  pubspec.yaml\n  CHANGELOG.md  README.md\u003c/code>\u003c/pre>\n\u003cpre class=\"dart\">\u003ccode>// lib/uikit.dart\nlibrary;\n\nexport &#39;src/theme/colors.dart&#39;;\nexport &#39;src/theme/typography.dart&#39;;\nexport &#39;src/components/ui_button.dart&#39;;\nexport &#39;src/components/ui_text_field.dart&#39;;\nexport &#39;src/components/ui_select.dart&#39;;\nexport &#39;src/components/ui_checkbox.dart&#39;;\n// ... всё, что должно быть доступно приложению\u003c/code>\u003c/pre>\n\u003cp>Приложение подключает \u003ccode>import 'package:uikit/uikit.dart';\u003c/code> и больше ничего. Это и есть \u003cstrong>инкапсуляция\u003c/strong>: «внутренняя реализация скрыта, наружу доступен только чётко определённый API».\u003c/p>\n\u003ch2>Шрифты и ресурсы внутри пакета\u003c/h2>\n\u003cpre class=\"yaml\">\u003ccode># pubspec.yaml библиотеки\nflutter:\n  assets:\n    - assets/\n  fonts:\n    - family: Manrope\n      fonts:\n        - asset: fonts/Manrope-Regular.ttf\n          weight: 400\n        - asset: fonts/Manrope-SemiBold.ttf\n          weight: 600\n        - asset: fonts/Manrope-Bold.ttf\n          weight: 700\n        - asset: fonts/Manrope-ExtraBold.ttf\n          weight: 800\u003c/code>\u003c/pre>\n\u003cp>В стиле указывайте пакет, тогда приложению не нужно дублировать шрифты в своём \u003ccode>pubspec.yaml\u003c/code>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>const TextStyle screenHeader = TextStyle(\n  fontFamily: &#39;Manrope&#39;,\n  package: &#39;uikit&#39;,\n  fontWeight: FontWeight.w700,\n  fontSize: 24,\n  height: 32 / 24,\n  letterSpacing: -0.48,\n);\u003c/code>\u003c/pre>\n\u003cp>Иконки из пакета: \u003ccode>Image.asset('assets/eye.png', package: 'uikit')\u003c/code>.\u003c/p>\n\u003ch2>Цвета и типографика\u003c/h2>\n\u003cp>Единый источник истины (DRY): цвета и стили определены один раз.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;package:flutter/painting.dart&#39;;\n\nabstract final class UiColors {\n  static const primary = Color(0xFF00C853);\n  static const onPrimary = Color(0xFFFFFFFF);\n  static const error = Color(0xFFBA1A1A);\n  static const border = Color(0xFFC3C6D7);\n  static const surface = Color(0xFFFAF8FF);\n  static const text = Color(0xFF191B23);\n}\u003c/code>\u003c/pre>\n\u003cp>Проверьте: в StoryBook должна быть страница «Цвета» (квадраты с названиями \u003cstrong>всех\u003c/strong> цветов макета) и «Типографика» (каждый стиль с подписью размера и начертания).\u003c/p>\n\u003ch2>Кнопка: варианты и состояния\u003c/h2>\n\u003cp>Один класс, варианты через enum (O из SOLID и фабрики из DRY):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Универсальная кнопка библиотеки. Отвечает только за отображение и нажатие.\n// Дата создания: 11-11-2026\n// Автор создания: 7\nenum UiButtonKind { primary, secondary, destructive }\n\nclass UiButton extends StatelessWidget {\n  final String text;\n  final UiButtonKind kind;\n  final bool isLoading;\n  final VoidCallback? onPressed; // null = кнопка отключена\n\n  const UiButton({\n    super.key,\n    required this.text,\n    this.kind = UiButtonKind.primary,\n    this.isLoading = false,\n    this.onPressed,\n  });\n\n  const UiButton.secondary({super.key, required this.text, this.isLoading = false, this.onPressed})\n      : kind = UiButtonKind.secondary;\n\n  bool get _enabled =&gt; onPressed != null &amp;&amp; !isLoading;\n\n  @override\n  Widget build(BuildContext context) {\n    final (bg, fg, border) = switch (kind) {\n      UiButtonKind.primary =&gt; (UiColors.primary, UiColors.onPrimary, UiColors.primary),\n      UiButtonKind.secondary =&gt; (UiColors.onPrimary, UiColors.primary, UiColors.primary),\n      UiButtonKind.destructive =&gt; (UiColors.error, UiColors.onPrimary, UiColors.error),\n    };\n    return Opacity(\n      opacity: _enabled ? 1 : 0.4, // состояние disabled\n      child: Material(\n        color: bg,\n        shape: RoundedRectangleBorder(\n          borderRadius: BorderRadius.circular(8),\n          side: BorderSide(color: border, width: 2),\n        ),\n        child: InkWell( // состояние pressed: ripple-эффект\n          borderRadius: BorderRadius.circular(8),\n          onTap: _enabled\n              ? () {\n                  UiLog.info(&#39;UiButton&#39;, &#39;Нажатие&#39;, text);\n                  onPressed!();\n                }\n              : null,\n          child: ConstrainedBox(\n            constraints: const BoxConstraints(minHeight: 48, minWidth: double.infinity),\n            child: Center(\n              child: isLoading\n                  ? SizedBox(width: 20, height: 20,\n                      child: CircularProgressIndicator(strokeWidth: 2, color: fg))\n                  : Text(text, style: bodyMedium.copyWith(color: fg)),\n            ),\n          ),\n        ),\n      ),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Кнопка тянется на ширину родителя (\u003ccode>minWidth: double.infinity\u003c/code>), поэтому на разных экранах не «плавает». Нужна половина ширины — оберните в \u003ccode>Expanded\u003c/code> или \u003ccode>SizedBox\u003c/code>.\u003c/p>\n\u003ch2>Поле ввода\u003c/h2>\n\u003cp>Варианты: обычное, в фокусе, с ошибкой, отключённое, пароль (с глазом), поиск (с иконкой).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class UiTextField extends StatefulWidget {\n  final String label, hint;\n  final String? errorText;\n  final bool enabled;\n  final UiTextFieldType type;           // normal | password | search\n  final TextEditingController? controller;\n  final ValueChanged&lt;String&gt;? onChanged;\n  const UiTextField({super.key, required this.label, required this.hint,\n    this.errorText, this.enabled = true, this.type = UiTextFieldType.normal,\n    this.controller, this.onChanged});\n  @override\n  State&lt;UiTextField&gt; createState() =&gt; _UiTextFieldState();\n}\n\nclass _UiTextFieldState extends State&lt;UiTextField&gt; {\n  final _focus = FocusNode();\n  bool _hidden = true;\n\n  @override\n  void initState() { super.initState(); _focus.addListener(() =&gt; setState(() {})); }\n  @override\n  void dispose() { _focus.dispose(); super.dispose(); }\n\n  // Один метод создаёт рамку для любого состояния (DRY: вместо пяти копий)\n  OutlineInputBorder _border(Color c) =&gt; OutlineInputBorder(\n        borderSide: BorderSide(color: c, width: 1),\n        borderRadius: BorderRadius.circular(8),\n      );\n\n  @override\n  Widget build(BuildContext context) {\n    final hasError = widget.errorText != null;\n    final color = hasError ? UiColors.error : _focus.hasFocus ? UiColors.primary : UiColors.border;\n    return Column(\n      crossAxisAlignment: CrossAxisAlignment.start,\n      children: [\n        Text(widget.label, style: fieldLabel.copyWith(color: color)),\n        const SizedBox(height: 4),\n        TextField(\n          focusNode: _focus,\n          enabled: widget.enabled,\n          controller: widget.controller,\n          onChanged: widget.onChanged,\n          obscureText: widget.type == UiTextFieldType.password &amp;&amp; _hidden,\n          decoration: InputDecoration(\n            filled: true, fillColor: UiColors.surface,\n            hintText: widget.hint,\n            errorText: widget.errorText,\n            enabledBorder: _border(color), focusedBorder: _border(color),\n            disabledBorder: _border(UiColors.border),\n            errorBorder: _border(UiColors.error), focusedErrorBorder: _border(UiColors.error),\n            suffixIcon: widget.type == UiTextFieldType.password\n                ? IconButton(\n                    icon: Icon(_hidden ? Icons.visibility_off : Icons.visibility),\n                    onPressed: () =&gt; setState(() =&gt; _hidden = !_hidden))\n                : null,\n          ),\n        ),\n      ],\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>В StoryBook показывайте \u003cstrong>настоящее\u003c/strong> состояние фокуса (поле с \u003ccode>autofocus\u003c/code> или принудительный \u003ccode>FocusNode.requestFocus()\u003c/code>), а не раскрашенную имитацию.\u003c/p>\n\u003ch2>Select и BottomSheet\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class UiSelect&lt;T&gt; extends StatelessWidget {\n  final String label, hint;\n  final T? value;\n  final List&lt;T&gt; options;\n  final String Function(T) titleOf;\n  final ValueChanged&lt;T&gt; onChanged;\n  const UiSelect({super.key, required this.label, required this.hint, required this.value,\n    required this.options, required this.titleOf, required this.onChanged});\n\n  @override\n  Widget build(BuildContext context) {\n    return GestureDetector(\n      behavior: HitTestBehavior.opaque,\n      onTap: () async {\n        final picked = await showModalBottomSheet&lt;T&gt;(\n          context: context,\n          builder: (_) =&gt; UiBottomSheet&lt;T&gt;(options: options, titleOf: titleOf, selected: value),\n        );\n        if (picked != null) onChanged(picked);\n      },\n      child: InputDecorator(\n        decoration: InputDecoration(labelText: label, suffixIcon: const Icon(Icons.keyboard_arrow_down)),\n        child: Text(value == null ? hint : titleOf(value as T)),\n      ),\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>UiBottomSheet\u003c/code> — отдельный публичный компонент (в таблице он отдельная строка 0,3 балла): заголовок, список вариантов, отметка выбранного.\u003c/p>\n\u003ch2>Pagination, Timer, Card, Bottom Bar\u003c/h2>\n\u003cp>\u003cstrong>Pagination\u003c/strong> — точки приветственных экранов. Активная шире остальных:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class UiPagination extends StatelessWidget {\n  final int count, current;\n  const UiPagination({super.key, required this.count, required this.current});\n  @override\n  Widget build(BuildContext context) =&gt; Row(\n        mainAxisSize: MainAxisSize.min,\n        children: List.generate(count, (i) =&gt; AnimatedContainer(\n              duration: const Duration(milliseconds: 200),\n              margin: const EdgeInsets.symmetric(horizontal: 3),\n              width: i == current ? 24 : 8, height: 8,\n              decoration: BoxDecoration(\n                color: i == current ? UiColors.primary : UiColors.border,\n                borderRadius: BorderRadius.circular(4)),\n            )),\n      );\n}\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Timer\u003c/strong> — компонент \u003cem>отображает\u003c/em> время, а считает его тот, кто его использует (SRP). Принимает \u003ccode>Duration\u003c/code> и форматирует \u003ccode>мм:сс\u003c/code>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>String formatDuration(Duration d) {\n  final m = d.inMinutes.remainder(60).toString().padLeft(2, &#39;0&#39;);\n  final s = d.inSeconds.remainder(60).toString().padLeft(2, &#39;0&#39;);\n  return &#39;$m:$s&#39;;\n}\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Card\u003c/strong> — состояния: обычная, выбранная, неактивная; контент передаётся параметрами (\u003ccode>title\u003c/code>, \u003ccode>subtitle\u003c/code>, \u003ccode>leading\u003c/code>, \u003ccode>trailing\u003c/code>, \u003ccode>onTap\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Bottom Bar\u003c/strong> — список данных, а не три копии кода; центральная кнопка выделена (по ней открывается Schedule Game):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class UiBottomBarItem {\n  final String label;\n  final String iconAsset;\n  const UiBottomBarItem(this.label, this.iconAsset);\n}\n// в виджете: items.asMap().entries.map((e) =&gt; _Tab(...)).toList()\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Checkbox\u003c/strong> — состояния: выкл, вкл, отключён (с отметкой и без).\u003c/p>\n\u003ch2>StoryBook\u003c/h2>\n\u003cp>Приложение подключает библиотеку из Git по тегу и содержит \u003cstrong>одну страницу на компонент\u003c/strong> (или один длинный экран с заголовками), где видны \u003cstrong>все\u003c/strong> состояния.\u003c/p>\n\u003cpre class=\"yaml\">\u003ccode>dependencies:\n  uikit:\n    git:\n      url: https://github.com/&lt;логин&gt;/uikit.git\n      ref: v1.0.0\u003c/code>\u003c/pre>\n\u003cpre class=\"dart\">\u003ccode>import &#39;package:uikit/uikit.dart&#39;;   // только один импорт\n\nclass ButtonsPage extends StatelessWidget {\n  const ButtonsPage({super.key});\n  @override\n  Widget build(BuildContext context) =&gt; Padding(\n        padding: const EdgeInsets.all(20),\n        child: Column(spacing: 16, children: [\n          UiButton(text: &#39;Primary&#39;, onPressed: () {}),\n          const UiButton(text: &#39;Primary disabled&#39;),\n          UiButton.secondary(text: &#39;Secondary&#39;, onPressed: () {}),\n          UiButton(text: &#39;Destructive&#39;, kind: UiButtonKind.destructive, onPressed: () {}),\n          UiButton(text: &#39;Loading&#39;, isLoading: true, onPressed: () {}),\n        ]),\n      );\n}\u003c/code>\u003c/pre>\n\u003ch2>Разбор вашей симуляции (6,39 из 10,51)\u003c/h2>\n\u003cp>Я прочитал оба репозитория. Это \u003cstrong>вероятные\u003c/strong> причины потерь по коду; точные баллы по пунктам видите только вы по протоколу.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 25%\" />\n\u003ccol style=\"width: 25%\" />\n\u003ccol style=\"width: 25%\" />\n\u003ccol style=\"width: 25%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>#\u003c/th>\n\u003cth>Что вижу в коде\u003c/th>\n\u003cth>Вероятный эффект\u003c/th>\n\u003cth>Что делать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ccode>lib/uikit.dart\u003c/code> экспортирует только цвета, типографику и логи. Компоненты \u003cstrong>не экспортируются\u003c/strong>; StoryBook импортирует \u003ccode>package:uikit/components/custom_button.dart\u003c/code> напрямую\u003c/td>\n\u003ctd>Нарушена инкапсуляция («наружу — чётко определённый API»)\u003c/td>\n\u003ctd>Папка \u003ccode>src/\u003c/code>, все публичные классы в \u003ccode>uikit.dart\u003c/code>, в приложении один импорт\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>2\u003c/td>\n\u003ctd>Иконки подключены как \u003ccode>Image.asset('assets/eye.png')\u003c/code> без \u003ccode>package: 'uikit'\u003c/code>. В \u003ccode>storybook/assets\u003c/code> лежит только \u003ccode>ava.jpg\u003c/code>\u003c/td>\n\u003ctd>Иконки не найдутся (ошибка ассета), компоненты ломаются\u003c/td>\n\u003ctd>Всегда \u003ccode>package: 'uikit'\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>3\u003c/td>\n\u003ctd>В \u003ccode>pubspec.yaml\u003c/code> вес \u003ccode>800\u003c/code> указывает на \u003ccode>Manrope-ExtraLight.ttf\u003c/code> (файл \u003ccode>ExtraBold\u003c/code> лежит рядом, но не подключён)\u003c/td>\n\u003ctd>Неверное начертание, минус за типографику\u003c/td>\n\u003ctd>Исправить на \u003ccode>ExtraBold\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>4\u003c/td>\n\u003ctd>Даты в шапках \u003ccode>15.10.2026\u003c/code>\u003c/td>\n\u003ctd>Формат по заданию \u003ccode>ДД-ММ-ГГГГ\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>15-10-2026\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>5\u003c/td>\n\u003ctd>Размеры вида \u003ccode>width: 350.fw\u003c/code>, \u003ccode>SizedBox(height: 109.fh)\u003c/code> в самих компонентах и в StoryBook\u003c/td>\n\u003ctd>Критерий «Все компоненты адаптивны» (1,2 балла)\u003c/td>\n\u003ctd>Ширина от родителя; числа Figma — для отступов и радиусов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>6\u003c/td>\n\u003ctd>Кнопка получает \u003ccode>fillColor\u003c/code>, \u003ccode>borderColor\u003c/code>, \u003ccode>textColor\u003c/code> снаружи; в StoryBook цвета перечислены вручную в каждой кнопке\u003c/td>\n\u003ctd>DRY / OCP, «кнопка со всеми состояниями» не инкапсулирована\u003c/td>\n\u003ctd>Enum вариантов (\u003ccode>primary / secondary / destructive\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>7\u003c/td>\n\u003ctd>В \u003ccode>CustomTextField\u003c/code> пять одинаковых \u003ccode>OutlineInputBorder\u003c/code>; в \u003ccode>CustomBottomBar\u003c/code> три копии пункта\u003c/td>\n\u003ctd>DRY (0,5 балла)\u003c/td>\n\u003ctd>Метод \u003ccode>_border(color)\u003c/code>, список пунктов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>8\u003c/td>\n\u003ctd>Состояние поля («focused», «error») передаётся параметром, а не берётся из фокуса\u003c/td>\n\u003ctd>«Все состояния» могут считаться имитацией\u003c/td>\n\u003ctd>\u003ccode>FocusNode\u003c/code> и \u003ccode>errorText\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>9\u003c/td>\n\u003ctd>Нет Select/BottomSheet, Pagination, карточки, Timer; в зависимостях есть \u003ccode>modal_bottom_sheet\u003c/code>, но не используется\u003c/td>\n\u003ctd>В реальном КЗ это около 4 баллов (0,9+0,3+0,3+1,5+0,6)\u003c/td>\n\u003ctd>Тренировать эти компоненты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>10\u003c/td>\n\u003ctd>Один коммит в каждом репозитории, одна ветка \u003ccode>main\u003c/code>; тегов нет\u003c/td>\n\u003ctd>Критерии Г (ветка спринта, merge) и «независимое версионирование»\u003c/td>\n\u003ctd>Ветка \u003ccode>sprint-1\u003c/code>, PR, тег \u003ccode>v1.0.0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>11\u003c/td>\n\u003ctd>\u003ccode>README.md\u003c/code> и \u003ccode>CHANGELOG.md\u003c/code> — шаблонные \u003ccode>TODO\u003c/code>\u003c/td>\n\u003ctd>Мелкие потери по документации\u003c/td>\n\u003ctd>Пара строк о компонентах и версии\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>12\u003c/td>\n\u003ctd>Лог в каждом \u003ccode>initState\u003c/code> и \u003ccode>dispose\u003c/code> для кнопки: в UIKit это допустимо, но \u003ccode>Logging()\u003c/code> создаётся заново каждый раз; ошибка \u003ccode>error()\u003c/code> не используется нигде\u003c/td>\n\u003ctd>Минор\u003c/td>\n\u003ctd>Один синглтон, лог ERROR в \u003ccode>catch\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"tip\">\n\u003cp>Если в вашей симуляции был другой набор компонентов (HR Design System: appbar, avatar, textarea, progress bar), это нормально. Важно, что в реальном КЗ набор другой: Select, BottomSheet, Pagination, Card, Timer, Bottom Bar, Checkbox, Input, Button.\u003c/p>\n\u003c/div>\n\u003ch2>Чек-лист перед сдачей спринта 1\u003c/h2>\n\u003cul class=\"task-list\">\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Репозиторий \u003ccode>uikit\u003c/code> отдельный, ветка \u003ccode>sprint-1\u003c/code>, смёржена в \u003ccode>main\u003c/code>, тег \u003ccode>v1.0.0\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />\u003ccode>lib/uikit.dart\u003c/code> экспортирует все компоненты, \u003ccode>src/\u003c/code> приватен.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Ресурсы с \u003ccode>package: 'uikit'\u003c/code>, шрифты подключены правильными файлами.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Цвета и типографика: \u003cstrong>все\u003c/strong> из макета, с именами.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />В StoryBook: каждый компонент во всех состояниях.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />На узком (360 dp) и широком (430 dp) экране нет переполнений.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Шапка у каждого класса, описания публичных методов, логи с форматом \u003ccode>[Тег]: Событие — Детали\u003c/code>.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Карточки перенесены в «Готово к тестированию» с хэшами коммитов.\u003c/label>\u003c/li>\n\u003c/ul>\n", "text": " Что нужно сделать Часть Баллы Что проверяют Цвета как на макете 0,24 −0,02 за каждый отсутствующий цвет Типографика (тема) 0,32 −0,02 за каждый отсутствующий стиль Поле ввода и все состояния 1,20 −0,15 за отсутствующий элемент; нет в StoryBook — половина Select + BottomSheet 0,90 + 0,30 Тап по селекту открывает BottomSheet Кнопка со всеми состояниями 1,50 −0,1 за каждый отсутствующий вариант Pagination 0,30 Все состояния Карточка со всеми состояниями 1,50 −0,3 за отсутствующий вариант Bottom Bar 0,80 Timer 0,60 Checkbox 0,80 Все компоненты адаптивны 1,20 −0,15 за каждый неадаптивный Архитектура: DRY, отдельная библиотека 0,50 + 0,50 Половина, если нет комментариев и логов Git: ветка, проект в ветке, merge 0,30 Три общих правила в критериях: нет библиотеки — ничего не проверяется ; нет компонента в StoryBook — половина баллов ; нет комментариев и логов — половина баллов . Порядок работы (план на 90 минут) Минуты Действие 0–5 Создать репозиторий и ветку sprint-1 , создать Flutter-пакет, переместить карточки в «В работе» (не более 2) 5–20 Цвета, типографика, шрифты, логгер, uikit.dart с экспортами 20–55 Поле, кнопка, чекбокс, карточка, bottom bar — самые дорогие 55–70 Select + BottomSheet, Pagination, Timer 70–85 StoryBook: все компоненты и все состояния 85–90 Тег v1.0.0 , push, PR, merge, перенос карточек с коммитами Создание библиотеки flutter create --template=package uikit cd uikit && git init Структура с настоящей инкапсуляцией: uikit/ lib/ uikit.dart # единственный публичный файл, только export src/ theme/ colors.dart typography.dart components/ ui_button.dart ui_text_field.dart ui_select.dart ... core/ logger.dart scale.dart assets/ icons... fonts/ Manrope-*.ttf pubspec.yaml CHANGELOG.md README.md // lib/uikit.dart library; export 'src/theme/colors.dart'; export 'src/theme/typography.dart'; export 'src/components/ui_button.dart'; export 'src/components/ui_text_field.dart'; export 'src/components/ui_select.dart'; export 'src/components/ui_checkbox.dart'; // ... всё, что должно быть доступно приложению Приложение подключает import 'package:uikit/uikit.dart'; и больше ничего. Это и есть инкапсуляция : «внутренняя реализация скрыта, наружу доступен только чётко определённый API». Шрифты и ресурсы внутри пакета # pubspec.yaml библиотеки flutter: assets: - assets/ fonts: - family: Manrope fonts: - asset: fonts/Manrope-Regular.ttf weight: 400 - asset: fonts/Manrope-SemiBold.ttf weight: 600 - asset: fonts/Manrope-Bold.ttf weight: 700 - asset: fonts/Manrope-ExtraBold.ttf weight: 800 В стиле указывайте пакет, тогда приложению не нужно дублировать шрифты в своём pubspec.yaml : const TextStyle screenHeader = TextStyle( fontFamily: 'Manrope', package: 'uikit', fontWeight: FontWeight.w700, fontSize: 24, height: 32 / 24, letterSpacing: -0.48, ); Иконки из пакета: Image.asset('assets/eye.png', package: 'uikit') . Цвета и типографика Единый источник истины (DRY): цвета и стили определены один раз. import 'package:flutter/painting.dart'; abstract final class UiColors { static const primary = Color(0xFF00C853); static const onPrimary = Color(0xFFFFFFFF); static const error = Color(0xFFBA1A1A); static const border = Color(0xFFC3C6D7); static const surface = Color(0xFFFAF8FF); static const text = Color(0xFF191B23); } Проверьте: в StoryBook должна быть страница «Цвета» (квадраты с названиями всех цветов макета) и «Типографика» (каждый стиль с подписью размера и начертания). Кнопка: варианты и состояния Один класс, варианты через enum (O из SOLID и фабрики из DRY): // Универсальная кнопка библиотеки. Отвечает только за отображение и нажатие. // Дата создания: 11-11-2026 // Автор создания: 7 enum UiButtonKind { primary, secondary, destructive } class UiButton extends StatelessWidget { final String text; final UiButtonKind kind; final bool isLoading; final VoidCallback? onPressed; // null = кнопка отключена const UiButton({ super.key, required this.text, this.kind = UiButtonKind.primary, this.isLoading = false, this.onPressed, }); const UiButton.secondary({super.key, required this.text, this.isLoading = false, this.onPressed}) : kind = UiButtonKind.secondary; bool get _enabled => onPressed != null && !isLoading; @override Widget build(BuildContext context) { final (bg, fg, border) = switch (kind) { UiButtonKind.primary => (UiColors.primary, UiColors.onPrimary, UiColors.primary), UiButtonKind.secondary => (UiColors.onPrimary, UiColors.primary, UiColors.primary), UiButtonKind.destructive => (UiColors.error, UiColors.onPrimary, UiColors.error), }; return Opacity( opacity: _enabled ? 1 : 0.4, // состояние disabled child: Material( color: bg, shape: RoundedRectangleBorder( borderRadius: BorderRadius.circular(8), side: BorderSide(color: border, width: 2), ), child: InkWell( // состояние pressed: ripple-эффект borderRadius: BorderRadius.circular(8), onTap: _enabled ? () { UiLog.info('UiButton', 'Нажатие', text); onPressed!(); } : null, child: ConstrainedBox( constraints: const BoxConstraints(minHeight: 48, minWidth: double.infinity), child: Center( child: isLoading ? SizedBox(width: 20, height: 20, child: CircularProgressIndicator(strokeWidth: 2, color: fg)) : Text(text, style: bodyMedium.copyWith(color: fg)), ), ), ), ), ); } } Кнопка тянется на ширину родителя ( minWidth: double.infinity ), поэтому на разных экранах не «плавает». Нужна половина ширины — оберните в Expanded или SizedBox . Поле ввода Варианты: обычное, в фокусе, с ошибкой, отключённое, пароль (с глазом), поиск (с иконкой). class UiTextField extends StatefulWidget { final String label, hint; final String? errorText; final bool enabled; final UiTextFieldType type; // normal | password | search final TextEditingController? controller; final ValueChanged\u003cString>? onChanged; const UiTextField({super.key, required this.label, required this.hint, this.errorText, this.enabled = true, this.type = UiTextFieldType.normal, this.controller, this.onChanged}); @override State\u003cUiTextField> createState() => _UiTextFieldState(); } class _UiTextFieldState extends State\u003cUiTextField> { final _focus = FocusNode(); bool _hidden = true; @override void initState() { super.initState(); _focus.addListener(() => setState(() {})); } @override void dispose() { _focus.dispose(); super.dispose(); } // Один метод создаёт рамку для любого состояния (DRY: вместо пяти копий) OutlineInputBorder _border(Color c) => OutlineInputBorder( borderSide: BorderSide(color: c, width: 1), borderRadius: BorderRadius.circular(8), ); @override Widget build(BuildContext context) { final hasError = widget.errorText != null; final color = hasError ? UiColors.error : _focus.hasFocus ? UiColors.primary : UiColors.border; return Column( crossAxisAlignment: CrossAxisAlignment.start, children: [ Text(widget.label, style: fieldLabel.copyWith(color: color)), const SizedBox(height: 4), TextField( focusNode: _focus, enabled: widget.enabled, controller: widget.controller, onChanged: widget.onChanged, obscureText: widget.type == UiTextFieldType.password && _hidden, decoration: InputDecoration( filled: true, fillColor: UiColors.surface, hintText: widget.hint, errorText: widget.errorText, enabledBorder: _border(color), focusedBorder: _border(color), disabledBorder: _border(UiColors.border), errorBorder: _border(UiColors.error), focusedErrorBorder: _border(UiColors.error), suffixIcon: widget.type == UiTextFieldType.password ? IconButton( icon: Icon(_hidden ? Icons.visibility_off : Icons.visibility), onPressed: () => setState(() => _hidden = !_hidden)) : null, ), ), ], ); } } В StoryBook показывайте настоящее состояние фокуса (поле с autofocus или принудительный FocusNode.requestFocus() ), а не раскрашенную имитацию. Select и BottomSheet class UiSelect\u003cT> extends StatelessWidget { final String label, hint; final T? value; final List\u003cT> options; final String Function(T) titleOf; final ValueChanged\u003cT> onChanged; const UiSelect({super.key, required this.label, required this.hint, required this.value, required this.options, required this.titleOf, required this.onChanged}); @override Widget build(BuildContext context) { return GestureDetector( behavior: HitTestBehavior.opaque, onTap: () async { final picked = await showModalBottomSheet\u003cT>( context: context, builder: (_) => UiBottomSheet\u003cT>(options: options, titleOf: titleOf, selected: value), ); if (picked != null) onChanged(picked); }, child: InputDecorator( decoration: InputDecoration(labelText: label, suffixIcon: const Icon(Icons.keyboard_arrow_down)), child: Text(value == null ? hint : titleOf(value as T)), ), ); } } UiBottomSheet — отдельный публичный компонент (в таблице он отдельная строка 0,3 балла): заголовок, список вариантов, отметка выбранного. Pagination, Timer, Card, Bottom Bar Pagination — точки приветственных экранов. Активная шире остальных: class UiPagination extends StatelessWidget { final int count, current; const UiPagination({super.key, required this.count, required this.current}); @override Widget build(BuildContext context) => Row( mainAxisSize: MainAxisSize.min, children: List.generate(count, (i) => AnimatedContainer( duration: const Duration(milliseconds: 200), margin: const EdgeInsets.symmetric(horizontal: 3), width: i == current ? 24 : 8, height: 8, decoration: BoxDecoration( color: i == current ? UiColors.primary : UiColors.border, borderRadius: BorderRadius.circular(4)), )), ); } Timer — компонент отображает время, а считает его тот, кто его использует (SRP). Принимает Duration и форматирует мм:сс : String formatDuration(Duration d) { final m = d.inMinutes.remainder(60).toString().padLeft(2, '0'); final s = d.inSeconds.remainder(60).toString().padLeft(2, '0'); return '$m:$s'; } Card — состояния: обычная, выбранная, неактивная; контент передаётся параметрами ( title , subtitle , leading , trailing , onTap ). Bottom Bar — список данных, а не три копии кода; центральная кнопка выделена (по ней открывается Schedule Game): class UiBottomBarItem { final String label; final String iconAsset; const UiBottomBarItem(this.label, this.iconAsset); } // в виджете: items.asMap().entries.map((e) => _Tab(...)).toList() Checkbox — состояния: выкл, вкл, отключён (с отметкой и без). StoryBook Приложение подключает библиотеку из Git по тегу и содержит одну страницу на компонент (или один длинный экран с заголовками), где видны все состояния. dependencies: uikit: git: url: https://github.com/\u003cлогин>/uikit.git ref: v1.0.0 import 'package:uikit/uikit.dart'; // только один импорт class ButtonsPage extends StatelessWidget { const ButtonsPage({super.key}); @override Widget build(BuildContext context) => Padding( padding: const EdgeInsets.all(20), child: Column(spacing: 16, children: [ UiButton(text: 'Primary', onPressed: () {}), const UiButton(text: 'Primary disabled'), UiButton.secondary(text: 'Secondary', onPressed: () {}), UiButton(text: 'Destructive', kind: UiButtonKind.destructive, onPressed: () {}), UiButton(text: 'Loading', isLoading: true, onPressed: () {}), ]), ); } Разбор вашей симуляции (6,39 из 10,51) Я прочитал оба репозитория. Это вероятные причины потерь по коду; точные баллы по пунктам видите только вы по протоколу. # Что вижу в коде Вероятный эффект Что делать 1 lib/uikit.dart экспортирует только цвета, типографику и логи. Компоненты не экспортируются ; StoryBook импортирует package:uikit/components/custom_button.dart напрямую Нарушена инкапсуляция («наружу — чётко определённый API») Папка src/ , все публичные классы в uikit.dart , в приложении один импорт 2 Иконки подключены как Image.asset('assets/eye.png') без package: 'uikit' . В storybook/assets лежит только ava.jpg Иконки не найдутся (ошибка ассета), компоненты ломаются Всегда package: 'uikit' 3 В pubspec.yaml вес 800 указывает на Manrope-ExtraLight.ttf (файл ExtraBold лежит рядом, но не подключён) Неверное начертание, минус за типографику Исправить на ExtraBold 4 Даты в шапках 15.10.2026 Формат по заданию ДД-ММ-ГГГГ 15-10-2026 5 Размеры вида width: 350.fw , SizedBox(height: 109.fh) в самих компонентах и в StoryBook Критерий «Все компоненты адаптивны» (1,2 балла) Ширина от родителя; числа Figma — для отступов и радиусов 6 Кнопка получает fillColor , borderColor , textColor снаружи; в StoryBook цвета перечислены вручную в каждой кнопке DRY / OCP, «кнопка со всеми состояниями» не инкапсулирована Enum вариантов ( primary / secondary / destructive ) 7 В CustomTextField пять одинаковых OutlineInputBorder ; в CustomBottomBar три копии пункта DRY (0,5 балла) Метод _border(color) , список пунктов 8 Состояние поля («focused», «error») передаётся параметром, а не берётся из фокуса «Все состояния» могут считаться имитацией FocusNode и errorText 9 Нет Select/BottomSheet, Pagination, карточки, Timer; в зависимостях есть modal_bottom_sheet , но не используется В реальном КЗ это около 4 баллов (0,9+0,3+0,3+1,5+0,6) Тренировать эти компоненты 10 Один коммит в каждом репозитории, одна ветка main ; тегов нет Критерии Г (ветка спринта, merge) и «независимое версионирование» Ветка sprint-1 , PR, тег v1.0.0 11 README.md и CHANGELOG.md — шаблонные TODO Мелкие потери по документации Пара строк о компонентах и версии 12 Лог в каждом initState и dispose для кнопки: в UIKit это допустимо, но Logging() создаётся заново каждый раз; ошибка error() не используется нигде Минор Один синглтон, лог ERROR в catch Если в вашей симуляции был другой набор компонентов (HR Design System: appbar, avatar, textarea, progress bar), это нормально. Важно, что в реальном КЗ набор другой: Select, BottomSheet, Pagination, Card, Timer, Bottom Bar, Checkbox, Input, Button. Чек-лист перед сдачей спринта 1 Репозиторий uikit отдельный, ветка sprint-1 , смёржена в main , тег v1.0.0 . lib/uikit.dart экспортирует все компоненты, src/ приватен. Ресурсы с package: 'uikit' , шрифты подключены правильными файлами. Цвета и типографика: все из макета, с именами. В StoryBook: каждый компонент во всех состояниях. На узком (360 dp) и широком (430 dp) экране нет переполнений. Шапка у каждого класса, описания публичных методов, логи с форматом [Тег]: Событие — Детали . Карточки перенесены в «Готово к тестированию» с хэшами коммитов. ", "hours": 6, "minutes": 11}, {"id": "sprint2", "stage": 6, "title": "Спринт 2: сетевой слой и тесты", "lead": "1 ч 10 мин. Отдельная библиотека для REST API, 11 запросов, обработка ошибок и тесты. Максимум 20,89 балла.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Часть\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Нет интернета → вернуть ошибку\u003c/td>\n\u003ctd style=\"text-align: right;\">0,70\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Ошибка сервера → вернуть ошибку\u003c/td>\n\u003ctd style=\"text-align: right;\">0,84\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>11 запросов, по 1,10 за каждый\u003c/td>\n\u003ctd style=\"text-align: right;\">12,10\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектура: библиотека, SOLID, DRY\u003c/td>\n\u003ctd style=\"text-align: right;\">0,5 + 1,0 + 0,5\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Тесты: 11 запросов, по 0,45 за каждый\u003c/td>\n\u003ctd style=\"text-align: right;\">4,95\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Git (ветка, merge)\u003c/td>\n\u003ctd style=\"text-align: right;\">0,30\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>11 запросов:\u003c/strong> авторизация, регистрация, изменение профиля, получение профиля, выход, создание игры, список игр, информация об игре, подключение к игре, статистика игрока, сохранение результата игры.\u003c/p>\n\u003cp>Это \u003cstrong>самый выгодный спринт по соотношению баллы/время\u003c/strong>: 20,89 балла за 70 минут, и все пункты однотипные. Сделав первый запрос «по шаблону», остальные добавляются за 2–3 минуты.\u003c/p>\n\u003cdiv class=\"tip\">\n\u003cp>Спринт 2 в вашей симуляции не проверялся, а он вторым по цене. Подготовьте шаблон и отрепетируйте его до автоматизма.\u003c/p>\n\u003c/div>\n\u003ch2>Требования к библиотеке\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Свойство\u003c/th>\n\u003cth>Как выполнить\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Изолированность\u003c/td>\n\u003ctd>Отдельный репозиторий и пакет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Абстрагированность\u003c/td>\n\u003ctd>Приложение зависит от \u003ccode>abstract interface class\u003c/code>, а не от \u003ccode>http\u003c/code> или \u003ccode>dio\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Заменяемость\u003c/td>\n\u003ctd>Реализация \u003ccode>HttpApiClient\u003c/code> может быть заменена на \u003ccode>DioApiClient\u003c/code> без правок приложения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Версионирование\u003c/td>\n\u003ctd>\u003ccode>version:\u003c/code> в pubspec и теги \u003ccode>v1.0.0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Структура пакета\u003c/h2>\n\u003cpre>\u003ccode>network_layer/\n  lib/\n    network_layer.dart             # экспорт публичного API\n    src/\n      config/api_config.dart       # baseUrl, заголовки, таймауты (единый источник)\n      client/api_client.dart       # abstract interface class\n      client/http_api_client.dart  # реализация на пакете http\n      errors/api_exception.dart    # NoInternet, Server, Timeout, Parse\n      models/                      # DTO: UserDto, GameDto, StatsDto, ...\n      api/auth_api.dart            # abstract + impl\n      api/game_api.dart\n      api/profile_api.dart\n  test/\n    auth_api_test.dart ...\u003c/code>\u003c/pre>\n\u003ch2>Ошибки\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// Базовая ошибка сетевого слоя.\nsealed class ApiException implements Exception {\n  final String message;\n  const ApiException(this.message);\n  @override\n  String toString() =&gt; message;\n}\n\nclass NoInternetException extends ApiException {\n  const NoInternetException() : super(&#39;Нет подключения к интернету&#39;);\n}\n\nclass TimeoutApiException extends ApiException {\n  const TimeoutApiException() : super(&#
