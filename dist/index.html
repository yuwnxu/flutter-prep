ывается. Выносите изменяющийся кусок в отдельный виджет. Виджеты — «чертежи», они лёгкие; создавать их много не страшно. Подробно: const и Key const сообщает Flutter, что виджет не меняется, поэтому его можно создать один раз и не перестраивать: const SizedBox(height: 16); // всегда один и тот же объект const Text('Заголовок'); Если виджет зависит от переменной, const ставить нельзя. Линтер подскажет, где можно: prefer_const_constructors . Key нужен, чтобы Flutter различал одинаковые виджеты в списках, особенно при перестановках. В игре Image плитки меняются местами, и без ключей состояние (например, анимация) может «прилипнуть» не к той плитке. for (final tile in tiles) TileWidget(key: ValueKey(tile.id), tile: tile), Подробно: constraints на примерах Правило: родитель задаёт границы, ребёнок выбирает размер внутри них, родитель ставит ребёнка на место. Родитель Что передаёт ребёнку Scaffold.body Размер экрана (tight) Center «Можешь быть от нуля до всего экрана» (loose) Column По ширине — ограничение родителя, по высоте — без ограничений Row По высоте — ограничение родителя, по ширине — без ограничений Expanded Ровно оставшееся место по главной оси SizedBox(width: 100) Ровно 100 Поэтому: Container(width: 100) внутри Center будет 100, а внутри Scaffold.body без Center растянется на весь экран (родитель «жёсткий»). ListView внутри Column получает бесконечную высоту и падает, пока не обернёте в Expanded . Column(children: [ const Header(), Expanded(child: ListView(children: items)), // список занимает всё оставшееся место const BottomButton(), ]) Подробно: как выбрать способ управления состоянием Вопрос Ответ → решение Состояние нужно одному маленькому виджету (раскрыт ли блок) StatefulWidget + setState Состояние экрана (загрузка, список, ошибка) Контроллер: ChangeNotifier / GetX / Bloc Состояние нужно многим экранам (пользователь) Хранить в репозитории/сервисе и отдавать через DI Минимальный контроллер без пакетов: class CounterController extends ChangeNotifier { int value = 0; void inc() { value++; notifyListeners(); } } final controller = CounterController(); ListenableBuilder( listenable: controller, builder: (_, __) => Text('${controller.value}'), ) С GetX: class CounterController extends GetxController { final value = 0.obs; void inc() => value.value++; } Obx(() => Text('${controller.value}')); Главное правило из задания: контроллер лежит в Presentation и не знает о сети ; он вызывает UseCase, а тот — репозиторий. Практика Сделайте экран-счётчик на StatefulWidget , затем перепишите на ChangeNotifier . Соберите карточку игры: аватар, два текста, иконка справа; проверьте на узком экране, что нет overflow. Добавьте initState / dispose с логами по формату задания. Сделайте список из 20 элементов с кнопкой внизу, прибитой к низу экрана. Объясните вслух, что произойдёт при нажатии на кнопку со setState . ", "hours": 4, "minutes": 6}, {"id": "flutter-ui", "stage": 3, "title": "Flutter: экраны, формы, навигация", "lead": "Тема, шрифты, ресурсы, поля ввода, навигация, диалоги, прокрутка. Всё для сборки реальных экранов.", "html": "\u003ch2>Структура проекта и pubspec.yaml\u003c/h2>\n\u003cpre>\u003ccode>my_app/\n  lib/\n    main.dart\n  assets/\n    images/\n    fonts/\n  pubspec.yaml\n  android/  ios/\n  test/\u003c/code>\u003c/pre>\n\u003cpre class=\"yaml\">\u003ccode>name: my_app\nenvironment:\n  sdk: ^3.11.0\n\ndependencies:\n  flutter:\n    sdk: flutter\n  http: ^1.2.0\n  shared_preferences: ^2.3.0\n\nflutter:\n  uses-material-design: true\n  assets:\n    - assets/images/\n  fonts:\n    - family: Manrope\n      fonts:\n        - asset: assets/fonts/Manrope-Regular.ttf\n          weight: 400\n        - asset: assets/fonts/Manrope-SemiBold.ttf\n          weight: 600\n        - asset: assets/fonts/Manrope-Bold.ttf\n          weight: 700\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Отступы в YAML — только пробелы, ровно по структуре. Каждому весу шрифта соответствует \u003cstrong>свой файл\u003c/strong>: \u003ccode>w800\u003c/code> — это \u003ccode>Manrope-ExtraBold.ttf\u003c/code>, а не \u003ccode>ExtraLight\u003c/code>.\u003c/p>\n\u003c/div>\n\u003cp>После изменения \u003ccode>pubspec.yaml\u003c/code> выполните \u003ccode>flutter pub get\u003c/code>.\u003c/p>\n\u003ch2>Тема и типографика (Material 3)\u003c/h2>\n\u003cp>Цвета и стили лучше хранить в одном месте (DRY): в UIKit это отдельные файлы \u003ccode>colors.dart\u003c/code> и \u003ccode>typography.dart\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>abstract final class AppColors {\n  static const primary = Color(0xFF004AC6);\n  static const white = Color(0xFFFFFFFF);\n}\n\nabstract final class AppText {\n  static const _family = &#39;Manrope&#39;;\n  static const header = TextStyle(\n    fontFamily: _family, fontWeight: FontWeight.w700,\n    fontSize: 24, height: 32 / 24, letterSpacing: -0.48,   // height = lineHeight / fontSize\n  );\n}\n\nMaterialApp(\n  theme: ThemeData(\n    useMaterial3: true,\n    colorScheme: ColorScheme.fromSeed(seedColor: AppColors.primary),\n    fontFamily: &#39;Manrope&#39;,\n  ),\n);\u003c/code>\u003c/pre>\n\u003cp>Из Figma берут: размер шрифта, начертание, \u003cstrong>межстрочный интервал\u003c/strong> (переводится в \u003ccode>height = lineHeight / fontSize\u003c/code>) и \u003cstrong>letter spacing\u003c/strong>.\u003c/p>\n\u003ch2>Поля ввода и формы\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final _email = TextEditingController();\nfinal _formKey = GlobalKey&lt;FormState&gt;();\nbool _hidden = true;\n\nForm(\n  key: _formKey,\n  child: Column(children: [\n    TextFormField(\n      controller: _email,\n      keyboardType: TextInputType.emailAddress,\n      validator: (v) =&gt; RegExp(r&#39;^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$&#39;).hasMatch(v ?? &#39;&#39;)\n          ? null\n          : &#39;Некорректный email&#39;,\n    ),\n    TextFormField(\n      obscureText: _hidden,\n      decoration: InputDecoration(\n        suffixIcon: IconButton(\n          icon: Icon(_hidden ? Icons.visibility_off : Icons.visibility),\n          onPressed: () =&gt; setState(() =&gt; _hidden = !_hidden),\n        ),\n      ),\n    ),\n    FilledButton(\n      onPressed: () {\n        if (_formKey.currentState!.validate()) { /* отправка */ }\n      },\n      child: const Text(&#39;Create Account&#39;),\n    ),\n  ]),\n)\n\n@override\nvoid dispose() { _email.dispose(); super.dispose(); } // контроллеры нужно освобождать\u003c/code>\u003c/pre>\n\u003cp>Состояния поля: обычное, фокус, ошибка, отключено. Фокус можно получить настоящим \u003ccode>FocusNode\u003c/code> (лучше, чем передавать «состояние» параметром).\u003c/p>\n\u003ch2>Навигация\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// Открыть экран\nNavigator.of(context).push(MaterialPageRoute(builder: (_) =&gt; const DetailsScreen()));\n\n// Заменить текущий (после Splash, после входа)\nNavigator.of(context).pushReplacement(MaterialPageRoute(builder: (_) =&gt; const HomeScreen()));\n\n// Очистить стек (после Success -&gt; Landing)\nNavigator.of(context).pushAndRemoveUntil(\n  MaterialPageRoute(builder: (_) =&gt; const LandingScreen()),\n  (route) =&gt; false,\n);\n\n// Назад\nNavigator.of(context).pop();\u003c/code>\u003c/pre>\n\u003cp>Если нужно сохранять «последний экран», дайте маршрутам \u003cstrong>имена\u003c/strong>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>MaterialApp(\n  initialRoute: &#39;/splash&#39;,\n  routes: {\n    &#39;/splash&#39;: (_) =&gt; const SplashScreen(),\n    &#39;/landing&#39;: (_) =&gt; const LandingScreen(),\n  },\n)\nNavigator.pushNamed(context, &#39;/landing&#39;);\u003c/code>\u003c/pre>\n\u003ch2>Диалоги, BottomSheet, SnackBar, пикеры\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// BottomSheet (для компонента Select)\nfinal picked = await showModalBottomSheet&lt;String&gt;(\n  context: context,\n  isScrollControlled: true,\n  shape: const RoundedRectangleBorder(\n    borderRadius: BorderRadius.vertical(top: Radius.circular(16)),\n  ),\n  builder: (_) =&gt; const OptionsList(),\n);\n\n// Дата и время (стандартные системные элементы)\nfinal date = await showDatePicker(\n  context: context,\n  initialDate: DateTime.now(),\n  firstDate: DateTime.now(),\n  lastDate: DateTime(2100),\n);\nfinal time = await showTimePicker(context: context, initialTime: TimeOfDay.now());\n\n// Уведомление об ошибке на 5 секунд\nScaffoldMessenger.of(context).showSnackBar(\n  const SnackBar(content: Text(&#39;Ошибка сети&#39;), duration: Duration(seconds: 5)),\n);\u003c/code>\u003c/pre>\n\u003ch2>Прокрутка и «закреплённый заголовок»\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>CustomScrollView(\n  slivers: [\n    SliverAppBar(pinned: true, title: Text(&#39;Create Account&#39;)),\n    SliverToBoxAdapter(child: Image.asset(&#39;assets/images/hero.png&#39;)),\n    SliverFillRemaining(hasScrollBody: false, child: FormContent()),\n  ],\n)\u003c/code>\u003c/pre>\n\u003cp>Это прямой ответ на требование спринта 3: «если контент не помещается, прокручивается картинка, а надпись Create Account остаётся сверху».\u003c/p>\n\u003ch2>Картинки\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>Image.asset(&#39;assets/images/logo.png&#39;, fit: BoxFit.cover);\nImage.network(url, fit: BoxFit.cover);       // без кэша!\u003c/code>\u003c/pre>\n\u003cp>Для кэширования сетевых изображений используйте \u003ccode>cached_network_image\u003c/code> (подробно в разделе спринта 4).\u003c/p>\n\u003cp>Внутри \u003cstrong>пакета\u003c/strong> (UIKit) ресурсы подключаются с параметром \u003ccode>package\u003c/code>:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Image.asset(&#39;assets/eye.png&#39;, package: &#39;uikit&#39;);\u003c/code>\u003c/pre>\n\u003cp>Без него приложение будет искать файл в своих \u003ccode>assets\u003c/code> и не найдёт.\u003c/p>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Подключить шрифт и ресурсы в \u003ccode>pubspec.yaml\u003c/code>.\u003c/li>\n\u003cli>Собрать форму с валидацией и показом пароля.\u003c/li>\n\u003cli>Выбрать нужный способ навигации.\u003c/li>\n\u003cli>Открыть BottomSheet и системные пикеры даты и времени.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: форма регистрации по шагам\u003c/h2>\n\u003cp>Задача из спринта 3: экран «Регистрация» с проверкой email, показом пароля, ошибкой и прокруткой.\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Каркас:\u003c/strong> \u003ccode>Scaffold\u003c/code> → \u003ccode>SafeArea\u003c/code> → прокручиваемая область.\u003c/li>\n\u003cli>\u003cstrong>Закреплённый заголовок:\u003c/strong> \u003ccode>CustomScrollView\u003c/code> с \u003ccode>SliverAppBar(pinned: true)\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Картинка\u003c/strong> сверху: \u003ccode>SliverToBoxAdapter\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Форма:\u003c/strong> \u003ccode>Form\u003c/code> + \u003ccode>TextFormField\u003c/code> для email и пароля, кнопка.\u003c/li>\n\u003cli>\u003cstrong>Логика:\u003c/strong> контроллеры, валидатор, \u003ccode>isLoading\u003c/code>, вызов регистрации.\u003c/li>\n\u003cli>\u003cstrong>Ошибки сети:\u003c/strong> SnackBar на 5 секунд.\u003c/li>\n\u003cli>\u003cstrong>Логи:\u003c/strong> нажатие кнопки (INFO), запрос (INFO/DEBUG/ERROR).\u003c/li>\n\u003c/ol>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;void&gt; _submit() async {\n  AppLog.info(&#39;RegisterScreen&#39;, &#39;Нажатие&#39;, &#39;Кнопка «Create Account»&#39;);\n  if (!_formKey.currentState!.validate()) return;     // показали ошибки валидации\n  setState(() =&gt; _loading = true);\n  try {\n    await controller.register(_email.text.trim(), _password.text);\n    if (!mounted) return;\n    Navigator.of(context).pushReplacementNamed(&#39;/landing&#39;);\n  } on ApiException catch (e) {\n    if (mounted) showError(context, e.message);\n  } finally {\n    if (mounted) setState(() =&gt; _loading = false);\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Эксперту важно увидеть: ошибку при некорректном email, кнопку, которая блокируется во время запроса, и то, что при маленькой высоте экрана форма прокручивается, а заголовок остаётся.\u003c/p>\n\u003ch2>Подробно: как устроена навигация\u003c/h2>\n\u003cp>\u003cstrong>Navigator\u003c/strong> хранит \u003cstrong>стек\u003c/strong> экранов, как стопку бумаг.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>push\u003c/code> кладёт новый экран сверху: пользователь может вернуться.\u003c/li>\n\u003cli>\u003ccode>pop\u003c/code> убирает верхний экран.\u003c/li>\n\u003cli>\u003ccode>pushReplacement\u003c/code> заменяет верхний (после Splash возвращаться некуда).\u003c/li>\n\u003cli>\u003ccode>pushAndRemoveUntil(..., (r) =&gt; false)\u003c/code> очищает весь стек и кладёт один экран (после Success открыть Landing, а назад чтобы нельзя).\u003c/li>\n\u003c/ul>\n\u003cp>Передача данных:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// вперёд: через конструктор\nNavigator.push(context, MaterialPageRoute(builder: (_) =&gt; CombatInfoScreen(gameId: game.id)));\n\n// назад: результат pop\nfinal picked = await Navigator.push&lt;String&gt;(context, MaterialPageRoute(builder: (_) =&gt; const PickerScreen()));\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Именованные маршруты\u003c/strong> с аргументами удобны для сохранения последнего экрана:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Navigator.pushNamed(context, &#39;/combat&#39;, arguments: game.id);\n// в onGenerateRoute читаем settings.arguments\u003c/code>\u003c/pre>\n\u003cp>Кнопка «назад» на Android: \u003ccode>PopScope\u003c/code> перехватывает её, например, в игре.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>PopScope(\n  canPop: false,\n  onPopInvokedWithResult: (didPop, _) { if (!didPop) _confirmExit(); },\n  child: ...,\n)\u003c/code>\u003c/pre>\n\u003ch2>Подробно: ресурсы и шрифты — где ошибаются\u003c/h2>\n\u003cp>Чек-лист «картинка/шрифт не отображается»:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Файл лежит в папке, указанной в \u003ccode>pubspec.yaml\u003c/code> (\u003ccode>assets:\u003c/code>). Для папки пишут \u003ccode>assets/images/\u003c/code> (со слэшем на конце).\u003c/li>\n\u003cli>Отступы в \u003ccode>pubspec.yaml\u003c/code> точные, без табуляции.\u003c/li>\n\u003cli>После изменения выполнен \u003ccode>flutter pub get\u003c/code> и \u003cstrong>полный перезапуск\u003c/strong> приложения.\u003c/li>\n\u003cli>Имя файла в коде совпадает с настоящим, \u003cstrong>включая регистр\u003c/strong> и расширение.\u003c/li>\n\u003cli>Для файлов внутри пакета указан \u003ccode>package: 'имя_пакета'\u003c/code>.\u003c/li>\n\u003cli>Шрифт: у каждого начертания \u003ccode>weight\u003c/code> и файл соответствуют друг другу.\u003c/li>\n\u003cli>В \u003ccode>TextStyle\u003c/code> указан \u003ccode>fontFamily\u003c/code> (или шрифт задан в теме).\u003c/li>\n\u003c/ol>\n\u003cp>Иконки в формате SVG во Flutter по умолчанию не поддерживаются, нужен пакет \u003ccode>flutter_svg\u003c/code>. Если пакета нет в списке разрешённых, экспортируйте иконки из Figma в PNG (\u003cspan class=\"citation\" data-cites=\"2x\">@2x\u003c/span> и \u003cspan class=\"citation\" data-cites=\"3x\">@3x\u003c/span>) или используйте \u003ccode>Icons.*\u003c/code>.\u003c/p>\n\u003ch2>Подробно: списки и прокрутка\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Задача\u003c/th>\n\u003cth>Виджет\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Небольшая страница, которая может не поместиться\u003c/td>\n\u003ctd>\u003ccode>SingleChildScrollView(child: Column(...))\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Длинный список одинаковых элементов\u003c/td>\n\u003ctd>\u003ccode>ListView.builder(itemCount: n, itemBuilder: ...)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Сетка карточек\u003c/td>\n\u003ctd>\u003ccode>GridView.count\u003c/code> / \u003ccode>GridView.builder\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Список + закреплённый заголовок + разные блоки\u003c/td>\n\u003ctd>\u003ccode>CustomScrollView\u003c/code> + \u003ccode>Sliver*\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Горизонтальная прокрутка\u003c/td>\n\u003ctd>\u003ccode>ListView(scrollDirection: Axis.horizontal)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>ListView.builder\u003c/code> создаёт элементы лениво (только видимые), поэтому быстрый и экономит память. Для экрана Discover Combats используйте именно его. Для пустого списка добавьте отдельное состояние («Игр пока нет»).\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>ListView.separated(\n  padding: const EdgeInsets.symmetric(horizontal: 20),\n  itemCount: games.length,\n  separatorBuilder: (_, __) =&gt; const SizedBox(height: 12),\n  itemBuilder: (_, i) =&gt; GameCard(game: games[i], onTap: () =&gt; open(games[i])),\n)\u003c/code>\u003c/pre>\n\u003ch2>Подробно: анимации для меню и переходов\u003c/h2>\n\u003cp>Для задания достаточно простых \u003cstrong>неявных анимаций\u003c/strong>: меняете значение, Flutter плавно анимирует.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>AnimatedContainer(\n  duration: const Duration(milliseconds: 250),\n  curve: Curves.easeOut,\n  width: selected ? 24 : 8,\n  decoration: BoxDecoration(color: selected ? green : grey, borderRadius: BorderRadius.circular(4)),\n)\n\nAnimatedSlide(\n  offset: open ? Offset.zero : const Offset(-1, 0),   // -1 = целиком за левым краем\n  duration: const Duration(milliseconds: 250),\n  child: const MenuPanel(),\n)\n\nAnimatedOpacity(opacity: visible ? 1 : 0, duration: const Duration(milliseconds: 200), child: widget)\u003c/code>\u003c/pre>\n\u003cp>Для меню слева с закрытием по свайпу:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>GestureDetector(\n  onHorizontalDragEnd: (d) { if ((d.primaryVelocity ?? 0) &lt; 0) closeMenu(); }, // свайп влево\n  child: ...,\n)\u003c/code>\u003c/pre>\n\u003cp>Но проще и надёжнее стандартный \u003ccode>Drawer\u003c/code> (он уже умеет анимацию и свайп).\u003c/p>\n\u003ch2>Практика\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Соберите форму входа: два поля, показ пароля, кнопка, ошибка, SnackBar.\u003c/li>\n\u003cli>Откройте экран, передайте в него \u003ccode>id\u003c/code>, верните результат назад.\u003c/li>\n\u003cli>Сделайте экран со списком из 50 элементов на \u003ccode>ListView.builder\u003c/code> с состоянием «пусто».\u003c/li>\n\u003cli>Подключите свой шрифт и проверьте разные начертания.\u003c/li>\n\u003cli>Сделайте индикатор страниц \u003ccode>UiPagination\u003c/code> с \u003ccode>AnimatedContainer\u003c/code>.\u003c/li>\n\u003c/ol>\n", "text": " Структура проекта и pubspec.yaml my_app/ lib/ main.dart assets/ images/ fonts/ pubspec.yaml android/ ios/ test/ name: my_app environment: sdk: ^3.11.0 dependencies: flutter: sdk: flutter http: ^1.2.0 shared_preferences: ^2.3.0 flutter: uses-material-design: true assets: - assets/images/ fonts: - family: Manrope fonts: - asset: assets/fonts/Manrope-Regular.ttf weight: 400 - asset: assets/fonts/Manrope-SemiBold.ttf weight: 600 - asset: assets/fonts/Manrope-Bold.ttf weight: 700 Отступы в YAML — только пробелы, ровно по структуре. Каждому весу шрифта соответствует свой файл : w800 — это Manrope-ExtraBold.ttf , а не ExtraLight . После изменения pubspec.yaml выполните flutter pub get . Тема и типографика (Material 3) Цвета и стили лучше хранить в одном месте (DRY): в UIKit это отдельные файлы colors.dart и typography.dart . abstract final class AppColors { static const primary = Color(0xFF004AC6); static const white = Color(0xFFFFFFFF); } abstract final class AppText { static const _family = 'Manrope'; static const header = TextStyle( fontFamily: _family, fontWeight: FontWeight.w700, fontSize: 24, height: 32 / 24, letterSpacing: -0.48, // height = lineHeight / fontSize ); } MaterialApp( theme: ThemeData( useMaterial3: true, colorScheme: ColorScheme.fromSeed(seedColor: AppColors.primary), fontFamily: 'Manrope', ), ); Из Figma берут: размер шрифта, начертание, межстрочный интервал (переводится в height = lineHeight / fontSize ) и letter spacing . Поля ввода и формы final _email = TextEditingController(); final _formKey = GlobalKey\u003cFormState>(); bool _hidden = true; Form( key: _formKey, child: Column(children: [ TextFormField( controller: _email, keyboardType: TextInputType.emailAddress, validator: (v) => RegExp(r'^[a-z0-9]+@[a-z0-9]+\\.[a-z]+$').hasMatch(v ?? '') ? null : 'Некорректный email', ), TextFormField( obscureText: _hidden, decoration: InputDecoration( suffixIcon: IconButton( icon: Icon(_hidden ? Icons.visibility_off : Icons.visibility), onPressed: () => setState(() => _hidden = !_hidden), ), ), ), FilledButton( onPressed: () { if (_formKey.currentState!.validate()) { /* отправка */ } }, child: const Text('Create Account'), ), ]), ) @override void dispose() { _email.dispose(); super.dispose(); } // контроллеры нужно освобождать Состояния поля: обычное, фокус, ошибка, отключено. Фокус можно получить настоящим FocusNode (лучше, чем передавать «состояние» параметром). Навигация // Открыть экран Navigator.of(context).push(MaterialPageRoute(builder: (_) => const DetailsScreen())); // Заменить текущий (после Splash, после входа) Navigator.of(context).pushReplacement(MaterialPageRoute(builder: (_) => const HomeScreen())); // Очистить стек (после Success -> Landing) Navigator.of(context).pushAndRemoveUntil( MaterialPageRoute(builder: (_) => const LandingScreen()), (route) => false, ); // Назад Navigator.of(context).pop(); Если нужно сохранять «последний экран», дайте маршрутам имена : MaterialApp( initialRoute: '/splash', routes: { '/splash': (_) => const SplashScreen(), '/landing': (_) => const LandingScreen(), }, ) Navigator.pushNamed(context, '/landing'); Диалоги, BottomSheet, SnackBar, пикеры // BottomSheet (для компонента Select) final picked = await showModalBottomSheet\u003cString>( context: context, isScrollControlled: true, shape: const RoundedRectangleBorder( borderRadius: BorderRadius.vertical(top: Radius.circular(16)), ), builder: (_) => const OptionsList(), ); // Дата и время (стандартные системные элементы) final date = await showDatePicker( context: context, initialDate: DateTime.now(), firstDate: DateTime.now(), lastDate: DateTime(2100), ); final time = await showTimePicker(context: context, initialTime: TimeOfDay.now()); // Уведомление об ошибке на 5 секунд ScaffoldMessenger.of(context).showSnackBar( const SnackBar(content: Text('Ошибка сети'), duration: Duration(seconds: 5)), ); Прокрутка и «закреплённый заголовок» CustomScrollView( slivers: [ SliverAppBar(pinned: true, title: Text('Create Account')), SliverToBoxAdapter(child: Image.asset('assets/images/hero.png')), SliverFillRemaining(hasScrollBody: false, child: FormContent()), ], ) Это прямой ответ на требование спринта 3: «если контент не помещается, прокручивается картинка, а надпись Create Account остаётся сверху». Картинки Image.asset('assets/images/logo.png', fit: BoxFit.cover); Image.network(url, fit: BoxFit.cover); // без кэша! Для кэширования сетевых изображений используйте cached_network_image (подробно в разделе спринта 4). Внутри пакета (UIKit) ресурсы подключаются с параметром package : Image.asset('assets/eye.png', package: 'uikit'); Без него приложение будет искать файл в своих assets и не найдёт. Что нужно уметь Подключить шрифт и ресурсы в pubspec.yaml . Собрать форму с валидацией и показом пароля. Выбрать нужный способ навигации. Открыть BottomSheet и системные пикеры даты и времени. Подробно: форма регистрации по шагам Задача из спринта 3: экран «Регистрация» с проверкой email, показом пароля, ошибкой и прокруткой. Каркас: Scaffold → SafeArea → прокручиваемая область. Закреплённый заголовок: CustomScrollView с SliverAppBar(pinned: true) . Картинка сверху: SliverToBoxAdapter . Форма: Form + TextFormField для email и пароля, кнопка. Логика: контроллеры, валидатор, isLoading , вызов регистрации. Ошибки сети: SnackBar на 5 секунд. Логи: нажатие кнопки (INFO), запрос (INFO/DEBUG/ERROR). Future\u003cvoid> _submit() async { AppLog.info('RegisterScreen', 'Нажатие', 'Кнопка «Create Account»'); if (!_formKey.currentState!.validate()) return; // показали ошибки валидации setState(() => _loading = true); try { await controller.register(_email.text.trim(), _password.text); if (!mounted) return; Navigator.of(context).pushReplacementNamed('/landing'); } on ApiException catch (e) { if (mounted) showError(context, e.message); } finally { if (mounted) setState(() => _loading = false); } } Эксперту важно увидеть: ошибку при некорректном email, кнопку, которая блокируется во время запроса, и то, что при маленькой высоте экрана форма прокручивается, а заголовок остаётся. Подробно: как устроена навигация Navigator хранит стек экранов, как стопку бумаг. push кладёт новый экран сверху: пользователь может вернуться. pop убирает верхний экран. pushReplacement заменяет верхний (после Splash возвращаться некуда). pushAndRemoveUntil(..., (r) => false) очищает весь стек и кладёт один экран (после Success открыть Landing, а назад чтобы нельзя). Передача данных: // вперёд: через конструктор Navigator.push(context, MaterialPageRoute(builder: (_) => CombatInfoScreen(gameId: game.id))); // назад: результат pop final picked = await Navigator.push\u003cString>(context, MaterialPageRoute(builder: (_) => const PickerScreen())); Именованные маршруты с аргументами удобны для сохранения последнего экрана: Navigator.pushNamed(context, '/combat', arguments: game.id); // в onGenerateRoute читаем settings.arguments Кнопка «назад» на Android: PopScope перехватывает её, например, в игре. PopScope( canPop: false, onPopInvokedWithResult: (didPop, _) { if (!didPop) _confirmExit(); }, child: ..., ) Подробно: ресурсы и шрифты — где ошибаются Чек-лист «картинка/шрифт не отображается»: Файл лежит в папке, указанной в pubspec.yaml ( assets: ). Для папки пишут assets/images/ (со слэшем на конце). Отступы в pubspec.yaml точные, без табуляции. После изменения выполнен flutter pub get и полный перезапуск приложения. Имя файла в коде совпадает с настоящим, включая регистр и расширение. Для файлов внутри пакета указан package: 'имя_пакета' . Шрифт: у каждого начертания weight и файл соответствуют друг другу. В TextStyle указан fontFamily (или шрифт задан в теме). Иконки в формате SVG во Flutter по умолчанию не поддерживаются, нужен пакет flutter_svg . Если пакета нет в списке разрешённых, экспортируйте иконки из Figma в PNG ( @2x и @3x ) или используйте Icons.* . Подробно: списки и прокрутка Задача Виджет Небольшая страница, которая может не поместиться SingleChildScrollView(child: Column(...)) Длинный список одинаковых элементов ListView.builder(itemCount: n, itemBuilder: ...) Сетка карточек GridView.count / GridView.builder Список + закреплённый заголовок + разные блоки CustomScrollView + Sliver* Горизонтальная прокрутка ListView(scrollDirection: Axis.horizontal) ListView.builder создаёт элементы лениво (только видимые), поэтому быстрый и экономит память. Для экрана Discover Combats используйте именно его. Для пустого списка добавьте отдельное состояние («Игр пока нет»). ListView.separated( padding: const EdgeInsets.symmetric(horizontal: 20), itemCount: games.length, separatorBuilder: (_, __) => const SizedBox(height: 12), itemBuilder: (_, i) => GameCard(game: games[i], onTap: () => open(games[i])), ) Подробно: анимации для меню и переходов Для задания достаточно простых неявных анимаций : меняете значение, Flutter плавно анимирует. AnimatedContainer( duration: const Duration(milliseconds: 250), curve: Curves.easeOut, width: selected ? 24 : 8, decoration: BoxDecoration(color: selected ? green : grey, borderRadius: BorderRadius.circular(4)), ) AnimatedSlide( offset: open ? Offset.zero : const Offset(-1, 0), // -1 = целиком за левым краем duration: const Duration(milliseconds: 250), child: const MenuPanel(), ) AnimatedOpacity(opacity: visible ? 1 : 0, duration: const Duration(milliseconds: 200), child: widget) Для меню слева с закрытием по свайпу: GestureDetector( onHorizontalDragEnd: (d) { if ((d.primaryVelocity ?? 0) \u003c 0) closeMenu(); }, // свайп влево child: ..., ) Но проще и надёжнее стандартный Drawer (он уже умеет анимацию и свайп). Практика Соберите форму входа: два поля, показ пароля, кнопка, ошибка, SnackBar. Откройте экран, передайте в него id , верните результат назад. Сделайте экран со списком из 50 элементов на ListView.builder с состоянием «пусто». Подключите свой шрифт и проверьте разные начертания. Сделайте индикатор страниц UiPagination с AnimatedContainer . ", "hours": 5, "minutes": 7}, {"id": "adaptive", "stage": 3, "title": "Адаптивная верстка и Figma", "lead": "Как перенести макет в код так, чтобы он выглядел одинаково на разных экранах. Это самый дорогой по баллам навык.", "html": "\u003ch2>Что требует задание\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Требование\u003c/th>\n\u003cth>Как проверять у себя\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Нет большого пустого пространства\u003c/td>\n\u003ctd>Запустите на самом широком и самом высоком эмуляторе\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Элементы не искажаются\u003c/td>\n\u003ctd>У аватарок, превью и иконок зафиксировано соотношение сторон\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Всё на месте и в границах\u003c/td>\n\u003ctd>Нет горизонтального скролла, CTA-кнопки видны\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Отступы пропорциональны макету\u003c/td>\n\u003ctd>Либо масштабируются, либо фиксированы (если так в дизайн-системе)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Шрифты из макета\u003c/td>\n\u003ctd>Не системные, размеры и межстрочные как в Figma\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Текст не режется блоком\u003c/td>\n\u003ctd>\u003ccode>maxLines\u003c/code> + \u003ccode>TextOverflow.ellipsis\u003c/code>, перенос строк\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Инструменты Flutter\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final size = MediaQuery.sizeOf(context);          // размер экрана\nfinal padding = MediaQuery.paddingOf(context);    // вырезы и системные панели\n\nLayoutBuilder(\n  builder: (context, constraints) {\n    final isCompact = constraints.maxWidth &lt; 360;\n    return isCompact ? const SmallLayout() : const NormalLayout();\n  },\n)\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Инструмент\u003c/th>\n\u003cth>Для чего\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>SafeArea\u003c/code>\u003c/td>\n\u003ctd>Отступ от выреза камеры и жестовой панели\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Expanded\u003c/code> / \u003ccode>Flexible\u003c/code>\u003c/td>\n\u003ctd>Растянуть элемент на оставшееся место\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>AspectRatio\u003c/code>\u003c/td>\n\u003ctd>Фиксированное соотношение сторон (аватарка, превью)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>FittedBox\u003c/code>\u003c/td>\n\u003ctd>Вписать содержимое в блок\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>ConstrainedBox(constraints: BoxConstraints(maxWidth: 480))\u003c/code>\u003c/td>\n\u003ctd>Ограничить ширину на планшетах\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Spacer\u003c/code>\u003c/td>\n\u003ctd>Гибкая пустота между элементами\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>FractionallySizedBox\u003c/code>\u003c/td>\n\u003ctd>Размер в долях от родителя\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Wrap\u003c/code>\u003c/td>\n\u003ctd>Перенос в несколько строк\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Масштабирование от макета (подход «vize»)\u003c/h2>\n\u003cp>В вашем коде размеры считаются от размера макета: \u003ccode>Vize.init(context, figmaWidth: 390, figmaHeight: 884)\u003c/code>, дальше \u003ccode>16.fw\u003c/code>, \u003ccode>24.fh\u003c/code>, \u003ccode>8.r\u003c/code>. Идея простая: коэффициент равен \u003ccode>ширина экрана / ширина макета\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Scale {\n  static late double _w, _h;\n  static void init(BuildContext c, {double figmaW = 390, double figmaH = 884}) {\n    final s = MediaQuery.sizeOf(c);\n    _w = s.width / figmaW;\n    _h = s.height / figmaH;\n  }\n  static double w(double v) =&gt; v * _w;   // ширины и горизонтальные отступы\n  static double h(double v) =&gt; v * _h;   // высоты и вертикальные отступы\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Размеры вида \u003ccode>width: 350.fw\u003c/code> для блоков, которые должны тянуться, — риск. На планшете блок останется «колонкой» посередине. Для основного контента чаще лучше \u003ccode>double.infinity\u003c/code> + горизонтальные отступы, а числа из Figma использовать для отступов, радиусов, иконок и высот. Фиксируйте только то, что должно быть фиксировано (аватар 60×60 с \u003ccode>AspectRatio\u003c/code>).\u003c/p>\n\u003c/div>\n\u003ch2>Перенос макета в код\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Откройте макет, включите \u003cstrong>Dev Mode\u003c/strong> (режим разработчика) — там видны размеры, отступы, цвета и параметры шрифта.\u003c/li>\n\u003cli>Определите \u003cstrong>сетку\u003c/strong> экрана: боковые поля (обычно 20 или 24), шаг (8 px).\u003c/li>\n\u003cli>Идите сверху вниз: каркас (\u003ccode>Scaffold\u003c/code>, \u003ccode>AppBar\u003c/code>, \u003ccode>BottomBar\u003c/code>) → секции → детали.\u003c/li>\n\u003cli>Повторяющееся выносите в UIKit-компоненты.\u003c/li>\n\u003cli>Проверьте на трёх размерах: маленький телефон (≈360×640), обычный (≈390×844), большой (≈430×932 и планшет).\u003c/li>\n\u003c/ol>\n\u003ch2>Состояния компонентов\u003c/h2>\n\u003cp>Дизайн-система описывает не только «покой». Для каждого компонента проверьте:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Компонент\u003c/th>\n\u003cth>Состояния\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Кнопка\u003c/td>\n\u003ctd>default, pressed, disabled, loading; primary / secondary / destructive\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Поле ввода\u003c/td>\n\u003ctd>default, focused, filled, error, disabled; password, search\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Чекбокс\u003c/td>\n\u003ctd>unchecked, checked, disabled (checked и unchecked)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Селект\u003c/td>\n\u003ctd>закрыт, открыт (BottomSheet), выбран, ошибка\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Карточка\u003c/td>\n\u003ctd>обычная, выбранная, неактивная\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Нижнее меню\u003c/td>\n\u003ctd>активный пункт для каждого из пунктов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Таймер\u003c/td>\n\u003ctd>идёт, остановлен, время вышло\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Проверка перед сдачей\u003c/h2>\n\u003cul>\n\u003cli>Запущено минимум на двух эмуляторах разных размеров.\u003c/li>\n\u003cli>Включён увеличенный размер шрифта в системе: текст не ломает раскладку.\u003c/li>\n\u003cli>Повёрнут экран (если макет допускает) либо ориентация зафиксирована.\u003c/li>\n\u003cli>Клавиатура не перекрывает поле (\u003ccode>resizeToAvoidBottomInset\u003c/code>, прокрутка).\u003c/li>\n\u003c/ul>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Объяснить разницу между фиксированным и адаптивным размером.\u003c/li>\n\u003cli>Использовать \u003ccode>LayoutBuilder\u003c/code>, \u003ccode>MediaQuery\u003c/code>, \u003ccode>AspectRatio\u003c/code>, \u003ccode>Expanded\u003c/code>.\u003c/li>\n\u003cli>Снять размеры из Figma и перевести стили текста в \u003ccode>TextStyle\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: из Figma в код — таблица соответствия\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>В Figma\u003c/th>\n\u003cth>Во Flutter\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Frame (кадр)\u003c/td>\n\u003ctd>\u003ccode>Container\u003c/code> / \u003ccode>SizedBox\u003c/code> / \u003ccode>Scaffold\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Auto layout, вертикальный\u003c/td>\n\u003ctd>\u003ccode>Column\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Auto layout, горизонтальный\u003c/td>\n\u003ctd>\u003ccode>Row\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Gap (расстояние между элементами)\u003c/td>\n\u003ctd>\u003ccode>Column(spacing: n)\u003c/code> или \u003ccode>SizedBox(height: n)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Padding\u003c/td>\n\u003ctd>\u003ccode>Padding(padding: EdgeInsets...)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Fill container (растянуть)\u003c/td>\n\u003ctd>\u003ccode>Expanded\u003c/code> или \u003ccode>double.infinity\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Hug contents (по содержимому)\u003c/td>\n\u003ctd>\u003ccode>mainAxisSize: MainAxisSize.min\u003c/code>, без фиксированного размера\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Fixed width/height\u003c/td>\n\u003ctd>\u003ccode>SizedBox(width:, height:)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Corner radius\u003c/td>\n\u003ctd>\u003ccode>BorderRadius.circular(r)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Stroke\u003c/td>\n\u003ctd>\u003ccode>Border.all(color:, width:)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Drop shadow\u003c/td>\n\u003ctd>\u003ccode>BoxShadow(color:, blurRadius:, offset:)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Text style\u003c/td>\n\u003ctd>\u003ccode>TextStyle(fontSize, fontWeight, height = lineHeight/fontSize, letterSpacing)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Constraints (pin left/right)\u003c/td>\n\u003ctd>\u003ccode>Positioned\u003c/code>, \u003ccode>Align\u003c/code>, \u003ccode>Stack\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Component variants\u003c/td>\n\u003ctd>Параметры или enum в виджете\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Разница между Fixed, Hug и Fill — основа адаптивности: \u003cstrong>Fixed\u003c/strong> не меняется на разных экранах, \u003cstrong>Hug\u003c/strong> подстраивается под содержимое, \u003cstrong>Fill\u003c/strong> растягивается. Смотрите, какой режим выбрал дизайнер, и повторяйте.\u003c/p>\n\u003ch2>Подробно: разбор карточки игры\u003c/h2>\n\u003cp>Допустим, в макете карточка шириной 350 (экран 390), внутри слева аватар 48×48, в центре название и время, справа статус.\u003c/p>\n\u003cp>Как собрать:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Container(\n  width: double.infinity,                 // Fill: на любом экране занимает всю ширину\n  padding: const EdgeInsets.all(16),      // фиксированные отступы из макета\n  decoration: BoxDecoration(\n    color: Colors.white,\n    borderRadius: BorderRadius.circular(12),\n    border: Border.all(color: border),\n  ),\n  child: Row(\n    children: [\n      SizedBox(\n        width: 48,\n        child: AspectRatio(aspectRatio: 1, child: ClipOval(child: avatar)), // не искажается\n      ),\n      const SizedBox(width: 12),\n      Expanded(                            // середина тянется\n        child: Column(\n          crossAxisAlignment: CrossAxisAlignment.start,\n          children: [\n            Text(title, maxLines: 1, overflow: TextOverflow.ellipsis, style: subheader),\n            Text(time, style: bodySmall),\n          ],\n        ),\n      ),\n      const SizedBox(width: 12),\n      StatusChip(status: status),          // справа фиксированный по содержимому\n    ],\n  ),\n)\u003c/code>\u003c/pre>\n\u003cp>Порядок рассуждения: что должно тянуться? (середина, Expanded) Что фиксировано? (аватар, статус) Что делать с длинным текстом? (многоточие). Карточка всегда на всю ширину, значит нет «пустоты» на широких экранах.\u003c/p>\n\u003ch2>Подробно: как проверять адаптивность\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Создайте \u003cstrong>минимум три эмулятора\u003c/strong> разного размера (маленький 360×640, обычный 390×844, большой/планшет).\u003c/li>\n\u003cli>Пройдите все экраны на самом маленьком: ищите жёлто-чёрные полосы overflow.\u003c/li>\n\u003cli>Пройдите на самом большом: ищите узкие «колонки» с пустыми полями по бокам.\u003c/li>\n\u003cli>Включите \u003cstrong>большой шрифт\u003c/strong> в настройках Android: текст не должен ломать вёрстку.\u003c/li>\n\u003cli>Откройте клавиатуру в полях ввода: кнопки и поля не должны перекрываться; форма должна прокручиваться.\u003c/li>\n\u003cli>Сравните скриншот со скриншотом макета: отступы, радиусы, цвета, шрифты.\u003c/li>\n\u003c/ol>\n\u003cp>В Android Studio можно менять размер окна эмулятора и плотность. Для быстрой проверки используйте \u003ccode>MediaQuery.sizeOf(context)\u003c/code> в логе: \u003ccode>AppLog.debug('Screen', 'Размер', '${size.width}x${size.height}')\u003c/code>.\u003c/p>\n\u003ch2>Практика\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Соберите по макету любую карточку и проверьте на трёх эмуляторах.\u003c/li>\n\u003cli>Сделайте вариант, где при узком экране карточки идут в одну колонку, а при широком в две (\u003ccode>LayoutBuilder\u003c/code>).\u003c/li>\n\u003cli>Составьте для своего UIKit таблицу «компонент → какие размеры фиксированы, какие тянутся».\u003c/li>\n\u003cli>Проверьте экран входа с клавиатурой и большим шрифтом.\u003c/li>\n\u003c/ol>\n", "text": " Что требует задание Требование Как проверять у себя Нет большого пустого пространства Запустите на самом широком и самом высоком эмуляторе Элементы не искажаются У аватарок, превью и иконок зафиксировано соотношение сторон Всё на месте и в границах Нет горизонтального скролла, CTA-кнопки видны Отступы пропорциональны макету Либо масштабируются, либо фиксированы (если так в дизайн-системе) Шрифты из макета Не системные, размеры и межстрочные как в Figma Текст не режется блоком maxLines + TextOverflow.ellipsis , перенос строк Инструменты Flutter final size = MediaQuery.sizeOf(context); // размер экрана final padding = MediaQuery.paddingOf(context); // вырезы и системные панели LayoutBuilder( builder: (context, constraints) { final isCompact = constraints.maxWidth \u003c 360; return isCompact ? const SmallLayout() : const NormalLayout(); }, ) Инструмент Для чего SafeArea Отступ от выреза камеры и жестовой панели Expanded / Flexible Растянуть элемент на оставшееся место AspectRatio Фиксированное соотношение сторон (аватарка, превью) FittedBox Вписать содержимое в блок ConstrainedBox(constraints: BoxConstraints(maxWidth: 480)) Ограничить ширину на планшетах Spacer Гибкая пустота между элементами FractionallySizedBox Размер в долях от родителя Wrap Перенос в несколько строк Масштабирование от макета (подход «vize») В вашем коде размеры считаются от размера макета: Vize.init(context, figmaWidth: 390, figmaHeight: 884) , дальше 16.fw , 24.fh , 8.r . Идея простая: коэффициент равен ширина экрана / ширина макета . class Scale { static late double _w, _h; static void init(BuildContext c, {double figmaW = 390, double figmaH = 884}) { final s = MediaQuery.sizeOf(c); _w = s.width / figmaW; _h = s.height / figmaH; } static double w(double v) => v * _w; // ширины и горизонтальные отступы static double h(double v) => v * _h; // высоты и вертикальные отступы } Размеры вида width: 350.fw для блоков, которые должны тянуться, — риск. На планшете блок останется «колонкой» посередине. Для основного контента чаще лучше double.infinity + горизонтальные отступы, а числа из Figma использовать для отступов, радиусов, иконок и высот. Фиксируйте только то, что должно быть фиксировано (аватар 60×60 с AspectRatio ). Перенос макета в код Откройте макет, включите Dev Mode (режим разработчика) — там видны размеры, отступы, цвета и параметры шрифта. Определите сетку экрана: боковые поля (обычно 20 или 24), шаг (8 px). Идите сверху вниз: каркас ( Scaffold , AppBar , BottomBar ) → секции → детали. Повторяющееся выносите в UIKit-компоненты. Проверьте на трёх размерах: маленький телефон (≈360×640), обычный (≈390×844), большой (≈430×932 и планшет). Состояния компонентов Дизайн-система описывает не только «покой». Для каждого компонента проверьте: Компонент Состояния Кнопка default, pressed, disabled, loading; primary / secondary / destructive Поле ввода default, focused, filled, error, disabled; password, search Чекбокс unchecked, checked, disabled (checked и unchecked) Селект закрыт, открыт (BottomSheet), выбран, ошибка Карточка обычная, выбранная, неактивная Нижнее меню активный пункт для каждого из пунктов Таймер идёт, остановлен, время вышло Проверка перед сдачей Запущено минимум на двух эмуляторах разных размеров. Включён увеличенный размер шрифта в системе: текст не ломает раскладку. Повёрнут экран (если макет допускает) либо ориентация зафиксирована. Клавиатура не перекрывает поле ( resizeToAvoidBottomInset , прокрутка). Что нужно уметь Объяснить разницу между фиксированным и адаптивным размером. Использовать LayoutBuilder , MediaQuery , AspectRatio , Expanded . Снять размеры из Figma и перевести стили текста в TextStyle . Подробно: из Figma в код — таблица соответствия В Figma Во Flutter Frame (кадр) Container / SizedBox / Scaffold Auto layout, вертикальный Column Auto layout, горизонтальный Row Gap (расстояние между элементами) Column(spacing: n) или SizedBox(height: n) Padding Padding(padding: EdgeInsets...) Fill container (растянуть) Expanded или double.infinity Hug contents (по содержимому) mainAxisSize: MainAxisSize.min , без фиксированного размера Fixed width/height SizedBox(width:, height:) Corner radius BorderRadius.circular(r) Stroke Border.all(color:, width:) Drop shadow BoxShadow(color:, blurRadius:, offset:) Text style TextStyle(fontSize, fontWeight, height = lineHeight/fontSize, letterSpacing) Constraints (pin left/right) Positioned , Align , Stack Component variants Параметры или enum в виджете Разница между Fixed, Hug и Fill — основа адаптивности: Fixed не меняется на разных экранах, Hug подстраивается под содержимое, Fill растягивается. Смотрите, какой режим выбрал дизайнер, и повторяйте. Подробно: разбор карточки игры Допустим, в макете карточка шириной 350 (экран 390), внутри слева аватар 48×48, в центре название и время, справа статус. Как собрать: Container( width: double.infinity, // Fill: на любом экране занимает всю ширину padding: const EdgeInsets.all(16), // фиксированные отступы из макета decoration: BoxDecoration( color: Colors.white, borderRadius: BorderRadius.circular(12), border: Border.all(color: border), ), child: Row( children: [ SizedBox( width: 48, child: AspectRatio(aspectRatio: 1, child: ClipOval(child: avatar)), // не искажается ), const SizedBox(width: 12), Expanded( // середина тянется child: Column( crossAxisAlignment: CrossAxisAlignment.start, children: [ Text(title, maxLines: 1, overflow: TextOverflow.ellipsis, style: subheader), Text(time, style: bodySmall), ], ), ), const SizedBox(width: 12), StatusChip(status: status), // справа фиксированный по содержимому ], ), ) Порядок рассуждения: что должно тянуться? (середина, Expanded) Что фиксировано? (аватар, статус) Что делать с длинным текстом? (многоточие). Карточка всегда на всю ширину, значит нет «пустоты» на широких экранах. Подробно: как проверять адаптивность Создайте минимум три эмулятора разного размера (маленький 360×640, обычный 390×844, большой/планшет). Пройдите все экраны на самом маленьком: ищите жёлто-чёрные полосы overflow. Пройдите на самом большом: ищите узкие «колонки» с пустыми полями по бокам. Включите большой шрифт в настройках Android: текст не должен ломать вёрстку. Откройте клавиатуру в полях ввода: кнопки и поля не должны перекрываться; форма должна прокручиваться. Сравните скриншот со скриншотом макета: отступы, радиусы, цвета, шрифты. В Android Studio можно менять размер окна эмулятора и плотность. Для быстрой проверки используйте MediaQuery.sizeOf(context) в логе: AppLog.debug('Screen', 'Размер', '${size.width}x${size.height}') . Практика Соберите по макету любую карточку и проверьте на трёх эмуляторах. Сделайте вариант, где при узком экране карточки идут в одну колонку, а при широком в две ( LayoutBuilder ). Составьте для своего UIKit таблицу «компонент → какие размеры фиксированы, какие тянутся». Проверьте экран входа с клавиатурой и большим шрифтом. ", "hours": 4, "minutes": 6}, {"id": "git", "stage": 4, "title": "Git, канбан и пакеты", "lead": "Ветка на спринт, коммиты, pull request, теги версий и подключение библиотек из Git.", "html": "\u003ch2>Зачем Git на чемпионате\u003c/h2>\n\u003cul>\n\u003cli>Работа \u003cstrong>сдаётся только через репозиторий\u003c/strong>; если проект не собирается из него, оценки нет.\u003c/li>\n\u003cli>Эксперты проверяют версию, сохранённую в \u003cstrong>вашей ветке спринта\u003c/strong>.\u003c/li>\n\u003cli>Карточку задачи нужно перенести в «Готово к тестированию» и указать \u003cstrong>хэш коммита\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch2>Основные команды\u003c/h2>\n\u003cpre class=\"bash\">\u003ccode>git clone &lt;url&gt;                 # получить репозиторий\ngit status                      # что изменилось\ngit add .                       # подготовить все изменения\ngit commit -m &quot;feat: экран регистрации&quot;\ngit push                        # отправить на сервер\ngit pull                        # получить изменения\ngit log --oneline               # история, видно хэши коммитов\u003c/code>\u003c/pre>\n\u003ch2>Рабочий цикл спринта\u003c/h2>\n\u003cpre class=\"bash\">\u003ccode>git checkout main\ngit pull\ngit checkout -b sprint-1        # создали ветку для спринта\n\n# ... работа, несколько коммитов, по одному на задачу ...\ngit add .\ngit commit -m &quot;feat(uikit): button with all states&quot;\ngit push -u origin sprint-1     # первая отправка ветки\n\n# в конце спринта: pull request sprint-1 -&gt; main, затем merge\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Критерий из таблицы\u003c/th>\n\u003cth>Что сделать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Создана ветка для спринта\u003c/td>\n\u003ctd>\u003ccode>git checkout -b sprint-N\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Проект сохранён в ветку и не требует разархивирования\u003c/td>\n\u003ctd>Код лежит в репозитории, \u003cstrong>не zip-файл\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Выполнен merge / pull request в \u003ccode>main\u003c/code>\u003c/td>\n\u003ctd>PR создан через веб-интерфейс, смёржен и закрыт\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"tip\">\n\u003cp>Делайте \u003cstrong>один коммит на задачу\u003c/strong> (карточку). Тогда хэш коммита в карточке однозначно показывает, где выполнена задача. Хэш смотрите в \u003ccode>git log --oneline\u003c/code>.\u003c/p>\n\u003c/div>\n\u003ch2>Канбан\u003c/h2>\n\u003cpre>\u003ccode>Готово к разработке -&gt; В работе (не более 2) -&gt; Готово к тестированию (+ коммит) -&gt; Завершена (эксперты)\u003c/code>\u003c/pre>\n\u003cp>Типичные потери: больше двух задач в «В работе», карточка не передвинута, коммит не указан, задача сделана позже закрытия спринта.\u003c/p>\n\u003ch2>Файл .gitignore\u003c/h2>\n\u003cp>Не коммитьте \u003ccode>build/\u003c/code>, \u003ccode>.dart_tool/\u003c/code>, \u003ccode>.idea/\u003c/code>, ключи и \u003ccode>local.properties\u003c/code>. Flutter создаёт нужный \u003ccode>.gitignore\u003c/code> сам.\u003c/p>\n\u003ch2>Версионирование библиотек (semver)\u003c/h2>\n\u003cp>Версия \u003ccode>МАЖОР.МИНОР.ПАТЧ\u003c/code>, например \u003ccode>1.2.0\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Часть\u003c/th>\n\u003cth>Когда увеличиваем\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>МАЖОР (1.x.x → 2.0.0)\u003c/td>\n\u003ctd>Несовместимое изменение API\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>МИНОР (1.1.x → 1.2.0)\u003c/td>\n\u003ctd>Новая функция, всё старое работает\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>ПАТЧ (1.2.0 → 1.2.1)\u003c/td>\n\u003ctd>Исправление ошибки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cpre class=\"bash\">\u003ccode># в pubspec.yaml библиотеки\nversion: 1.0.0\n\ngit tag v1.0.0\ngit push origin v1.0.0\u003c/code>\u003c/pre>\n\u003cp>Описывайте изменения в \u003ccode>CHANGELOG.md\u003c/code> (в вашем шаблоне там пока \u003ccode>TODO: Describe initial release\u003c/code>, замените его реальным текстом).\u003c/p>\n\u003ch2>Подключение библиотеки из Git в приложение\u003c/h2>\n\u003cpre class=\"yaml\">\u003ccode>dependencies:\n  uikit:\n    git:\n      url: https://github.com/&lt;логин&gt;/uikit.git\n      ref: v1.0.0            # тег; можно ветка или хэш коммита\n  network_layer:\n    git:\n      url: https://github.com/&lt;логин&gt;/network_layer.git\n      ref: v1.0.0\u003c/code>\u003c/pre>\n\u003cp>Если библиотеки лежат в папке рядом, для разработки удобно:\u003c/p>\n\u003cpre class=\"yaml\">\u003ccode>dependencies:\n  uikit:\n    path: ../uikit\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>\u003ccode>ref: main\u003c/code> работает, но после каждого изменения библиотеки приложение получит новую версию неожиданно. Для «независимого версионирования» из задания используйте \u003cstrong>теги\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Создать ветку, закоммитить, отправить и смёржить через PR.\u003c/li>\n\u003cli>Найти хэш коммита и вставить его в карточку.\u003c/li>\n\u003cli>Назвать правила semver и поставить тег.\u003c/li>\n\u003cli>Подключить пакет из Git и из локальной папки.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: что такое коммит, ветка и merge\u003c/h2>\n\u003cp>Представьте книгу, которую пишут несколько человек.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Коммит\u003c/strong> — сохранённая «версия страницы» с подписью: что изменили и зачем. К любому коммиту можно вернуться.\u003c/li>\n\u003cli>\u003cstrong>Ветка\u003c/strong> — отдельный черновик. Вы переписываете главу в ветке \u003ccode>sprint-1\u003c/code>, а основной текст (\u003ccode>main\u003c/code>) остаётся нетронутым.\u003c/li>\n\u003cli>\u003cstrong>Merge\u003c/strong> — перенос готовых изменений из черновика в основной текст.\u003c/li>\n\u003cli>\u003cstrong>Pull request\u003c/strong> — «прошу проверить мою главу и принять в книгу». На соревновании это обычно просто формальность, но она оценивается.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>main:       A ── B ───────────── M (merge)\n                  \\             /\nsprint-1:          C ── D ── E\u003c/code>\u003c/pre>\n\u003cp>Хороший коммит:\u003c/p>\n\u003cul>\n\u003cli>делает \u003cstrong>одну логическую вещь\u003c/strong> (одна карточка, один экран);\u003c/li>\n\u003cli>имеет понятное описание: \u003ccode>feat(auth): экран авторизации\u003c/code>, \u003ccode>fix(network): обработка таймаута\u003c/code>;\u003c/li>\n\u003cli>не содержит мусора (\u003ccode>build/\u003c/code>, \u003ccode>.idea/\u003c/code>, ключи).\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: pull request пошагово\u003c/h2>\n\u003col type=\"1\">\n\u003cli>В конце спринта убедитесь, что всё закоммичено: \u003ccode>git status\u003c/code> пустой.\u003c/li>\n\u003cli>Отправьте ветку: \u003ccode>git push -u origin sprint-1\u003c/code>.\u003c/li>\n\u003cli>В веб-интерфейсе (GitHub/GitLab/Gitea) нажмите \u003cstrong>Create Pull Request / Merge Request\u003c/strong>.\u003c/li>\n\u003cli>Выберите: \u003cstrong>откуда\u003c/strong> \u003ccode>sprint-1\u003c/code> → \u003cstrong>куда\u003c/strong> \u003ccode>main\u003c/code>.\u003c/li>\n\u003cli>Заполните название («Спринт 1: UIKit») и описание (кратко, что сделано).\u003c/li>\n\u003cli>Нажмите \u003cstrong>Create\u003c/strong>, затем \u003cstrong>Merge\u003c/strong> и подтвердите.\u003c/li>\n\u003cli>Не удаляйте ветку \u003ccode>sprint-1\u003c/code>: эксперту нужно увидеть, что она была.\u003c/li>\n\u003cli>Локально: \u003ccode>git checkout main &amp;&amp; git pull\u003c/code>, затем для следующего спринта: \u003ccode>git checkout -b sprint-2\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>Платформа, которую выдадут организаторы, может отличаться, но идея одна.\u003c/p>\n\u003ch2>Подробно: конфликты слияния\u003c/h2>\n\u003cp>Конфликт возникает, когда две ветки изменили \u003cstrong>одну и ту же строку\u003c/strong>. Git не знает, какую выбрать, и просит вас.\u003c/p>\n\u003cpre>\u003ccode>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\nconst primary = Color(0xFF00C853);\n=======\nconst primary = Color(0xFF00D95F);\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; sprint-2\u003c/code>\u003c/pre>\n\u003cp>Что делать:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Откройте файл, найдите маркеры \u003ccode>&lt;&lt;&lt;&lt;&lt;&lt;&lt;\u003c/code>, \u003ccode>=======\u003c/code>, \u003ccode>&gt;&gt;&gt;&gt;&gt;&gt;&gt;\u003c/code>.\u003c/li>\n\u003cli>Оставьте нужный вариант (или объедините), \u003cstrong>удалите\u003c/strong> все маркеры.\u003c/li>\n\u003cli>\u003ccode>git add &lt;файл&gt;\u003c/code> → \u003ccode>git commit\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>Как избегать: одна ветка на спринт, один человек, не правьте один и тот же файл в двух ветках.\u003c/p>\n\u003ch2>Подробно: типичные проблемы с Git\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Проблема\u003c/th>\n\u003cth>Причина\u003c/th>\n\u003cth>Решение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>fatal: not a git repository\u003c/code>\u003c/td>\n\u003ctd>Вы не в папке проекта\u003c/td>\n\u003ctd>\u003ccode>cd\u003c/code> в папку проекта\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Updates were rejected\u003c/code>\u003c/td>\n\u003ctd>На сервере есть коммиты, которых у вас нет\u003c/td>\n\u003ctd>\u003ccode>git pull --rebase\u003c/code>, затем \u003ccode>git push\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Забыли ветку, работали в \u003ccode>main\u003c/code>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003ccode>git checkout -b sprint-N\u003c/code> (коммиты перейдут вместе)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Закоммитили лишнее\u003c/td>\n\u003ctd>Нет \u003ccode>.gitignore\u003c/code>\u003c/td>\n\u003ctd>Добавить файл в \u003ccode>.gitignore\u003c/code>, \u003ccode>git rm --cached &lt;файл&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>detached HEAD\u003c/code>\u003c/td>\n\u003ctd>Переключились на коммит, а не на ветку\u003c/td>\n\u003ctd>\u003ccode>git checkout sprint-N\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Не пушится: нет доступа\u003c/td>\n\u003ctd>Неверный логин/токен\u003c/td>\n\u003ctd>Уточнить у организаторов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Не помню, что изменилось\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003ccode>git status\u003c/code>, \u003ccode>git diff\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Практика\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Создайте репозиторий, ветку \u003ccode>sprint-1\u003c/code>, три коммита, отправьте, оформите PR и смёржите.\u003c/li>\n\u003cli>Создайте конфликт нарочно (две ветки меняют одну строку) и решите его.\u003c/li>\n\u003cli>Поставьте тег \u003ccode>v1.0.0\u003c/code> и подключите пакет по тегу в другом проекте.\u003c/li>\n\u003cli>Найдите хэш последнего коммита и объясните, зачем он нужен в карточке.\u003c/li>\n\u003c/ol>\n", "text": " Зачем Git на чемпионате Работа сдаётся только через репозиторий ; если проект не собирается из него, оценки нет. Эксперты проверяют версию, сохранённую в вашей ветке спринта . Карточку задачи нужно перенести в «Готово к тестированию» и указать хэш коммита . Основные команды git clone \u003curl> # получить репозиторий git status # что изменилось git add . # подготовить все изменения git commit -m \"feat: экран регистрации\" git push # отправить на сервер git pull # получить изменения git log --oneline # история, видно хэши коммитов Рабочий цикл спринта git checkout main git pull git checkout -b sprint-1 # создали ветку для спринта # ... работа, несколько коммитов, по одному на задачу ... git add . git commit -m \"feat(uikit): button with all states\" git push -u origin sprint-1 # первая отправка ветки # в конце спринта: pull request sprint-1 -> main, затем merge Критерий из таблицы Что сделать Создана ветка для спринта git checkout -b sprint-N Проект сохранён в ветку и не требует разархивирования Код лежит в репозитории, не zip-файл Выполнен merge / pull request в main PR создан через веб-интерфейс, смёржен и закрыт Делайте один коммит на задачу (карточку). Тогда хэш коммита в карточке однозначно показывает, где выполнена задача. Хэш смотрите в git log --oneline . Канбан Готово к разработке -> В работе (не более 2) -> Готово к тестированию (+ коммит) -> Завершена (эксперты) Типичные потери: больше двух задач в «В работе», карточка не передвинута, коммит не указан, задача сделана позже закрытия спринта. Файл .gitignore Не коммитьте build/ , .dart_tool/ , .idea/ , ключи и local.properties . Flutter создаёт нужный .gitignore сам. Версионирование библиотек (semver) Версия МАЖОР.МИНОР.ПАТЧ , например 1.2.0 . Часть Когда увеличиваем МАЖОР (1.x.x → 2.0.0) Несовместимое изменение API МИНОР (1.1.x → 1.2.0) Новая функция, всё старое работает ПАТЧ (1.2.0 → 1.2.1) Исправление ошибки # в pubspec.yaml библиотеки version: 1.0.0 git tag v1.0.0 git push origin v1.0.0 Описывайте изменения в CHANGELOG.md (в вашем шаблоне там пока TODO: Describe initial release , замените его реальным текстом). Подключение библиотеки из Git в приложение dependencies: uikit: git: url: https://github.com/\u003cлогин>/uikit.git ref: v1.0.0 # тег; можно ветка или хэш коммита network_layer: git: url: https://github.com/\u003cлогин>/network_layer.git ref: v1.0.0 Если библиотеки лежат в папке рядом, для разработки удобно: dependencies: uikit: path: ../uikit ref: main работает, но после каждого изменения библиотеки приложение получит новую версию неожиданно. Для «независимого версионирования» из задания используйте теги . Что нужно уметь Создать ветку, закоммитить, отправить и смёржить через PR. Найти хэш коммита и вставить его в карточку. Назвать правила semver и поставить тег. Подключить пакет из Git и из локальной папки. Подробно: что такое коммит, ветка и merge Представьте книгу, которую пишут несколько человек. Коммит — сохранённая «версия страницы» с подписью: что изменили и зачем. К любому коммиту можно вернуться. Ветка — отдельный черновик. Вы переписываете главу в ветке sprint-1 , а основной текст ( main ) остаётся нетронутым. Merge — перенос готовых изменений из черновика в основной текст. Pull request — «прошу проверить мою главу и принять в книгу». На соревновании это обычно просто формальность, но она оценивается. main: A ── B ───────────── M (merge) \\ / sprint-1: C ── D ── E Хороший коммит: делает одну логическую вещь (одна карточка, один экран); имеет понятное описание: feat(auth): экран авторизации , fix(network): обработка таймаута ; не содержит мусора ( build/ , .idea/ , ключи). Подробно: pull request пошагово В конце спринта убедитесь, что всё закоммичено: git status пустой. Отправьте ветку: git push -u origin sprint-1 . В веб-интерфейсе (GitHub/GitLab/Gitea) нажмите Create Pull Request / Merge Request . Выберите: откуда sprint-1 → куда main . Заполните название («Спринт 1: UIKit») и описание (кратко, что сделано). Нажмите Create , затем Merge и подтвердите. Не удаляйте ветку sprint-1 : эксперту нужно увидеть, что она была. Локально: git checkout main && git pull , затем для следующего спринта: git checkout -b sprint-2 . Платформа, которую выдадут организаторы, может отличаться, но идея одна. Подробно: конфликты слияния Конфликт возникает, когда две ветки изменили одну и ту же строку . Git не знает, какую выбрать, и просит вас. \u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD const primary = Color(0xFF00C853); ======= const primary = Color(0xFF00D95F); >>>>>>> sprint-2 Что делать: Откройте файл, найдите маркеры \u003c\u003c\u003c\u003c\u003c\u003c\u003c , ======= , >>>>>>> . Оставьте нужный вариант (или объедините), удалите все маркеры. git add \u003cфайл> → git commit . Как избегать: одна ветка на спринт, один человек, не правьте один и тот же файл в двух ветках. Подробно: типичные проблемы с Git Проблема Причина Решение fatal: not a git repository Вы не в папке проекта cd в папку проекта Updates were rejected На сервере есть коммиты, которых у вас нет git pull --rebase , затем git push Забыли ветку, работали в main git checkout -b sprint-N (коммиты перейдут вместе) Закоммитили лишнее Нет .gitignore Добавить файл в .gitignore , git rm --cached \u003cфайл> detached HEAD Переключились на коммит, а не на ветку git checkout sprint-N Не пушится: нет доступа Неверный логин/токен Уточнить у организаторов Не помню, что изменилось git status , git diff Практика Создайте репозиторий, ветку sprint-1 , три коммита, отправьте, оформите PR и смёржите. Создайте конфликт нарочно (две ветки меняют одну строку) и решите его. Поставьте тег v1.0.0 и подключите пакет по тегу в другом проекте. Найдите хэш последнего коммита и объясните, зачем он нужен в карточке. ", "hours": 2, "minutes": 5}, {"id": "architecture", "stage": 5, "title": "Архитектура, SOLID и DRY", "lead": "Слои Domain, Presentation, Data. Принципы, по которым эксперты ставят баллы за архитектуру.", "html": "\u003ch2>Зачем архитектура\u003c/h2>\n\u003cp>Требование задания: \u003cstrong>«изменение бизнес-логики или представления одного экрана не должно повлечь изменений на других экранах»\u003c/strong>. Для этого код делится на слои, а слои зависят друг от друга только в одну сторону.\u003c/p>\n\u003ch2>Три слоя\u003c/h2>\n\u003cpre>\u003ccode>Presentation  ---&gt;  Domain  &lt;---  Data\n(экраны, state)    (ядро)        (API, БД, DTO)\u003c/code>\u003c/pre>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Слой\u003c/th>\n\u003cth>Что внутри\u003c/th>\n\u003cth>Что нельзя\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>Domain\u003c/strong>\u003c/td>\n\u003ctd>Entities, UseCases, интерфейсы репозиториев, доменные ошибки\u003c/td>\n\u003ctd>Импортировать Flutter, \u003ccode>http\u003c/code>, DTO, виджеты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>Presentation\u003c/strong>\u003c/td>\n\u003ctd>Screens, Controller / ViewModel / Bloc, виджеты, мапперы Domain→UI\u003c/td>\n\u003ctd>Знать про DTO и реализацию репозитория\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>Data\u003c/strong>\u003c/td>\n\u003ctd>Реализации репозиториев, DataSource (remote/local), DTO, мапперы DTO↔︎Entity\u003c/td>\n\u003ctd>Знать про экраны\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Критерии А: «Слой DOMAIN не содержит других слоёв», то же для PRESENTATION и DATA. Проверка простая: откройте импорты файлов слоя. \u003ccode>domain\u003c/code> не должен импортировать \u003ccode>presentation\u003c/code> и \u003ccode>data\u003c/code>.\u003c/p>\n\u003ch2>Пример структуры\u003c/h2>\n\u003cpre>\u003ccode>lib/\n  main.dart\n  common/                       # общее: константы, утилиты, DI\n    di.dart\n    constants.dart\n  domain/\n    entities/\n      game.dart\n      player.dart\n    repositories/\n      game_repository.dart      # abstract interface class\n    usecases/\n      create_game.dart\n      get_games.dart\n    exceptions/\n      domain_exception.dart\n  data/\n    dto/\n      game_dto.dart\n    mappers/\n      game_mapper.dart          # DTO &lt;-&gt; Entity\n    datasources/\n      game_remote_source.dart   # через абстракцию сетевого слоя\n      session_local_source.dart # SharedPreferences\n    repositories/\n      game_repository_impl.dart\n  presentation/\n    screens/\n      auth/\n        login_screen.dart\n        login_controller.dart\n      landing/ ...\n    widgets/\u003c/code>\u003c/pre>\n\u003ch2>Как слои общаются (на примере «Создать игру»)\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// domain/entities/game.dart\nclass Game {\n  final String id;\n  final String title;\n  final DateTime startAt;\n  const Game({required this.id, required this.title, required this.startAt});\n}\n\n// domain/repositories/game_repository.dart\nabstract interface class GameRepository {\n  Future&lt;Game&gt; createGame({required String title, required DateTime startAt});\n  Future&lt;List&lt;Game&gt;&gt; getGames();\n}\n\n// domain/usecases/create_game.dart\nclass CreateGame {\n  final GameRepository _repo;\n  CreateGame(this._repo);\n  Future&lt;Game&gt; call({required String title, required DateTime startAt}) {\n    if (startAt.isBefore(DateTime.now())) {\n      throw const DomainException(&#39;Время начала в прошлом&#39;);\n    }\n    return _repo.createGame(title: title, startAt: startAt);\n  }\n}\n\n// data/repositories/game_repository_impl.dart\nclass GameRepositoryImpl implements GameRepository {\n  final GameRemoteSource _remote;\n  GameRepositoryImpl(this._remote);\n  @override\n  Future&lt;Game&gt; createGame({required String title, required DateTime startAt}) async {\n    final dto = await _remote.create(title: title, startAt: startAt);\n    return GameMapper.toEntity(dto);\n  }\n  ...\n}\n\n// presentation/screens/schedule/schedule_controller.dart\nclass ScheduleController extends ChangeNotifier {\n  final CreateGame _createGame;\n  bool loading = false;\n  String? error;\n  ScheduleController(this._createGame);\n\n  Future&lt;bool&gt; publish(String title, DateTime startAt) async {\n    loading = true; notifyListeners();\n    try {\n      await _createGame(title: title, startAt: startAt);\n      return true;\n    } on DomainException catch (e) {\n      error = e.message;\n      return false;\n    } finally {\n      loading = false; notifyListeners();\n    }\n  }\n}\u003c/code>\u003c/pre>\n\u003ch2>Управление состоянием\u003c/h2>\n\u003cp>Задание не требует конкретного пакета. Выбирайте то, что умеете быстро и безошибочно.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Подход\u003c/th>\n\u003cth>Плюсы\u003c/th>\n\u003cth>Минусы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>ChangeNotifier\u003c/code> + \u003ccode>ListenableBuilder\u003c/code>\u003c/td>\n\u003ctd>Не нужны пакеты\u003c/td>\n\u003ctd>Больше ручной работы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>GetX (\u003ccode>GetxController\u003c/code>, \u003ccode>Obx\u003c/code>)\u003c/td>\n\u003ctd>Быстро, DI и навигация в комплекте\u003c/td>\n\u003ctd>Легко смешать слои, нужно дисциплины\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Provider\u003c/td>\n\u003ctd>Просто и привычно\u003c/td>\n\u003ctd>Нужен пакет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Bloc / Cubit\u003c/td>\n\u003ctd>Строгая структура, тестируемость\u003c/td>\n\u003ctd>Больше кода\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Состояние экрана удобно описывать \u003ccode>sealed\u003c/code>-классом: \u003ccode>Loading\u003c/code>, \u003ccode>Data\u003c/code>, \u003ccode>Error\u003c/code>.\u003c/p>\n\u003ch2>Внедрение зависимостей (DI)\u003c/h2>\n\u003cp>Контроллер получает зависимость \u003cstrong>через конструктор\u003c/strong>, а не создаёт сам.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// common/di.dart: единственное место, где знают реализации\nfinal ApiClient api = HttpApiClient(baseUrl: Env.baseUrl);\nfinal GameRepository gameRepo = GameRepositoryImpl(GameRemoteSource(api));\nfinal createGame = CreateGame(gameRepo);\u003c/code>\u003c/pre>\n\u003ch2>SOLID на примерах\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Принцип\u003c/th>\n\u003cth>Нарушение\u003c/th>\n\u003cth>Как правильно\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>S\u003c/strong> Одна ответственность\u003c/td>\n\u003ctd>\u003ccode>LoginScreen\u003c/code> сам парсит JSON и ходит в сеть\u003c/td>\n\u003ctd>Экран → контроллер → UseCase → репозиторий\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>O\u003c/strong> Открыто/закрыто\u003c/td>\n\u003ctd>\u003ccode>if (type == 'primary') ... else if ...\u003c/code> в кнопке\u003c/td>\n\u003ctd>Параметры/фабрики вариантов; новые варианты без правки базового кода\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>L\u003c/strong> Подстановка Лисков\u003c/td>\n\u003ctd>\u003ccode>SecondaryButton\u003c/code> ломает поведение \u003ccode>Button\u003c/code>\u003c/td>\n\u003ctd>Наследники не меняют контракт\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>I\u003c/strong> Разделение интерфейсов\u003c/td>\n\u003ctd>Один \u003ccode>Api\u003c/code> с 30 методами\u003c/td>\n\u003ctd>\u003ccode>AuthApi\u003c/code>, \u003ccode>GameApi\u003c/code>, \u003ccode>ProfileApi\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>D\u003c/strong> Инверсия зависимостей\u003c/td>\n\u003ctd>Экран создаёт \u003ccode>http.Client()\u003c/code>\u003c/td>\n\u003ctd>Зависеть от \u003ccode>ApiClient\u003c/code> (абстракция), реализацию подставляет DI\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>DRY: что обычно дублируют\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Место\u003c/th>\n\u003cth>Дублирование\u003c/th>\n\u003cth>Решение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>UIKit\u003c/td>\n\u003ctd>Пять одинаковых \u003ccode>OutlineInputBorder(...)\u003c/code>\u003c/td>\n\u003ctd>Один приватный метод \u003ccode>_border(Color)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>UIKit\u003c/td>\n\u003ctd>Три одинаковых пункта нижнего меню\u003c/td>\n\u003ctd>Список данных + \u003ccode>map\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Стили\u003c/td>\n\u003ctd>\u003ccode>fontSize: 16\u003c/code> повторяется в \u003ccode>copyWith\u003c/code>\u003c/td>\n\u003ctd>Добавить стиль в типографику\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сеть\u003c/td>\n\u003ctd>\u003ccode>try/catch\u003c/code> в каждом запросе\u003c/td>\n\u003ctd>Один обработчик ошибок в клиенте\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Экраны\u003c/td>\n\u003ctd>Одинаковый показ SnackBar ошибки\u003c/td>\n\u003ctd>Один общий метод/виджет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Константы\u003c/td>\n\u003ctd>URL и ключи в нескольких местах\u003c/td>\n\u003ctd>Один конфиг\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Что нужно уметь\u003c/h2>\n\u003cul>\n\u003cli>Нарисовать схему слоёв и показать направление зависимостей.\u003c/li>\n\u003cli>Создать сущность, интерфейс репозитория, UseCase, реализацию и контроллер.\u003c/li>\n\u003cli>Объяснить каждую букву SOLID на своём коде.\u003c/li>\n\u003cli>Найти и убрать дублирование.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: путь данных на примере кнопки «Войти»\u003c/h2>\n\u003cp>Проследим, что происходит от нажатия до ответа, и \u003cstrong>в каком слое\u003c/strong> живёт каждый шаг.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 40%\" />\n\u003ccol style=\"width: 30%\" />\n\u003ccol style=\"width: 30%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth style=\"text-align: right;\">Шаг\u003c/th>\n\u003cth>Слой\u003c/th>\n\u003cth>Что происходит\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>Presentation\u003c/td>\n\u003ctd>\u003ccode>LoginScreen\u003c/code>: нажатие кнопки, лог INFO, валидация формы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003ctd>Presentation\u003c/td>\n\u003ctd>\u003ccode>LoginController.login(email, password)\u003c/code> включает \u003ccode>loading\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd>Domain\u003c/td>\n\u003ctd>\u003ccode>LoginUseCase\u003c/code>: правила («пароль не пустой»), вызывает \u003ccode>AuthRepository\u003c/code> (интерфейс)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">4\u003c/td>\n\u003ctd>Data\u003c/td>\n\u003ctd>\u003ccode>AuthRepositoryImpl\u003c/code>: вызывает \u003ccode>AuthRemoteSource\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">5\u003c/td>\n\u003ctd>Data\u003c/td>\n\u003ctd>\u003ccode>AuthRemoteSource\u003c/code>: вызывает \u003ccode>AuthApi\u003c/code> из сетевой библиотеки (через абстракцию)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">6\u003c/td>\n\u003ctd>Сетевая библиотека\u003c/td>\n\u003ctd>\u003ccode>HttpApiClient\u003c/code>: запрос на сервер, обработка ошибок\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">7\u003c/td>\n\u003ctd>Data\u003c/td>\n\u003ctd>Ответ превращается из \u003ccode>UserDto\u003c/code> в \u003ccode>User\u003c/code> (маппер)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">8\u003c/td>\n\u003ctd>Domain→Presentation\u003c/td>\n\u003ctd>\u003ccode>User\u003c/code> возвращается контроллеру\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">9\u003c/td>\n\u003ctd>Presentation\u003c/td>\n\u003ctd>Сохранение токена, переход на Landing; при ошибке SnackBar на 5 секунд\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Стрелки зависимостей: Presentation → Domain ← Data. Domain \u003cstrong>ничего не импортирует\u003c/strong> ни из Presentation, ни из Data.\u003c/p>\n\u003ch2>Подробно: как сделать, чтобы слои были «чистыми»\u003c/h2>\n\u003cp>Критерий: «Слой DOMAIN не содержит других слоёв» (1 балл за каждый слой в спринтах 3 и 4).\u003c/p>\n\u003cp>Проверка за минуту:\u003c/p>\n\u003cpre class=\"bash\">\u003ccode># в Domain не должно быть импортов Data, Presentation, flutter, http\ngrep -rnE &quot;import .*(presentation|data|flutter|http)&quot; lib/domain\n\n# в Presentation не должно быть импортов Data\ngrep -rn &quot;import .*data/&quot; lib/presentation\n\n# в Data не должно б
