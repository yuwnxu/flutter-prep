политика, соглашение, сессия, последний экран Перезапустить приложение Фото профиля (4,0 в модуле Д) Галерея и камера, фото сменяется Проверить на устройстве Комментарии и логи Шапки, методы, логи Скрипт-проверка Подробно: алгоритм «последний экран» без ошибок Требование: после перезапуска приложение открывает тот экран, где пользователь остановился. У каждого маршрута есть имя ( '/landing' , '/schedule' , '/profile' ). NavigatorObserver записывает имя в SharedPreferences при открытии и закрытии маршрутов. SplashScreen (или main ) читает last_route и открывает его, если есть токен . Для экранов с параметрами ( gameId ) сохраняйте аргумент отдельным ключом. После выхода из аккаунта last_route стирается. Пограничные случаи, о которых забывают: Случай Что делать Последний экран — Splash или онбординг Не сохранять эти маршруты Нет токена, но есть last_route Открыть вход Экран игры в процессе Не восстанавливать игру, а засчитать поражение (спринты 4–5) Сохранённый gameId больше не существует Показать ошибку и открыть Landing Подробно: слои для экрана авторизации (структура файлов) lib/ common/di.dart domain/ entities/user.dart repositories/auth_repository.dart usecases/login.dart usecases/register.dart exceptions/domain_exception.dart data/ datasources/auth_remote_source.dart datasources/session_local_source.dart mappers/user_mapper.dart repositories/auth_repository_impl.dart presentation/ screens/login/login_screen.dart screens/login/login_controller.dart screens/register/register_screen.dart screens/register/register_controller.dart widgets/error_snackbar.dart Пошагово: User (Entity) без зависимостей. AuthRepository (абстрактный интерфейс). LoginUseCase и RegisterUseCase . AuthRemoteSource вызывает AuthApi из сетевой библиотеки. UserMapper . AuthRepositoryImpl . Контроллеры экранов. Экраны. di.dart собирает всё в одном месте. Каждая шапка файла: описание, дата, номер. Подробно: меню слева — вариант без Drawer Если макет требует нестандартного вида, сделайте свою панель: Stack(children: [ content, if (open) GestureDetector(onTap: close, child: Container(color: Colors.black54)), // затемнение AnimatedSlide( offset: open ? Offset.zero : const Offset(-1, 0), duration: const Duration(milliseconds: 250), curve: Curves.easeOut, child: GestureDetector( onHorizontalDragEnd: (d) { if ((d.primaryVelocity ?? 0) \u003c 0) close(); }, child: SizedBox(width: MediaQuery.sizeOf(context).width * 0.8, child: const MenuPanel()), ), ), ]) Обязательно: крестик внутри панели вызывает close() ; тап по затемнению тоже закрывает; свайп влево закрывает. Подробно: фото профиля — полный сценарий Нажатие на «Фото» → лог INFO → BottomSheet «Галерея / Камера». ImagePicker().pickImage(source: ...) . Пользователь отменил → null → ничего не делать. Загрузка фото на сервер (запрос «изменение профиля»), если API это поддерживает; либо сохранить локально (путь в SharedPreferences ). Обновить аватар на экране (через контроллер), показать индикатор загрузки. Ошибки сети — SnackBar на 5 секунд. Отказ в разрешении — понятное сообщение, приложение не падает. Манифесты (Android: CAMERA ; iOS: NSCameraUsageDescription , NSPhotoLibraryUsageDescription ) настройте заранее на симуляции , чтобы на соревновании не искать. Репетиция спринта 3 Соберите экраны Splash → Onboarding → Регистрация → Вход → Landing по макету (любому). Проведите проверку «перезапуск приложения на каждом экране». Проверьте grep-скриптом слои. Запишите в заметках симуляции всё, что вызвало вопросы. ", "hours": 6, "minutes": 10}, {"id": "sprint4", "stage": 6, "title": "Спринт 4: бои, игроки, статистика, Image", "lead": "1 ч. Самый дорогой спринт: 25,55 балла. Список игр, детали, профиль соперника, графики и первая игра.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 27%\" />\n\u003ccol style=\"width: 36%\" />\n\u003ccol style=\"width: 36%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Задача\u003c/th>\n\u003cth style=\"text-align: right;\">Верстка\u003c/th>\n\u003cth style=\"text-align: right;\">Сеть\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Discover Combats (все созданные и прошедшие игры)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20 + 0,05\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Combat Information, вход в игру, если нет соперника\u003c/td>\n\u003ctd style=\"text-align: right;\">0,90 + 0,10\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Player Information (из Most Popular Players)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Statistics: Earnings, Played Games, Scheduled Games\u003c/td>\n\u003ctd style=\"text-align: right;\">0,80 + 3×0,5\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Игра \u003cstrong>Image\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00 + 0,30\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Автозавершение при сборке пазла\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Победитель — кто быстрее; результаты на сервер\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектура: папки, 3 слоя, SOLID, DRY\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">5,30\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Хранение: последний экран, закрыл игру = проиграл, кэш медиа\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Уведомление за час до игры\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">1,00\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Игра Image вместе с автозавершением и победителем даёт \u003cstrong>6,3 балла\u003c/strong> — это почти четверть всего спринта.\u003c/p>\n\u003ch2>Порядок (60 минут)\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Минуты\u003c/th>\n\u003cth>Что\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>0–5\u003c/td>\n\u003ctd>Ветка \u003ccode>sprint-4\u003c/code>, обновить пакеты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>5–20\u003c/td>\n\u003ctd>Discover Combats + Combat Information (списки и детали — шаблон повторяется)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>20–32\u003c/td>\n\u003ctd>Player Information, Statistics\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>32–52\u003c/td>\n\u003ctd>Игра Image: поле, перемешивание, таймер, победа, отправка результата\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>52–58\u003c/td>\n\u003ctd>Уведомления, кэш\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>58–60\u003c/td>\n\u003ctd>Коммиты, PR, карточки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Если времени мало, реализуйте экраны полностью, а игру сначала \u003cstrong>минимально рабочую\u003c/strong> (сборка → завершение → отправка), а красоту доведите потом.\u003c/p>\n\u003ch2>Список игр и детали\u003c/h2>\n\u003cp>Шаблон экрана с сетью — одинаковый для всех:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>sealed class ScreenState&lt;T&gt; {}\nclass Loading&lt;T&gt; extends ScreenState&lt;T&gt; {}\nclass Loaded&lt;T&gt; extends ScreenState&lt;T&gt; { final T data; Loaded(this.data); }\nclass Failed&lt;T&gt; extends ScreenState&lt;T&gt; { final String message; Failed(this.message); }\u003c/code>\u003c/pre>\n\u003cpre class=\"dart\">\u003ccode>// В контроллере\nFuture&lt;void&gt; load() async {\n  state = Loading();\n  notifyListeners();\n  try {\n    final games = await _getGames();\n    state = Loaded(games);\n  } on ApiException catch (e) {\n    state = Failed(e.message);   // а экран покажет SnackBar на 5 секунд\n  }\n  notifyListeners();\n}\u003c/code>\u003c/pre>\n\u003cp>В интерфейсе: \u003ccode>switch (state) { Loading() =&gt; spinner, Loaded(:final data) =&gt; список, Failed(:final message) =&gt; сообщение + «повторить» }\u003c/code>.\u003c/p>\n\u003cp>Различие «предстоящая» / «прошедшая» игра определяется по времени начала и статусу с сервера. Сравнивайте даты в одном часовом поясе (\u003ccode>toUtc()\u003c/code> либо \u003ccode>toLocal()\u003c/code> везде).\u003c/p>\n\u003cp>\u003cstrong>Combat Information\u003c/strong>: если соперника нет, кнопка «Join» вызывает запрос «подключение к игре», затем переход в игру.\u003c/p>\n\u003ch2>Статистика: кольцевая диаграмма без пакета\u003c/h2>\n\u003cp>Из задания: «Played Games — количество выигранных игр, \u003cstrong>синий круг\u003c/strong> — Circle, \u003cstrong>красный\u003c/strong> — Image». Если нет разрешённого \u003ccode>fl_chart\u003c/code>, нарисуйте сами:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class DonutPainter extends CustomPainter {\n  final List&lt;double&gt; values;     // например [circleWins, imageWins]\n  final List&lt;Color&gt; colors;      // [синий, красный]\n  const DonutPainter(this.values, this.colors);\n\n  @override\n  void paint(Canvas canvas, Size size) {\n    final total = values.fold&lt;double&gt;(0, (a, b) =&gt; a + b);\n    final stroke = size.shortestSide * 0.18;\n    final rect = Offset.zero &amp; size;\n    final area = rect.deflate(stroke / 2);\n    var start = -3.14159 / 2; // начинаем сверху\n\n    for (var i = 0; i &lt; values.length; i++) {\n      final sweep = total == 0 ? 0.0 : values[i] / total * 2 * 3.14159;\n      final paint = Paint()\n        ..color = colors[i]\n        ..style = PaintingStyle.stroke\n        ..strokeWidth = stroke;\n      canvas.drawArc(area, start, sweep, false, paint);\n      start += sweep;\n    }\n  }\n\n  @override\n  bool shouldRepaint(DonutPainter old) =&gt; old.values != values || old.colors != colors;\n}\n\n// использование\nAspectRatio(aspectRatio: 1, child: CustomPaint(painter: DonutPainter([4, 3], [Colors.blue, Colors.red])))\u003c/code>\u003c/pre>\n\u003cp>Три показателя:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Показатель\u003c/th>\n\u003cth>Как считать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>THIS WEEK EARNINGS\u003c/td>\n\u003ctd>Сумма баллов за текущую неделю из статистики игрока\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Played Games\u003c/td>\n\u003ctd>Количество выигранных игр по категориям Circle и Image\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Scheduled Games\u003c/td>\n\u003ctd>Количество созданных игр за текущую неделю\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Начало недели:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final now = DateTime.now();\nfinal monday = DateTime(now.year, now.month, now.day).subtract(Duration(days: now.weekday - 1));\u003c/code>\u003c/pre>\n\u003ch2>Игра Image: идея и каркас\u003c/h2>\n\u003cp>В макете и прототипе Figma посмотрите механику (в тексте задания: «логику можно посмотреть в режиме прототипа»): картинка режется на части, части перемешаны, игрок переставляет их, пока картинка не будет собрана. Время идёт, как только игра началась.\u003c/p>\n\u003cp>\u003cstrong>Одинаковая картинка у обоих игроков, но разная в каждой игре.\u003c/strong> Значит, выбор картинки и порядок перемешивания должны зависеть от того, что \u003cstrong>одинаково у обоих игроков\u003c/strong>, то есть от \u003ccode>id\u003c/code> игры:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>import &#39;dart:math&#39;;\n\n// Список возможных картинок\nconst images = [&#39;assets/img/1.jpg&#39;, &#39;assets/img/2.jpg&#39;, &#39;assets/img/3.jpg&#39;];\n\n// seed — число-идентификатор игры (например, id с сервера)\nString pickImage(int seed) =&gt; images[Random(seed).nextInt(images.length)];\n\nList&lt;int&gt; shuffleTiles(int count, int seed) {\n  final order = List&lt;int&gt;.generate(count, (i) =&gt; i);\n  order.shuffle(Random(seed));\n  return order;\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Не используйте \u003ccode>string.hashCode\u003c/code> как seed, если он должен совпасть на разных устройствах: значение не гарантируется одинаковым между запусками и платформами. Берите числовой \u003ccode>id\u003c/code> игры, либо превращайте строку в число вручную (сумма кодов символов).\u003c/p>\n\u003c/div>\n\u003cp>Состояние игры в одном месте (контроллер/Cubit):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class ImageGameController extends ChangeNotifier {\n  final int size;                    // сетка size × size\n  late List&lt;int&gt; tiles;              // tiles[позиция] = номер части\n  int moves = 0;\n  final Stopwatch _watch = Stopwatch();\n\n  ImageGameController({required this.size, required int seed}) {\n    tiles = shuffleTiles(size * size, seed);\n  }\n\n  void start() =&gt; _watch.start();\n\n  // Меняет местами две части и проверяет, собрана ли картинка\n  void swap(int a, int b) {\n    final t = tiles[a]; tiles[a] = tiles[b]; tiles[b] = t;\n    moves++;\n    notifyListeners();\n    if (isSolved) _finish();\n  }\n\n  // Картинка собрана, если каждая часть на своём месте\n  bool get isSolved {\n    for (var i = 0; i &lt; tiles.length; i++) {\n      if (tiles[i] != i) return false;\n    }\n    return true;\n  }\n\n  Duration get elapsed =&gt; _watch.elapsed;\n\n  Future&lt;void&gt; _finish() async {\n    _watch.stop();\n    // отправить результат на сервер: время и победитель определяются сервером/сравнением\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Отображение частей из одной картинки:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Показать часть картинки: Align + ClipRect + увеличенное изображение\nClipRect(\n  child: Align(\n    alignment: Alignment(-1 + 2 * col / (size - 1), -1 + 2 * row / (size - 1)),\n    widthFactor: 1 / size,\n    heightFactor: 1 / size,\n    child: Image.asset(path, fit: BoxFit.cover),\n  ),\n)\u003c/code>\u003c/pre>\n\u003cp>Для перетаскивания используйте \u003ccode>Draggable\u003c/code> + \u003ccode>DragTarget\u003c/code> или \u003ccode>GestureDetector\u003c/code> с двумя нажатиями «выбрать-поменять». Начните с двух нажатий: надёжнее и быстрее, потом улучшайте.\u003c/p>\n\u003cp>Каждое движение и отправку позже придётся отправить в метрику (спринт 6), поэтому сразу делайте метод \u003ccode>onMove()\u003c/code> одним местом.\u003c/p>\n\u003ch2>Автозавершение и победитель\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Как только \u003ccode>isSolved == true\u003c/code>, игра \u003cstrong>сама\u003c/strong> завершается: таймер стоп, экран блокируется, результат улетает на сервер («сохранение результата игры»).\u003c/li>\n\u003cli>Победитель — кто собрал быстрее. Сравнение делайте так, как описывает API: либо сервер возвращает победителя, либо вы сравниваете \u003ccode>time\u003c/code> обоих игроков.\u003c/li>\n\u003cli>Экран результата: время игрока, время соперника, победа/поражение.\u003c/li>\n\u003c/ol>\n\u003cp>Данные по играм должны попасть на сервер, иначе статистика не заполнится.\u003c/p>\n\u003ch2>Закрытие игры = поражение\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>class _GameScreenState extends State&lt;GameScreen&gt; with WidgetsBindingObserver {\n  bool _finished = false;\n\n  @override\n  void didChangeAppLifecycleState(AppLifecycleState state) {\n    // Если приложение свернули или закрыли во время игры — засчитываем поражение\n    if (!_finished &amp;&amp; (state == AppLifecycleState.paused || state == AppLifecycleState.detached)) {\n      _lose();\n    }\n  }\n\n  Future&lt;void&gt; _lose() async {\n    _finished = true;\n    await controller.reportLose();   // запрос «сохранение результата игры»\n  }\n  ...\n}\u003c/code>\u003c/pre>\n\u003cp>Дополнительно:\u003c/p>\n\u003cul>\n\u003cli>Кнопка «назад» внутри игры — через \u003ccode>PopScope\u003c/code>: диалог «Выйти? Вы проиграете» и \u003ccode>_lose()\u003c/code> при согласии.\u003c/li>\n\u003cli>Сохраните в \u003ccode>SharedPreferences\u003c/code> флаг \u003ccode>active_game_id\u003c/code> при старте игры и убирайте при завершении. При запуске приложения, если флаг остался (приложение убили), отправьте поражение.\u003c/li>\n\u003c/ul>\n\u003ch2>Кэширование медиа\u003c/h2>\n\u003cp>«Все медиа ресурсы должны кэшироваться». Аватары, картинки игр:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>CachedNetworkImage(\n  imageUrl: player.photoUrl,\n  fit: BoxFit.cover,\n  placeholder: (_, __) =&gt; const ColoredBox(color: UiColors.border),\n  errorWidget: (_, __, ___) =&gt; const Icon(Icons.person),\n)\u003c/code>\u003c/pre>\n\u003cp>Проверьте: включите авиарежим, откройте экран, который уже открывали: картинки должны остаться.\u003c/p>\n\u003ch2>Локальное уведомление за 1 час\u003c/h2>\n\u003cp>Если в Schedule Game стояла галка, при создании игры (и при загрузке списка, если приложение переустановили) планируйте уведомление.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>final plugin = FlutterLocalNotificationsPlugin();\n\nFuture&lt;void&gt; initNotifications() async {\n  tz.initializeTimeZones();                       // пакет timezone\n  tz.setLocalLocation(tz.getLocation(&#39;Asia/Yekaterinburg&#39;)); // или flutter_timezone\n  const settings = InitializationSettings(\n    android: AndroidInitializationSettings(&#39;@mipmap/ic_launcher&#39;),\n    iOS: DarwinInitializationSettings(),          // запросит разрешение на iOS\n  );\n  await plugin.initialize(settings);\n  // Android 13+: запросить разрешение на показ\n  await plugin\n      .resolvePlatformSpecificImplementation&lt;AndroidFlutterLocalNotificationsPlugin&gt;()\n      ?.requestNotificationsPermission();\n}\n\nFuture&lt;void&gt; scheduleReminder(Game game) async {\n  final when = game.startAt.subtract(const Duration(hours: 1));\n  if (when.isBefore(DateTime.now())) return;      // уже поздно\n  await plugin.zonedSchedule(\n    game.id.hashCode,                             // id уведомления\n    &#39;Скоро игра&#39;,\n    &#39;Через час: ${game.title}&#39;,\n    tz.TZDateTime.from(when, tz.local),\n    const NotificationDetails(\n      android: AndroidNotificationDetails(&#39;games&#39;, &#39;Игры&#39;),\n      iOS: DarwinNotificationDetails(),\n    ),\n    androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,\n  );\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>Сигнатуры \u003ccode>flutter_local_notifications\u003c/code> отличаются между версиями (например, у старых версий был обязательный параметр \u003ccode>uiLocalNotificationDateInterpretation\u003c/code>). Заранее создайте тестовый проект и проверьте с той версией, которую вам согласуют. Также нужны права в \u003ccode>AndroidManifest.xml\u003c/code>: \u003ccode>POST_NOTIFICATIONS\u003c/code>, \u003ccode>SCHEDULE_EXACT_ALARM\u003c/code> (или \u003ccode>USE_EXACT_ALARM\u003c/code>) и ресиверы из README пакета.\u003c/p>\n\u003c/div>\n\u003cp>Для проверки в тесте можно временно поставить интервал в одну минуту.\u003c/p>\n\u003ch2>Частые ошибки\u003c/h2>\n\u003cul>\n\u003cli>Картинка у соперников разная: использовали \u003ccode>Random()\u003c/code> без seed.\u003c/li>\n\u003cli>Игра не завершается, потому что \u003ccode>isSolved\u003c/code> проверяется только при отпускании пальца.\u003c/li>\n\u003cli>Секундомер продолжает идти после победы или ухода с экрана (забыли \u003ccode>dispose\u003c/code>/\u003ccode>stop\u003c/code>).\u003c/li>\n\u003cli>Результат не отправляется в сеть при сворачивании.\u003c/li>\n\u003cli>\u003ccode>DateTime\u003c/code> в UTC сравнивают с локальным.\u003c/li>\n\u003c/ul>\n\u003ch2>Максимальный балл: критерий за критерием\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Критерий (макс.)\u003c/th>\n\u003cth>Что сделать точно\u003c/th>\n\u003cth>Проверка\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Discover Combats (1,2 + 0,05)\u003c/td>\n\u003ctd>Список созданных и прошедших игр, карточки по макету, тап по предстоящей → Combat Information\u003c/td>\n\u003ctd>Список пустой, с данными, с ошибкой\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Combat Information (0,9 + 0,1)\u003c/td>\n\u003ctd>Детали игры; если соперника нет, кнопка «войти в игру»\u003c/td>\n\u003ctd>Игра без соперника\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Player Information (1,2)\u003c/td>\n\u003ctd>Открывается из «Most Popular Players», данные игрока\u003c/td>\n\u003ctd>Переход с Landing\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Statistics (0,8)\u003c/td>\n\u003ctd>Экран по макету, открывается из меню и Landing, данные текущего пользователя\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>THIS WEEK EARNINGS (0,5)\u003c/td>\n\u003ctd>Сумма очков за неделю\u003c/td>\n\u003ctd>Сверить с данными сервера\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Played Games (0,5)\u003c/td>\n\u003ctd>Число выигранных, синий — Circle, красный — Image\u003c/td>\n\u003ctd>Диаграмма отражает данные\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Scheduled Games (0,5)\u003c/td>\n\u003ctd>Созданные за неделю\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Игра Image (2,0) + одинаковая картинка (0,3)\u003c/td>\n\u003ctd>Пазл по прототипу; seed из id игры\u003c/td>\n\u003ctd>У двух игроков картинка совпадает\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Автозавершение (2,0)\u003c/td>\n\u003ctd>Сразу при сборке: таймер стоп, отправка результата\u003c/td>\n\u003ctd>Не нужно жать «готово»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Победитель, результаты на сервер (2,0)\u003c/td>\n\u003ctd>Быстрее — победил; результат ушёл на сервер\u003c/td>\n\u003ctd>В статистике появились данные\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Сеть: пять экранов (по 1,2)\u003c/td>\n\u003ctd>Через абстракцию, ошибка на 5 секунд\u003c/td>\n\u003ctd>Отключить интернет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Папки и слои (0,3 + 1,0×3)\u003c/td>\n\u003ctd>Новые файлы в нужных слоях\u003c/td>\n\u003ctd>grep-проверка\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>SOLID, DRY (по 1,0)\u003c/td>\n\u003ctd>Нет дублей между экранами и играми\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Хранение (1,2)\u003c/td>\n\u003ctd>Последний экран, закрытие игры = поражение, кэш медиа\u003c/td>\n\u003ctd>Свернуть игру\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Уведомление за час (1,0, модуль Д)\u003c/td>\n\u003ctd>Только если стояла галка\u003c/td>\n\u003ctd>Проверка с интервалом в минуту\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: порядок работы в спринте 4 по минутам\u003c/h2>\n\u003cp>Спринт 4 самый дорогой (25,55 балла), поэтому тайм-менеджмент критичен.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Минуты\u003c/th>\n\u003cth>Что\u003c/th>\n\u003cth>Результат\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>0–3\u003c/td>\n\u003ctd>Ветка, обновить пакеты, взять 2 карточки\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>3–15\u003c/td>\n\u003ctd>Domain/Data для игр: UseCase получения списка и деталей\u003c/td>\n\u003ctd>Данные доступны\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>15–27\u003c/td>\n\u003ctd>Discover Combats + Combat Information\u003c/td>\n\u003ctd>Два экрана работают\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>27–35\u003c/td>\n\u003ctd>Player Information\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>35–42\u003c/td>\n\u003ctd>Statistics (кольцевая диаграмма + 3 показателя)\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>42–55\u003c/td>\n\u003ctd>Игра Image: плитки, перемешивание, таймер, победа\u003c/td>\n\u003ctd>Игра завершается\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>55–58\u003c/td>\n\u003ctd>Отправка результата, закрытие = поражение\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>58–60\u003c/td>\n\u003ctd>Коммит каждой карточки, PR\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Если не успеваете, \u003cstrong>пожертвуйте красотой, а не логикой\u003c/strong>: игра, которая завершается и отправляет результат, ценнее красивой, которая не завершается. Уведомления можно сделать на спринте 5, если время остаётся.\u003c/p>\n\u003ch2>Подробно: экран с загрузкой, пустотой и ошибкой\u003c/h2>\n\u003cp>Каждый экран с данными должен корректно показывать \u003cstrong>четыре состояния\u003c/strong>:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Состояние\u003c/th>\n\u003cth>Что показать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Загрузка\u003c/td>\n\u003ctd>Индикатор по центру\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Данные\u003c/td>\n\u003ctd>Контент\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Пусто\u003c/td>\n\u003ctd>Сообщение «Игр пока нет» и (если нужно) кнопка создать\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Ошибка\u003c/td>\n\u003ctd>SnackBar на 5 секунд + возможность повторить\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Эксперт проверяет именно ошибку: отключит интернет и откроет экран. Если приложение упало или показывает белый экран, баллы за сеть теряются.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Widget build(BuildContext context) =&gt; switch (controller.state) {\n  Loading() =&gt; const Center(child: CircularProgressIndicator()),\n  Loaded(:final data) when data.isEmpty =&gt; const EmptyView(&#39;Игр пока нет&#39;),\n  Loaded(:final data) =&gt; GamesList(games: data),\n  Failed(:final message) =&gt; RetryView(message: message, onRetry: controller.load),\n};\u003c/code>\u003c/pre>\n\u003ch2>Подробно: статистика — откуда берутся числа\u003c/h2>\n\u003cp>Статистика строится по \u003cstrong>данным игрока\u003c/strong> и по \u003cstrong>сохранённым результатам игр\u003c/strong> (запросы «Статистика игрока» и «Сохранение результата игры»).\u003c/p>\n\u003col type=\"1\">\n\u003cli>Игрок завершает игру → результат отправляется на сервер (категория, время, победа или поражение, очки).\u003c/li>\n\u003cli>Экран Statistics запрашивает статистику игрока.\u003c/li>\n\u003cli>Приложение показывает: сумму очков за неделю, число побед по категориям, число созданных игр.\u003c/li>\n\u003c/ol>\n\u003cp>Следовательно, \u003cstrong>если результаты игр не сохраняются на сервере, статистика останется пустой\u003c/strong>, и потеряются баллы сразу в нескольких местах. Проверьте порядок: сыграйте игру → откройте Statistics → цифры должны измениться.\u003c/p>\n\u003cp>Если API возвращает сырые данные, а не готовые суммы, считайте их в UseCase (\u003ccode>GetWeeklyStats\u003c/code>), а не в виджете: это бизнес-логика.\u003c/p>\n\u003ch2>Подробно: как проверить игру Image\u003c/h2>\n\u003cp>Чек-лист тестирования на устройстве:\u003c/p>\n\u003cul class=\"task-list\">\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Плитки перемешаны, но пазл решаем.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Каждое нажатие/перетаскивание увеличивает счётчик ходов.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Таймер идёт с первой секунды и останавливается при победе.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />После сборки игра \u003cstrong>сама\u003c/strong> завершается и открывает экран результата.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Результат ушёл на сервер (проверить в статистике).\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />У второго игрока та же картинка и тот же порядок.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Новая игра — другая картинка/порядок.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Сворачивание приложения в игре = поражение.\u003c/label>\u003c/li>\n\u003cli>\u003clabel>\u003cinput type=\"checkbox\" />Нет утечки таймера после выхода с экрана.\u003c/label>\u003c/li>\n\u003c/ul>\n\u003cp>Про «решаем»: при случайной перестановке пазла-перетаскивания (swap) любая перестановка решаема. Для пазла «пятнашки» (с пустой клеткой) половина перестановок нерешаема, так что проверяйте по прототипу, какая механика у вас.\u003c/p>\n\u003ch2>Подробно: уведомления без ошибок\u003c/h2>\n\u003cp>Самые частые проблемы с локальными уведомлениями:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Не запрошено разрешение на Android 13+ → уведомление не появляется.\u003c/li>\n\u003cli>Не настроен часовой пояс (\u003ccode>timezone\u003c/code>) → приходит в другое время.\u003c/li>\n\u003cli>Время в прошлом → ничего не планируется (нужна проверка).\u003c/li>\n\u003cli>Не прописаны права и ресиверы в манифесте.\u003c/li>\n\u003cli>Галка «уведомлять» не сохранена вместе с игрой.\u003c/li>\n\u003c/ol>\n\u003cp>Проверяйте функцию отдельно: временно запланируйте на «через 1 минуту», убедитесь, что приходит, затем верните «за 1 час». В коде оставьте константу \u003ccode>reminderBefore = Duration(hours: 1)\u003c/code> в одном месте.\u003c/p>\n\u003ch2>Репетиция спринта 4\u003c/h2>\n\u003cp>Сыграйте полную цепочку на двух устройствах/эмуляторах: создать игру на одном → открыть на втором → войти → собрать пазл → посмотреть статистику у обоих. Все сбои запишите в заметки симуляции.\u003c/p>\n", "text": " Что нужно сделать Задача Верстка Сеть Discover Combats (все созданные и прошедшие игры) 1,20 + 0,05 1,20 Combat Information, вход в игру, если нет соперника 0,90 + 0,10 1,20 Player Information (из Most Popular Players) 1,20 1,20 Statistics: Earnings, Played Games, Scheduled Games 0,80 + 3×0,5 1,20 Игра Image 2,00 + 0,30 1,20 Автозавершение при сборке пазла 2,00 Победитель — кто быстрее; результаты на сервер 2,00 Архитектура: папки, 3 слоя, SOLID, DRY 5,30 Хранение: последний экран, закрыл игру = проиграл, кэш медиа 1,20 Уведомление за час до игры 1,00 Игра Image вместе с автозавершением и победителем даёт 6,3 балла — это почти четверть всего спринта. Порядок (60 минут) Минуты Что 0–5 Ветка sprint-4 , обновить пакеты 5–20 Discover Combats + Combat Information (списки и детали — шаблон повторяется) 20–32 Player Information, Statistics 32–52 Игра Image: поле, перемешивание, таймер, победа, отправка результата 52–58 Уведомления, кэш 58–60 Коммиты, PR, карточки Если времени мало, реализуйте экраны полностью, а игру сначала минимально рабочую (сборка → завершение → отправка), а красоту доведите потом. Список игр и детали Шаблон экрана с сетью — одинаковый для всех: sealed class ScreenState\u003cT> {} class Loading\u003cT> extends ScreenState\u003cT> {} class Loaded\u003cT> extends ScreenState\u003cT> { final T data; Loaded(this.data); } class Failed\u003cT> extends ScreenState\u003cT> { final String message; Failed(this.message); } // В контроллере Future\u003cvoid> load() async { state = Loading(); notifyListeners(); try { final games = await _getGames(); state = Loaded(games); } on ApiException catch (e) { state = Failed(e.message); // а экран покажет SnackBar на 5 секунд } notifyListeners(); } В интерфейсе: switch (state) { Loading() => spinner, Loaded(:final data) => список, Failed(:final message) => сообщение + «повторить» } . Различие «предстоящая» / «прошедшая» игра определяется по времени начала и статусу с сервера. Сравнивайте даты в одном часовом поясе ( toUtc() либо toLocal() везде). Combat Information : если соперника нет, кнопка «Join» вызывает запрос «подключение к игре», затем переход в игру. Статистика: кольцевая диаграмма без пакета Из задания: «Played Games — количество выигранных игр, синий круг — Circle, красный — Image». Если нет разрешённого fl_chart , нарисуйте сами: class DonutPainter extends CustomPainter { final List\u003cdouble> values; // например [circleWins, imageWins] final List\u003cColor> colors; // [синий, красный] const DonutPainter(this.values, this.colors); @override void paint(Canvas canvas, Size size) { final total = values.fold\u003cdouble>(0, (a, b) => a + b); final stroke = size.shortestSide * 0.18; final rect = Offset.zero & size; final area = rect.deflate(stroke / 2); var start = -3.14159 / 2; // начинаем сверху for (var i = 0; i \u003c values.length; i++) { final sweep = total == 0 ? 0.0 : values[i] / total * 2 * 3.14159; final paint = Paint() ..color = colors[i] ..style = PaintingStyle.stroke ..strokeWidth = stroke; canvas.drawArc(area, start, sweep, false, paint); start += sweep; } } @override bool shouldRepaint(DonutPainter old) => old.values != values || old.colors != colors; } // использование AspectRatio(aspectRatio: 1, child: CustomPaint(painter: DonutPainter([4, 3], [Colors.blue, Colors.red]))) Три показателя: Показатель Как считать THIS WEEK EARNINGS Сумма баллов за текущую неделю из статистики игрока Played Games Количество выигранных игр по категориям Circle и Image Scheduled Games Количество созданных игр за текущую неделю Начало недели: final now = DateTime.now(); final monday = DateTime(now.year, now.month, now.day).subtract(Duration(days: now.weekday - 1)); Игра Image: идея и каркас В макете и прототипе Figma посмотрите механику (в тексте задания: «логику можно посмотреть в режиме прототипа»): картинка режется на части, части перемешаны, игрок переставляет их, пока картинка не будет собрана. Время идёт, как только игра началась. Одинаковая картинка у обоих игроков, но разная в каждой игре. Значит, выбор картинки и порядок перемешивания должны зависеть от того, что одинаково у обоих игроков , то есть от id игры: import 'dart:math'; // Список возможных картинок const images = ['assets/img/1.jpg', 'assets/img/2.jpg', 'assets/img/3.jpg']; // seed — число-идентификатор игры (например, id с сервера) String pickImage(int seed) => images[Random(seed).nextInt(images.length)]; List\u003cint> shuffleTiles(int count, int seed) { final order = List\u003cint>.generate(count, (i) => i); order.shuffle(Random(seed)); return order; } Не используйте string.hashCode как seed, если он должен совпасть на разных устройствах: значение не гарантируется одинаковым между запусками и платформами. Берите числовой id игры, либо превращайте строку в число вручную (сумма кодов символов). Состояние игры в одном месте (контроллер/Cubit): class ImageGameController extends ChangeNotifier { final int size; // сетка size × size late List\u003cint> tiles; // tiles[позиция] = номер части int moves = 0; final Stopwatch _watch = Stopwatch(); ImageGameController({required this.size, required int seed}) { tiles = shuffleTiles(size * size, seed); } void start() => _watch.start(); // Меняет местами две части и проверяет, собрана ли картинка void swap(int a, int b) { final t = tiles[a]; tiles[a] = tiles[b]; tiles[b] = t; moves++; notifyListeners(); if (isSolved) _finish(); } // Картинка собрана, если каждая часть на своём месте bool get isSolved { for (var i = 0; i \u003c tiles.length; i++) { if (tiles[i] != i) return false; } return true; } Duration get elapsed => _watch.elapsed; Future\u003cvoid> _finish() async { _watch.stop(); // отправить результат на сервер: время и победитель определяются сервером/сравнением } } Отображение частей из одной картинки: // Показать часть картинки: Align + ClipRect + увеличенное изображение ClipRect( child: Align( alignment: Alignment(-1 + 2 * col / (size - 1), -1 + 2 * row / (size - 1)), widthFactor: 1 / size, heightFactor: 1 / size, child: Image.asset(path, fit: BoxFit.cover), ), ) Для перетаскивания используйте Draggable + DragTarget или GestureDetector с двумя нажатиями «выбрать-поменять». Начните с двух нажатий: надёжнее и быстрее, потом улучшайте. Каждое движение и отправку позже придётся отправить в метрику (спринт 6), поэтому сразу делайте метод onMove() одним местом. Автозавершение и победитель Как только isSolved == true , игра сама завершается: таймер стоп, экран блокируется, результат улетает на сервер («сохранение результата игры»). Победитель — кто собрал быстрее. Сравнение делайте так, как описывает API: либо сервер возвращает победителя, либо вы сравниваете time обоих игроков. Экран результата: время игрока, время соперника, победа/поражение. Данные по играм должны попасть на сервер, иначе статистика не заполнится. Закрытие игры = поражение class _GameScreenState extends State\u003cGameScreen> with WidgetsBindingObserver { bool _finished = false; @override void didChangeAppLifecycleState(AppLifecycleState state) { // Если приложение свернули или закрыли во время игры — засчитываем поражение if (!_finished && (state == AppLifecycleState.paused || state == AppLifecycleState.detached)) { _lose(); } } Future\u003cvoid> _lose() async { _finished = true; await controller.reportLose(); // запрос «сохранение результата игры» } ... } Дополнительно: Кнопка «назад» внутри игры — через PopScope : диалог «Выйти? Вы проиграете» и _lose() при согласии. Сохраните в SharedPreferences флаг active_game_id при старте игры и убирайте при завершении. При запуске приложения, если флаг остался (приложение убили), отправьте поражение. Кэширование медиа «Все медиа ресурсы должны кэшироваться». Аватары, картинки игр: CachedNetworkImage( imageUrl: player.photoUrl, fit: BoxFit.cover, placeholder: (_, __) => const ColoredBox(color: UiColors.border), errorWidget: (_, __, ___) => const Icon(Icons.person), ) Проверьте: включите авиарежим, откройте экран, который уже открывали: картинки должны остаться. Локальное уведомление за 1 час Если в Schedule Game стояла галка, при создании игры (и при загрузке списка, если приложение переустановили) планируйте уведомление. final plugin = FlutterLocalNotificationsPlugin(); Future\u003cvoid> initNotifications() async { tz.initializeTimeZones(); // пакет timezone tz.setLocalLocation(tz.getLocation('Asia/Yekaterinburg')); // или flutter_timezone const settings = InitializationSettings( android: AndroidInitializationSettings('@mipmap/ic_launcher'), iOS: DarwinInitializationSettings(), // запросит разрешение на iOS ); await plugin.initialize(settings); // Android 13+: запросить разрешение на показ await plugin .resolvePlatformSpecificImplementation\u003cAndroidFlutterLocalNotificationsPlugin>() ?.requestNotificationsPermission(); } Future\u003cvoid> scheduleReminder(Game game) async { final when = game.startAt.subtract(const Duration(hours: 1)); if (when.isBefore(DateTime.now())) return; // уже поздно await plugin.zonedSchedule( game.id.hashCode, // id уведомления 'Скоро игра', 'Через час: ${game.title}', tz.TZDateTime.from(when, tz.local), const NotificationDetails( android: AndroidNotificationDetails('games', 'Игры'), iOS: DarwinNotificationDetails(), ), androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle, ); } Сигнатуры flutter_local_notifications отличаются между версиями (например, у старых версий был обязательный параметр uiLocalNotificationDateInterpretation ). Заранее создайте тестовый проект и проверьте с той версией, которую вам согласуют. Также нужны права в AndroidManifest.xml : POST_NOTIFICATIONS , SCHEDULE_EXACT_ALARM (или USE_EXACT_ALARM ) и ресиверы из README пакета. Для проверки в тесте можно временно поставить интервал в одну минуту. Частые ошибки Картинка у соперников разная: использовали Random() без seed. Игра не завершается, потому что isSolved проверяется только при отпускании пальца. Секундомер продолжает идти после победы или ухода с экрана (забыли dispose / stop ). Результат не отправляется в сеть при сворачивании. DateTime в UTC сравнивают с локальным. Максимальный балл: критерий за критерием Критерий (макс.) Что сделать точно Проверка Discover Combats (1,2 + 0,05) Список созданных и прошедших игр, карточки по макету, тап по предстоящей → Combat Information Список пустой, с данными, с ошибкой Combat Information (0,9 + 0,1) Детали игры; если соперника нет, кнопка «войти в игру» Игра без соперника Player Information (1,2) Открывается из «Most Popular Players», данные игрока Переход с Landing Statistics (0,8) Экран по макету, открывается из меню и Landing, данные текущего пользователя THIS WEEK EARNINGS (0,5) Сумма очков за неделю Сверить с данными сервера Played Games (0,5) Число выигранных, синий — Circle, красный — Image Диаграмма отражает данные Scheduled Games (0,5) Созданные за неделю Игра Image (2,0) + одинаковая картинка (0,3) Пазл по прототипу; seed из id игры У двух игроков картинка совпадает Автозавершение (2,0) Сразу при сборке: таймер стоп, отправка результата Не нужно жать «готово» Победитель, результаты на сервер (2,0) Быстрее — победил; результат ушёл на сервер В статистике появились данные Сеть: пять экранов (по 1,2) Через абстракцию, ошибка на 5 секунд Отключить интернет Папки и слои (0,3 + 1,0×3) Новые файлы в нужных слоях grep-проверка SOLID, DRY (по 1,0) Нет дублей между экранами и играми Хранение (1,2) Последний экран, закрытие игры = поражение, кэш медиа Свернуть игру Уведомление за час (1,0, модуль Д) Только если стояла галка Проверка с интервалом в минуту Подробно: порядок работы в спринте 4 по минутам Спринт 4 самый дорогой (25,55 балла), поэтому тайм-менеджмент критичен. Минуты Что Результат 0–3 Ветка, обновить пакеты, взять 2 карточки 3–15 Domain/Data для игр: UseCase получения списка и деталей Данные доступны 15–27 Discover Combats + Combat Information Два экрана работают 27–35 Player Information 35–42 Statistics (кольцевая диаграмма + 3 показателя) 42–55 Игра Image: плитки, перемешивание, таймер, победа Игра завершается 55–58 Отправка результата, закрытие = поражение 58–60 Коммит каждой карточки, PR Если не успеваете, пожертвуйте красотой, а не логикой : игра, которая завершается и отправляет результат, ценнее красивой, которая не завершается. Уведомления можно сделать на спринте 5, если время остаётся. Подробно: экран с загрузкой, пустотой и ошибкой Каждый экран с данными должен корректно показывать четыре состояния : Состояние Что показать Загрузка Индикатор по центру Данные Контент Пусто Сообщение «Игр пока нет» и (если нужно) кнопка создать Ошибка SnackBar на 5 секунд + возможность повторить Эксперт проверяет именно ошибку: отключит интернет и откроет экран. Если приложение упало или показывает белый экран, баллы за сеть теряются. Widget build(BuildContext context) => switch (controller.state) { Loading() => const Center(child: CircularProgressIndicator()), Loaded(:final data) when data.isEmpty => const EmptyView('Игр пока нет'), Loaded(:final data) => GamesList(games: data), Failed(:final message) => RetryView(message: message, onRetry: controller.load), }; Подробно: статистика — откуда берутся числа Статистика строится по данным игрока и по сохранённым результатам игр (запросы «Статистика игрока» и «Сохранение результата игры»). Игрок завершает игру → результат отправляется на сервер (категория, время, победа или поражение, очки). Экран Statistics запрашивает статистику игрока. Приложение показывает: сумму очков за неделю, число побед по категориям, число созданных игр. Следовательно, если результаты игр не сохраняются на сервере, статистика останется пустой , и потеряются баллы сразу в нескольких местах. Проверьте порядок: сыграйте игру → откройте Statistics → цифры должны измениться. Если API возвращает сырые данные, а не готовые суммы, считайте их в UseCase ( GetWeeklyStats ), а не в виджете: это бизнес-логика. Подробно: как проверить игру Image Чек-лист тестирования на устройстве: Плитки перемешаны, но пазл решаем. Каждое нажатие/перетаскивание увеличивает счётчик ходов. Таймер идёт с первой секунды и останавливается при победе. После сборки игра сама завершается и открывает экран результата. Результат ушёл на сервер (проверить в статистике). У второго игрока та же картинка и тот же порядок. Новая игра — другая картинка/порядок. Сворачивание приложения в игре = поражение. Нет утечки таймера после выхода с экрана. Про «решаем»: при случайной перестановке пазла-перетаскивания (swap) любая перестановка решаема. Для пазла «пятнашки» (с пустой клеткой) половина перестановок нерешаема, так что проверяйте по прототипу, какая механика у вас. Подробно: уведомления без ошибок Самые частые проблемы с локальными уведомлениями: Не запрошено разрешение на Android 13+ → уведомление не появляется. Не настроен часовой пояс ( timezone ) → приходит в другое время. Время в прошлом → ничего не планируется (нужна проверка). Не прописаны права и ресиверы в манифесте. Галка «уведомлять» не сохранена вместе с игрой. Проверяйте функцию отдельно: временно запланируйте на «через 1 минуту», убедитесь, что приходит, затем верните «за 1 час». В коде оставьте константу reminderBefore = Duration(hours: 1) в одном месте. Репетиция спринта 4 Сыграйте полную цепочку на двух устройствах/эмуляторах: создать игру на одном → открыть на втором → войти → собрать пазл → посмотреть статистику у обоих. Все сбои запишите в заметки симуляции. ", "hours": 7, "minutes": 13}, {"id": "sprint5", "stage": 6, "title": "Спринт 5: игра Circle", "lead": "1 ч. Вторая игра, общее завершение и победитель. 11,65 балла.", "html": "\u003ch2>Что нужно сделать\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Задача\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Игра \u003cstrong>Circle\u003c/strong>: собрать круги от большего к меньшему\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Автозавершение после сборки\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Победитель — кто быстрее; результаты на сервер для графиков\u003c/td>\n\u003ctd style=\"text-align: right;\">2,00\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сеть: экран Game Circle через абстракцию\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Архитектура: SOLID, DRY, слои\u003c/td>\n\u003ctd style=\"text-align: right;\">3,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Хранение: последний экран, закрыл игру = проиграл (0,35)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,25\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>В этом спринте самое важное — \u003cstrong>повторно использовать\u003c/strong> то, что сделали для Image: общий контроллер игры, таймер, отправку результата, проверку победителя. Если логика скопирована, вы теряете на DRY.\u003c/p>\n\u003ch2>Общая основа игр\u003c/h2>\n\u003cp>Выделите абстракцию, а две игры сделайте её реализациями (O и L из SOLID):\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// domain/entities/game_category.dart\nenum GameCategory { image, circle }\n\n// Общее поведение любой игры-пазла.\nabstract class PuzzleGame extends ChangeNotifier {\n  final Stopwatch _watch = Stopwatch();\n  bool finished = false;\n\n  bool get isSolved;                 // каждая игра определяет сама\n  void onUserMove();                 // каждая игра определяет сама\n\n  Duration get elapsed =&gt; _watch.elapsed;\n\n  void start() =&gt; _watch.start();\n\n  // Общий шаг: игрок сделал ход, проверяем, не собран ли пазл\n  void afterMove() {\n    notifyListeners();\n    if (!finished &amp;&amp; isSolved) {\n      finished = true;\n      _watch.stop();\n      onFinished(); // отправка результата, переход на экран результата\n    }\n  }\n\n  void onFinished();\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>ImageGameController\u003c/code> и \u003ccode>CircleGameController\u003c/code> наследуют \u003ccode>PuzzleGame\u003c/code> и реализуют только \u003ccode>isSolved\u003c/code> и ходы. Экран результата, отправка в метрику, обработка выхода — общие.\u003c/p>\n\u003ch2>Логика Circle\u003c/h2>\n\u003cp>Цель: расположить круги в порядке от большего к меньшему. Посмотрите в прототипе, как это выглядит: вложенные круги, которые нужно перетащить на места, или набор кругов, который ставят по порядку в стопку. Ниже — универсальная модель «упорядочить по размеру».\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class CircleItem {\n  final int id;\n  final double radius;\n  const CircleItem(this.id, this.radius);\n}\n\nclass CircleGameController extends PuzzleGame {\n  late List&lt;CircleItem&gt; items;       // текущее расположение\n\n  CircleGameController({required int seed, required List&lt;CircleItem&gt; source}) {\n    items = [...source]..shuffle(Random(seed));   // одинаково у обоих игроков\n  }\n\n  // Собрано, если радиусы идут по убыванию\n  @override\n  bool get isSolved {\n    for (var i = 0; i &lt; items.length - 1; i++) {\n      if (items[i].radius &lt; items[i + 1].radius) return false;\n    }\n    return true;\n  }\n\n  @override\n  void onUserMove() =&gt; afterMove();\n\n  // Перемещение круга на новое место\n  void move(int from, int to) {\n    final item = items.removeAt(from);\n    items.insert(to, item);\n    onUserMove();\n  }\n\n  @override\n  void onFinished() {/* отправка результата */}\n}\u003c/code>\u003c/pre>\n\u003cp>Рисование кругов — \u003ccode>Container\u003c/code> с \u003ccode>BoxShape.circle\u003c/code> или \u003ccode>CustomPaint\u003c/code>. Для перетаскивания — \u003ccode>ReorderableListView\u003c/code> (если макет линейный) либо \u003ccode>Draggable\u003c/code> + \u003ccode>DragTarget\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>ReorderableListView(\n  onReorder: (oldIndex, newIndex) {\n    if (newIndex &gt; oldIndex) newIndex -= 1;   // особенность ReorderableListView\n    controller.move(oldIndex, newIndex);\n  },\n  children: [\n    for (final c in controller.items)\n      CircleWidget(key: ValueKey(c.id), radius: c.radius),\n  ],\n)\u003c/code>\u003c/pre>\n\u003ch2>Завершение и победитель\u003c/h2>\n\u003cp>Алгоритм одинаковый для обеих игр:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003ccode>isSolved == true\u003c/code> → таймер остановлен → экран заблокирован.\u003c/li>\n\u003cli>Запрос «сохранение результата» со временем и категорией.\u003c/li>\n\u003cli>Определение победителя (кто быстрее) по правилам API.\u003c/li>\n\u003cli>Экран результата и возврат на Landing.\u003c/li>\n\u003c/ol>\n\u003cp>Данные попадают в статистику: «Played Games» делится на \u003cstrong>Circle (синий)\u003c/strong> и \u003cstrong>Image (красный)\u003c/strong>, поэтому категорию нужно отправлять корректно.\u003c/p>\n\u003ch2>Закрытие игры = поражение\u003c/h2>\n\u003cp>То же, что в спринте 4 (\u003ccode>WidgetsBindingObserver\u003c/code>, \u003ccode>PopScope\u003c/code>, флаг \u003ccode>active_game_id\u003c/code>). Вынесите это в общий миксин для игровых экранов, а не копируйте:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>mixin GameLifecycleMixin&lt;T extends StatefulWidget&gt; on State&lt;T&gt; implements WidgetsBindingObserver {\n  // ... общий код: подписка на lifecycle и вызов onGameAbandoned()\n}\u003c/code>\u003c/pre>\n\u003cp>Если мешает \u003ccode>implements WidgetsBindingObserver\u003c/code>, используйте обычный базовый \u003ccode>State\u003c/code>-класс.\u003c/p>\n\u003ch2>Проверка перед сдачей\u003c/h2>\n\u003cul>\n\u003cli>Играйте две игры подряд, статистика растёт, круги не дублируются.\u003c/li>\n\u003cli>Выйдите из игры: засчитано поражение.\u003c/li>\n\u003cli>Перезапустите приложение посреди игры: вернулись на экран, где были, и не потеряли данные (либо засчитано поражение, если так сказано в карточке).\u003c/li>\n\u003cli>Отключите интернет: ошибка на 5 секунд, приложение живо.\u003c/li>\n\u003cli>Нет дублирования между \u003ccode>ImageGame\u003c/code> и \u003ccode>CircleGame\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2>Если не успеваете\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Сначала сделайте игру без анимации и красоты.\u003c/li>\n\u003cli>Затем экран результата и отправка.\u003c/li>\n\u003cli>Потом перетаскивание и стили.\u003c/li>\n\u003c/ol>\n\u003ch2>Максимальный балл: критерий за критерием\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Критерий (макс.)\u003c/th>\n\u003cth>Что сделать точно\u003c/th>\n\u003cth>Проверка\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Игра Circle (2,0)\u003c/td>\n\u003ctd>Механика по прототипу: круги от большего к меньшему\u003c/td>\n\u003ctd>Собирается, проверка условия верна\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Автозавершение (2,0)\u003c/td>\n\u003ctd>Игра заканчивается сразу при сборке\u003c/td>\n\u003ctd>Без лишних нажатий\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Победитель, данные на сервер (2,0)\u003c/td>\n\u003ctd>Быстрее — победил; результат в API с категорией circle\u003c/td>\n\u003ctd>Статистика (синий) растёт\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сеть Game Circle (1,2)\u003c/td>\n\u003ctd>Всё через абстракцию; ошибка на 5 секунд\u003c/td>\n\u003ctd>Отключить интернет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Папки, слои (по 0,3)\u003c/td>\n\u003ctd>Новые файлы в слоях\u003c/td>\n\u003ctd>grep-проверка\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>SOLID (1,0), DRY (1,0)\u003c/td>\n\u003ctd>Общий базовый класс игр\u003c/td>\n\u003ctd>Нет копий кода Image\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Хранение (1,25)\u003c/td>\n\u003ctd>Последний экран, закрытие игры = поражение (0,35)\u003c/td>\n\u003ctd>Свернуть игру\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Спринт 5 дешевле предыдущих, но \u003cstrong>подводит итог\u003c/strong>: эксперты смотрят, переиспользовали ли вы код. Если Circle скопирован из Image с заменой слов, пострадают DRY и SOLID.\u003c/p>\n\u003ch2>Подробно: что именно выносить в общее\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Общее\u003c/th>\n\u003cth>Где живёт\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Таймер и секундомер\u003c/td>\n\u003ctd>Базовый \u003ccode>PuzzleGame\u003c/code> (Presentation)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Проверка «собрано»\u003c/td>\n\u003ctd>Абстрактный метод \u003ccode>isSolved\u003c/code> — реализует каждая игра\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Завершение, отправка результата\u003c/td>\n\u003ctd>Один UseCase \u003ccode>SubmitGameResult\u003c/code> (Domain)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Экран результата\u003c/td>\n\u003ctd>Один виджет \u003ccode>GameResultScreen\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Закрытие игры = поражение\u003c/td>\n\u003ctd>Один миксин/базовый \u003ccode>State\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>События метрики\u003c/td>\n\u003ctd>Один класс \u003ccode>Analytics\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Проверка победителя\u003c/td>\n\u003ctd>UseCase \u003ccode>DetermineWinner\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Запрос на сервер\u003c/td>\n\u003ctd>Один метод в сетевой библиотеке (категория параметром)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Отличается только: \u003cstrong>как выглядит игра\u003c/strong> и \u003cstrong>как проверить, что она собрана\u003c/strong>. Это и есть принцип открытости/закрытости: добавили новую игру, не трогая старый код.\u003c/p>\n\u003ch2>Подробно: проверка победителя\u003c/h2>\n\u003cp>Разные API работают по-разному, возможны варианты:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Сервер сам определяет победителя\u003c/strong>: вы отправляете результат (время), а потом запрашиваете игру и смотрите поле \u003ccode>winner\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Клиент сравнивает\u003c/strong>: вы получаете результат соперника и сравниваете времена.\u003c/li>\n\u003c/ol>\n\u003cp>В обоих случаях логика сравнения — \u003cstrong>бизнес-правило\u003c/strong>, поэтому оно в Domain:\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>// Определяет победителя: меньшее время побеждает; при отсутствии результата соперника ждём\nWinner determine(Duration mine, Duration? opponent) {\n  if (opponent == null) return Winner.pending;\n  return mine &lt;= opponent ? Winner.me : Winner.opponent;\n}\u003c/code>\u003c/pre>\n\u003cp>Не забудьте экран ожидания, если соперник ещё играет (пока результата нет), и таймаут/повтор запроса.\u003c/p>\n\u003ch2>Подробно: что проверить на финальной репетиции спринта 5\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Полный цикл двух игр подряд.\u003c/li>\n\u003cli>Выход с экрана игры через «назад» = поражение, и это сохранено.\u003c/li>\n\u003cli>Перезапуск приложения в игре.\u003c/li>\n\u003cli>Нет дублирования между \u003ccode>ImageGame\u003c/code> и \u003ccode>CircleGame\u003c/code>: найдите повторяющиеся строки поиском.\u003c/li>\n\u003cli>Итоговая проверка всех шапок и логов скриптом.\u003c/li>\n\u003cli>Merge в \u003ccode>main\u003c/code> и тег (если используете версии приложения).\u003c/li>\n\u003c/ol>\n\u003ch2>Репетиция спринта 5\u003c/h2>\n\u003cp>Сделайте Circle как «добавление» к готовой Image за один час. Если заметили, что приходится копировать, остановитесь и вынесите общее.\u003c/p>\n", "text": " Что нужно сделать Задача Баллы Игра Circle : собрать круги от большего к меньшему 2,00 Автозавершение после сборки 2,00 Победитель — кто быстрее; результаты на сервер для графиков 2,00 Сеть: экран Game Circle через абстракцию 1,20 Архитектура: SOLID, DRY, слои 3,20 Хранение: последний экран, закрыл игру = проиграл (0,35) 1,25 В этом спринте самое важное — повторно использовать то, что сделали для Image: общий контроллер игры, таймер, отправку результата, проверку победителя. Если логика скопирована, вы теряете на DRY. Общая основа игр Выделите абстракцию, а две игры сделайте её реализациями (O и L из SOLID): // domain/entities/game_category.dart enum GameCategory { image, circle } // Общее поведение любой игры-пазла. abstract class PuzzleGame extends ChangeNotifier { final Stopwatch _watch = Stopwatch(); bool finished = false; bool get isSolved; // каждая игра определяет сама void onUserMove(); // каждая игра определяет сама Duration get elapsed => _watch.elapsed; void start() => _watch.start(); // Общий шаг: игрок сделал ход, проверяем, не собран ли пазл void afterMove() { notifyListeners(); if (!finished && isSolved) { finished = true; _watch.stop(); onFinished(); // отправка результата, переход на экран результата } } void onFinished(); } ImageGameController и CircleGameController наследуют PuzzleGame и реализуют только isSolved и ходы. Экран результата, отправка в метрику, обработка выхода — общие. Логика Circle Цель: расположить круги в порядке от большего к меньшему. Посмотрите в прототипе, как это выглядит: вложенные круги, которые нужно перетащить на места, или набор кругов, который ставят по порядку в стопку. Ниже — универсальная модель «упорядочить по размеру». class CircleItem { final int id; final double radius; const CircleItem(this.id, this.radius); } class CircleGameController extends PuzzleGame { late List\u003cCircleItem> items; // текущее расположение CircleGameController({required int seed, required List\u003cCircleItem> source}) { items = [...source]..shuffle(Random(seed)); // одинаково у обоих игроков } // Собрано, если радиусы идут по убыванию @override bool get isSolved { for (var i = 0; i \u003c items.length - 1; i++) { if (items[i].radius \u003c items[i + 1].radius) return false; } return true; } @override void onUserMove() => afterMove(); // Перемещение круга на новое место void move(int from, int to) { final item = items.removeAt(from); items.insert(to, item); onUserMove(); } @override void onFinished() {/* отправка результата */} } Рисование кругов — Container с BoxShape.circle или CustomPaint . Для перетаскивания — ReorderableListView (если макет линейный) либо Draggable + DragTarget . ReorderableListView( onReorder: (oldIndex, newIndex) { if (newIndex > oldIndex) newIndex -= 1; // особенность ReorderableListView controller.move(oldIndex, newIndex); }, children: [ for (final c in controller.items) CircleWidget(key: ValueKey(c.id), radius: c.radius), ], ) Завершение и победитель Алгоритм одинаковый для обеих игр: isSolved == true → таймер остановлен → экран заблокирован. Запрос «сохранение результата» со временем и категорией. Определение победителя (кто быстрее) по правилам API. Экран результата и возврат на Landing. Данные попадают в статистику: «Played Games» делится на Circle (синий) и Image (красный) , поэтому категорию нужно отправлять корректно. Закрытие игры = поражение То же, что в спринте 4 ( WidgetsBindingObserver , PopScope , флаг active_game_id ). Вынесите это в общий миксин для игровых экранов, а не копируйте: mixin GameLifecycleMixin\u003cT extends StatefulWidget> on State\u003cT> implements WidgetsBindingObserver { // ... общий код: подписка на lifecycle и вызов onGameAbandoned() } Если мешает implements WidgetsBindingObserver , используйте обычный базовый State -класс. Проверка перед сдачей Играйте две игры подряд, статистика растёт, круги не дублируются. Выйдите из игры: засчитано поражение. Перезапустите приложение посреди игры: вернулись на экран, где были, и не потеряли данные (либо засчитано поражение, если так сказано в карточке). Отключите интернет: ошибка на 5 секунд, приложение живо. Нет дублирования между ImageGame и CircleGame . Если не успеваете Сначала сделайте игру без анимации и красоты. Затем экран результата и отправка. Потом перетаскивание и стили. Максимальный балл: критерий за критерием Критерий (макс.) Что сделать точно Проверка Игра Circle (2,0) Механика по прототипу: круги от большего к меньшему Собирается, проверка условия верна Автозавершение (2,0) Игра заканчивается сразу при сборке Без лишних нажатий Победитель, данные на сервер (2,0) Быстрее — победил; результат в API с категорией circle Статистика (синий) растёт Сеть Game Circle (1,2) Всё через абстракцию; ошибка на 5 секунд Отключить интернет Папки, слои (по 0,3) Новые файлы в слоях grep-проверка SOLID (1,0), DRY (1,0) Общий базовый класс игр Нет копий кода Image Хранение (1,25) Последний экран, закрытие игры = поражение (0,35) Свернуть игру Спринт 5 дешевле предыдущих, но подводит итог : эксперты смотрят, переиспользовали ли вы код. Если Circle скопирован из Image с заменой слов, пострадают DRY и SOLID. Подробно: что именно выносить в общее Общее Где живёт Таймер и секундомер Базовый PuzzleGame (Presentation) Проверка «собрано» Абстрактный метод isSolved — реализует каждая игра Завершение, отправка результата Один UseCase SubmitGameResult (Domain) Экран результата Один виджет GameResultScreen Закрытие игры = поражение Один миксин/базовый State События метрики Один класс Analytics Проверка победителя UseCase DetermineWinner Запрос на сервер Один метод в сетевой библиотеке (категория параметром) Отличается только: как выглядит игра и как проверить, что она собрана . Это и есть принцип открытости/закрытости: добавили новую игру, не трогая старый код. Подробно: проверка победителя Разные API работают по-разному, возможны варианты: Сервер сам определяет победителя : вы отправляете результат (время), а потом запрашиваете игру и смотрите поле winner . Клиент сравнивает : вы получаете результат соперника и сравниваете времена. В обоих случаях логика сравнения — бизнес-правило , поэтому оно в Domain: // Определяет победителя: меньшее время побеждает; при отсутствии результата соперника ждём Winner determine(Duration mine, Duration? opponent) { if (opponent == null) return Winner.pending; return mine \u003c= opponent ? Winner.me : Winner.opponent; } Не забудьте экран ожидания, если соперник ещё играет (пока результата нет), и таймаут/повтор запроса. Подробно: что проверить на финальной репетиции спринта 5 Полный цикл двух игр подряд. Выход с экрана игры через «назад» = поражение, и это сохранено. Перезапуск приложения в игре. Нет дублирования между ImageGame и CircleGame : найдите повторяющиеся строки поиском. Итоговая проверка всех шапок и логов скриптом. Merge в main и тег (если используете версии приложения). Репетиция спринта 5 Сделайте Circle как «добавление» к готовой Image за один час. Если заметили, что приходится копировать, остановитесь и вынесите общее. ", "hours": 4, "minutes": 6}, {"id": "sprint6", "stage": 6, "title": "Спринт 6: защита и публикация", "lead": "3 ч. Презентация, Яндекс-метрика и подготовка страницы в RuStore. 9 баллов.", "html": "\u003ch2>Что оценивают\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 42%\" />\n\u003ccol style=\"width: 57%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Блок\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Презентация создана (0,4) + 5 обязательных разделов (по 0,2)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,40\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Яндекс-метрика инициализирована\u003c/td>\n\u003ctd style=\"text-align: right;\">1,00\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Сценарий активности в Image + диаграмма в презентации\u003c/td>\n\u003ctd style=\"text-align: right;\">1,20\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Слайды, диаграммы, доклад, ответы на вопросы, поведение\u003c/td>\n\u003ctd style=\"text-align: right;\">3,30\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Публикация: название, иконка, APK, тип, возраст, категория, описания, скриншоты\u003c/td>\n\u003ctd style=\"text-align: right;\">2,10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Всего 9 баллов, из них около 3,3 даёт \u003cstrong>ваше выступление\u003c/strong> (экспертная оценка), остальное проверяется по наличию.\u003c/p>\n\u003ch2>Презентация для разработчиков\u003c/h2>\n\u003cp>Аудитория — разработчики. «Вы не должны продавать приложение!» Показывайте инженерные решения.\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Раздел\u003c/th>\n\u003cth>Что показать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Реализация приложения\u003c/td>\n\u003ctd>Экраны (по 1–2 скриншота), основные сценарии, стек\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Схема классов\u003c/td>\n\u003ctd>Диаграмма (UML): UseCase, Repository, DTO/Entity, Controller, экран\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Производительность\u003c/td>\n\u003ctd>Сценарий «Игра Image»: FPS, время перестановки, память, что сделали для плавности\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Архитектурные решения\u003c/td>\n\u003ctd>Слои, DI, SOLID, почему Clean Architecture, отдельные библиотеки\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Библиотеки\u003c/td>\n\u003ctd>Таблица: пакет → зачем; и \u003cstrong>что не использовали и почему\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Метрика\u003c/td>\n\u003ctd>Скриншот диаграммы активности в Image по событиям\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Структура на 7–8 слайдов:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Название и цель.\u003c/li>\n\u003cli>Стек и состав проекта (приложение + UIKit + сетевая библиотека).\u003c/li>\n\u003cli>Архитектура (схема слоёв).\u003c/li>\n\u003cli>Схема классов.\u003c/li>\n\u003cli>Используемые библиотеки и обоснование.\u003c/li>\n\u003cli>Производительность в сценарии Image.\u003c/li>\n\u003cli>Метрика и диаграмма.\u003c/li>\n\u003cli>Итоги, что улучшили бы.\u003c/li>\n\u003c/ol>\n\u003cp>Диаграмму классов можно нарисовать в Mermaid или любом редакторе:\u003c/p>\n\u003cpre>\u003ccode>GameScreen\n   └─ GameController (Presentation)\n         └─ SubmitResult  — UseCase (Domain)\n               └─ GameRepository  — interface (Domain)\n                     ▲\n        GameRepositoryImpl (Data) ──► ApiClient — interface сетевой библиотеки\n                                           ▲\n                                     HttpApiClient\u003c/code>\u003c/pre>\n\u003ch3>Производительность: что сказать\u003c/h3>\n\u003cul>\n\u003cli>Открыть \u003cstrong>Flutter DevTools → Performance\u003c/strong> и записать сценарий «собрать пазл».\u003c/li>\n\u003cli>Показать, что кадры укладываются в ~16 мс (60 fps) или ~8 мс (120 fps).\u003c/li>\n\u003cli>Что вы сделали: \u003ccode>const\u003c/code> конструкторы, \u003ccode>RepaintBoundary\u003c/code> вокруг плиток, перестройка только нужных виджетов, кэширование картинок, \u003ccode>dispose\u003c/code> таймеров.\u003c/li>\n\u003cli>Запускайте профилирование в режиме \u003ccode>flutter run --profile\u003c/code>, не в debug.\u003c/li>\n\u003c/ul>\n\u003ch2>Яндекс.Метрика (AppMetrica)\u003c/h2>\n\u003cp>Нужны: API-ключ (его выдадут организаторы или создадите в кабинете), пакет \u003ccode>appmetrica_plugin\u003c/code>.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>Future&lt;void&gt; main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await AppMetrica.activate(const AppMetricaConfig(&#39;API_KEY&#39;));\n  runApp(const MyApp());\n}\u003c/code>\u003c/pre>\n\u003cp>События в игре Image: \u003cstrong>каждое движение\u003c/strong> и \u003cstrong>отправка\u003c/strong> результата.\u003c/p>\n\u003cpre class=\"dart\">\u003ccode>class Analytics {\n  static void imageMove(int moveNumber) =&gt;\n      AppMetrica.reportEventWithMap(&#39;image_move&#39;, {&#39;move&#39;: moveNumber});\n\n  static void imageSubmit(int seconds, int moves) =&gt;\n      AppMetrica.reportEventWithMap(&#39;image_submit&#39;, {&#39;seconds&#39;: seconds, &#39;moves&#39;: moves});\n}\n\n// в контроллере игры\nvoid swap(int a, int b) {\n  ...\n  Analytics.imageMove(moves);\n}\u003c/code>\u003c/pre>\n\u003cdiv class=\"warn\">\n\u003cp>API плагина и версии меняются: сверьтесь с README \u003ccode>appmetrica_plugin\u003c/code> и инструкцией для Android/iOS. Событие должно улететь в метрику \u003cstrong>до\u003c/strong> презентации — данные появляются в кабинете с задержкой.\u003c/p>\n\u003c/div>\n\u003cp>Сделайте пару прогонов игры, затем в кабинете откройте отчёт по событиям и сделайте \u003cstrong>скриншот диаграммы\u003c/strong>.\u003c/p>\n\u003ch2>Подготовка к публикации в RuStore\u003c/h2>\n\u003cp>Что понадобится (по критериям):\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Пункт\u003c/th>\n\u003cth style=\"text-align: right;\">Баллы\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Название соответствует заданию\u003c/td>\n\u003ctd style=\"text-align: right;\">0,1\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Иконка приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">0,1\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>APK-файл загружен\u003c/td>\n\u003ctd style=\"text-align: right;\">0,2\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Название для пользователя и тип приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">0,2\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Возрастная категория\u003c/td>\n\u003ctd style=\"text-align: right;\">0,2\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Категория приложения\u003c/td>\n\u003ctd style=\"text-align: right;\">0,1\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Краткое описание\u003c/td>\n\u003ctd style=\"text-align: right;\">0,3\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Основное описание\u003c/td>\n\u003ctd style=\"text-align: right;\">0,6\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Скриншоты (−0,1 за каждый отсутствующий до 5)\u003c/td>\n\u003ctd style=\"text-align: right;\">0,5\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3>Сборка APK с подписью\u003c/h3>\n\u003cpre class=\"bash\">\u003ccode>keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>android/key.properties\u003c/code> (\u003cstrong>не коммитьте!\u003c/strong>):\u003c/p>\n\u003cpre>\u003ccode>storePassword=...\nkeyPassword=...\nkeyAlias=upload\nstoreFile=../upload-keystore.jks\u003c/code>\u003c/pre>\n\u003cp>В \u003ccode>android/app/build.gradle\u003c/code> подключите \u003ccode>signingConfigs\u003c/code> и используйте их в \u003ccode>release\u003c/code>. Затем:\u003c/p>\n\u003cpre class=\"bash\">\u003ccode>flutter build apk --release\u003c/code>\u003c/pre>\n\u003cp>Файл лежит в \u003ccode>build/app/outputs/flutter-apk/app-release.apk\u003c/code>.\u003c/p>\n\u003ch3>Иконка и название\u003c/h3>\n\u003cul>\n\u003cli>Иконка приложения: пакет \u003ccode>flutter_launcher_icons\u003c/code> или замена файлов в \u003ccode>mipmap-*\u003c/code>.\u003c/li>\n\u003cli>Название приложения: \u003ccode>android:label\u003c/code> в \u003ccode>AndroidManifest.xml\u003c/code> и \u003ccode>CFBundleDisplayName\u003c/code> в \u003ccode>Info.plist\u003c/code>.\u003c/li>\n\u003cli>Идентификатор: \u003ccode>applicationId\u003c/code> (Android) и \u003ccode>Bundle Identifier\u003c/code> (iOS), например \u003ccode>ru.example.combats\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch3>Тексты\u003c/h3>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Поле\u003c/th>\n\u003cth>Как писать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Краткое описание\u003c/td>\n\u003ctd>1–2 предложения: что делает приложение\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Основное описание\u003c/td>\n\u003ctd>Для кого, основные функции, как играть, особенности\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Категория\u003c/td>\n\u003ctd>Например, «Игры» / «Развлечения»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Возраст\u003c/td>\n\u003ctd>Как требует магазин (0+, 6+, 12+ …); игры без насилия и покупок — низкая категория\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Скриншоты\u003c/td>\n\u003ctd>5 экранов приложения в порядке сценария\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Как отвечать на вопросы комиссии\u003c/h2>\n\u003cp>Подготовьте ответы на:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Почему вы разделили слои именно так?\u003c/li>\n\u003cli>Чем \u003ccode>implements\u003c/code> отличается от \u003ccode>extends\u003c/code>?\u003c/li>\n\u003cli>Как вы убедились, что картинка у игроков одинакова?\u003c/li>\n\u003cli>Как приложение ведёт себя без интернета?\u003c/li>\n\u003cli>Что в вашем коде нарушает SOLID и как бы вы исправили?\u003c/li>\n\u003cli>Зачем нужны отдельные библиотеки и версионирование?\u003c/li>\n\u003cli>Почему не использовали (или использовали) \u003ccode>dio\u003c/code>/\u003ccode>GetX\u003c/code>/\u003ccode>Bloc\u003c/code>?\u003c/li>\n\u003c/ol>\n\u003cp>Говорите простыми словами, с примерами из своего кода, и называйте честно, что не успели.\u003c/p>\n\u003ch2>Тайминг на 3 часа\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Время\u003c/th>\n\u003cth>Что\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>0:00–0:20\u003c/td>\n\u003ctd>Метрика, события, прогоны\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>0:20–1:10\u003c/td>\n\u003ctd>Сборка, иконка, описание, скриншоты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>1:10–2:10\u003c/td>\n\u003ctd>Презентация, диаграммы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>2:10–2:40\u003c/td>\n\u003ctd>Репетиция доклада, ответы на вопросы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>2:40–3:00\u003c/td>\n\u003ctd>Git: ветка, PR, merge, финальная проверка сборки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Максимальный балл: критерий за критерием\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Критерий (макс.)\u003c/th>\n\u003cth>Что сделать точно\u003c/th>\n\u003cth>Проверка\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Презентация создана (0,4)\u003c/td>\n\u003ctd>Файл готов к показу\u003c/td>\n\u003ctd>Открывается\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Описание реализации (0,2)\u003c/td>\n\u003ctd>Слайд про экраны и сценарии\u003c/td>\n\u003ctd>Есть\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Схема классов (0,2)\u003c/td>\n\u003ctd>Диаграмма классов: слои и связи\u003c/td>\n\u003ctd>Читаема, соответствует коду\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Производительность (0,2)\u003c/td>\n\u003ctd>Сценарий «Игра Image»: замеры и выводы\u003c/td>\n\u003ctd>Есть цифры или скриншот DevTools\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Архитектурные решения (0,2)\u003c/td>\n\u003ctd>Слои, DI, SOLID, библиотеки\u003c/td>\n\u003ctd>Есть\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Используемые библиотеки (0,2)\u003c/td>\n\u003ctd>Таблица «пакет — зачем» и что не использовали и почему\u003c/td>\n\u003ctd>Есть\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Метрика инициализирована (1,0)\u003c/td>\n\u003ctd>\u003ccode>AppMetrica.activate\u003c/code> в \u003ccode>main\u003c/code>\u003c/td>\n\u003ctd>Событие видно в кабинете\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сценарий активности + диаграмма (1,2)\u003c/td>\n\u003ctd>События на каждое движение и отправку, скриншот отчёта\u003c/td>\n\u003ctd>Скриншот в презентации\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Слайды (0,9)\u003c/td>\n\u003ctd>Единый стиль, мало текста, читаемо\u003c/td>\n\u003ctd>Судейский\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Диаграммы (0,6)\u003c/td>\n\u003ctd>Корректные, подписанные\u003c/td>\n\u003ctd>Судейский\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Доклад (0,6)\u003c/td>\n\u003ctd>Чёткая речь, укладываетесь во время\u003c/td>\n\u003ctd>Судейский\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Ответы на вопросы (0,6)\u003c/td>\n\u003ctd>Ответы по существу\u003c/td>\n\u003ctd>Судейский\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Поведение (0,6)\u003c/td>\n\u003ctd>Уверенно, к аудитории, без чтения с листа\u003c/td>\n\u003ctd>Судейский\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>RuStore (всего 2,1)\u003c/td>\n\u003ctd>Название, иконка, APK, тип, возраст, категория, описания, 5 скриншотов\u003c/td>\n\u003ctd>По списку\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: слайды для разработчиков\u003c/h2>\n\u003cp>Хорошая презентация для технической аудитории:\u003c/p>\n\u0
