03cul>\n\u003cli>\u003cstrong>Мало текста\u003c/strong>: ключевое слово или схема и ваш комментарий вслух.\u003c/li>\n\u003cli>\u003cstrong>Один слайд — одна идея.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Схемы и скриншоты\u003c/strong> вместо абзацев.\u003c/li>\n\u003cli>\u003cstrong>Шрифт\u003c/strong> от 24 pt, контрастные цвета.\u003c/li>\n\u003cli>\u003cstrong>Единый стиль\u003c/strong> (цвета приложения).\u003c/li>\n\u003c/ul>\n\u003cp>Что на каждом слайде:\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 40%\" />\n\u003ccol style=\"width: 30%\" />\n\u003ccol style=\"width: 30%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth style=\"text-align: right;\">№\u003c/th>\n\u003cth>Заголовок\u003c/th>\n\u003cth>Что показать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>Название и цель\u003c/td>\n\u003ctd>Что за приложение и какую задачу решали\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003ctd>Состав проекта\u003c/td>\n\u003ctd>Три репозитория: приложение, UIKit, сетевой слой\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd>Архитектура\u003c/td>\n\u003ctd>Схема трёх слоёв и направление зависимостей\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">4\u003c/td>\n\u003ctd>Схема классов\u003c/td>\n\u003ctd>Диаграмма по сценарию (например, «Отправка результата игры»)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">5\u003c/td>\n\u003ctd>Библиотеки\u003c/td>\n\u003ctd>Таблица: пакет → зачем; что не использовали и почему\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">6\u003c/td>\n\u003ctd>Производительность\u003c/td>\n\u003ctd>Скриншот DevTools и 2–3 вывода (FPS, \u003ccode>const\u003c/code>, \u003ccode>RepaintBoundary\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd style=\"text-align: right;\">7\u003c/td>\n\u003ctd>Метрика\u003c/td>\n\u003ctd>Скриншот диаграммы активности по событиям\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd style=\"text-align: right;\">8\u003c/td>\n\u003ctd>Итоги\u003c/td>\n\u003ctd>Что получилось, что улучшили бы\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: доклад на 5 минут\u003c/h2>\n\u003cp>Структура речи (примерно по 30–40 секунд на слайд):\u003c/p>\n\u003col type=\"1\">\n\u003cli>«Я разработала мобильное приложение для ... Расскажу, как оно устроено.»\u003c/li>\n\u003cli>«Проект состоит из трёх частей: ...»\u003c/li>\n\u003cli>«Архитектура разделена на три слоя: ... Это даёт ...»\u003c/li>\n\u003cli>«Вот схема классов. Например, при отправке результата игры ... »\u003c/li>\n\u003cli>«Использовала пакеты ... Не использовала ..., потому что ...»\u003c/li>\n\u003cli>«Производительность: я замерила ... Улучшила ... »\u003c/li>\n\u003cli>«Метрика: события ... Видно, что ...»\u003c/li>\n\u003cli>«Итог: что получилось и что улучшила бы.»\u003c/li>\n\u003c/ol>\n\u003cp>Тренируйтесь вслух с таймером, записывайте на телефон и слушайте. Говорите «я сделала», «я выбрала», а не «было сделано».\u003c/p>\n\u003ch2>Подробно: ответы на вопросы комиссии\u003c/h2>\n\u003cp>Принцип: \u003cstrong>коротко, по делу, с примером из кода\u003c/strong>. Если не знаете, скажите честно «не успела реализовать, но сделала бы так: ...».\u003c/p>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Вопрос\u003c/th>\n\u003cth>Основа ответа\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Почему три слоя?\u003c/td>\n\u003ctd>Изменение экрана не затрагивает бизнес-логику и данные; проще тестировать\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Зачем интерфейс репозитория?\u003c/td>\n\u003ctd>Domain не зависит от реализации, можно заменить источник данных\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Чем DTO отличается от Entity?\u003c/td>\n\u003ctd>DTO — формат сервера, Entity — модель приложения; изменение API не ломает экраны\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Как вы сделали одинаковую картинку?\u003c/td>\n\u003ctd>Генератор случайных чисел с seed из id игры\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Почему отдельная сетевая библиотека?\u003c/td>\n\u003ctd>Независимое версионирование, заменяемость, тесты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Что в вашем коде нарушает SOLID?\u003c/td>\n\u003ctd>Назовите конкретное место и как исправили бы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Как приложение работает без интернета?\u003c/td>\n\u003ctd>\u003ccode>NoInternetException\u003c/code>, SnackBar на 5 секунд, кэш картинок\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Что бы вы улучшили?\u003c/td>\n\u003ctd>Конкретные пункты: тесты UI, локальная БД, обработка гонок\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: производительность — что и как измерять\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Запустите приложение в режиме профилирования: \u003ccode>flutter run --profile\u003c/code> на реальном устройстве.\u003c/li>\n\u003cli>Откройте \u003cstrong>DevTools → Performance\u003c/strong>, нажмите запись, пройдите сценарий «собрать пазл Image».\u003c/li>\n\u003cli>Найдите кадры, которые вышли за 16 мс (красные столбцы): это «рывки».\u003c/li>\n\u003cli>Улучшите: \u003ccode>const\u003c/code> конструкторы, \u003ccode>RepaintBoundary\u003c/code> вокруг плиток, вынос неизменяемых виджетов, кэш картинок, \u003ccode>ListView.builder\u003c/code>.\u003c/li>\n\u003cli>Замерьте ещё раз и сохраните скриншоты «до» и «после».\u003c/li>\n\u003c/ol>\n\u003cp>Для слайда достаточно: «в сценарии Image средний кадр X мс; после оптимизации Y мс; что сделал».\u003c/p>\n\u003ch2>Подробно: публикация в RuStore пошагово\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Создайте аккаунт разработчика в RuStore Консоли (организаторы дадут доступ или инструкцию).\u003c/li>\n\u003cli>Создайте приложение, укажите \u003cstrong>название\u003c/strong> (как в задании) и \u003cstrong>тип\u003c/strong> (приложение/игра).\u003c/li>\n\u003cli>Загрузите \u003cstrong>APK\u003c/strong> (подписанный release-сборкой).\u003c/li>\n\u003cli>Загрузите \u003cstrong>иконку\u003c/strong> (по требованиям консоли: обычно квадрат PNG).\u003c/li>\n\u003cli>Выберите \u003cstrong>категорию\u003c/strong> и \u003cstrong>возрастную категорию\u003c/strong> (0+, 6+, ...).\u003c/li>\n\u003cli>Заполните \u003cstrong>краткое\u003c/strong> и \u003cstrong>полное описание\u003c/strong>.\u003c/li>\n\u003cli>Загрузите минимум \u003cstrong>5 скриншотов\u003c/strong>.\u003c/li>\n\u003cli>Проверьте и сохраните черновик; отправлять на модерацию, если не сказано, не нужно.\u003c/li>\n\u003c/ol>\n\u003cp>Тексты описаний готовьте заранее в файле, чтобы на соревновании только вставить.\u003c/p>\n\u003cp>Пример краткого описания (до 80 символов, уточните лимит): «Соревнуйтесь в пазлах Image и Circle и следите за статистикой».\u003c/p>\n\u003cp>Пример основного описания:\u003c/p>\n\u003cpre>\u003ccode>Игровое приложение для двух соперников. Создавайте игры по расписанию,\nнаходите соперника, собирайте пазлы Image (картинка) и Circle (круги)\nна скорость и смотрите статистику побед. Приложение напомнит о начале\nигры за час. Фото профиля можно выбрать из галереи или сделать на камеру.\u003c/code>\u003c/pre>\n\u003ch2>Репетиция спринта 6\u003c/h2>\n\u003cp>Выполните за 3 часа: метрика → сборка → публикация → презентация → доклад на камеру. Попросите наставника задать три вопроса.\u003c/p>\n", "text": " Что оценивают Блок Баллы Презентация создана (0,4) + 5 обязательных разделов (по 0,2) 1,40 Яндекс-метрика инициализирована 1,00 Сценарий активности в Image + диаграмма в презентации 1,20 Слайды, диаграммы, доклад, ответы на вопросы, поведение 3,30 Публикация: название, иконка, APK, тип, возраст, категория, описания, скриншоты 2,10 Всего 9 баллов, из них около 3,3 даёт ваше выступление (экспертная оценка), остальное проверяется по наличию. Презентация для разработчиков Аудитория — разработчики. «Вы не должны продавать приложение!» Показывайте инженерные решения. Раздел Что показать Реализация приложения Экраны (по 1–2 скриншота), основные сценарии, стек Схема классов Диаграмма (UML): UseCase, Repository, DTO/Entity, Controller, экран Производительность Сценарий «Игра Image»: FPS, время перестановки, память, что сделали для плавности Архитектурные решения Слои, DI, SOLID, почему Clean Architecture, отдельные библиотеки Библиотеки Таблица: пакет → зачем; и что не использовали и почему Метрика Скриншот диаграммы активности в Image по событиям Структура на 7–8 слайдов: Название и цель. Стек и состав проекта (приложение + UIKit + сетевая библиотека). Архитектура (схема слоёв). Схема классов. Используемые библиотеки и обоснование. Производительность в сценарии Image. Метрика и диаграмма. Итоги, что улучшили бы. Диаграмму классов можно нарисовать в Mermaid или любом редакторе: GameScreen └─ GameController (Presentation) └─ SubmitResult — UseCase (Domain) └─ GameRepository — interface (Domain) ▲ GameRepositoryImpl (Data) ──► ApiClient — interface сетевой библиотеки ▲ HttpApiClient Производительность: что сказать Открыть Flutter DevTools → Performance и записать сценарий «собрать пазл». Показать, что кадры укладываются в ~16 мс (60 fps) или ~8 мс (120 fps). Что вы сделали: const конструкторы, RepaintBoundary вокруг плиток, перестройка только нужных виджетов, кэширование картинок, dispose таймеров. Запускайте профилирование в режиме flutter run --profile , не в debug. Яндекс.Метрика (AppMetrica) Нужны: API-ключ (его выдадут организаторы или создадите в кабинете), пакет appmetrica_plugin . Future\u003cvoid> main() async { WidgetsFlutterBinding.ensureInitialized(); await AppMetrica.activate(const AppMetricaConfig('API_KEY')); runApp(const MyApp()); } События в игре Image: каждое движение и отправка результата. class Analytics { static void imageMove(int moveNumber) => AppMetrica.reportEventWithMap('image_move', {'move': moveNumber}); static void imageSubmit(int seconds, int moves) => AppMetrica.reportEventWithMap('image_submit', {'seconds': seconds, 'moves': moves}); } // в контроллере игры void swap(int a, int b) { ... Analytics.imageMove(moves); } API плагина и версии меняются: сверьтесь с README appmetrica_plugin и инструкцией для Android/iOS. Событие должно улететь в метрику до презентации — данные появляются в кабинете с задержкой. Сделайте пару прогонов игры, затем в кабинете откройте отчёт по событиям и сделайте скриншот диаграммы . Подготовка к публикации в RuStore Что понадобится (по критериям): Пункт Баллы Название соответствует заданию 0,1 Иконка приложения 0,1 APK-файл загружен 0,2 Название для пользователя и тип приложения 0,2 Возрастная категория 0,2 Категория приложения 0,1 Краткое описание 0,3 Основное описание 0,6 Скриншоты (−0,1 за каждый отсутствующий до 5) 0,5 Сборка APK с подписью keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload android/key.properties ( не коммитьте! ): storePassword=... keyPassword=... keyAlias=upload storeFile=../upload-keystore.jks В android/app/build.gradle подключите signingConfigs и используйте их в release . Затем: flutter build apk --release Файл лежит в build/app/outputs/flutter-apk/app-release.apk . Иконка и название Иконка приложения: пакет flutter_launcher_icons или замена файлов в mipmap-* . Название приложения: android:label в AndroidManifest.xml и CFBundleDisplayName в Info.plist . Идентификатор: applicationId (Android) и Bundle Identifier (iOS), например ru.example.combats . Тексты Поле Как писать Краткое описание 1–2 предложения: что делает приложение Основное описание Для кого, основн ctd>Архитектура не по заданию\u003c/td>\n\u003ctd>0 за слои\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Файл лежит вне своей папки\u003c/td>\n\u003ctd>−0,1 за файл\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Приложение не собирается из репозитория\u003c/td>\n\u003ctd>Ничего не оценивается\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Карточка не в «Готово к тестированию»\u003c/td>\n\u003ctd>Задача не проверяется\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Больше двух задач «В работе»\u003c/td>\n\u003ctd>Ограничение баллов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Нет мёржа в main\u003c/td>\n\u003ctd>Потеря баллов модуля Г\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Приоритеты по «стоимость / время»\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Приоритет\u003c/th>\n\u003cth>Что\u003c/th>\n\u003cth>Почему\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>1\u003c/td>\n\u003ctd>11 запросов сетевого слоя (спринт 2)\u003c/td>\n\u003ctd>12,1 балла, задачи однотипные\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>2\u003c/td>\n\u003ctd>Тесты на запросы\u003c/td>\n\u003ctd>4,95 балла по шаблону\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>3\u003c/td>\n\u003ctd>Игра Image + завершение + победитель\u003c/td>\n\u003ctd>6,3 балла в спринте 4\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>4\u003c/td>\n\u003ctd>Архитектура спринтов 3–4\u003c/td>\n\u003ctd>6,2 + 5,3 балла\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>5\u003c/td>\n\u003ctd>Экраны и их сеть\u003c/td>\n\u003ctd>по 1,1–1,2 за экран\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>6\u003c/td>\n\u003ctd>Камера, уведомления\u003c/td>\n\u003ctd>5 баллов за два небольших блока\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>7\u003c/td>\n\u003ctd>Защита и публикация\u003c/td>\n\u003ctd>9 баллов, 3,3 из них — выступление\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подготовка к чемпионату: что тренировать\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003ccol style=\"width: 33%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Навык\u003c/th>\n\u003cth>Как тренировать\u003c/th>\n\u003cth>Критерий готовности\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>UIKit за 90 минут\u003c/td>\n\u003ctd>Секундомер, макет из симуляции + недостающие компоненты\u003c/td>\n\u003ctd>Все 10 компонентов, StoryBook, PR\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сетевой слой за 70 минут\u003c/td>\n\u003ctd>Любой публичный API (например, jsonplaceholder)\u003c/td>\n\u003ctd>11 методов, тесты проходят\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Экран по макету за 10 минут\u003c/td>\n\u003ctd>Открыть Figma, собрать экран\u003c/td>\n\u003ctd>Разница с макетом не заметна\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Три слоя без подсказок\u003c/td>\n\u003ctd>Экран логина «с нуля»\u003c/td>\n\u003ctd>Domain без импортов Flutter\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Игра-пазл за 30 минут\u003c/td>\n\u003ctd>Шаблон с общим контроллером\u003c/td>\n\u003ctd>Победа, время, отправка\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Git за 3 минуты\u003c/td>\n\u003ctd>Ветка, коммит, push, PR, merge\u003c/td>\n\u003ctd>Без ошибок и без документации\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Комментарии и логи\u003c/td>\n\u003ctd>Писать при каждом классе\u003c/td>\n\u003ctd>Шапка + 4 точки логов\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Свой комплект шпаргалок\u003c/h2>\n\u003cp>Перед чемпионатом подготовьте (то, что можно использовать по правилам, уточните у главного эксперта):\u003c/p>\n\u003cul>\n\u003cli>Список пакетов и версий.\u003c/li>\n\u003cli>Сниппеты: шапка класса, \u003ccode>AppLog\u003c/code>, \u003ccode>HttpApiClient\u003c/code>, шаблон экрана с \u003ccode>ScreenState\u003c/code>.\u003c/li>\n\u003cli>Команды Git.\u003c/li>\n\u003cli>Таблицу 11 запросов.\u003c/li>\n\u003c/ul>\n\u003ch2>День перед стартом\u003c/h2>\n\u003cul>\n\u003cli>Проверьте \u003ccode>flutter doctor\u003c/code> и эмуляторы разных размеров.\u003c/li>\n\u003cli>Обновите Flutter до версии стенда, которую сообщат организаторы.\u003c/li>\n\u003cli>Выспитесь. Усталость стоит дороже одной непрочитанной главы.\u003c/li>\n\u003c/ul>\n\u003ch2>Подробно: как распределить внимание между модулями\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 30%\" />\n\u003ccol style=\"width: 40%\" />\n\u003ccol style=\"width: 30%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Модуль\u003c/th>\n\u003cth style=\"text-align: right;\">Максимум\u003c/th>\n\u003cth>Где зарабатывать быстрее всего\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>А (17,7)\u003c/td>\n\u003ctd style=\"text-align: right;\">Больше всего в спринтах 3–4\u003c/td>\n\u003ctd>Заранее иметь заготовку структуры папок и DI\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Б (34,36)\u003c/td>\n\u003ctd style=\"text-align: right;\">Спринты 1 и 4\u003c/td>\n\u003ctd>Хороший UIKit; быстро собирать экраны из его компонентов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>В (24,14)\u003c/td>\n\u003ctd style=\"text-align: right;\">Спринт 2 (13,64)\u003c/td>\n\u003ctd>Шаблон запроса; не терять время на красоту\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Г (4,85)\u003c/td>\n\u003ctd style=\"text-align: right;\">По мелочи\u003c/td>\n\u003ctd>Git-дисциплина и две-три настройки хранения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Д (5,0)\u003c/td>\n\u003ctd style=\"text-align: right;\">Спринты 3–4\u003c/td>\n\u003ctd>Заготовки манифестов и кода выбора фото и уведомлений\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Е (4,95)\u003c/td>\n\u003ctd style=\"text-align: right;\">Спринт 2\u003c/td>\n\u003ctd>Шаблон теста на MockClient\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Ж (9,0)\u003c/td>\n\u003ctd style=\"text-align: right;\">Спринт 6\u003c/td>\n\u003ctd>Подготовить тексты и структуру презентации заранее\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: что подготовить заранее (шаблоны, которые можно использовать)\u003c/h2>\n\u003cp>Уточните у главного эксперта, что разрешено приносить в виде заготовок. Тренировочные заготовки для себя:\u003c/p>\n\u003cul>\n\u003cli>Структура папок \u003ccode>domain / data / presentation / common\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>AppLog\u003c/code> и шаблон шапки.\u003c/li>\n\u003cli>Каркас \u003ccode>ApiClient\u003c/code> и \u003ccode>HttpApiClient\u003c/code>.\u003c/li>\n\u003cli>Шаблон \u003ccode>ScreenState\u003c/code> и \u003ccode>ScreenController\u003c/code>.\u003c/li>\n\u003cli>Шаблон теста с \u003ccode>MockClient\u003c/code>.\u003c/li>\n\u003cli>Код для \u003ccode>image_picker\u003c/code>, \u003ccode>SharedPreferences\u003c/code>, \u003ccode>NavigatorObserver\u003c/code>.\u003c/li>\n\u003cli>Манифесты с правами.\u003c/li>\n\u003cli>Шаблон презентации и текстов описания.\u003c/li>\n\u003c/ul>\n\u003cp>Тренируйтесь \u003cstrong>писать их по памяти\u003c/strong>, а не копировать: на площадке может быть доступ только к тому, что вы вспомните.\u003c/p>\n\u003ch2>Подробно: типичные ошибки тайм-менеджмента\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ошибка\u003c/th>\n\u003cth>Как избежать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Перфекционизм на первом компоненте\u003c/td>\n\u003ctd>Сначала все компоненты «на 80%», потом доработка\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Застряли на ошибке &gt; 10 минут\u003c/td>\n\u003ctd>Заметка, переход дальше, возврат позже\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Нет коммитов до последней минуты\u003c/td>\n\u003ctd>Коммит по каждой карточке\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Забыли комментарии «на потом»\u003c/td>\n\u003ctd>Писать шапку сразу при создании файла\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Логи в конце\u003c/td>\n\u003ctd>Лог при каждом \u003ccode>try\u003c/code>, запросе и клике\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Не перенесли карточки\u003c/td>\n\u003ctd>Перенос сразу после коммита\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Не проверили на другом размере\u003c/td>\n\u003ctd>Проверка за 10 минут до конца\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Забыли PR\u003c/td>\n\u003ctd>Напоминание в конце: «PR → merge → карточки»\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Подробно: перед стартом каждого спринта (ритуал)\u003c/h2>\n\u003col type=\"1\">\n\u003cli>Прочитать \u003cstrong>все\u003c/strong> карточки спринта (2 минуты).\u003c/li>\n\u003cli>Определить порядок по таблице «стоимость / время».\u003c/li>\n\u003cli>Создать ветку, взять две карточки.\u003c/li>\n\u003cli>Открыть шпаргалки.\u003c/li>\n\u003cli>Поставить таймер (во вкладке «Симуляция» можно потренироваться).\u003c/li>\n\u003c/ol>\n\u003ch2>Подробно: ритуал перед сдачей спринта\u003c/h2>\n\u003col type=\"1\">\n\u003cli>\u003ccode>flutter analyze\u003c/code> — нет ошибок.\u003c/li>\n\u003cli>Скрипт проверки шапок и логов.\u003c/li>\n\u003cli>Запуск на двух размерах экрана.\u003c/li>\n\u003cli>Проверка без интернета.\u003c/li>\n\u003cli>\u003ccode>git status\u003c/code> пустой, \u003ccode>git log --oneline\u003c/code> — коммит по каждой карточке.\u003c/li>\n\u003cli>Pu ршена»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Инвариант\u003c/td>\n\u003ctd>Обязательная часть задания для всех регионов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Вариатив\u003c/td>\n\u003ctd>Часть задания, которую выбирает регион\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Аспект\u003c/td>\n\u003ctd>Один пункт оценивания в таблице критериев\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Измеримый («И»)\u003c/td>\n\u003ctd>Аспект с ответом «есть/нет»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Судейский («С»)\u003c/td>\n\u003ctd>Аспект с экспертной оценкой 0–3\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Эксперт\u003c/td>\n\u003ctd>Человек, который проверяет вашу работу\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Главный эксперт (ГЭ)\u003c/td>\n\u003ctd>Руководитель проверки, согласует пакеты и правила\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Менеджер компетенции\u003c/td>\n\u003ctd>Автор конкурсного задания\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Инфраструктурный лист (ИЛ)\u003c/td>\n\u003ctd>Список оборудования и программ на площадке\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Git\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Термин\u003c/th>\n\u003cth>Что значит\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Репозиторий\u003c/td>\n\u003ctd>Папка проекта с историей изменений\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Коммит\u003c/td>\n\u003ctd>«Снимок» проекта с описанием; имеет уникальный хэш\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Хэш коммита\u003c/td>\n\u003ctd>Длинный код вроде \u003ccode>5899748\u003c/code>, по нему находят нужную версию\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Ветка (branch)\u003c/td>\n\u003ctd>Отдельная линия изменений, не мешающая \u003ccode>main\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>main\u003c/code>\u003c/td>\n\u003ctd>Основная ветка проекта\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Merge\u003c/td>\n\u003ctd>Слияние одной ветки в другую\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Pull request (PR)\u003c/td>\n\u003ctd>Запрос на слияние ветки: его просматривают, а потом принимают\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Push / Pull\u003c/td>\n\u003ctd>Отправить изменения на сервер / получить с сервера\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Тег\u003c/td>\n\u003ctd>Метка на коммите, например \u003ccode>v1.0.0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Semver\u003c/td>\n\u003ctd>Система версий МАЖОР.МИНОР.ПАТЧ\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>.gitignore\u003c/code>\u003c/td>\n\u003ctd>Список файлов, которые Git не должен хранить\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Dart и Flutter\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Термин\u003c/th>\n\u003cth>Что значит\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Dart\u003c/td>\n\u003ctd>Язык программирования, на котором пишут Flutter\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Flutter\u003c/td>\n\u003ctd>Фреймворк для мобильных приложений от Google\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Виджет\u003c/td>\n\u003ctd>Любой элемент интерфейса: кнопка, текст, отступ, экран\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Stateless\u003c/td>\n\u003ctd>Виджет без изменяемого состояния\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Stateful\u003c/td>\n\u003ctd>Виджет с состоянием, которое меняется\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>State\u003c/td>\n\u003ctd>Объект, где хранится состояние Stateful-виджета\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>setState\u003c/code>\u003c/td>\n\u003ctd>Команда «перерисуй виджет с новыми данными»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>build\u003c/code>\u003c/td>\n\u003ctd>Метод, который описывает, как выглядит виджет\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>BuildContext\u003c/code>\u003c/td>\n\u003ctd>«Адрес» виджета в дереве, нужен для темы, навигации, размеров\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Hot reload\u003c/td>\n\u003ctd>Мгновенное применение изменений без перезапуска\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>pubspec.yaml\u003c/code>\u003c/td>\n\u003ctd>Файл настроек проекта: пакеты, шрифты, ресурсы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Пакет (package)\u003c/td>\n\u003ctd>Готовая библиотека кода с pub.dev\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>async\u003c/code> / \u003ccode>await\u003c/code>\u003c/td>\n\u003ctd>Ключевые слова для работы с долгими операциями\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Future\u003c/td>\n\u003ctd>Результат, который появится позже\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Stream\u003c/td>\n\u003ctd>Поток значений во времени\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Null safety\u003c/td>\n\u003ctd>Защита от пустых значений: обычные типы не могут быть \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Mixin\u003c/td>\n\u003ctd>Набор методов, подмешиваемый в класс\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Extension\u003c/td>\n\u003ctd>Добавление методов существующему типу\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Sealed class\u003c/td>\n\u003ctd>Класс с ограниченным набором наследников, удобен для состояний\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Generics\u003c/td>\n\u003ctd>Обобщения: \u003ccode>List&lt;int&gt;\u003c/code>, \u003ccode>Box&lt;T&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Scaffold\u003c/td>\n\u003ctd>Каркас экрана: AppBar, body, drawer, bottomBar\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Sliver\u003c/td>\n\u003ctd>Элемент прокручиваемой области (\u003ccode>CustomScrollView\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Constraints\u003c/td>\n\u003ctd>Ограничения размера, которые родитель передаёт ребёнку\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Navigator\u003c/td>\n\u003ctd>Управляет стеком экранов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Drawer\u003c/td>\n\u003ctd>Выдвижное боковое меню\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>BottomSheet\u003c/td>\n\u003ctd>Панель, выезжающая снизу\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>SnackBar\u003c/td>\n\u003ctd>Всплывающее сообщение внизу экрана\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>mounted\u003c/code>\u003c/td>\n\u003ctd>Признак, что виджет ещё на экране\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Lifecycle\u003c/td>\n\u003ctd>Жизненный цикл: создание, использование, удаление\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Архитектура\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Термин\u003c/th>\n\u003cth>Что значит\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Архитектура\u003c/td>\n\u003ctd>Способ разделения кода на части с чёткими обязанностями\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Domain\u003c/td>\n\u003ctd>Слой бизнес-правил, не знает ни о UI, ни о сети\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Presentation\u003c/td>\n\u003ctd>Слой экранов и управления их состоянием\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Data\u003c/td>\n\u003ctd>Слой получения данных: API, БД, хранилище\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Entity\u003c/td>\n\u003ctd>Чистая модель предметной области (Game, Player)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>DTO\u003c/td>\n\u003ctd>Модель данных «как пришло с сервера», может отличаться от Entity\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Mapper\u003c/td>\n\u003ctd>Преобразователь одной модели в другую\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>UseCase\u003c/td>\n\u003ctd>Одно действие пользователя в виде класса (\u003ccode>CreateGame\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Repository\u003c/td>\n\u003ctd>Посредник, который отдаёт данные слою Domain\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Data source\u003c/td>\n\u003ctd>Источник данных: удалённый (API) или локальный (память)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>DI\u003c/td>\n\u003ctd>Внедрение зависимостей: объект получает нужные ему части снаружи\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Абстракция\u003c/td>\n\u003ctd>Интерфейс, который описывает «что делать», а не «как»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>SOLID\u003c/td>\n\u003ctd>Пять принципов проектирования (S, O, L, I, D)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>DRY\u003c/td>\n\u003ctd>«Не повторяйся»: одна логика живёт в одном месте\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>SRP\u003c/td>\n\u003ctd>Одна ответственность на класс\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Контроллер / ViewModel / Bloc\u003c/td>\n\u003ctd>Объект, который управляет состоянием экрана\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Сеть\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Термин\u003c/th>\n\u003cth>Что значит\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Клиент\u003c/td>\n\u003ctd>Ваше мобильное приложение\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сервер\u003c/td>\n\u003ctd>Компьютер, хранящий данные и отвечающий на запросы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>API\u003c/td>\n\u003ctd>Набор адресов и правил общения с сервером\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>REST\u003c/td>\n\u003ctd>Стиль API: запросы HTTP, данные в JSON\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>HTTP-метод\u003c/td>\n\u003ctd>GET (получить), POST (создать), PUT (изменить), DELETE (удалить)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Эндпоинт\u003c/td>\n\u003ctd>Конкретный адрес запроса, например \u003ccode>/games\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Заголовок (header)\u003c/td>\n\u003ctd>Служебная информация запроса, например токен\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Токен\u003c/td>\n\u003ctd>Строка, которая подтверждает, что вы вошли\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Статус-код\u003c/td>\n\u003ctd>Результат: 200 успех, 400 плохой запрос, 401 нет доступа, 404 не найдено, 500 ошибка сервера\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>JSON\u003c/td>\n\u003ctd>Текстовый формат данных \u003ccode>{\"id\": 1}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Сериализация\u003c/td>\n\u003ctd>Объект → строка JSON\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Десериализация\u003c/td>\n\u003ctd>Строка JSON → объект\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Таймаут\u003c/td>\n\u003ctd>Максимальное время ожидания ответа\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Мок (mock)\u003c/td>\n\u003ctd>Заглушка вместо настоящего сервера в тестах\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Интерсептор\u003c/td>\n\u003ctd>Перехватчик запросов/ответов (общая обработка ошибок, токена)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>UIKit и верстка\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Термин\u003c/th>\n\u003cth>Что значит\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>UIKit (в задании)\u003c/td>\n\u003ctd>Отдельная библиотека компонентов интерфейса\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>StoryBook\u003c/td>\n\u003ctd>Приложение-витрина со всеми компонентами\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Дизайн-система\u003c/td>\n\u003ctd>Набор правил: цвета, шрифты, отступы, компоненты\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Токены дизайна\u003c/td>\n\u003ctd>Именованные значения: цвета, размеры, радиусы\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Макет\u003c/td>\n\u003ctd>Дизайн в Figma\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Dev Mode\u003c/td>\n\u003ctd>Режим Figma для разработчиков с размерами и стилями\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Адаптивность\u003c/td>\n\u003ctd>Корректный вид на экранах разных размеров\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>dp (логический пиксель)\u003c/td>\n\u003ctd>Единица измерения Flutter, не зависит от плотности экрана\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Состояния компонента\u003c/td>\n\u003ctd>default, focused, disabled, error, pressed и т. д.\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Auto layout (Figma)\u003c/td>\n\u003ctd>Автораскладка, аналог Row/Column\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Хранение и устройство\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Термин\u003c/th>\n\u003cth>Что значит\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>SharedPreferences\u003c/td>\n\u003ctd>Простое хранилище пар «ключ — значение»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Secure storage\u003c/td>\n\u003ctd>Защищённое хранилище для токенов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Кэш\u003c/td>\n\u003ctd>Локальная копия данных, чтобы не загружать их повторно\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Сессия\u003c/td>\n\u003ctd>Состояние «пользователь вошёл»\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Разрешение (permission)\u003c/td>\n\u003ctd>Согласие пользователя на доступ к камере, уведомлениям\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Локальное уведомление\u003c/td>\n\u003ctd>Уведомление, созданное приложением без сервера\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Манифест\u003c/td>\n\u003ctd>Файл Android с настройками и правами приложения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>Info.plist\u003c/code>\u003c/td>\n\u003ctd>Аналогичный файл настроек для iOS\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Тестирование и публикация\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Термин\u003c/th>\n\u003cth>Что значит\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Unit-тест\u003c/td>\n\u003ctd>Проверка отдельной функции или класса\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Тест-кейс\u003c/td>\n\u003ctd>Описание: предусловия, шаги, ожидаемый результат\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Mock-сервер\u003c/td>\n\u003ctd>Имитация сервера для тестов\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003ccode>expect\u003c/code>\u003c/td>\n\u003ctd>Проверка результата в тесте\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Метрика (AppMetrica)\u003c/td>\n\u003ctd>Сервис аналитики: какие действия делают пользователи\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>RuStore\u003c/td>\n\u003ctd>Российский магазин приложений\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>APK / AAB\u003c/td>\n\u003ctd>Файл сборки Android-приложения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Keystore\u003c/td>\n\u003ctd>Файл-ключ для подписи приложения\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Возрастная категория\u003c/td>\n\u003ctd>Рейтинг 0+, 6+, 12+, 16+, 18+\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n", "text": " Процесс и организация Термин Что значит Спринт Короткий отрезок работы с набором задач и ограниченным временем Таск-трекер Сервис с карточками задач (как Trello, Jira, YouTrack) Канбан-доска Доска с колонками этапов задачи: «К разработке» → «В работе» → «К тестированию» → «Завершена» Инвариант Обязательная часть задания для всех регионов Вариатив Часть задания, которую выбирает регион Аспект Один пункт оценивания в таблице критериев Измеримый («И») Аспект с ответом «есть/нет» Судейский («С») Аспект с экспертной оценкой 0–3 Эксперт Человек, который проверяет вашу работу Главный эксперт (ГЭ) Руководитель проверки, согласует пакеты и правила Менеджер компетенции Автор конкурсного задания Инфраструктурный лист (ИЛ) Список оборудования и программ на площадке Git Термин Что значит Репозиторий Папка проекта с историей изменений Коммит «Снимок» проекта с описанием; имеет уникальный хэш Хэш коммита Длинный код вроде 5899748 , по нему находят нужную версию Ветка (branch) Отдельная линия изменений, не мешающая main main Основная ветка проекта Merge Слияние одной ветки в другую Pull request (PR) Запрос на слияние ветки: чения данных: API, БД, хранилище Entity Чистая модель предметной области (Game, Player) DTO Модель данных «как пришло с сервера», может отличаться от Entity Mapper Преобразователь одной модели в другую UseCase Одно действие пользователя в виде класса ( CreateGame ) Repository Посредник, который отдаёт данные слою Domain Data source Источник данных: удалённый (API) или локальный (память) DI Внедрение зависимостей: объект получает нужные ему части снаружи Абстракция Интерфейс, который описывает «что делать», а не «как» SOLID Пять принципов проектирования (S, O, L, I, D) DRY «Не повторяйся»: одна логика живёт в одном месте SRP Одна ответственность на класс Контроллер / ViewModel / Bloc Объект, который управляет состоянием экрана Сеть Термин Что значит Клиент Ваше мобильное приложение Сервер Компьютер, хранящий данные и отвечающий на запросы API Набор адресов и правил общения с сервером REST Стиль API: запросы HTTP, данные в JSON HTTP-метод GET (получить), POST (создать), PUT (изменить), DELETE (удалить) Эндпоинт Конкретный адрес запроса, например /games Заголовок (header) Служебная информация запроса, например токен Токен Строка, которая подтверждает, что вы вошли Статус-код Результат: 200 успех, 400 плохой запрос, 401 нет доступа, 404 не найдено, 500 ошибка сервера JSON Текстовый формат данных {\"id\": 1} Сериализация Объект → строка JSON Десериализация Строка JSON → объект Таймаут Максимальное время ожидания ответа Мок (mock) Заглушка вместо настоящего сервера в тестах Интерсептор Перехватчик запросов/ответов (общая обработка ошибок, токена) UIKit и верстка Термин Что значит UIKit (в задании) Отдельная библиотека компонентов интерфейса StoryBook Приложение-витрина со всеми компонентами Дизайн-система Набор правил: цвета, шрифты, отступы, компоненты Токены дизайна Именованные значения: цвета, размеры, радиусы Макет Дизайн в Figma Dev Mode Режим Figma для разработчиков с размерами и стилями Адаптивность Корректный вид на экранах разных размеров dp (логический пиксель) Единица измерения Flutter, не зависит от плотности экрана Состояния компонента default, focused, disabled, error, pressed и т. д. Auto layout (Figma) Автораскладка, аналог Row/Column Хранение и устройство Термин Что значит SharedPreferences Простое хранилище пар «ключ — значение» Secure storage Защищённое хранилище для токенов Кэш Локальная копия данных, чтобы не загружать их повторно Сессия Состояние «пользователь вошёл» Разрешение (permission) Согласие пользователя на доступ к камере, уведомлениям Локальное уведомление Уведомление, созданное приложением без сервера Манифест Файл Android с настройками и правами приложения Info.plist Аналогичный файл настроек для iOS Тестирование и публикация Термин Что значит Unit-тест Проверка отдельной функции или класса Тест-кейс Описание: предусловия, шаги, ожидаемый результат Mock-сервер Имитация сервера для тестов expect Проверка результата в тесте Метрика (AppMetrica) Сервис аналитики: какие действия делают пользователи RuStore Российский магазин приложений APK / AAB Файл сборки Android-приложения Keystore Файл-ключ для подписи приложения Возрастная категория Рейтинг 0+, 6+, 12+, 16+, 18+ ", "hours": 1, "minutes": 5}, {"id": "cheatsheet", "stage": 7, "title": "Шпаргалки: команды и сниппеты", "lead": "То, что нужно копировать быстро: команды, шаблоны файлов и кусочки кода для каждого спринта.", "html": "\u003ch2>Команды Flutter\u003c/h2>\n\u003cpre class=\"bash\">\u003ccode>flutter doctor                     # проверка окружения\nflutter create my_app              # новый проект\nflutter create --template=package uikit   # новая библиотека\nflutter pub get                    # скачать пакеты\nflutter pub add http               # добавить пакет в pubspec\nflutter run                        # запуск на устройстве/эмуляторе\nflutter run -d &lt;id&gt;                # конкретное устройство\nflutter devices                    # список устройств\nflutter analyze                    # статический анализ кода\nflutter test                       # запустить тесты\nflutter clean                      # очистить сборку (при странных ошибках)\nflutter build apk --release        # собрать APK\ndart format .                      # форматирование\u003c/code>\u003c/pre>\n\u003ch2>Команды Git\u003c/h2>\n\u003cpre class=\"bash\">\u003ccode>git clone &lt;url&gt;\ngit checkout -b sprint-1           # создать ветку\ngit status\ngit add .\ngit commit -m &quot;feat: описание&quot;\ngit push -u origin sprint-1\ngit log --oneline                  # хэши коммитов для карточки\ngit checkout main &amp;&amp; git pull\ngit merge sprint-1                 # слить локально\ngit tag v1.0.0 &amp;&amp; git push origin v1.0.0\ngit restore &lt;файл&gt;                 # откатить файл\ngit stash                          # спрятать изменения\u003c/code>\u003c/pre>\n\u003ch2>Шапка файла (шаблон)\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>// Краткое описание: за что отвечает класс (одна фраза).\n// Дата создания: 11-11-2026\n// Автор создания: &lt;номер участника&gt;\u003c/code>\u003c/pre>\n\u003ch2>Логгер (копируйте в проект)\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>import &#39;package:logger/logger.dart&#39;;\n\nclass AppLog {\n  static final Logger _log = Logger(printer: SimplePrinter());\n  static String _f(String t, String e, String d) =&gt; &#39;[$t]: $e — $d&#39;;\n  static void debug(String t, String e, String d) =&gt; _log.d(_f(t, e, d));\n  static void info(String t, String e, String d) =&gt; _log.i(_f(t, e, d));\n  static void error(String t, String e, String d, [Object? err, StackTrace? st]) =&gt;\n      _log.e(_f(t, e, d), error: err, stackTrace: st);\n}\u003c/code>\u003c/pre>\n\u003ch2>Шаблон экрана с состоянием загрузки\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>sealed class ScreenState&lt;T&gt; {}\nclass Loading&lt;T&gt; extends ScreenState&lt;T&gt; {}\nclass Loaded&lt;T&gt; extends ScreenState&lt;T&gt; { final T data; Loaded(this.data); }\nclass Failed&lt;T&gt; extends ScreenState&lt;T&gt; { final String message; Failed(this.message); }\n\nWidget body(ScreenState&lt;List&lt;Game&gt;&gt; s) =&gt; switch (s) {\n  Loading() =&gt; const Center(child: CircularProgressIndicator()),\n  Loaded(:final data) =&gt; ListView(children: data.map(GameCard.new).toList()),\n  Failed(:final message) =&gt; Center(child: Text(message)),\n};\u003c/code>\u003c/pre>\n\u003ch2>SnackBar ошибки на 5 секунд\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>void showError(BuildContext context, String text) {\n  final m = ScaffoldMessenger.of(context);\n  m.hideCurrentSnackBar();\n  m.showSnackBar(SnackBar(\n    duration: const Duration(seconds: 5),\n    content: Text(text),\n    action: SnackBarAction(label: &#39;OK&#39;, onPressed: m.hideCurrentSnackBar),\n  ));\n}\u003c/code>\u003c/pre>\n\u003ch2>SharedPreferences\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final prefs = await SharedPreferences.getInstance();\nawait prefs.setString(&#39;token&#39;, token);\nfinal token = prefs.getString(&#39;token&#39;);\nawait prefs.remove(&#39;token&#39;);\nawait prefs.setBool(&#39;seen_onboarding&#39;, true);\u003c/code>\u003c/pre>\n\u003ch2>Работа с датами\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final start = DateTime(d.year, d.month, d.day, t.hour, t.minute);\nfinal remind = start.subtract(const Duration(hours: 1));\nfinal iso = start.toUtc().toIso8601String();\nfinal monday = DateTime(now.year, now.month, now.day).subtract(Duration(days: now.weekday - 1));\nString two(int v) =&gt; v.toString().padLeft(2, &#39;0&#39;);\nString date = &#39;${two(d.day)}-${two(d.month)}-${d.year}&#39;;\u003c/code>\u003c/pre>\n\u003ch2>Тест с MockClient\u003c/h2>\n\u003cpre class=\"dart\">\u003ccode>final mock = MockClient((req) async {\n  expect(req.url.path, &#39;/games&#39;);\n  return http.Response(jsonEncode([{&#39;id&#39;: &#39;1&#39;}]), 200);\n});\u003c/code>\u003c/pre>\n\u003ch2>Манифесты\u003c/h2>\n\u003cp>Android (\u003ccode>android/app/src/main/AndroidManifest.xml\u003c/code>):\u003c/p>\n\u003cpre class=\"xml\">\u003ccode>&lt;uses-permission android:name=&quot;android.permission.INTERNET&quot;/&gt;\n&lt;uses-permission android:name=&quot;android.permission.CAMERA&quot;/&gt;\n&lt;uses-permission android:name=&quot;android.permission.POST_NOTIFICATIONS&quot;/&gt;\u003c/code>\u003c/pre>\n\u003cp>iOS (\u003ccode>ios/Runner/Info.plist\u003c/code>):\u003c/p>\n\u003cpre class=\"xml\">\u003ccode>&lt;key&gt;NSCameraUsageDescription&lt;/key&gt;&lt;string&gt;Нужна камера для фото профиля&lt;/string&gt;\n&lt;key&gt;NSPhotoLibraryUsageDescription&lt;/key&gt;&lt;string&gt;Нужна галерея для фото профиля&lt;/string&gt;\u003c/code>\u003c/pre>\n\u003ch2>Быстрая проверка перед сдачей\u003c/h2>\n\u003cpre class=\"bash\">\u003ccode>grep -rL &quot;Автор создания&quot; lib   # файлы без шапки\ngrep -rn &quot;print(&quot; lib           # забытые print\nflutter analyze\nflutter test\ngit status\u003c/code>\u003c/pre>\n", "text": " Команды Flutter flutter doctor # проверка окружения flutter create my_app # новый проект flutter create --template=package uikit # новая библиотека flutter pub get # скачать пакеты flutter pub add http # добавить пакет в pubspec flutter run # запуск на устройстве/эмуляторе flutter run -d \u003cid> # конкретное устройство flutter devices # список устройств flutter analyze # статический анализ кода flutter test # запустить тесты flutter clean # очистить сборку (при странных ошибках) flutter build apk --release # собрать APK dart format . # форматирование Команды Git git clone \u003curl> git checkout -b sprint-1 # создать ветку git status git add . git commit -m \"feat: описание\" git push -u origin sprint-1 git log --oneline # хэши коммитов для карточки git checkout main && git pull git merge sprint-1 # слить локально git tag v1.0.0 && git push origin v1.0.0 git restore \u003cфайл> # откатить файл git stash # спрятать изменения Шапка файла (шаблон) // Краткое описание: за что отвечает класс (одна фраза). // Дата создания: 11-11-2026 // Автор создания: \u003cномер участника> Логгер (копируйте в проект) import 'package:logger/logger.dart'; class AppLog { static final Logger _log = Logger(printer: SimplePrinter()); static String _f(String t, String e, String d) => '[$t]: $e — $d'; static void debug(String t, String e, String d) => _log.d(_f(t, e, d)); static void info(String t, String e, String d) => _log.i(_f(t, e, d)); static void error(String t, String e, String d, [Object? err, StackTrace? st]) => _log.e(_f(t, e, d), error: err, stackTrace: st); } Шаблон экрана с состоянием загрузки sealed class ScreenState\u003cT> {} class Loading\u003cT> extends ScreenState\u003cT> {} class Loaded\u003cT> extends ScreenState\u003cT> { final T data; Loaded(this.data); } class Failed\u003cT> extends ScreenState\u003cT> { final String message; Failed(this.message); } Widget body(ScreenState\u003cList\u003cGame>> s) => switch (s) { Loading() => const Center(child: CircularProgressIndicator()), Loaded(:final data) => ListView(children: data.map(GameCard.new).toList()), Failed(:final message) => Center(child: Text(message)), }; SnackBar ошибки на 5 секунд void showError(BuildContext context, String text) { final m = ScaffoldMessenger.of(context); m.hideCurrentSnackBar(); m.showSnackBar(SnackBar( duration: const Duration(seconds: 5), content: Text(text), action: SnackBarAction(label: 'OK', onPressed: m.hideCurrentSnackBar), )); } SharedPreferences final prefs = await SharedPreferences.getInstance(); await prefs.setString('token', token); final token = prefs.getString('token'); await prefs.remove('token'); await prefs.setBool('seen_onboarding', true); Работа с датами final start = DateTime(d.year, d.month, d.day, t.hour, t.minute); final remind = start.subtract(const Duration(hours: 1)); final iso = start.toUtc().toIso8601String(); final monday = DateTime(now.year, now.month, now.day).subtract(Duration(days: now.weekday - 1)); String two(int v) => v.toString().padLeft(2, '0'); String date = '${two(d.day)}-${two(d.month)}-${d.year}'; Тест с MockClient final mock = MockClient((req) async { expect(req.url.path, '/games'); return http.Response(jsonEncode([{'id': '1'}]), 200); }); Манифесты Android ( android/app/src/main/AndroidManifest.xml ): \u003cuses-permission android:name=\"android.permission.INTERNET\"/> \u003cuses-permission android:name=\"android.permission.CAMERA\"/> \u003cuses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/> iOS ( ios/Runner/Info.plist ): \u003ckey>NSCameraUsageDescription\u003c/key>\u003cstring>Нужна камера для фото профиля\u003c/string> \u003ckey>NSPhotoLibraryUsageDescription\u003c/key>\u003cstring>Нужна галерея для фото профиля\u003c/string> Быстрая проверка перед сдачей grep -rL \"Автор создания\" lib # файлы без шапки grep -rn \"print(\" lib # забытые print flutter analyze flutter test git status ", "hours": 1, "minutes": 3}, {"id": "mistakes", "stage": 7, "title": "Типичные ошибки и как их чинить", "lead": "Тексты ошибок, которые вы увидите чаще всего, что они значат и как исправить за минуту.", "html": "\u003ch2>Ошибки раскладки\u003c/h2>\n\u003ch3>RenderFlex overflowed by N pixels\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> элементы в \u003ccode>Row\u003c/code> или \u003ccode>Column\u003c/code> не поместились. \u003cstrong>Как чинить:\u003c/strong> оберните длинный элемент в \u003ccode>Expanded\u003c/code> или \u003ccode>Flexible\u003c/code>, добавьте \u003ccode>overflow: TextOverflow.ellipsis\u003c/code> у текста, либо дайте прокрутку (\u003ccode>SingleChildScrollView\u003c/code>). Для колонки на всю высоту экрана с содержимым, которое может не поместиться, используйте \u003ccode>SingleChildScrollView\u003c/code> или \u003ccode>ListView\u003c/code>.\u003c/p>\n\u003ch3>Vertical viewport was given unbounded height\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> \u003ccode>ListView\u003c/code> лежит внутри \u003ccode>Column\u003c/code>, у него нет ограничений по высоте. \u003cstrong>Как чинить:\u003c/strong> оберните \u003ccode>ListView\u003c/code> в \u003ccode>Expanded\u003c/code>, либо \u003ccode>shrinkWrap: true\u003c/code> (для небольших списков) и \u003ccode>physics: NeverScrollableScrollPhysics()\u003c/code>.\u003c/p>\n\u003ch3>BoxConstraints forces an infinite width\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> виджет просят быть бесконечно широким (часто \u003ccode>TextField\u003c/code> в \u003ccode>Row\u003c/code>). \u003cstrong>Как чинить:\u003c/strong> оберните \u003ccode>TextField\u003c/code> в \u003ccode>Expanded\u003c/code> или \u003ccode>SizedBox(width: ...)\u003c/code>.\u003c/p>\n\u003ch3>Incorrect use of ParentDataWidget\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> \u003ccode>Expanded\u003c/code> или \u003ccode>Positioned\u003c/code> стоит не внутри \u003ccode>Row/Column/Stack\u003c/code>. \u003cstrong>Как чинить:\u003c/strong> проверьте, что \u003ccode>Expanded\u003c/code> — прямой ребёнок \u003ccode>Row/Column/Flex\u003c/code>, а \u003ccode>Positioned\u003c/code> — прямой ребёнок \u003ccode>Stack\u003c/code>.\u003c/p>\n\u003ch2>Ошибки состояния и жизненного цикла\u003c/h2>\n\u003ch3>setState() called after dispose()\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> вы вызвали \u003ccode>setState\u003c/code> после ухода с экрана (таймер, \u003ccode>await\u003c/code>). \u003cstrong>Как чинить:\u003c/strong> \u003ccode>if (!mounted) return;\u003c/code> после \u003ccode>await\u003c/code>; в \u003ccode>dispose\u003c/code> отменяйте таймеры и подписки.\u003c/p>\n\u003ch3>Null check operator used on a null value\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> \u003ccode>!\u003c/code> применён к \u003ccode>null\u003c/code>. \u003cstrong>Как чинить:\u003c/strong> вместо \u003ccode>!\u003c/code> используйте \u003ccode>??\u003c/code>, \u003ccode>?.\u003c/code> или \u003ccode>if (x != null)\u003c/code>.\u003c/p>\n\u003ch3>LateInitializationError\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> \u003ccode>late\u003c/code>-переменную прочитали до присваивания. \u003cstrong>Как чинить:\u003c/strong> присвойте в \u003ccode>initState\u003c/code> или сделайте поле nullable.\u003c/p>\n\u003ch3>Looking up a deactivated widget's ancestor is unsafe\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> вы используете \u003ccode>context\u003c/code> после того, как виджет удалён (часто после \u003ccode>await\u003c/code>). \u003cstrong>Как чинить:\u003c/strong> проверяйте \u003ccode>mounted\u003c/code> и не сохраняйте \u003ccode>context\u003c/code> надолго.\u003c/p>\n\u003ch3>A TextEditingController was used after being disposed\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> контроллер освободили, а виджет ещё жив. \u003cstrong>Как чинить:\u003c/strong> создавайте контроллер в \u003ccode>initState\u003c/code>, освобождайте в \u003ccode>dispose\u003c/code> того же \u003ccode>State\u003c/code>.\u003c/p>\n\u003ch2>Ошибки ресурсов и сборки\u003c/h2>\n\u003ch3>Unable to load asset: assets/...\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> файла нет в \u003ccode>pubspec.yaml\u003c/code> в \u003ccode>assets:\u003c/code>, либо опечатка в пути, либо внутри пакета не указан \u003ccode>package:\u003c/code>. \u003cstrong>Как чинить:\u003c/strong> добавьте папку в \u003ccode>assets\u003c/code>, сделайте \u003ccode>flutter pub get\u003c/code>, перезапустите приложение (hot reload не подхватывает новые ассеты). В пакете: \u003ccode>Image.asset('assets/x.png', package: 'uikit')\u003c/code>.\u003c/p>\n\u003ch3>Because app depends on uikit ... version solving failed\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> конфликт версий пакетов. \u003cstrong>Как чинить:\u003c/strong> проверьте \u003ccode>environment: sdk\u003c/code> в \u003ccode>pubspec.yaml\u003c/code> библиотеки и приложения, подберите совместимые версии, \u003ccode>flutter pub upgrade\u003c/code>.\u003c/p>\n\u003ch3>Target of URI doesn't exist: 'package:...'\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> пакет не подключён или \u003ccode>pub get\u003c/code> не выполнен. \u003cstrong>Как чинить:\u003c/strong> добавьте пакет в \u003ccode>dependencies\u003c/code>, выполните \u003ccode>flutter pub get\u003c/code>.\u003c/p>\n\u003ch3>Gradle / Kotlin / SDK errors\u003c/h3>\n\u003cp>\u003cstrong>Как чинить:\u003c/strong> \u003ccode>flutter clean\u003c/code>, \u003ccode>flutter pub get\u003c/code>, пересборка. Проверьте \u003ccode>minSdk\u003c/code> и версии Gradle по сообщению ошибки. Не меняйте версии наугад: читайте первую строку «What went wrong».\u003c/p>\n\u003ch3>MissingPluginException\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> плагин добавлен, но приложение не пересобрано. \u003cstrong>Как чинить:\u003c/strong> полностью остановить и запустить \u003ccode>flutter run\u003c/code> заново.\u003c/p>\n\u003ch2>Ошибки сети\u003c/h2>\n\u003ch3>SocketException: Failed host lookup\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> нет интернета или неверный адрес. \u003cstrong>Как чинить:\u003c/strong> проверьте сеть и \u003ccode>baseUrl\u003c/code>. В приложении это должно превращаться в \u003ccode>NoInternetException\u003c/code> с SnackBar на 5 секунд.\u003c/p>\n\u003ch3>Cleartext HTTP traffic not permitted\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> адрес начинается с \u003ccode>http://\u003c/code>, Android блокирует незащищённый трафик. \u003cstrong>Как чинить:\u003c/strong> используйте \u003ccode>https://\u003c/code>, либо (если организатор разрешил) \u003ccode>android:usesCleartextTraffic=\"true\"\u003c/code> в манифесте.\u003c/p>\n\u003ch3>FormatException: Unexpected character\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> сервер вернул не JSON (HTML-страница ошибки или пустой ответ). \u003cstrong>Как чинить:\u003c/strong> напечатайте \u003ccode>response.body\u003c/code> (уровень DEBUG), проверьте статус-код до \u003ccode>jsonDecode\u003c/code>.\u003c/p>\n\u003ch3>type 'Null' is not a subtype of type 'String'\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> в JSON нет поля или оно \u003ccode>null\u003c/code>, а в модели оно обязательное. \u003cstrong>Как чинить:\u003c/strong> проверьте названия полей в документации, сделайте поле nullable (\u003ccode>String?\u003c/code>) или значение по умолчанию (\u003ccode>?? ''\u003c/code>).\u003c/p>\n\u003ch3>401 / 403 при запросах после входа\u003c/h3>\n\u003cp>\u003cstrong>Что значит:\u003c/strong> токен не передан или устарел. \u003cstrong>Как чинить:\u003c/strong> сохраните токен после логина, подставляйте в заголовок \u003ccode>Authorization\u003c/code>, восстановите при старте приложения.\u003c/p>\n\u003ch2>Ошибки Git\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ситуация\u003c/th>\n\u003cth>Что делать\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>\u003ccode>rejected ... non-fast-forward\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>git pull --rebase origin &lt;ветка&gt;\u003c/code>, затем \u003ccode>git push\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Закоммитили \u003ccode>build/\u003c/code>\u003c/td>\n\u003ctd>Добавить в \u003ccode>.gitignore\u003c/code>, выполнить \u003ccode>git rm -r --cached build\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Забыли ветку и сделали коммиты в \u003ccode>main\u003c/code>\u003c/td>\n\u003ctd>Создать ветку: \u003ccode>git checkout -b sprint-N\u003c/code>; затем вернуть \u003ccode>main\u003c/code> на нужный коммит\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Конфликт слияния\u003c/td>\n\u003ctd>Открыть файл, оставить нужные строки, убрать маркеры \u003ccode>&lt;&lt;&lt;&lt;&lt;&lt;&lt;\u003c/code>, затем \u003ccode>git add\u003c/code> и \u003ccode>git commit\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Не знаю хэш коммита\u003c/td>\n\u003ctd>\u003ccode>git log --oneline\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Ошибки оформления, за которые снимают баллы\u003c/h2>\n\u003ctable>\n\u003ccolgroup>\n\u003ccol style=\"width: 50%\" />\n\u003ccol style=\"width: 50%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Ошибка\u003c/th>\n\u003cth>Исправление\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Нет шапки класса\u003c/td>\n\u003ctd>Добавить по шаблону\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Дата в формате \u003ccode>15.10.2026\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>15-10-2026\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Лог без формата \u003ccode>[Тег]: Событие — Детали\u003c/code>\u003c/td>\n\u003ctd>Использовать \u003ccode>AppLog\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Файл в неправильной папке\u003c/td>\n\u003ctd>Перенести в \u003ccode>domain\u003c/code>, \u003ccode>data\u003c/code> или \u003ccode>presentation\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Импорты \u003ccode>presentation\u003c/code> в \u003ccode>domain\u003c/code>\u003c/td>\n\u003ctd>Убрать, вынести общее в \u003ccode>common\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Нет \u003ccode>package: 'uikit'\u003c/code> у ассетов\u003c/td>\n\u003ctd>Добавить\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Шрифт не из макета\u003c/td>\n\u003ctd>Подключить в \u003ccode>pubspec.yaml\u003c/code> и в тему\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n", "text": " Ошибки раскладки RenderFlex overflowed by N pixels Что значит: элементы в Row или Column не поместились. Как чинить: оберните длинный элемент в Expanded или Flexible , добавьте overflow: TextOverflow.ellipsis у текста, либо дайте прокрутку ( SingleChildScrollView ). Для колонки на всю высоту экрана с содержимым, которое может не поместиться, используйте SingleChildScrollView или ListView . Vertical viewport was given unbounded height Что значит: ListView лежит внутри Column , у него нет ограничений по высоте. Как чинить: оберните ListView в Expanded , либо shrinkWrap: true (для небольших списков) и physics: NeverScrollableScrollPhysics() . BoxConstraints forces an infinite width Что значит: виджет просят быть бесконечно широким (часто TextField в Row ). Как чинить: оберните TextField в Expanded или SizedBox(width: ...) . Incorrect use of ParentDataWidget Что значит: Expanded или Positioned стоит не внутри Row/Column/Stack . Как чинить: проверьте, что Expanded — прямой ребёнок Row/Column/Flex , а Positioned — прямой ребёнок Stack . Ошибки состояния и жизненного цикла setState() called after dispose() Что значит: вы вызвали setState после ухода с экрана (таймер, await ). Как чинить: if (!mounted) return; после await ; в dispose отменяйте таймеры и подписки. Null check operator used on a null value Что значит: ! применён к null . Как чинить: вместо ! используйте ?? , ?. или if (x != null) . LateInitializationError Что значит: late -переменную прочитали до присваивания. Как чинить: присвойте в initState или сделайте поле nullable. Looking up a deactivated widget's ancestor is unsafe Что значит: вы используете context после того, как виджет удалён (часто после await ). Как чинить: проверяйте mounted и не сохраняйте context надолго. A TextEditingController was used after being disposed Что значит: контроллер освободили, а виджет ещё жив. Как чинить: создавайте контроллер в initState , освобождайте в dispose того же State . Ошибки ресурсов и сборки Unable to load asset: assets/... Что значит: файла нет в pubspec.yaml в assets: , либо опечатка в пути, либо внутри пакета не указан package: . Как чинить: добавьте папку в assets , сделайте flutter pub get , перезапустите приложение (hot reload не подхватывает новые ассеты). В пакете: Image.asset('assets/x.png', package: 'uikit') . Because app depends on uikit ... version solving failed Что значит: конфликт версий пакетов. Как чинить: проверьте environment: sdk в pubspec.yaml библиотеки и приложения, подберите совместимые версии, flutter pub upgrade . Target of URI doesn't exist: 'package:...' Что значит: пакет не подключён или pub get не выполнен. Как чинить: добавьте пакет в dependencies , выполните flutter pub get . Gradle / Kotlin / SDK errors Как чинить: flutter clean , flutter pub get , пересборка. Проверьте minSdk и версии Gradle по сообщению ошибки. Не меняйте версии наугад: читайте первую строку «What went wrong». MissingPluginException Что значит: плагин добавлен, но приложение не пересобрано. Как чинить: полностью остановить и запустить flutter run заново. Ошибки сети SocketException: Failed host lookup Что значит: нет интернета или неверный адрес. Как чинить: проверьте сеть и baseUrl . В приложении это должно превращаться в NoInternetException с SnackBar на 5 секунд. Cleartext HTTP traffic not permitted Что значит: адрес начинается с http:// , Android блокирует незащищённый трафик. Как чинить: используйте https:// , либо (если организатор разрешил) android:usesCleartextTraffic=\"true\" в манифесте. FormatException: Unexpected character Что значит: сервер вернул не JSON (HTML-страница ошибки или пустой ответ). Как чинить: напечатайте response.body (уровень DEBUG), проверьте статус-код до jsonDecode . type 'Null' is not a subtype of type 'String' Что значит: в JSON нет поля или оно null , а в модели оно обязательное. Как чинить: проверьте названия полей в документации, сделайте поле nullable ( String? ) или значение по умолчанию ( ?? '' ). 401 / 403 при запросах после входа Что значит: токен не передан или устарел. Как чинить: сохраните токен после логина, подставляйте в заголовок Authorization , восстановите при старте приложения. Ошибки Git Ситуация Что делать rejected ... non-fast-forward git pull --rebase origin \u003cветка> , затем git push Закоммитили build/ Добавить в .gitignore , выполнить git rm -r --cached build Забыли ветку и сделали комм   var main = document.getElementById('main'), side = document.getElementById('side'), scrim = document.getElementById('scrim');

  var totalHours = PARTS.reduce(function (s, p) { return s + p.hours; }, 0);

  /* =============== утилиты =============== */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function inline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }

  function fmtShort(ms) { var m = Math.round(ms / 60000); var h = Math.floor(m / 60); return h ? h + ' ч ' + (m % 60 ? m % 60 + ' мин' : '') : m + ' мин'; }
  function fmtDate(ts) { var d = new Date(ts); return two(d.getDate()) + '-' + two(d.getMonth() + 1) + '-' + d.getFullYear() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // SHA-256 для проверки входа (без внешних библиотек)
  function sha256(str) {
    var mw = Math.pow(2, 32), K = [], H = [], i, j, primes = [], cand = 2;
    while (primes.length < 64) { var ok = true; for (j = 0; j < primes.length; j++) { if (cand % primes[j] === 0) { ok = false; break; } } if (ok) primes.push(cand); cand++; }
    for (i = 0; i < 64; i++) { K[i] = (Math.pow(primes[i], 1 / 3) % 1) * mw | 0; if (i < 8) H[i] = (Math.pow(primes[i], 1 / 2) % 1) * mw | 0; }
    var bytes = [], u = unescape(encodeURIComponent(str));
    for (i = 0; i < u.length; i++) bytes.push(u.charCodeAt(i));
    var bitLen = bytes.length * 8; bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bitLen >>> (i * 8)) & 255);
    function rr(n, x) { return (x >>> n) | (x << (32 - n)); }
    for (var off = 0; off < bytes.length; off += 64) {
      var w = [];
      for (i = 0; i < 64; i++) {
        if (i < 16) w[i] = (bytes[off + i * 4] << 24) | (bytes[off + i * 4 + 1] << 16) | (bytes[off + i * 4 + 2] << 8) | bytes[off + i * 4 + 3];
        else { var s0 = rr(7, w[i - 15]) ^ rr(18, w[i - 15]) ^ (w[i - 15] >>> 3), s1 = rr(17, w[i - 2]) ^ rr(19, w[i - 2]) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
      }
      var a = H.slice();
      for (i = 0; i < 64; i++) {
        var S1 = rr(6, a[4]) ^ rr(11, a[4]) ^ rr(25, a[4]), ch = (a[4] & a[5]) ^ (~a[4] & a[6]), t1 = (a[7] + S1 + ch + K[i] + w[i]) | 0;
        var S0 = rr(2, a[0]) ^ rr(13, a[0]) ^ rr(22, a[0]), mj = (a[0] & a[1]) ^ (a[0] & a[2]) ^ (a[1] & a[2]), t2 = (S0 + mj) | 0;
        a = [(t1 + t2) | 0, a[0], a[1], a[2], (a[3] + t1) | 0, a[4], a[5], a[6]];
      }

    }
    return H.map(function (x) { return ('00000000' + (x >>> 0).toString(16)).slice(-8); }).join('');
  }

  /* =============== пользователь и хранилище =============== */
  var user = null; // имя пользователя
  function uk(k) { return 'fp:' + user + ':' + k; }
  function ud(k, def) { try { var v = lsGet(uk(k)); return v ? JSON.parse(v) : def; } catch (e) { return def; } }

  /* =============== онлайн-синхронизация (Supabase, чистый REST) =============== */
